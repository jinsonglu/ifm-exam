eased metabolic demand may overwhelm the limited adrenal reserves, causing a 'crash'. Thyroid hormone increases cellular energy needs; if the adrenals are exhausted, they cannot provide the necessary stress- response support, leading to a worsening of symptoms. Think about the energetic consequences of 'revving the engine' (thyroid) when the 'oil' (adrenals) is nearly gone.", "caseContext": null}, {"id": 81, "question": "A patient in Stage 3 Adrenal Exhaustion has a positive Ragland’s sign and significant orthostatic hypotension. Which electrolyte and botanical combination is specifically indicated to support vascular tone and volume?", "options": [{"key": "A", "text": "Magnesium and Kava kava"}, {"key": "B", "text": "Calcium and Rhodiola"}, {"key": "C", "text": "Potassium and Ashwagandha"}, {"key": "D", "text": "Sea salt/Sodium and Licorice root"}], "answer": "D", "rationale": "Sea salt/Sodium and Licorice root Sodium helps restore extracellular volume, and Licorice supports mineralocorticoid activity to maintain blood pressure.", "caseContext": null}, {"id": 82, "question": "According to the thyroid 'Decision Tree,' what is the recommended protocol for a patient whose TSH is 3.5 mIU/L and has negative TPO antibodies, but continues to show symptoms of hypothyroidism?", "options": [{"key": "A", "text": "Evaluate the environmental factors and optimize nutrients like Selenium and Iron"}, {"key": "B", "text": "Perform a fine-needle aspiration of the thyroid immediately"}, {"key": "C", "text": "Immediately start high-dose T3 monotherapy to bypass conversion"}, {"key": "D", "text": "Order a gluten-free diet and reassess in 12 months"}], "answer": "A", "rationale": "Evaluate the environmental factors and optimize nutrients like Selenium and Iron If TSH is suboptimal (above 2.5) but antibodies are negative, the next step is to address environmental and nutritional blocks to thyroid function.", "caseContext": null}, {"id": 83, "question": "A 65-year-old male with a history of mild arrhythmias presents with symptoms of Stage 3 Adrenal Exhaustion and a TSH of 5.0. What is the safest clinical approach regarding thyroid hormone replacement?", "options": [{"key": "A", "text": "Ignore the thyroid until the cortisol levels are in the top quartile"}, {"key": "B", "text": "Start with a high dose of desiccated thyroid to quickly resolve the fatigue"}, {"key": "C", "text": "Prescribe T4 monotherapy only, as it has no cardiac side effects"}, {"key": "D", "text": "Support the adrenals first and use caution with T3-containing medications"}], "answer": "D", "rationale": "Support the adrenals first and use caution with T3-containing medications Adrenals must be supported first to avoid metabolic collapse, and T3 must be used carefully in older patients with cardiac risks.", "caseContext": null}, {"id": 84, "question": "Which nutrient is a required cofactor for the thyroid peroxidase (TPO) enzyme and is often deficient in patients with high toxic burdens?", "options": [{"key": "A", "text": "Vitamin K2"}, {"key": "B", "text": "Calcium"}, {"key": "C", "text": "Molybdenum"}, {"key": "D", "text": "Iodine"}], "answer": "D", "rationale": "Iodine TPO uses iodine and hydrogen peroxide to iodinate thyroglobulin; without iodine, thyroid hormone synthesis stops.", "caseContext": null}, {"id": 85, "question": "In the context of the 'Pregnenolone Steal' (HPA Axis dysfunction), why does chronic high stress often lead to progesterone deficiency in perimenopausal women?", "options": [{"key": "A", "text": "Progesterone is converted directly into adrenaline during the 'fight or flight' response."}, {"key": "B", "text": "The body preferentially shunts pregnenolone toward cortisol production to ensure survival."}, {"key": "C", "text": "Stress directly causes the kidneys to excrete progesterone as a waste product."}, {"key": "D", "text": "High cortisol levels destroy the corpus luteum in the ovary."}], "answer": "B", "rationale": "The body preferentially shunts pregnenolone toward cortisol production to ensure survival. Pregnenolone is the common precursor for both cortisol and progesterone; under stress, metabolic pathways favor the 'survival' hormone over the ‘reproductive’ one.", "caseContext": null}, {"id": 86, "question": "A Dutch test shows a patient has a high 16α-hydroxyestrone level but very low 2-hydroxyestrone. Which specific clinical risk is associated with this Phase 1 pattern, and what is the target enzyme?", "options": [{"key": "A", "text": "Increased testosterone production; the target is the Aromatase enzyme."}, {"key": "B", "text": "Decreased risk of breast cancer; the target is the COMT enzyme."}, {"key": "C", "text": "Increased risk of DNA damage; the target is the CYP1A1 enzyme."}, {"key": "D", "text": "Increased risk of osteoporosis; the target is the SULT1E1 enzyme."}], "answer": "C", "rationale": "Increased risk of DNA damage; the target is the CYP1A1 enzyme. 16alpha-OH is highly proliferative and associated with increased cancer risk; inducing CYP1A1 (e.g., with DIM) shifts the balance toward the safer 2-OH pathway.", "caseContext": null}, {"id": 87, "question": "Which of the following is a key clinical indicator that a male patient has 'Secondary Hypogonadism' rather than 'Primary Hypogonadism'?", "options": [{"key": "A", "text": "High LH with Low Sperm Count."}, {"key": "B", "text": "Low Testosterone paired with high LH and FSH."}, {"key": "C", "text": "High Testosterone with low Libido."}, {"key": "D", "text": "Low Testosterone paired with low or inappropriately normal LH and FSH."}], "answer": "D", "rationale": "Low Testosterone paired with low or inappropriately normal LH and FSH. This indicates a failure in the 'top-down' signaling from the hypothalamus/pituitary, often caused by stress, inflammation, or opioids. B describes Primary Hypogonadism (Hypergonadotropic), where the brain is signaling correctly but the testes cannot respond.", "caseContext": null}, {"id": 88, "question": "A woman on HRT complains of breast tenderness and bloating. Her labs show high levels of E2 but her stool test shows high Beta-glucuronidase. What does this combination suggest regarding her clinical management?", "options": [{"key": "A", "text": "She has a 'Phase 3' elimination bottleneck and requires Calcium D-Glucarate."}, {"key": "B", "text": "Her HRT dose is too high and should be halved immediately."}, {"key": "C", "text": "She has a 5-alpha reductase dominance and needs Saw Palmetto."}, {"key": "D", "text": "She needs to switch from transdermal to oral estrogen."}], "answer": "A", "rationale": "She has a 'Phase 3' elimination bottleneck and requires Calcium D-Glucarate. High Beta-glucuronidase 'un-zips' conjugated estrogen in the gut, allowing it to be reabsorbed; inhibiting this enzyme prevents systemic accumulation.", "caseContext": null}, {"id": 89, "question": "How does high levels of 'Leptin' in an obese male directly affect his testosterone levels, independent of the HPTA axis?", "options": [{"key": "A", "text": "Leptin stimulates the pituitary to release more LH, causing 'LH burnout.'"}, {"key": "B", "text": "Leptin inhibits the StAR (Steroidogenic Acute Regulatory) protein in the Leydig cells."}, {"key": "C", "text": "Leptin acts as a building block for Estrone."}, {"key": "D", "text": "Leptin increases the sensitivity of the androgen receptors."}], "answer": "B", "rationale": "Leptin inhibits the StAR (Steroidogenic Acute Regulatory) protein in the Leydig cells. The StAR protein is the rate-limiting step for cholesterol entering the mitochondria for T- synthesis; leptin directly blocks this step.", "caseContext": null}, {"id": 90, "question": "A 45-year-old female presents with cyclic migraines, breast tenderness, and irritability. Her Dutch test reveals a 'Methylation Bottleneck.' Which nutrient co-factors are essential to support the COMT enzyme?", "options": [{"key": "A", "text": "Iodine and Selenium."}, {"key": "B", "text": "Iron and Vitamin C."}, {"key": "C", "text": "Magnesium and S-Adenosylmethionine (SAMe)."}, {"key": "D", "text": "Zinc and Copper."}], "answer": "C", "rationale": "Magnesium and S-Adenosylmethionine (SAMe). COMT is a magnesium-dependent enzyme that requires a methyl donor (SAMe) to neutralize catechol estrogens.", "caseContext": null}, {"id": 91, "question": "Which delivery method for Testosterone Replacement Therapy (TRT) is most likely to cause a significant rise in Hematocrit (erythrocytosis)?", "options": [{"key": "A", "text": "Transdermal Gels"}, {"key": "B", "text": "Intramuscular Injections (e.g., Cypionate)"}, {"key": "C", "text": "Sublingual Troches"}, {"key": "D", "text": "Pellet Implants"}], "answer": "B", "rationale": "Intramuscular Injections (e.g., Cypionate) The supraphysiological peaks associated with injections are the strongest drivers of increased red blood cell production.", "caseContext": null}, {"id": 92, "question": "A patient with PCOS has high Free Testosterone and high Insulin. Why would a clinician prescribe Saw Palmetto as part of the treatment protocol?", "options": [{"key": "A", "text": "To inhibit the 5-alpha reductase enzyme and reduce the production of DHT."}, {"key": "B", "text": "To stimulate the release of GnRH from the hypothalamus."}, {"key": "C", "text": "To lower blood glucose levels directly."}, {"key": "D", "text": "To increase the conversion of testosterone to estrogen."}], "answer": "A", "rationale": "To inhibit the 5-alpha reductase enzyme and reduce the production of DHT. Dihydrotestosterone (DHT) is responsible for many PCOS symptoms like hirsutism; Saw Palmetto helps block its formation.", "caseContext": null}, {"id": 93, "question": "In the context of the 'PTSD' model for managing estrogen dominance, which mechanism explains why Sleep is critical for hormonal clearance?", "options": [{"key": "A", "text": "Sleep deprivation increases evening cortisol, which inhibits the sulfation of estrogen."}, {"key": "B", "text": "Melatonin directly inhibits the CYP1A1 enzyme in the liver."}, {"key": "C", "text": "Deep sleep is the only time the Estrobolome can conjugate estrogens."}, {"key": "D", "text": "Melatonin has anti-aromatase properties and can modulate estrogen receptor expression."}], "answer": "D", "rationale": "Melatonin has anti-aromatase properties and can modulate estrogen receptor expression. Melatonin acts as a natural selective estrogen receptor modulator (SERM) and reduces the conversion of androgens to estrogens. A is incorrect since While stress affects metabolism, the primary sleep link is through the circadian regulation of the HPA-G axis and glycemic control.", "caseContext": null}, {"id": 94, "question": "A woman on BHRT presents with high levels of 4-hydroxyestrone (4−OH−E1) on her urinary profile. Which specific clinical intervention is most targeted at preventing this metabolite from becoming a reactive quinone?", "options": [{"key": "A", "text": "Switching from transdermal to oral estrogen."}, {"key": "B", "text": "Prescribing DIM (Diindolylmethane)."}, {"key": "C", "text": "Increasing fiber intake to 35g per day."}, {"key": "D", "text": "Supplementing with N-Acetyl Cysteine (NAC) or Glutathione."}], "answer": "D", "rationale": "Supplementing with N-Acetyl Cysteine (NAC) or Glutathione. Glutathione can neutralize reactive estrogen quinones that have already formed, preventing DNA adducts.", "caseContext": null}, {"id": 95, "question": "In the 'Hormone Hierarchy,' why must Thyroid function be optimized before finalizing a Sex Steroid replacement dose?", "options": [{"key": "A", "text": "Thyroid hormones are the primary co-factors for the COMT enzyme."}, {"key": "B", "text": "Low thyroid hormone (T3) increases SHBG, leading to excessive free testosterone."}, {"key": "C", "text": "Thyroid hormone is required for the expression of sex hormone receptors at the cellular level."}, {"key": "D", "text": "High TSH directly stimulates the aromatase enzyme in adipose tissue."}], "answer": "C", "rationale": "Thyroid hormone is required for the expression of sex hormone receptors at the cellular level. T3 acts as a permissive hormone that sensitizes tissues to the effects of estrogen and testosterone.", "caseContext": null}, {"id": 96, "question": "According to the IFM Sex Hormone module, which laboratory finding would most strongly argue against the use of 'Pellets' for a perimenopausal woman?", "options": [{"key": "A", "text": "Low levels of Sex Hormone Binding Globulin (SHBG)."}, {"key": "B", "text": "A history of heavy menstrual bleeding and uterine fibroids."}, {"key": "C", "text": "High levels of 2-hydroxyestrone on a Dutch test."}, {"key": "D", "text": "Elevated DHEA-S levels."}], "answer": "B", "rationale": "A history of heavy menstrual bleeding and uterine fibroids. Subcutaneous pellets are long-acting, non-biodegradable delivery systems that release a steady physiologic dose of hormones over 3 to 6 months. Because they bypass first-pass hepatic metabolism, they maintain high, stable serum levels that cannot be reversed or \"turned off\" once the procedure is complete. Pellets provide a fixed dose that cannot be easily adjusted if the estrogen load triggers heavy bleeding from fibroids.", "caseContext": null}, {"id": 97, "question": "A woman on HRT presents with elevated levels of DNA-adducts on her lab report. Her Phase 1 metabolism shows a preference for the 4-OH pathway. Which specific antioxidant 'rescue' nutrient is required to neutralize reactive quinones before they damage DNA?", "options": [{"key": "A", "text": "Glutathione"}, {"key": "B", "text": "Iodine"}, {"key": "C", "text": "Calcium"}, {"key": "D", "text": "Vitamin D"}], "answer": "A", "rationale": "Glutathione Glutathione (or its precursor NAC) binds to reactive estrogen quinones, preventing them from forming depurinating DNA adducts. This molecule is the 'master antioxidant’ that provides a thiol group for detoxification.", "caseContext": null}, {"id": 98, "question": "Which clinical finding in a male patient would lead a clinician to categorize him as 'Red Risk' (Absolute Contraindication) for starting TRT according to IFM guidelines?", "options": [{"key": "A", "text": "Total Testosterone of 200 ng/dL with high LH."}, {"key": "B", "text": "BMI of 35 and elevated fasting insulin."}, {"key": "C", "text": "Hematocrit of 48% and a history of treated hypertension."}, {"key": "D", "text": "Confirmed Prostate Cancer or a Breast Cancer diagnosis."}], "answer": "D", "rationale": "Confirmed Prostate Cancer or a Breast Cancer diagnosis. Male breast cancer and active, high-risk prostate cancer remain absolute contraindications for testosterone therapy in the core IFM curriculum.", "caseContext": null}, {"id": 99, "question": "A perimenopausal woman experiences heavy periods and 'estrogen dominance' symptoms. Her Dutch test shows a 2:16 ratio of 0.4. Which lifestyle or nutritional factor is most likely to worsen this ratio by further inducing the 16α-OH pathway?", "options": [{"key": "A", "text": "Obesity and high-sugar intake"}, {"key": "B", "text": "Supplementing with Magnesium"}, {"key": "C", "text": "Vigorous aerobic exercise"}, {"key": "D", "text": "Cruciferous vegetable intake"}], "answer": "A", "rationale": "Obesity and high-sugar intake Inflammation and obesity up-regulate the enzymes that favor the more 'proliferative' 16- hydroxyestrone pathway.", "caseContext": null}, {"id": 100, "question": "A patient is identified as having 'High Beta-Glucuronidase' on a stool test. Which food-based intervention would provide the most targeted support for this Phase 3 bottleneck?", "options": [{"key": "A", "text": "Increased fluid intake only"}, {"key": "B", "text": "Red meat and saturated fats"}, {"key": "C", "text": "Fermented foods like Sauerkraut"}, {"key": "D", "text": "Cruciferous vegetables like Broccoli and Kale"}], "answer": "D", "rationale": "Cruciferous vegetables like Broccoli and Kale Cruciferous vegetables contain compounds that can naturally provide some glucuronidase inhibition and provide fiber for excretion. C is not quite correct. While good for general gut health, these do not specifically inhibit the beta-glucuronidase enzyme.", "caseContext": null}, {"id": 101, "question": "A practitioner suspects a patient has 'sick building syndrome' due to chronic fatigue and respiratory issues. In which section of the IFM Environmental Health Matrix would this exposure be recorded?", "options": [{"key": "A", "text": "Antecedents"}, {"key": "B", "text": "Mediators/Perpetuators"}, {"key": "C", "text": "Triggering Events"}, {"key": "D", "text": "Physiology and Function"}], "answer": "B", "rationale": "Mediators/Perpetuators Sick building syndrome represents an ongoing environmental exposure that sustains the patient's illness.", "caseContext": null}, {"id": 102, "question": "Which dietary component is specifically recommended to support the glucuronidation pathway and help counteract the effects of β-glucuronidase?", "options": [{"key": "A", "text": "Charbroiled meats"}, {"key": "B", "text": "Calcium D-glucarate"}, {"key": "C", "text": "High-mercury seafood"}, {"key": "D", "text": "Refined carbohydrates"}], "answer": "B", "rationale": "Calcium D-glucarate This supplement is often paired with cruciferous vegetables to support hormone metabolism. Calcium D-glucarate is a well-known inhibitor of beta-glucuronidase, preventing the reabsorption of toxins like estrogen.", "caseContext": null}, {"id": 103, "question": "What is a common clinical indicator of Zinc deficiency that might be observed during a physical exam, as noted in the Environmental Health module?", "options": [{"key": "A", "text": "Spoon-shaped nails (koilonychia)"}, {"key": "B", "text": "Pale conjunctiva"}, {"key": "C", "text": "Leukonychia (white spots on the nails)"}, {"key": "D", "text": "Angular stomatitis"}], "answer": "C", "rationale": "Leukonychia (white spots on the nails) White spots on the nails, or leukonychia, are frequently associated with marginal zinc status. A, B and D are due signs of Iron deficiency.", "caseContext": null}, {"id": 104, "question": "A patient with a 'slow' COMT (Catechol-O-methyltransferase) enzyme may have difficulty processing which of the following substances?", "options": [{"key": "A", "text": "Histamine and sulfa drugs"}, {"key": "B", "text": "Catecholamines (like dopamine and epinephrine) and estrogens"}, {"key": "C", "text": "Acetaminophen and ethanol"}, {"key": "D", "text": "Caffeine and cigarette smoke"}], "answer": "B", "rationale": "Catecholamines (like dopamine and epinephrine) and estrogens COMT is a primary enzyme in the methylation pathway responsible for degrading catecholamines and 2-OH/4-OH estrogens.", "caseContext": null}, {"id": 105, "question": "Which dietary habit is known to 'induce' (speed up) the CYP1A2 enzyme, potentially increasing the metabolism of caffeine and charbroiled meat toxins?", "options": [{"key": "A", "text": "Consistent fasting"}, {"key": "B", "text": "Drinking grapefruit juice"}, {"key": "C", "text": "Cigarette smoking"}, {"key": "D", "text": "A high-fat ketogenic diet"}], "answer": "C", "rationale": "Cigarette smoking Tobacco smoke contains compounds that induce CYP1A2, leading to faster clearance of substances like caffeine.", "caseContext": null}, {"id": 106, "question": "A physical exam finding of 'leukonychia' (white spots on the nails) is a clinical indicator for a deficiency in which mineral?", "options": [{"key": "A", "text": "Iron"}, {"key": "B", "text": "Iodine"}, {"key": "C", "text": "Zinc"}, {"key": "D", "text": "Calcium"}], "answer": "C", "rationale": "Zinc White spots on the nails are a classic physical sign of zinc insufficiency in functional medicine.", "caseContext": null}, {"id": 107, "question": "If a patient has an elevated Gamma-Glutamyl Transpeptidase (GGT) but does not drink alcohol, which environmental concern should be investigated?", "options": [{"key": "A", "text": "A deficiency in Vitamin D."}, {"key": "B", "text": "High levels of physical exercise."}, {"key": "C", "text": "Exposure to Persistent Organic Pollutants (POPs)."}, {"key": "D", "text": "Excessive intake of refined sugar."}], "answer": "C", "rationale": "Exposure to Persistent Organic Pollutants (POPs). GGT is used as a surrogate marker for toxic exposure to chemicals like organochlorine pesticides (POPs).", "caseContext": null}, {"id": 108, "question": "A patient presents with 'petechiae' (small purple spots) and easy bruising. In the context of Biotransformation, which nutrient deficiency and functional impairment does this most likely suggest?", "options": [{"key": "A", "text": "Magnesium deficiency; impairing the ATP-dependent Phase II conjugation steps."}, {"key": "B", "text": "Vitamin B12 deficiency; causing a backup in the methylation pathway."}, {"key": "C", "text": "Vitamin C deficiency; impairing antioxidant recycling and collagen structure."}, {"key": "D", "text": "Zinc deficiency; impairing the function of SOD1 in the cytosol."}], "answer": "C", "rationale": "Vitamin C deficiency; impairing antioxidant recycling and collagen structure. Vitamin C is critical for blood vessel integrity and acts as a primary antioxidant and recycler of Vitamin E in biotransformation. This nutrient is a classic 'cement' for small blood vessels and a first-line extracellular antioxidant.", "caseContext": null}, {"id": 109, "question": "A patient presents with jaundice that specifically worsens after fasting. Which genetic variation is most likely indicated?", "options": [{"key": "A", "text": "COMT deficiency"}, {"key": "B", "text": "SULT gene deletion"}, {"key": "C", "text": "MTHFR polymorphism"}, {"key": "D", "text": "Gilbert’s Syndrome"}], "answer": "D", "rationale": "Gilbert’ s Syndrome Gilbert's involves impaired glucuronidation of bilirubin, which typically manifests as elevated unconjugated bilirubin after fasting.", "caseContext": null}, {"id": 110, "question": "Which of the following is considered a 'Phytochelator' specifically mentioned as a 'Green food' to support heavy metal detoxification?", "options": [{"key": "A", "text": "Chlorella"}, {"key": "B", "text": "Resveratrol"}, {"key": "C", "text": "Sulforaphane"}, {"key": "D", "text": "Lycopene"}], "answer": "A", "rationale": "Chlorella Chlorella is listed as a primary phytochelator and is a common 'green' food used for this purpose. This substance is a single-celled green algae.", "caseContext": null}, {"id": 111, "question": "Elevated levels of which enzyme in the 'normal range' can serve as a surrogate marker for exposure to persistent organic pollutants (POPs)?", "options": [{"key": "A", "text": "LDH (Lactate Dehydrogenase)"}, {"key": "B", "text": "GGT (Gamma-Glutamyl Transpeptidase)"}, {"key": "C", "text": "ALP (Alkaline Phosphatase)"}, {"key": "D", "text": "ALT (Alanine Transaminase)"}], "answer": "B", "rationale": "GGT (Gamma-Glutamyl Transpeptidase) GGT is positively related to xenobiotics conjugated by glutathione and can predict risks for Type 2 diabetes based on toxic load. ALT is a standard marker for liver cell damage but is not specifically highlighted as the surrogate for POPs exposure.", "caseContext": null}, {"id": 112, "question": "Which Phase II detoxification pathway is most correctly associated with its beneficial precursor or nutrient support?", "options": [{"key": "A", "text": "Sulfonation & S-adenosylmethionine"}, {"key": "B", "text": "Amino Acid Conjugation & Glutamine"}, {"key": "C", "text": "Glucuronidation & Selenium"}, {"key": "D", "text": "Acetylation & Molybdenum"}], "answer": "B", "rationale": "Amino Acid Conjugation & Glutamine The module identifies Glutamine, Glycine, and Taurine as key amino acids used in this conjugation pathway.", "caseContext": null}, {"id": 113, "question": "What is the primary role of Phase I biotransformation reactions?", "options": [{"key": "A", "text": "To introduce or expose a functional group and render the compound more polar"}, {"key": "B", "text": "To ensure immediate excretion via the bile"}, {"key": "C", "text": "To deactivate all pro-drugs and pro-carcinogens"}, {"key": "D", "text": "To conjugate the compound with a large polar molecule"}], "answer": "A", "rationale": "To introduce or expose a functional group and render the compound more polar Phase | uses oxidation, reduction, and hydrolysis to prepare compounds for Phase II.", "caseContext": null}, {"id": 114, "question": "Why is the administration of N-acetylcysteine (NAC) beneficial for someone with high exposure to heavy metals and POPs?", "options": [{"key": "A", "text": "NAC acts as a direct Phase I enzyme inducer."}, {"key": "B", "text": "NAC provides the rate-limiting amino acid (cysteine) for the synthesis of intracellular glutathione."}, {"key": "C", "text": "NAC inhibits the release of toxins from adipose tissue."}, {"key": "D", "text": "NAC is a potent phytochelator that binds mercury in the gut."}], "answer": "B", "rationale": "NAC provides the rate-limiting amino acid (cysteine) for the synthesis of intracellular glutathione. Glutathione is the body's master antioxidant and a key Phase II conjugator; NAC ensures its adequate production.", "caseContext": null}, {"id": 115, "question": "A patient's 'Toxic Exposure Questionnaire' reveals significant exposure to 'Old Paint' and 'Dust' in a pre-1978 home. Which biomarker is the gold standard for assessing recent exposure to this specific hazard?", "options": [{"key": "A", "text": "Urinary Arsenic/Creatinine ratio"}, {"key": "B", "text": "Hair analysis for Mercury"}, {"key": "C", "text": "Serum Ferritin"}, {"key": "D", "text": "Whole blood Lead level"}], "answer": "D", "rationale": "Whole blood Lead level Whole blood lead is the standard clinical measure for assessing recent or ongoing lead exposure and evaluating the need for intervention.", "caseContext": null}, {"id": 116, "question": "Which mechanism describes why 'Xenoestrogens' like phthalates are classified as endocrine disruptors?", "options": [{"key": "A", "text": "They bind to hormone receptors and mimic or block the action of natural hormones."}, {"key": "B", "text": "They prevent the liver from producing any bile."}, {"key": "C", "text": "They increase the rate of Phase I reactions to a dangerous speed."}, {"key": "D", "text": "They directly destroy the ovaries and testes."}], "answer": "A", "rationale": "They bind to hormone receptors and mimic or block the action of natural hormones. Xenoestrogens can fit into estrogen receptors, sending ‘false signals’ to the cell that alter development and metabolism", "caseContext": null}, {"id": 117, "question": "In the IFM Clinical Decision Tree, during which step would you prioritize 'Restoring Gut Integrity and Bowel Frequency'?", "options": [{"key": "A", "text": "Track"}, {"key": "B", "text": "Initiate"}, {"key": "C", "text": "Gather"}, {"key": "D", "text": "Organize"}], "answer": "B", "rationale": "Initiate Establishing regular bowel movements and gut health is a prerequisite for safely beginning toxin mobilization to prevent reabsorption.", "caseContext": null}, {"id": 118, "question": "What is the clinical significance of a 'High' 2-hydroxyestrone to 16-alpha-hydroxyestrone ratio in the context of estrogen detoxification?", "options": [{"key": "A", "text": "It means the patient is a 'Fast Acetylator'."}, {"key": "B", "text": "It indicates a high risk for bone fractures."}, {"key": "C", "text": "It suggests the patient is not eating enough fiber."}, {"key": "D", "text": "The 2-OH pathway is considered 'protective,' so a high ratio is generally viewed as lower risk for estrogen- sensitive cancers."}], "answer": "D", "rationale": "The 2-OH pathway is considered 'protective,' so a high ratio is generally viewed as lower risk for estrogen-sensitive cancers. 2-hydroxyestrone is a weak estrogen, while 16-alpha-OH is a potent 'pro-growth' estrogen; therefore, a higher 2:16 ratio is preferred.", "caseContext": null}, {"id": 119, "question": "A practitioner is using the IFM Bioenergetics Clinical Decision Tree to manage a patient with chronic fatigue. If initial primary (1º) treatments provide no improvement, which specific set of biomarkers is categorized as a Secondary (2º) Metabolism Diagnostic?", "options": [{"key": "A", "text": "TSH, Free T4, and Reverse T3"}, {"key": "B", "text": "8-OHdG and Oxidized LDL"}, {"key": "C", "text": "Serum Ferritin and CBC"}, {"key": "D", "text": "Acyl-Carnitine, Organic Acids (OA) Profile, and Cellular Redox"}], "answer": "D", "rationale": "Acyl-Carnitine, Organic Acids (OA) Profile, and Cellular Redox These tests look deeper into metabolic intermediates and the redox state of the cell.", "caseContext": null}, {"id": 120, "question": "Which enzyme responsible for neutralizing reactive oxygen species (ROS) is specifically localized to the mitochondrial matrix and requires Manganese (Mn) as its metallic cofactor?", "options": [{"key": "A", "text": "SOD2"}, {"key": "B", "text": "Catalase"}, {"key": "C", "text": "SOD1"}, {"key": "D", "text": "Glutathione Peroxidase"}], "answer": "A", "rationale": "SOD2 SOD2 is specifically the mitochondrial form of superoxide dismutase and is dependent on Manganese.", "caseContext": null}, {"id": 121, "question": "In the 'feed-forward cycle' of oxidative stress, which transcription factor is activated by increased ROS, leading to the up-regulation of pro-inflammatory genes like iNOS?", "options": [{"key": "A", "text": "HIF-1 alpha"}, {"key": "B", "text": "NF-kB"}, {"key": "C", "text": "PPAR-gamma"}, {"key": "D", "text": "NRF-2"}], "answer": "B", "rationale": "NF-kB This protein complex is a key mediator of the body's inflammatory response to cellular stress. Oxidative stress activates NF-kB, which then triggers the expression of stress and inflammatory genes, creating a damaging cycle.", "caseContext": null}, {"id": 122, "question": "Heavy metals such as Lead (Pb) and Mercury (Hg) primarily cause 'Energy Suffering' by inhibiting which critical biological pathway?", "options": [{"key": "A", "text": "Glycolysis"}, {"key": "B", "text": "Heme Biosynthesis"}, {"key": "C", "text": "The Pentose Phosphate Pathway"}, {"key": "D", "text": "Beta-oxidation of fatty acids"}], "answer": "B", "rationale": "Heme Biosynthesis Heavy metals inhibit multiple steps of the Heme Synthesis pathway, which is essential for assembling electron transfer complexes and catalase.", "caseContext": null}, {"id": 123, "question": "When addressing 'Lipid Support' for mitochondrial membranes (1º Oral Lipid Support), what is the recommended daily dosage range for Phosphatidylcholine (PC)?", "options": [{"key": "A", "text": "10 - 100 mg / day"}, {"key": "B", "text": "500 - 1000 mcg / day"}, {"key": "C", "text": "20 - 40 gm / day"}, {"key": "D", "text": "1 - 10 gm / day"}], "answer": "D", "rationale": "1 - 10 gm / day This structural lipid is required in gram amounts for effective membrane replacement therapy. The module recommends a dose of 1 to 10 grams per day for primary oral lipid support using Phosphatidylcholine.", "caseContext": null}, {"id": 124, "question": "The 'Mito Food Plan' emphasizes 'Color' in the diet. What is the bioenergetic rationale for consuming 8-12 servings of colorful vegetables per day?", "options": [{"key": "A", "text": "To provide phytonutrients that act as exogenous antioxidants and Nrf2 activators"}, {"key": "B", "text": "To increase serum glucose for the brain"}, {"key": "C", "text": "To maximize caloric intake for weight gain"}, {"key": "D", "text": "To replace the need for B-vitamin supplementation"}], "answer": "A", "rationale": "To provide phytonutrients that act as exogenous antioxidants and Nrf2 activators Phytonutrients (polyphenols, flavonoids) help neutralize ROS and trigger the cell's internal antioxidant defense systems.", "caseContext": null}, {"id": 125, "question": "In the IFM Pain Matrix, 'Communication' imbalances often involve the HPTGA axis. How does chronically elevated Cortisol directly harm the mitochondria?", "options": [{"key": "A", "text": "It converts ATP back into ADP prematurely"}, {"key": "B", "text": "It increases the production of superoxide and inhibits oxidative phosphorylation"}, {"key": "C", "text": "It causes the mitochondria to grow too large to function"}, {"key": "D", "text": "It depletes the body of all Vitamin D"}], "answer": "B", "rationale": "It increases the production of superoxide and inhibits oxidative phosphorylation Chronic glucocorticoid exposure is known to increase oxidative stress and impair the efficiency of ATP production in the mitochondria.", "caseContext": null}, {"id": 126, "question": "The 'Mito Food Plan' suggests 'Time-Restricted Eating' (TRE). What is the bioenergetic benefit of having a 12-16 hour fasting window?", "options": [{"key": "A", "text": "It increases the absorption of iron in the gut"}, {"key": "B", "text": "It prevents the breakdown of muscle tissue"}, {"key": "C", "text": "It eliminates the need for oxygen in the ETC"}, {"key": "D", "text": "It triggers mitophagy and improves metabolic flexibility"}], "answer": "D", "rationale": "It triggers mitophagy and improves metabolic flexibility Fasting windows allow the cell to shift from growth/storage to repair and 'cleanup' of dysfunctional organelles.", "caseContext": null}, {"id": 127, "question": "A practitioner is treating a patient with suspected Secondary Mitochondrial Dysfunction (SMD) and high oxidative stress. Which 1º Oxidative Stress treatment is uniquely prioritized for its ability to increase internal glutathione synthesis and support detoxification simultaneously?", "options": [{"key": "A", "text": "Direct IV Glutathione"}, {"key": "B", "text": "High-dose Melatonin"}, {"key": "C", "text": "Sulforaphane-glucosinolate (SGS)"}, {"key": "D", "text": "Vitamin E (Tocopherols)"}], "answer": "C", "rationale": "Sulforaphane-glucosinolate (SGS) Think of the compound found in broccoli seeds that talks to the cell's DNA. SGS is a potent inducer of Nrf2, which upregulates the body's endogenous production of glutathione and Phase Il enzymes.", "caseContext": null}, {"id": 128, "question": "When applying the 'Mito Food Plan' for neuroprotection, what is the clinical rationale for emphasizing 'therapeutic' levels of Omega-3 fatty acids over standard dietary intake?", "options": [{"key": "A", "text": "To increase the calorie density of the diet without adding volume"}, {"key": "B", "text": "To stabilize the mitochondrial inner membrane and reduce neuro-inflammation"}, {"key": "C", "text": "To lower the need for Vitamin C and Vitamin E"}, {"key": "D", "text": "To act as a primary fuel source for the Krebs cycle"}], "answer": "B", "rationale": "To stabilize the mitochondrial inner membrane and reduce neuro-inflammation Consider the relationship between membrane integrity and the efficiency of the electron transport chain. High-dose Omega-3s are essential for maintaining the fluidity and function of the mitochondrial membranes where the ETC resides.", "caseContext": null}, {"id": 129, "question": "In the clinical management of Chronic Pain, which mechanism describes how mitochondrial ROS contribute to 'central sensitization'?", "options": [{"key": "A", "text": "ROS activate microglial cells, leading to a chronically mediated inflammatory cascade in the CNS."}, {"key": "B", "text": "ROS increase the thickness of the myelin sheath, slowing down nerve conduction."}, {"key": "C", "text": "ROS act as a primary fuel source for the Glymphatic System."}, {"key": "D", "text": "ROS inhibit the HPTGA axis, causing a surplus of testosterone."}], "answer": "A", "rationale": "ROS activate microglial cells, leading to a chronically mediated inflammatory cascade in the CNS. Mitochondrial dysfunction leads to increased ROS, which activates microglia and lowers the threshold for pain signaling (sensitization).", "caseContext": null}, {"id": 130, "question": "Which specific enzyme in the Heme Biosynthesis pathway is inhibited by heavy metals, leading to the metabolic state described as 'Energy Suffering'?", "options": [{"key": "A", "text": "Uroporphyrinogen decarboxylase"}, {"key": "B", "text": "Glutathione Reductase"}, {"key": "C", "text": "Superoxide Dismutase 1"}, {"key": "D", "text": "Pyruvate Dehydrogenase"}], "answer": "A", "rationale": "Uroporphyrinogen decarboxylase Heavy metals like lead and mercury specifically target UROD and CPOX, causing a block in heme production that starves the electron transport chain.", "caseContext": null}, {"id": 131, "question": "In the IFM Bioenergetics Clinical Decision Tree, if a patient shows no improvement after Primary (1º) treatments, which secondary treatment is indicated to support 'Energy Storage'?", "options": [{"key": "A", "text": "Creatine Monohydrate"}, {"key": "B", "text": "Coenzyme Q10 (Ubiquinol)"}, {"key": "C", "text": "Sulforaphane-glucosinolate (SGS)"}, {"key": "D", "text": "Magnesium Chelate"}], "answer": "A", "rationale": "Creatine Monohydrate Think of the nutrient often used by athletes to replenish ATP quickly in muscle tissue. Creatine acts as a high-energy phosphate buffer and is listed as a 22 Metabolism Treatment for patients requiring enhanced energy storage capacity.", "caseContext": null}, {"id": 132, "question": "Which nutrient is described as having the 'greatest potential to be toxic to mitochondria' if levels are excessive?", "options": [{"key": "A", "text": "Iron"}, {"key": "B", "text": "Vitamin B3 (Niacin)"}, {"key": "C", "text": "Riboflavin (B2)"}, {"key": "D", "text": "Zinc"}], "answer": "A", "rationale": "Iron While essential for heme and the ETC, excess iron can participate in the Fenton reaction, producing highly damaging hydroxyl radicals. This mineral is a 'double-edged sword' due to its ability to catalyze the formation of ROS.", "caseContext": null}, {"id": 133, "question": "When examining 'Secondary Mitochondrial Dysfunction' (SMD), which statement accurately describes its origin compared to primary mitochondrial disease?", "options": [{"key": "A", "text": "It involves impairments in fission, fusion, and distribution secondarily to complex disorders."}, {"key": "B", "text": "It is exclusively caused by inherited mutations in mitochondrial DNA."}, {"key": "C", "text": "It refers only to the lack of B-vitamin cofactors."}, {"key": "D", "text": "It is only found in patients with overt, end-stage organ failure."}], "answer": "A", "rationale": "It involves impairments in fission, fusion, and distribution secondarily to complex disorders. SMD arises from multifactorial issues like diabetes or toxins that secondarily impair mitochondrial dynamics like fission and fusion.", "caseContext": null}, {"id": 134, "question": "When addressing toxic metals in the Clinical Decision Tree, which step is considered a 2º (Secondary) Detox Treatment, to be used after primary support is established?", "options": [{"key": "A", "text": "Selenium and NAC"}, {"key": "B", "text": "IV-Phospholipids"}, {"key": "C", "text": "Mito Food Plan"}, {"key": "D", "text": "Chelation therapy"}], "answer": "D", "rationale": "Chelation therapy Chelation is a secondary treatment used once primary pathways and supports (like NAC and Se) are in place. B is not quite correct since this is a 22 Metabolism Treatment for membranes, not a 22 Detox Treatment for toxin removal.", "caseContext": null}, {"id": 135, "question": "Under the 'Mental/Emotional/Spiritual' section of the Fatigue Matrix, which state is identified as a mediator that can perpetuate energy failure?", "options": [{"key": "A", "text": "Acute Grief"}, {"key": "B", "text": "Excessive Empathy"}, {"key": "C", "text": "Type A Personality"}, {"key": "D", "text": "Learned Helplessness"}], "answer": "D", "rationale": "Learned Helplessness Learned Helplessness is explicitly listed as an emotional/spiritual mediator in the Fatigue Matrix. This term refers to a psychological state where a patient feels they have no power to change their health outcome.", "caseContext": null}, {"id": 136, "question": "Which specific enzyme in the heme biosynthesis pathway is inhibited by heavy metals, directly preventing the formation of Protoporphyrinogen IX?", "options": [{"key": "A", "text": "Ferrochelatase"}, {"key": "B", "text": "UROD (Uroporphyrinogen Decarboxylase)"}, {"key": "C", "text": "CPOX (Coproporphyrinogen Oxidase)"}, {"key": "D", "text": "ALA Synthase"}], "answer": "C", "rationale": "CPOX (Coproporphyrinogen Oxidase) CPOX is the enzyme that converts coproporphyrinogen to protoporphyrinogen IX and is highly sensitive to metal inhibition. Case Study 1 — Answer Key", "caseContext": null}, {"id": 137, "question": "James's history of multiple rounds of antibiotics should be categorized as a:", "options": [{"key": "A", "text": "Mediator"}, {"key": "B", "text": "Antecedent"}, {"key": "C", "text": "Trigger"}], "answer": "C", "rationale": "Trigger The antibiotics are rapid-acting activators that disrupted his microbiome balance.", "caseContext": "Case Study 1: The Cardiometabolic & Immune Overlap. Questions 137-147\nPatient Profile: James, a 55-year-old male, presents with bloating, weight gain (mostly abdominal), and recurring\nskin rashes (eczema).\nHistory: He has a high-stress job and sleeps 5 hours a night. He was treated with multiple rounds of antibiotics for\nsinus infections last year.\nClinical Indicators: Elevated blood pressure (145/92), waist circumference of 42 inches, and dry, scaly patches on\nthe antecubital fossa.\nLabs: Fasting glucose 110 mg/dL, HbA1c 5.9%, and positive IgG food sensitivity markers for dairy and gluten"}, {"id": 138, "question": "The presence of recurring skin rashes and bloating primarily points to a disturbance in which Matrix node?", "options": [{"key": "A", "text": "Transport"}, {"key": "B", "text": "Defense and Repair"}, {"key": "C", "text": "Energy"}], "answer": "B", "rationale": "Defense and Repair Consider immune regulation and repair of inflamed tissues.", "caseContext": null}, {"id": 139, "question": "James's 5 hours of sleep per night is considered a 'Mediator' because:", "options": [{"key": "A", "text": "It was the initial event that caused his weight gain."}, {"key": "B", "text": "It is an inherited trait."}, {"key": "C", "text": "It is an ongoing factor that prevents the improvement of physiological function."}], "answer": "C", "rationale": "It is an ongoing factor that prevents the improvement of physiological function. Mediators are factors whose presence prevents improvement.", "caseContext": null}, {"id": 140, "question": "In assessing James's 'Assimilation' node, which of the following is most relevant?", "options": [{"key": "A", "text": "His blood pressure"}, {"key": "B", "text": "His fasting glucose level"}, {"key": "C", "text": "His reported bloating and microbiome balance"}], "answer": "C", "rationale": "His reported bloating and microbiome balance Assimilation focuses on the Gl tract and entry into the body.", "caseContext": null}, {"id": 141, "question": "What is the primary goal when applying the 'Patient Communication' competency to James's case?", "options": [{"key": "A", "text": "To ensure he follows a strict 1,200 calorie diet immediately"}, {"key": "B", "text": "To explain how his stress and lack of sleep contribute to his metabolic dysfunction"}, {"key": "C", "text": "To memorize his list of current medications"}], "answer": "B", "rationale": "To explain how his stress and lack of sleep contribute to his metabolic dysfunction Educating the patient on how life events and circumstances contribute to dysfunction is a core competency.", "caseContext": null}, {"id": 142, "question": "James's abdominal weight gain and elevated HbA1c (5.9%) primarily reflect a disturbance in which domain?", "options": [{"key": "A", "text": "Biotransformation"}, {"key": "B", "text": "Structural Integrity"}, {"key": "C", "text": "Communication"}], "answer": "C", "rationale": "Communication Think about the balance of compounds like insulin and cortisol.", "caseContext": null}, {"id": 143, "question": "According to the Therapeutic Intervention competencies, what should be the FIRST step in managing James's rashes?", "options": [{"key": "A", "text": "Evaluate his readiness to engage in dietary changes (e.g., elimination of gluten/dairy)"}, {"key": "B", "text": "Begin long-term immunosuppressant therapy"}, {"key": "C", "text": "Prescribe a potent topical corticosteroid"}], "answer": "A", "rationale": "Evaluate his readiness to engage in dietary changes (e.g., elimination of gluten/dairy) Functional medicine prioritizes dietary and lifestyle strategies first. Evaluating readiness and prioritizing dietary/lifestyle changes is the first competency in the intervention domain.", "caseContext": null}, {"id": 144, "question": "James's high-stress job acts as a continuous 'mediator.' Which system is most likely being 'overwhelmed' in his Evaluation of Patient Domains?", "options": [{"key": "A", "text": "His structural cell membranes"}, {"key": "B", "text": "His musculoskeletal integrity"}, {"key": "C", "text": "His ability to adapt to allostatic load"}], "answer": "C", "rationale": "His ability to adapt to allostatic load Look for the term used to describe the cumulative wear and tear on the body. Stress is a primary driver of allostatic load, affecting his overall physiological function.", "caseContext": null}, {"id": 145, "question": "Which physical sign mentioned in the case study is an indicator of metabolic 'insufficiency' or imbalance?", "options": [{"key": "A", "text": "Elevated waist circumference"}, {"key": "B", "text": "Eczema on the antecubital fossa"}, {"key": "C", "text": "High stress levels"}], "answer": "A", "rationale": "Elevated waist circumference Abdominal adiposity is a key biometric indicator of metabolic disturbance and insulin resistance.", "caseContext": null}, {"id": 146, "question": "James's high blood pressure (145/92) requires an assessment of which Matrix domain?", "options": [{"key": "A", "text": "Assimilation"}, {"key": "B", "text": "Biotransformation"}, {"key": "C", "text": "Transport"}], "answer": "C", "rationale": "Transport The transport of compounds and substances through the cardiovascular system includes blood pressure regulation.", "caseContext": null}, {"id": 147, "question": "Which 'root cause' category best fits James's stressful job?", "options": [{"key": "A", "text": "Mediator"}, {"key": "B", "text": "Antecedent"}, {"key": "C", "text": "Trigger"}], "answer": "A", "rationale": "Mediator It is an ongoing circumstance and behavior that prevents the improvement of his function. Case Study 2 — Answer Key", "caseContext": null}, {"id": 148, "question": "Elena’s \"Butterfly rash\" and positive Anti-dsDNA are hallmark markers for which condition?", "options": [{"key": "A", "text": "Systemic Lupus Erythematosus (SLE)"}, {"key": "B", "text": "Scleroderma"}, {"key": "C", "text": "Dermatomyositis"}], "answer": "A", "rationale": "Systemic Lupus Erythematosus (SLE) Positive Anti-dsDNA is highly specific for SLE. The malar (butterfly) rash is a hallmark clinical sign.", "caseContext": "Case Study 2: The \"Aching\" Yoga Instructor (Immune & GI). Questions 148-160\nPatient Profile: Elena, a 38-year-old female.\nChief Concern: Migrating joint pain, \"butterfly\" rash on face after sun exposure, and severe Raynaud's\nphenomenon.\nHistory: Elena has a strong family history of Rheumatoid Arthritis (Antecedent). Her symptoms began after a\nstressful divorce and a subsequent \"flu-like illness\" last summer.\nPhysical Exam: Malar rash (sparing nasolabial folds), swelling of the PIP and MCP joints. Fine crackles heard at\nthe lung bases.\nLABS\nANA: 1:640 (Speckled pattern)  ·  Anti-dsDNA: Positive  ·  C3 and C4 Complement: Low\nStool Calprotectin: 150 ug/g (Elevated)  ·  Anti-Gliadin IgA: High; tTG-IgA: Negative"}, {"id": 149, "question": "Elena’s low C3 and C4 complement levels indicate:", "options": [{"key": "A", "text": "Immune deficiency"}, {"key": "B", "text": "Active immune complex consumption"}, {"key": "C", "text": "Success of her current yoga practice"}], "answer": "B", "rationale": "Active immune complex consumption In autoimmune flares (especially SLE), complement proteins (C3, C4) are \"used up\" as they bind to immune complexes, resulting in low serum levels.", "caseContext": null}, {"id": 150, "question": "In the \"Defense and Repair\" node, the \"Malar Rash\" is an example of:", "options": [{"key": "A", "text": "Loss of Self-Tolerance"}, {"key": "B", "text": "Acute Infection"}, {"key": "C", "text": "Structural breach"}], "answer": "A", "rationale": "Loss of Self-Tolerance Autoimmunity (ANA, Anti-dsDNA) represents a failure of the \"Defense and Repair\" node to distinguish between \"self\" and \"non-self.\"", "caseContext": null}, {"id": 151, "question": "Elena has elevated Anti-Gliadin IgA but negative tTG-IgA. This suggests:", "options": [{"key": "A", "text": "Overt Celiac Disease"}, {"key": "B", "text": "Non-Celiac Gluten Sensitivity"}, {"key": "C", "text": "No reaction to gluten"}], "answer": "B", "rationale": "Non-Celiac Gluten Sensitivity Celiac requires positive tTG-lgA (or biopsy). Elevated Anti-Gliadin with negative tTG often points to NCGS or a breach in oral tolerance.", "caseContext": null}, {"id": 152, "question": "In the 5R Protocol, Elena’s \"Butterfly rash\" and joint pain suggest the \"First Tier\" of the \"Remove\" step should focus on:", "options": [{"key": "A", "text": "Broad-spectrum antibiotics"}, {"key": "B", "text": "Inflammatory triggers (Gluten/Dairy) and UV exposure"}, {"key": "C", "text": "Heavy metal chelation"}], "answer": "B", "rationale": "Inflammatory triggers (Gluten/Dairy) and UV exposure In SLE, UV light is a known Trigger for flares. The \"Remove\" step of 5R focuses first on common dietary antigens and environmental triggers.", "caseContext": null}, {"id": 153, "question": "Elena’s \"migrating joint pain\" following a \"flu-like illness\" in the summer should prompt the clinician to screen for:", "options": [{"key": "A", "text": "Occult infections like Borrelia or co-infections (Lyme)"}, {"key": "B", "text": "Iron overload"}, {"key": "C", "text": "Vitamin D toxicity"}], "answer": "A", "rationale": "Occult infections like Borrelia or co-infections (Lyme) Migrating joint pain following a summer \"flu-like\" illness is a \"red flag\" for Tick-Borne illness (Lyme), which can mimic or trigger autoimmunity.", "caseContext": null}, {"id": 154, "question": "Elena’s elevated Stool Calprotectin (150) suggests inflammation in which Matrix node?", "options": [{"key": "A", "text": "Transport"}, {"key": "B", "text": "Assimilation"}, {"key": "C", "text": "Biotransformation"}], "answer": "B", "rationale": "Assimilation While it measures inflammation, Calprotectin is a stool marker indicating inflammation within the GI tract, which is organized under the Assimilation node.", "caseContext": null}, {"id": 155, "question": "Which \"M\" in the ATM framework does Elena’s \"Stressful Divorce\" represent?", "options": [{"key": "A", "text": "Mediator/Perpetuator"}, {"key": "B", "text": "Morbidity"}, {"key": "C", "text": "Maladaptation"}], "answer": "A", "rationale": "Mediator/Perpetuator A divorce is a psychosocial factor that \"mediates\" or \"perpetuates\" the stress response, keeping the immune system in a hyper-reactive state.", "caseContext": null}, {"id": 156, "question": "The Raynaud's phenomenon (cold, blue fingers) is organized under which Matrix node?", "options": [{"key": "A", "text": "Structural Integrity"}, {"key": "B", "text": "Transport"}, {"key": "C", "text": "Energy"}], "answer": "B", "rationale": "Transport Raynaud's is a vasospastic disorder affecting the flow of blood to extremities, making it a \"Transport\" node issue.", "caseContext": null}, {"id": 157, "question": "Which phytonutrient is most indicated for stabilizing Elena’s Mast Cells and reducing her systemic inflammatory load?", "options": [{"key": "A", "text": "Quercetin"}, {"key": "B", "text": "Sulforaphane"}, {"key": "C", "text": "Lycopene"}], "answer": "A", "rationale": "Quercetin Quercetin is a potent flavonoid used for mast cell stabilization and blunting the Th2/allergic/inflammatory response.", "caseContext": null}, {"id": 158, "question": "Elena’s \"Butterfly rash\" worsening with sun exposure is an example of:", "options": [{"key": "A", "text": "Phototoxicity"}, {"key": "B", "text": "Photosensitivity"}, {"key": "C", "text": "Vitamin D synthesis"}], "answer": "B", "rationale": "Photosensitivity In SLE, UV radiation causes keratinocyte apoptosis, releasing nuclear antigens that the immune system (having lost tolerance) attacks.", "caseContext": null}, {"id": 159, "question": "To support the \"Reinoculate\" step of the 5R program, the clinician should recommend:", "options": [{"key": "A", "text": "Digestive enzymes with every meal"}, {"key": "B", "text": "Polyphenol-rich foods and fermented vegetables"}, {"key": "C", "text": "Prednisone"}], "answer": "B", "rationale": "Polyphenol-rich foods and fermented vegetables \"Reinoculate\" involves introducing probiotics and prebiotics (including polyphenols) to support a healthy microbiome.", "caseContext": null}, {"id": 160, "question": "Which nutrient is critical for the \"T-Regulatory\" cells that help restore Elena's immune tolerance?", "options": [{"key": "A", "text": "Vitamin D and Vitamin A"}, {"key": "B", "text": "Calcium and Phosphorus"}, {"key": "C", "text": "Iron and Copper"}], "answer": "A", "rationale": "Vitamin D and Vitamin A Both Vitamin D and Vitamin A are crucial \"immunomodulators\" that promote the differentiation of T-Regulatory (Treg) cells, which dampen autoimmunity.", "caseContext": null}];

    const STORAGE_KEY_ANSWERS = 'ifm_exam6_answers';
    const STORAGE_KEY_SUBMITTED = 'ifm_exam6_submitted_groups';
    const STORAGE_KEY_VOCAB = 'ifm_vocab_list';
    const STORAGE_KEY_THEME = 'ifm_theme';

    let userAnswers = JSON.parse(localStorage.getItem(STORAGE_KEY_ANSWERS) || '{}');
    let submittedGroups = JSON.parse(localStorage.getItem(STORAGE_KEY_SUBMITTED) || '{}');
    let vocabList = JSON.parse(localStorage.getItem(STORAGE_KEY_VOCAB) || '[]');
    let currentBatch = 1;
    const batchSize = 20;
    const totalBatches = 8;

    function speakWord(word) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(word);
      const voices = window.speechSynthesis.getVoices();
      const naturalVoice = voices.find(v => (v.name.includes("Samantha") || v.name.includes("Ava") || v.name.includes("Jenny") || v.name.includes("Natural")) && v.lang.startsWith("en")) || voices.find(v => v.lang === "en-US");
      if (naturalVoice) utter.voice = naturalVoice;
      utter.lang = 'en-US';
      utter.rate = 0.88;
      window.speechSynthesis.speak(utter);
    }
    if ('speechSynthesis' in window) window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();

    function init() {
      applyTheme();
      renderBatchBar();
      renderQuestions();
      updateBadges();
      setupSelectionTooltip();
    }

    function switchView(viewName) {
      document.getElementById('view-exam').style.display = viewName === 'exam' ? 'block' : 'none';
      document.getElementById('view-vocab').style.display = viewName === 'vocab' ? 'block' : 'none';
      document.getElementById('view-wrong').style.display = viewName === 'wrong' ? 'block' : 'none';

      document.getElementById('tab-exam').className = 'nav-btn' + (viewName === 'exam' ? ' active' : '');
      document.getElementById('tab-vocab').className = 'nav-btn' + (viewName === 'vocab' ? ' active' : '');
      document.getElementById('tab-wrong').className = 'nav-btn' + (viewName === 'wrong' ? ' active' : '');

      if (viewName === 'vocab') renderVocabList();
      if (viewName === 'wrong') renderWrongList();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderBatchBar() {
      const container = document.getElementById('batch-grid');
      let html = '';
      let totalAnsweredAll = Object.keys(userAnswers).length;

      for (let i = 1; i <= totalBatches; i++) {
        const start = (i - 1) * batchSize + 1;
        const end = i * batchSize;
        
        let answeredInGroup = 0;
        let correctInGroup = 0;
        for (let qid = start; qid <= end; qid++) {
          if (userAnswers[qid]) answeredInGroup++;
          const q = ALL_QUESTIONS[qid - 1];
          if (q && userAnswers[qid] === q.answer) correctInGroup++;
        }

        const isSub = !!submittedGroups[i];
        let subText = `${answeredInGroup}/20 题`;
        if (isSub) {
          subText = `${correctInGroup}/20 正确 ✅`;
        }

        html += `
          <button class="batch-btn ${i === currentBatch ? 'active' : ''}" onclick="switchBatch(${i})">
            <span>${start}–${end} 题</span>
            <span class="batch-sub">${subText}</span>
          </button>
        `;
      }
      container.innerHTML = html;
      document.getElementById('exam-overall-stats').innerText = `总进度：${totalAnsweredAll} / 160 题已答`;
      document.getElementById('current-group-num').innerText = currentBatch;

      const isCurrentSub = !!submittedGroups[currentBatch];
      const btnSubmit = document.getElementById('btn-group-submit');
      if (isCurrentSub) {
        btnSubmit.innerText = '🔄 重新核对本组';
      } else {
        btnSubmit.innerText = '📝 交卷核对本组';
      }
    }

    function switchBatch(batchNum) {
      currentBatch = batchNum;
      renderBatchBar();
      renderQuestions();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function nextGroup() {
      if (currentBatch < totalBatches) {
        switchBatch(currentBatch + 1);
      } else {
        showToast('已经是最后一组了！建议切换到【错题深度复盘】进行汇总！');
      }
    }

    function renderQuestions() {
      const container = document.getElementById('questions-container');
      const startIdx = (currentBatch - 1) * batchSize;
      const batchList = ALL_QUESTIONS.slice(startIdx, startIdx + batchSize);
      const isSub = !!submittedGroups[currentBatch];

      let html = '';

      batchList.forEach(q => {
        const uAns = userAnswers[q.id];

        if (q.caseContext) {
          html += `
            <div class="case-card">
              <h3>📋 综合临床案例背景</h3>
              <pre>${q.caseContext}</pre>
            </div>
          `;
        }

        html += `
          <div class="card" id="q-card-${q.id}">
            <div class="q-meta">
              <span class="q-badge">QUESTION ${q.id} OF 160</span>
              <span>IFM Practice Exam 6</span>
            </div>
            <div class="question-stem">${q.question}</div>
            <div class="options">
              ${q.options.map(opt => {
                let optClass = 'option-label';
                if (isSub) {
                  if (opt.key === q.answer) optClass += ' is-correct';
                  else if (uAns === opt.key && uAns !== q.answer) optClass += ' is-wrong';
                }
                return `
                  <label class="${optClass}" id="opt-label-${q.id}-${opt.key}">
                    <input type="radio" name="q-${q.id}" value="${opt.key}" 
                      ${uAns === opt.key ? 'checked' : ''} 
                      onchange="selectAnswer(${q.id}, '${opt.key}')">
                    <span><span class="opt-key">${opt.key}.</span>${opt.text}</span>
                  </label>
                `;
              }).join('')}
            </div>
            <div class="explanation" id="exp-${q.id}" style="display: ${isSub ? 'block' : 'none'};">
              <div class="exp-row"><span class="exp-tag">🎯 正确答案:</span> <strong>${q.answer}</strong></div>
              <div class="exp-row"><span class="exp-tag">🔬 IFM 官方临床解析:</span> ${q.rationale || '详见 IFM 教材核心讲义解析'}</div>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    function selectAnswer(qid, val) {
      userAnswers[qid] = val;
      localStorage.setItem(STORAGE_KEY_ANSWERS, JSON.stringify(userAnswers));
      renderBatchBar();
      updateBadges();
    }

    function submitCurrentGroup() {
      const start = (currentBatch - 1) * batchSize + 1;
      const end = currentBatch * batchSize;
      
      let answeredCount = 0;
      let correctCount = 0;

      for (let qid = start; qid <= end; qid++) {
        if (userAnswers[qid]) answeredCount++;
        const q = ALL_QUESTIONS[qid - 1];
        if (q && userAnswers[qid] === q.answer) correctCount++;
      }

      submittedGroups[currentBatch] = true;
      localStorage.setItem(STORAGE_KEY_SUBMITTED, JSON.stringify(submittedGroups));

      renderBatchBar();
      renderQuestions();
      updateBadges();

      showToast(`第 ${currentBatch} 组核对完毕！答对 ${correctCount} / ${batchSize} 题（得分率 ${Math.round(correctCount / batchSize * 100)}%）`);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    let currentSelectedText = '';
    function setupSelectionTooltip() {
      const tooltip = document.getElementById('selection-tooltip');

      document.addEventListener('mouseup', function(e) {
        if (e.target.closest('#selection-tooltip')) return;

        const sel = window.getSelection();
        const text = sel.toString().trim();

        if (text && text.length > 1 && text.length < 50 && /^[a-zA-Z\s\-]+$/.test(text)) {
          currentSelectedText = text;
          const cleanKey = text.toLowerCase();
          const dictEntry = MEDICAL_DICT[cleanKey] || {};

          document.getElementById('tt-word').innerText = text;
          document.getElementById('tt-ipa').innerText = dictEntry.ipa || '';
          document.getElementById('tt-cn').innerText = dictEntry.cn || '点击收录或发音';

          const range = sel.getRangeAt(0);
          const rect = range.getBoundingClientRect();
          
          tooltip.style.left = (rect.left + rect.width / 2 + window.scrollX) + 'px';
          tooltip.style.top = (rect.top + window.scrollY) + 'px';
          tooltip.style.display = 'block';
        } else {
          tooltip.style.display = 'none';
        }
      });
    }

    function playSelectedWord(e) {
      e.stopPropagation();
      if (currentSelectedText) speakWord(currentSelectedText);
    }

    function saveSelectedWord(e) {
      e.stopPropagation();
      if (!currentSelectedText) return;
      const cleanKey = currentSelectedText.toLowerCase();
      const dictEntry = MEDICAL_DICT[cleanKey] || {};

      if (!vocabList.some(v => v.word.toLowerCase() === cleanKey)) {
        vocabList.unshift({
          word: currentSelectedText,
          ipa: dictEntry.ipa || '',
          cn: dictEntry.cn || '',
          time: new Date().toLocaleDateString()
        });
        localStorage.setItem(STORAGE_KEY_VOCAB, JSON.stringify(vocabList));
        updateBadges();
        showToast(`已成功收录: ${currentSelectedText} 到生词本！`);
      } else {
        showToast(`该词已在生词本中`);
      }
      document.getElementById('selection-tooltip').style.display = 'none';
    }

    function renderVocabList() {
      const tbody = document.getElementById('vocab-table-body');
      if (vocabList.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding: 2.5rem; color: var(--text-muted);">生词本为空。在答题过程中用鼠标选中任何英文生词，即可划词发音并收录！</td></tr>`;
        return;
      }
      tbody.innerHTML = vocabList.map((item, idx) => `
        <tr>
          <td><strong>${item.word}</strong></td>
          <td style="color: #8b5cf6; font-family: monospace;">${item.ipa || '-'}</td>
          <td>${item.cn || '<span style="color:var(--text-muted);">自行记忆</span>'}</td>
          <td style="text-align: center;">
            <button class="btn-icon" onclick="speakWord('${item.word}')" title="播放真人自然发音">🔊</button>
          </td>
          <td style="text-align: center;">
            <button class="btn-icon" onclick="deleteVocab(${idx})" title="删除" style="color: var(--danger);">🗑️</button>
          </td>
        </tr>
      `).join('');
    }

    function deleteVocab(idx) {
      vocabList.splice(idx, 1);
      localStorage.setItem(STORAGE_KEY_VOCAB, JSON.stringify(vocabList));
      renderVocabList();
      updateBadges();
      showToast('已从生词本移除');
    }

    function clearVocab() {
      if (confirm('确定要清空全部生词本吗？')) {
        vocabList = [];
        localStorage.setItem(STORAGE_KEY_VOCAB, JSON.stringify(vocabList));
        renderVocabList();
        updateBadges();
        showToast('生词本已清空');
      }
    }

    function copyVocabMarkdown() {
      if (vocabList.length === 0) return showToast('生词本为空！');
      let md = '| 单词 (Word) | 国际音标 (IPA) | 功能医学专业释义 |\n|---|---|---|\n';
      vocabList.forEach(v => {
        md += `| ${v.word} | ${v.ipa} | ${v.cn} |\n`;
      });
      navigator.clipboard.writeText(md).then(() => showToast('已成功复制 Markdown 表格到剪贴板！可直接粘贴至 Obsidian！'));
    }

    function exportVocabTSV() {
      if (vocabList.length === 0) return showToast('生词本为空！');
      let tsv = '';
      vocabList.forEach(v => {
        tsv += `${v.word}\t${v.ipa}\t${v.cn}\n`;
      });
      navigator.clipboard.writeText(tsv).then(() => showToast('已成功复制 TSV 到剪贴板！可直接粘贴导入 Anki！'));
    }

    function renderWrongList() {
      const container = document.getElementById('wrong-list-container');
      const wrongQuestions = [];

      ALL_QUESTIONS.forEach(q => {
        const groupNum = Math.ceil(q.id / batchSize);
        if (submittedGroups[groupNum]) {
          const uAns = userAnswers[q.id];
          if (uAns && uAns !== q.answer) {
            wrongQuestions.push({ question: q, userAns: uAns });
          }
        }
      });

      if (wrongQuestions.length === 0) {
        container.innerHTML = `
          <div class="card" style="text-align: center; padding: 3rem; color: var(--text-muted);">
            🎉 暂无错题记录！请先在【英文真题】中作答并点击【交卷核对】，系统会自动抓取全部错题！
          </div>
        `;
        return;
      }

      container.innerHTML = wrongQuestions.map(w => `
        <div class="wrong-item">
          <div class="wrong-header">
            <span style="color: var(--danger);">QUESTION ${w.question.id} (第 ${Math.ceil(w.question.id / batchSize)} 组)</span>
            <span>IFM Practice Exam 6</span>
          </div>
          <div class="wrong-stem">${w.question.question}</div>
          <div class="wrong-choice-grid">
            <div class="my-choice">❌ 我的选择: ${w.userAns}</div>
            <div class="correct-choice">✅ 正确答案: ${w.question.answer}</div>
          </div>
          <div class="explanation" style="display:block; margin-top: 0.6rem;">
            <div class="exp-row"><span class="exp-tag">🔬 机制深度剖析:</span> ${w.question.rationale}</div>
          </div>
        </div>
      `).join('');
    }

    function getWrongList() {
      const wrongQuestions = [];
      ALL_QUESTIONS.forEach(q => {
        const groupNum = Math.ceil(q.id / batchSize);
        if (submittedGroups[groupNum]) {
          const uAns = userAnswers[q.id];
          if (uAns && uAns !== q.answer) {
            wrongQuestions.push({ q: q, uAns: uAns });
          }
        }
      });
      return wrongQuestions;
    }

    function copyWrongForNotebookLM() {
      const wrongQuestions = getWrongList();
      if (wrongQuestions.length === 0) return showToast('目前暂无已批改出的错题！');

      let text = `【请基于已上传的 IFM 官方讲义、教材与课程 Transcript 检索并回答】\n\n`;
      text += `我在进行 IFM Practice Exam 6 模考时做错了以下题目。请检索知识库中对应的 APM 模块（GI, Detox, Hormone, Energy, Immune, Cardiometabolic, Neuro/Matrix/GOTOIT）及课程音频文字稿：\n\n`;
      text += `1. **知识点与模块定位**：指出每道题涉及的核心模块、讲义章节或专家观点；\n`;
      text += `2. **错选辨析与机制深剖**：对照【我的错误选择】与【官方正确答案】，用讲义中的生理/生化机理解释我为什么会混淆，并引用讲义依据；\n`;
      text += `3. **临床要点总结**：提炼该知识点在 IFM 认证考试中的必背临床诊断与干预原则。\n\n`;
      text += `### 错题明细清单：\n\n`;

      wrongQuestions.forEach((item, index) => {
        text += `#### 错题 ${index + 1} (Question ${item.q.id})\n`;
        text += `**英文题干**: ${item.q.question}\n`;
        text += `**选项列表**:\n`;
        item.q.options.forEach(opt => {
          text += `  - ${opt.key}. ${opt.text}\n`;
        });
        text += `**我的错误选择**: ❌ ${item.uAns}\n`;
        text += `**官方正确答案**: ✅ ${item.q.answer}\n`;
        text += `**官方临床解析**: ${item.q.rationale}\n\n`;
      });

      navigator.clipboard.writeText(text).then(() => {
        showToast('已复制【NotebookLM 专属提问指令】！直接粘贴到 NotebookLM 对话框即可！');
      });
    }

    function copyWrongForAI() {
      const wrongQuestions = getWrongList();
      if (wrongQuestions.length === 0) return showToast('目前暂无已批改出的错题！');

      let promptText = `## IFM 备考专项深度复盘与二次变式出题\n\n`;
      promptText += `我在做 IFM Practice Exam 6 时出现以下错题。请调取我的 IFM 课程笔记与讲义，针对每道错题帮我做两件事：\n`;
      promptText += `1. **核心病理生理机制剖析**：分析我为什么容易选错【我的选项】，正解【正确选项】在功能医学矩阵（Matrix）或生化通路上的根本逻辑是什么；\n`;
      promptText += `2. **反向变式出题（二次盲测）**：针对该考点，出 2 道新的英文临床案例长题（附 4 个选项与解析），测试我是否彻底掌握。\n\n`;
      promptText += `### 错题明细清单：\n\n`;

      wrongQuestions.forEach((item, index) => {
        promptText += `#### 错题 ${index + 1} (Question ${item.q.id})\n`;
        promptText += `- **英文原题**: ${item.q.question}\n`;
        promptText += `- **我的错误选择**: ${item.uAns}\n`;
        promptText += `- **官方正确答案**: ${item.q.answer}\n`;
        promptText += `- **官方参考解析**: ${item.q.rationale}\n\n`;
      });

      navigator.clipboard.writeText(promptText).then(() => {
        showToast('已成功复制变式出题 Prompt！请直接粘贴至 Gemini / Claude 对话框！');
      });
    }

    function copyWrongAsNote() {
      const wrongQuestions = getWrongList();
      if (wrongQuestions.length === 0) return showToast('目前暂无已批改出的错题！');

      let text = `# IFM Practice Exam 6 错题复盘笔记\n\n`;
      text += `> 收录日期: ${new Date().toLocaleDateString()} | 错题总数: ${wrongQuestions.length} 题\n\n`;
      text += `---\n\n`;

      wrongQuestions.forEach((item, index) => {
        text += `### Q${item.q.id}. ${item.q.question}\n\n`;
        item.q.options.forEach(opt => {
          let mark = '  ';
          if (opt.key === item.q.answer) mark = '✅ ';
          else if (opt.key === item.uAns) mark = '❌ ';
          text += `- ${mark}${opt.key}. ${opt.text}\n`;
        });
        text += `\n**我的错选**: ${item.uAns} | **标准答案**: ${item.q.answer}\n\n`;
        text += `**官方临床机制解析 (Rationale)**:\n${item.q.rationale}\n\n`;
        text += `---\n\n`;
      });

      navigator.clipboard.writeText(text).then(() => {
        showToast('已复制【Markdown 错题笔记源】！可在 NotebookLM 点击“添加笔记”直接粘贴！');
      });
    }

    function updateBadges() {
      document.getElementById('vocab-count').innerText = vocabList.length;
      
      let wrongCount = 0;
      ALL_QUESTIONS.forEach(q => {
        const groupNum = Math.ceil(q.id / batchSize);
        if (submittedGroups[groupNum] && userAnswers[q.id] && userAnswers[q.id] !== q.answer) {
          wrongCount++;
        }
      });
      document.getElementById('wrong-count').innerText = wrongCount;
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 3200);
    }

    function applyTheme() {
      const th = localStorage.getItem(STORAGE_KEY_THEME) || 'light';
      if (th === 'dark') document.body.classList.add('dark-mode');
      else document.body.classList.remove('dark-mode');
    }
    function toggleTheme() {
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      localStorage.setItem(STORAGE_KEY_THEME, isDark ? 'dark' : 'light');
    }

    window.onload = init;
  </script>
</body>
</html>
