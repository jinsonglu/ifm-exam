) over the 'reproductive' axis (HPG) during perceived danger.", "caseContext": null}, {"id": 92, "question": "When assessing a patient for 'Estrogen Excess' conditions (like endometriosis or fibroids), which Phase 3 detoxification factor is a common Functional Medicine target?", "options": [{"key": "A", "text": "Urine pH levels."}, {"key": "B", "text": "Liver enzyme induction."}, {"key": "C", "text": "Beta-glucuronidase activity in the gut microbiome."}, {"key": "D", "text": "Glutathione conjugation."}], "answer": "C", "rationale": "Beta-glucuronidase activity in the gut microbiome. This involves a 'recycling' process that happens in the large intestine. High levels of this enzyme ‘un-zip' conjugated estrogen, allowing it to be reabsorbed into circulation.", "caseContext": null}, {"id": 93, "question": "What is the 'Window of Opportunity' hypothesis regarding the initiation of HRT for cardiovascular protection in women?", "options": [{"key": "A", "text": "HRT is most effective and safest when started within 10 years of menopause or before age of 60."}, {"key": "B", "text": "HRT should only be started after age 70 to protect the heart."}, {"key": "C", "text": "HRT has no effect on cardiovascular risk regardless of when it is started."}, {"key": "D", "text": "HRT should only be used for a maximum of 6 months to avoid heart failure."}], "answer": "A", "rationale": "HRT is most effective and safest when started within 10 years of menopause or before age of 60. Estrogen's protective effect on the endothelium is most robust before significant atherosclerosis has developed.", "caseContext": null}, {"id": 94, "question": "A 55-year-old female patient with an intact uterus is starting BHRT. Which combination of hormones and delivery methods best aligns with the Sex Hormones Module safety guidelines for minimizing thrombotic risk and protecting the endometrium?", "options": [{"key": "A", "text": "Oral Estradiol and Oral Medroxyprogesterone Acetate."}, {"key": "B", "text": "Transdermal Estradiol and Micronized Progesterone"}, {"key": "C", "text": "Synthetic Equine Estrogen patches and Oral Micronized Progesterone."}, {"key": "D", "text": "Transdermal Estradiol alone."}], "answer": "B", "rationale": "Transdermal Estradiol and Micronized Progesterone Transdermal delivery avoids the hepatic first-pass effect on clotting factors, and micronized progesterone provides essential endometrial protection.", "caseContext": null}, {"id": 95, "question": "Which specific physiological mechanism explains why starting HRT 15 years after the onset of menopause increases cardiovascular risk, according to the \"Window of Opportunity' hypothesis?", "options": [{"key": "A", "text": "Estrogen triggers the immediate breakdown of healthy smooth muscle cells."}, {"key": "B", "text": "Pro-inflammatory remodeling and established plaque can be destabilized by estrogen's effects on the endothelium."}, {"key": "C", "text": "Late-stage initiation causes a massive surge in HDL cholesterol that clogs arteries."}, {"key": "D", "text": "The liver becomes unable to process any form of estrogen after age 65."}], "answer": "B", "rationale": "Pro-inflammatory remodeling and established plaque can be destabilized by estrogen's effects on the endothelium. In an aged vascular environment with existing atherosclerosis, estrogen may promote plaque rupture or inflammation rather than vasodilation.", "caseContext": null}, {"id": 96, "question": "If a male patient's lab results show a high 'Total Testosterone’ but he remains symptomatic for hypogonadism, which protein's elevation is most likely 'masking' his deficiency?", "options": [{"key": "A", "text": "Aromatase."}, {"key": "B", "text": "C-Reactive Protein (CRP)."}, {"key": "C", "text": "Albumin."}, {"key": "D", "text": "Sex Hormone Binding Globulin (SHBG)"}], "answer": "D", "rationale": "Sex Hormone Binding Globulin (SHBG) SHBG binds testosterone with high affinity; if elevated (often due to age or high insulin), it reduces the free, active fraction.", "caseContext": null}, {"id": 97, "question": "In the 'Estrobolome' concept, high levels of bacterial beta-glucuronidase in the gut lead to which clinical outcome?", "options": [{"key": "A", "text": "Reabsorption of active estrogen into the systemic circulation."}, {"key": "B", "text": "Increased excretion of estrogen in the stool."}, {"key": "C", "text": "Inhibition of the Aromatase enzyme in adipose tissue."}, {"key": "D", "text": "Rapid conversion of Estradiol to the protective 2-OH metabolite."}], "answer": "A", "rationale": "Reabsorption of active estrogen into the systemic circulation. By de-conjugating estrogen, the enzyme allows it to cross back through the intestinal wall and return to the blood.", "caseContext": null}, {"id": 98, "question": "According to the 'Hormone Hierarchy,' why should a clinician address insulin resistance and blood sugar before escalating a testosterone replacement dose in a male patient?", "options": [{"key": "A", "text": "High insulin up-regulates aromatase, potentially converting the supplemental testosterone into estradiol."}, {"key": "B", "text": "Blood sugar must be low for the testosterone to bind to its receptors."}, {"key": "C", "text": "Testosterone supplementation will cause a life-threatening drop in blood sugar."}, {"key": "D", "text": "Insulin is the precursor required for the body to manufacture testosterone."}], "answer": "A", "rationale": "High insulin up-regulates aromatase, potentially converting the supplemental testosterone into estradiol. Insulin resistance is often associated with increased adiposity and aromatase activity, leading to ‘estrogenization' of the treatment.", "caseContext": null}, {"id": 99, "question": "A patient with PCOS and 'Androgen Dominance' presents with hirsutism. Which nutritional intervention specifically targets the 5-alpha reductase enzyme to reduce DHT production?", "options": [{"key": "A", "text": "High-dose Iron supplementation"}, {"key": "B", "text": "Magnesium and B12."}, {"key": "C", "text": "Calcium D-Glucarate."}, {"key": "D", "text": "Saw Palmetto and Zinc."}], "answer": "D", "rationale": "Saw Palmetto and Zinc. These substances are known natural inhibitors of the 5-alpha reductase enzyme, reducing the conversion to potent DHT.", "caseContext": null}, {"id": 100, "question": "How does chronic activation of the HPA axis (stress) lead to 'Functional Hypothalamic Amenorrhea’?", "options": [{"key": "A", "text": "Glucocorticoids and CRH inhibit the pulsatile release of GnRH from the hypothalamus."}, {"key": "B", "text": "Cortisol directly destroys the egg follicles in the ovaries."}, {"key": "C", "text": "The liver stops producing the cholesterol needed to make estrogen during stress."}, {"key": "D", "text": "Stress causes the pituitary to overproduce LH, which exhausts the ovaries."}], "answer": "A", "rationale": "Glucocorticoids and CRH inhibit the pulsatile release of GnRH from the hypothalamus. Stress signals prioritize survival, effectively shutting down the master 'metronome' (GnRH) of the reproductive system.", "caseContext": null}, {"id": 101, "question": "A patient presents with jaundice that consistently appears or worsens after a period of fasting. This clinical finding is most indicative of a genetic variation in which biotransformation pathway?", "options": [{"key": "A", "text": "Acetylation"}, {"key": "B", "text": "Methylation"}, {"key": "C", "text": "Sulfation"}, {"key": "D", "text": "Glucuronidation"}], "answer": "D", "rationale": "Glucuronidation Gilbert’s Syndrome involves UGT1A1 SNPs that impair the ability to conjugate bilirubin with glucuronic acid, often manifesting as elevated unconjugated bilirubin during fasting.", "caseContext": null}, {"id": 102, "question": "Which nutrient is required for the function of all Cytochrome P450 enzymes (Phase I) and is involved in the metabolism of approximately 75% of all drugs?", "options": [{"key": "A", "text": "Zinc"}, {"key": "B", "text": "Magnesium"}, {"key": "C", "text": "Iron"}, {"key": "D", "text": "Selenium"}], "answer": "C", "rationale": "Iron Iron is a strictly required component for all CYP450 enzymes, which are heme-containing proteins.", "caseContext": null}, {"id": 103, "question": "In the context of the IFM Environmental Health Matrix, which clinical indicator would be classified under 'Biotransformation & Elimination'?", "options": [{"key": "A", "text": "Elevated ALT and AST"}, {"key": "B", "text": "Celiac Disease"}, {"key": "C", "text": "Type II Diabetes"}, {"key": "D", "text": "Osteopenia"}], "answer": "A", "rationale": "Elevated ALT and AST Look for a marker specifically associated with liver function or toxic burden. Elevated liver enzymes like GGT, AST, and ALT are key indicators of imbalances in the Biotransformation node.", "caseContext": null}, {"id": 104, "question": "Which enzyme/marker is hypothesized to be a predictor for Type 2 Diabetes and Cardiovascular disease due to its role as a surrogate marker for toxic exposure to Persistent Organic Pollutants (POPs)?", "options": [{"key": "A", "text": "Superoxide Dismutase (SOD)"}, {"key": "B", "text": "Alkaline Phosphatase (ALP)"}, {"key": "C", "text": "C-Reactive Protein (CRP)"}, {"key": "D", "text": "Gamma-Glutamy] Transpeptidase (GGT)"}], "answer": "D", "rationale": "Gamma-Glutamy] Transpeptidase (GGT) Serum GGT is positively related to xenobiotics conjugated by glutathione and may reflect exposure to POPs residing in adipose tissue. This enzyme is often used to assess liver health but has a ‘two-part hypothesis' regarding its link to obesity and diabetes.", "caseContext": null}, {"id": 105, "question": "An individual with high levels of CYP1A2 activity may exhibit which of the following characteristics?", "options": [{"key": "A", "text": "Increased risk of warfarin toxicity"}, {"key": "B", "text": "Sensitivity to low doses of caffeine"}, {"key": "C", "text": "Impaired ability to process ethanol"}, {"key": "D", "text": "High caffeine tolerance"}], "answer": "D", "rationale": "High caffeine tolerance Since CYP1A2 demethylates and inactivates caffeine, high activity—often induced by smoking or charbroiled meats— results in high caffeine tolerance.", "caseContext": null}, {"id": 106, "question": "A patient presents with 'Itai-itai' disease, characterized by severe bone pain and softening. Which environmental toxin is the primary cause of this condition?", "options": [{"key": "A", "text": "Arsenic"}, {"key": "B", "text": "Cadmium"}, {"key": "C", "text": "Lead"}, {"key": "D", "text": "Phthalates"}], "answer": "B", "rationale": "Cadmium Cadmium poisoning causes kidney damage which then leads to the leaching of calcium from bones, resulting in the painful 'Itai-itai' syndrome.", "caseContext": null}, {"id": 107, "question": "Which dietary component is specifically recommended in the IFM module to increase the excretion of Polychlorinated Biphenyls (PCBs) by binding them in the GI tract?", "options": [{"key": "A", "text": "Raw animal fats"}, {"key": "B", "text": "High doses of Vitamin A"}, {"key": "C", "text": "Soluble and insoluble fiber (Rice bran, Olestra)"}, {"key": "D", "text": "Refined sugars"}], "answer": "C", "rationale": "Soluble and insoluble fiber (Rice bran, Olestra) Non-absorbable lipids and fiber acts as 'sinks' for lipophilic toxins, preventing their enterohepatic recirculation.", "caseContext": null}, {"id": 108, "question": "What is the primary role of Phase I biotransformation reactions?", "options": [{"key": "A", "text": "To introduce or expose a functional group on a parent compound"}, {"key": "B", "text": "To eliminate excess histamine through acetylation"}, {"key": "C", "text": "To reduce the reactivity of activated intermediates"}, {"key": "D", "text": "To conjugate toxins with a polar moiety for immediate excretion"}], "answer": "A", "rationale": "To introduce or expose a functional group on a parent compound Phase | reactions (oxidation, reduction, hydrolysis) expose or add functional groups, often making the compound more polar and prepared for Phase II.", "caseContext": null}, {"id": 109, "question": "When evaluating a patient for heavy metal burden, which biomarker is best for estimating exposure to Lead, Cadmium, or Mercury within the last 4-6 weeks?", "options": [{"key": "A", "text": "Fecal metals test"}, {"key": "B", "text": "Whole blood concentration"}, {"key": "C", "text": "Hair analysis"}, {"key": "D", "text": "Serum GGT"}], "answer": "B", "rationale": "Whole blood concentration For Lead, Cadmium, and Mercury, blood is the standard biomarker for assessing exposure occurring within a few months of collection. D is not correct since GGT is a surrogate marker for xenobiotic load but does not quantify specific heavy metal levels.", "caseContext": null}, {"id": 110, "question": "Which Phase II pathway is the primary route for the elimination of excess histamine and serotonin, and is often impaired in individuals with multiple chemical sensitivities?", "options": [{"key": "A", "text": "Sulfation"}, {"key": "B", "text": "Methylation"}, {"key": "C", "text": "Amino Acid Conjugation"}, {"key": "D", "text": "Acetylation"}], "answer": "D", "rationale": "Acetylation Acetylation attaches acetyl Co-A to toxins and is the key pathway for eliminating excess histamine, serotonin, and sulfa drugs.", "caseContext": null}, {"id": 111, "question": "A patient with a known UGT1A1*28 polymorphism (Gilbert’s Syndrome) is prescribed the chemotherapy drug Irinotecan (CPT-11). What is the primary clinical concern regarding this patient's biotransformation capacity?", "options": [{"key": "A", "text": "Increased risk of severe neutropenia and diarrhea due to impaired clearance of the SN-38 metabolite."}, {"key": "B", "text": "Enhanced glutathione depletion leading to acute liver failure."}, {"key": "C", "text": "Accelerated excretion of the drug, leading to sub-therapeutic levels."}, {"key": "D", "text": "Failure to activate the pro-drug into its active form."}], "answer": "A", "rationale": "Increased risk of severe neutropenia and diarrhea due to impaired clearance of the SN-38 metabolite. Reduced UGT1A1 activity significantly increases the risk of side effects like neutropenia and diarrhea because the active metabolite SN-38 is cleared via glucuronidation.", "caseContext": null}, {"id": 112, "question": "According to the 'PURE' case studies and the sequencing of detox, which step should be prioritized before initiating more rigorous therapeutic interventions like liquid fasting or chelation?", "options": [{"key": "A", "text": "Increasing Phase I enzyme activity through high-dose caffeine."}, {"key": "B", "text": "Establishing healthy elimination and ensuring the patient is nutritionally replete."}, {"key": "C", "text": "Administering high-dose NAC to stimulate glutathione production."}, {"key": "D", "text": "Immediate removal of dental amalgams."}], "answer": "B", "rationale": "Establishing healthy elimination and ensuring the patient is nutritionally replete. The 'U' in the P-U-R-E (Undernourished) emphasizes that patients must have adequate nutrient stores and functional bowel movements before starting intense detox.", "caseContext": null}, {"id": 113, "question": "A patient exhibits signs of 'slow acetylation.’ Which set of cofactors would be most beneficial to support this specific Phase II pathway?", "options": [{"key": "A", "text": "B12, Folate, and SAMe"}, {"key": "B", "text": "Selenium, Vitamin C, and N-acetylcysteine"}, {"key": "C", "text": "Glycine, Taurine, and Glutamine"}, {"key": "D", "text": "Pantothenic acid, B1, B2, and Magnesium"}], "answer": "D", "rationale": "Pantothenic acid, B1, B2, and Magnesium Acetylation requires the conversion of pyruvate to acetyl CoA, which depends on these specific B-vitamins and minerals.", "caseContext": null}, {"id": 114, "question": "Which biomarker is considered a standard measure for estimating mercury exposure occurring within the last few months, specifically reflecting the internal dose from both organic and inorganic sources?", "options": [{"key": "A", "text": "Serum Gamma-Glutamy1 Transpeptidase (GGT)"}, {"key": "B", "text": "Hair analysis"}, {"key": "C", "text": "Urine mercapturic acids"}, {"key": "D", "text": "Whole blood concentration"}], "answer": "D", "rationale": "Whole blood concentration Whole blood is the standard for assessing exposure to heavy metals like lead and mercury within a 4-6 week window.", "caseContext": null}, {"id": 115, "question": "Ifa patient is a 'slow acetylator' and also has a glutathione deficiency, they are at significantly increased risk for hepatotoxicity when taking which common medication?", "options": [{"key": "A", "text": "Acetaminophen"}, {"key": "B", "text": "Ibuprofen"}, {"key": "C", "text": "Caffeine"}, {"key": "D", "text": "Warfarin"}], "answer": "A", "rationale": "Acetaminophen Acetaminophen is processed by several pathways; when sulfation and glucuronidation are overwhelmed or impaired, the toxic Acetaminophen metabolite must be neutralized by glutathione.", "caseContext": null}, {"id": 116, "question": "Which clinical physical exam finding is most closely associated with an iron deficiency, which could indirectly impair all Cytochrome P450 (Phase I) reactions?", "options": [{"key": "A", "text": "Angular stomatitis and spoon-shaped nails (koilonychia)"}, {"key": "B", "text": "Loss of vibratory sense in the great toe"}, {"key": "C", "text": "Leukonychia (white spots on nails)"}, {"key": "D", "text": "Dermatitis and hair loss"}], "answer": "A", "rationale": "Angular stomatitis and spoon-shaped nails (koilonychia) These are classic clinical signs of iron deficiency, which is critical for the heme-containing CYP450 enzymes. B is not quite correct since Loss of vibratory sense is a sign of B12 deficiency or peripheral neuropathy. C and D are signs of zinc deficiency.", "caseContext": null}, {"id": 117, "question": "According to the IFM Bioenergetics Clinical Decision Tree, which of the following is considered a primary metabolism diagnostic test (1° Metabolism Dx)?", "options": [{"key": "A", "text": "Genetic testing for mitochondrial SNPs"}, {"key": "B", "text": "B-Vitamins, Magnesium, and CoQ10"}, {"key": "C", "text": "Cellular Redox and Lactate:Pyruvate ratio"}, {"key": "D", "text": "Acyl-Carnitine and Organic Acids Profile"}], "answer": "B", "rationale": "B-Vitamins, Magnesium, and CoQ10 Primary tests focus on common micronutrient cofactors for the Citric Acid Cycle and ETC. The decision tree lists B- vitamins, Magnesium, and CoQ10 as the first-line (12) biomarkers to assess for metabolic energy dysregulation.", "caseContext": null}, {"id": 118, "question": "Which nutrient is specifically noted as having the 'greatest potential to be toxic to mitochondria’ if present in excess?", "options": [{"key": "A", "text": "Vitamin B3 (Niacin)"}, {"key": "B", "text": "Iron"}, {"key": "C", "text": "Vitamin B2 (Riboflavin)"}, {"key": "D", "text": "Zinc"}], "answer": "B", "rationale": "Iron Think of a mineral that, while being an essential cofactor for the ETC and catalase, can also promote significant oxidative stress through the Fenton reaction.", "caseContext": null}, {"id": 119, "question": "In the context of the IFM Fatigue Matrix, which \"The Usual Suspects' category includes Dysbiosis, SIBO, and Hypochlorhydria?", "options": [{"key": "A", "text": "Communication"}, {"key": "B", "text": "Assimilation"}, {"key": "C", "text": "Defense & Repair"}, {"key": "D", "text": "Biotransformation & Elimination"}], "answer": "B", "rationale": "Assimilation The matrix organizes clinical imbalances by node; gastrointestinal issues like SIBO and low stomach acid fall under Assimilation.", "caseContext": null}, {"id": 120, "question": "The module identifies several 'Hormetic Therapies’ that can stimulate mitochondrial adaptation. Which of the following is NOT listed as a mitochondrial hormetic therapy?", "options": [{"key": "A", "text": "Statin Use"}, {"key": "B", "text": "Light and Oxygen"}, {"key": "C", "text": "Heat and Cold exposure"}, {"key": "D", "text": "Hydration"}], "answer": "A", "rationale": "Statin Use Statins are listed as a cause of energy dysregulation (due to CoQ10 depletion) rather than a beneficial hormetic therapy.", "caseContext": null}, {"id": 121, "question": "Which enzyme, responsible for converting Superoxide into Hydrogen Peroxide, requires Manganese (Mn) as a co-factor when located in the mitochondria?", "options": [{"key": "A", "text": "Glutathione Peroxidase (GPx)"}, {"key": "B", "text": "Catalase"}, {"key": "C", "text": "SOD1"}, {"key": "D", "text": "SOD2"}], "answer": "D", "rationale": "SOD2 SOD2 is the mitochondrial form of superoxide dismutase and specifically requires Manganese as its cofactor.", "caseContext": null}, {"id": 122, "question": "What is considered the 'best marker for monitoring intracellular oxidative stress' according to the module's review on Glutathione?", "options": [{"key": "A", "text": "Total serum glutathione levels"}, {"key": "B", "text": "Plasma GSH-to-GSSG ratio"}, {"key": "C", "text": "Red blood cell (RBC) magnesium"}, {"key": "D", "text": "Urine 8-OHdG"}], "answer": "B", "rationale": "Plasma GSH-to-GSSG ratio Monitoring the balance between the 'reduced' and 'oxidized' forms of this tripeptide provides insight into the body's antioxidant capacity. The module explicitly states that the ratio of reduced (GSH) to oxidized (GSSG) glutathione in plasma is the best marker for intracellular oxidative stress.", "caseContext": null}, {"id": 123, "question": "In the clinical management of Chronic Pain, which 'node' is described as the 'Center of the Matrix' for modulating stress through mindfulness practices?", "options": [{"key": "A", "text": "Communication"}, {"key": "B", "text": "Mental, Emotional, and Spiritual"}, {"key": "C", "text": "Energy"}, {"key": "D", "text": "Structural Integrity"}], "answer": "B", "rationale": "Mental, Emotional, and Spiritual In the IFM Pain Matrix, the center focuses on the patient's internal dialogue, purpose, and perception of pain, mindfulness, and the mental/emotional/spiritual aspects of the patient's story.", "caseContext": null}, {"id": 124, "question": "Which set of nutrients is identified as critical for 'Energy Transport’ (Electron Transfer)?", "options": [{"key": "A", "text": "L-Carnitine and CoQ10"}, {"key": "B", "text": "Iron and Copper"}, {"key": "C", "text": "Vitamin D and Magnesium"}, {"key": "D", "text": "Riboflavin (B2) and Niacin (B3)"}], "answer": "D", "rationale": "Riboflavin (B2) and Niacin (B3) The module identifies Riboflavin (as FAD) and Niacin (as NAD) as the primary nutrients critical for energy transport/ electron transfer.", "caseContext": null}, {"id": 125, "question": "Which of the following is a symptom or sign specifically associated with 'Mitochondropathy' in the endocrine/systemic category?", "options": [{"key": "A", "text": "Hyperthyroidism"}, {"key": "B", "text": "Hypercalcemia"}, {"key": "C", "text": "Hypoglycemia"}, {"key": "D", "text": "Excessive weight gain"}], "answer": "C", "rationale": "Hypoglycemia Low blood sugar (hypoglycemia) is explicitly listed as a systemic and liver-related indicator of mitochondrial dysfunction.", "caseContext": null}, {"id": 126, "question": "Which IFM matrix node includes 'BDNF' and 'Nerve Growth Factors' as clinical considerations for neurodegeneration?", "options": [{"key": "A", "text": "Assimilation"}, {"key": "B", "text": "Defense & Repair"}, {"key": "C", "text": "Communication"}, {"key": "D", "text": "Transport"}], "answer": "C", "rationale": "Communication Growth factors are chemical signals that allow cells to interact and regenerate. The Neurodegeneration Matrix places BDNF, Nerve Growth factors, and HPATG axis imbalances under the Communication node.", "caseContext": null}, {"id": 127, "question": "A patient presents with high levels of 8-OH deoxyguanosine (8-OHdG) and oxidized LDL on their initial lab work. According to the IFM Bioenergetics Clinical Decision Tree, which of the following is an appropriate 1° Oxidative Stress Treatment?", "options": [{"key": "A", "text": "Resveratrol, Curcumin, and IV Glutathione"}, {"key": "B", "text": "Alpha-Lipoic Acid (ALA), Sulforaphane-glucosinolate (SGS), and CPAP"}, {"key": "C", "text": "Chelation therapy and SAM-e"}, {"key": "D", "text": "Phosphatidylcholine and Fish Oil"}], "answer": "B", "rationale": "Alpha-Lipoic Acid (ALA), Sulforaphane-glucosinolate (SGS), and CP AP The decision tree specifically lists ALA, SGS, vitamins C/E/A, and CPAP (if indicated) as primary interventions for high oxidative stress markers. A is not quite correct since while beneficial, resveratrol and curcumin are categorized as 22 Oxidative Stress treatments, and IV Glutathione is a 2° Detox treatment.", "caseContext": null}, {"id": 128, "question": "Which of the following describes the mechanism by which heavy metals like Lead (Pb) or Mercury (Hg) primarily cause 'Energy Suffering' in the bioenergetics model?", "options": [{"key": "A", "text": "Depletion of extracellular Magnesium"}, {"key": "B", "text": "Direct inhibition of the Heme Biosynthesis pathway"}, {"key": "C", "text": "Inhibition of Vitamin D receptors"}, {"key": "D", "text": "Activation of the parasympathetic nervous system"}], "answer": "B", "rationale": "Direct inhibition of the Heme Biosynthesis pathway Heavy metals are noted to inhibit multiple steps in the Heme Synthesis pathway, which is essential for assembling electron transfer complexes.", "caseContext": null}, {"id": 129, "question": "When assessing the 'Transport' node of the IFM Fatigue Matrix, which clinical indicator should a practitioner investigate?", "options": [{"key": "A", "text": "Dysbiosis and SIBO"}, {"key": "B", "text": "Hypochlorhydria"}, {"key": "C", "text": "HPTGA Axis Dysfunction"}, {"key": "D", "text": "Vascular supply and Lymph Congestion"}], "answer": "D", "rationale": "Vascular supply and Lymph Congestion Think about how oxygen and nutrients are physically moved to the cells. The Transport node focuses on the movement of substances through the body, including vascular flow and lymphatic drainage.", "caseContext": null}, {"id": 130, "question": "Mitochondria have several functions beyond ATP synthesis. Which of the following is a non- energetic function of mitochondria?", "options": [{"key": "A", "text": "Buffering calcium ion flux"}, {"key": "B", "text": "Filtering blood urea nitrogen"}, {"key": "C", "text": "Maintenance of the blood-brain barrier"}, {"key": "D", "text": "Synthesis of digestive enzymes"}], "answer": "A", "rationale": "Buffering calcium ion flux Mitochondria play a vital role in cellular homeostasis by regulating and buffering calcium levels.", "caseContext": null}, {"id": 131, "question": "Which combination of nutrients specifically supports the Citric Acid Cycle (Krebs Cycle) according to the module's energy support guides?", "options": [{"key": "A", "text": "B1, B2, B3, BS, and Lipoate"}, {"key": "B", "text": "Vitamin K2 and SAM-e"}, {"key": "C", "text": "Vitamin C and Vitamin E"}, {"key": "D", "text": "Zinc and Copper"}], "answer": "A", "rationale": "B1, B2, B3, BS, and Lipoate These specific B-vitamins and Alpha-Lipoic Acid are listed as the primary supports for the Citric Acid Cycle enzymes. D is not quite right since Zinc and Copper are cofactors for SOD1 and other enzymes, but not the primary 'Krebs cycle’ cluster.", "caseContext": null}, {"id": 132, "question": "A patient with suspected secondary mitochondrial dysfunction (SMD) might show impairments in ‘mitochondrial dynamics.' What does this term specifically refer to?", "options": [{"key": "A", "text": "Changes in mitochondrial fission, fusion, and movement"}, {"key": "B", "text": "The speed of blood flow to the mitochondria"}, {"key": "C", "text": "The ratio of dietary fats to carbohydrates"}, {"key": "D", "text": "The rate of gastric emptying"}], "answer": "A", "rationale": "Changes in mitochondrial fission, fusion, and movement Mitochondrial dynamics involve the physical changes in shape, size, and distribution through processes like fission and fusion. Case Study 1 — Answer Key", "caseContext": null}, {"id": 133, "question": "Which of Sarah's factors is best classified as a 'Trigger' (immediate activator) of her current physiological dysfunction?", "options": [{"key": "A", "text": "Ongoing mold exposure in her office building"}, {"key": "B", "text": "Family history of Hashimoto's thyroiditis"}, {"key": "C", "text": "The 18-month-old viral pneumonia infection"}], "answer": "C", "rationale": "The 18-month-old viral pneumonia infection Look for the specific event that preceded the immediate shift in her health status.", "caseContext": "Case Study 1: The Complex Fatigue Scenario Questions 133-145\nPatient Profile: Sarah, a 42-year-old female, presents with profound fatigue, \"brain fog,\" and joint\nstiffness that began approximately 18 months ago following a severe bout of viral pneumonia.\nHistory: She has a family history of Hashimoto’s thyroiditis. Her diet is high in processed\ncarbohydrates, and she works in a renovated 1920s building with known previous water damage.\nClinical Indicators: BMI 29, thinning outer eyebrows, and mild pitting edema in the lower\nextremities.\nLabs: Elevated TSH (5.8 uIU/mL), low-normal Free T3, elevated hs-CRP (4.2 mg/L), and low serum\nFerritin (15 ng/mL)"}, {"id": 134, "question": "Sarah's 'brain fog' and fatigue are most likely localized to which node of the Functional Medicine Matrix?", "options": [{"key": "A", "text": "Energy"}, {"key": "B", "text": "Structural Integrity"}, {"key": "C", "text": "Transport"}], "answer": "A", "rationale": "Energy Fatigue and cognitive dysfunction are primary indicators of mitochondrial inefficiency and oxidative stress.", "caseContext": null}, {"id": 135, "question": "Based on her physical exam finding of thinning outer eyebrows, which clinical imbalance should be prioritized for further evaluation?", "options": [{"key": "A", "text": "Communication (Hormonal)"}, {"key": "B", "text": "Assimilation (Digestive)"}, {"key": "C", "text": "Biotransformation (Detoxification)"}], "answer": "A", "rationale": "Communication (Hormonal) Thinning of the outer third of the eyebrows is a classic physical sign associated with thyroid dysfunction.", "caseContext": null}, {"id": 136, "question": "Which initial therapeutic intervention is most consistent with the IFM competencies for Sarah's care?", "options": [{"key": "A", "text": "High-dose IV glutathione for environmental detoxification"}, {"key": "B", "text": "Immediate prescription of T3/T4 combination therapy"}, {"key": "C", "text": "Dietary and lifestyle strategies to reduce systemic inflammation"}], "answer": "C", "rationale": "Dietary and lifestyle strategies to reduce systemic inflammation Competencies require prioritizing dietary and lifestyle changes as initial interventional modalities.", "caseContext": null}, {"id": 137, "question": "The elevated hs-CRP (4.2 mg/L) indicates a disturbance in which Matrix domain?", "options": [{"key": "A", "text": "Defense and Repair"}, {"key": "B", "text": "Biotransformation"}, {"key": "C", "text": "Assimilation"}], "answer": "A", "rationale": "Defense and Repair hs-CRP is a key biomarker for systemic inflammation and immune activation.", "caseContext": null}, {"id": 138, "question": "How should the low Ferritin (15 ng/mL) be categorized in Sarah’s clinical narrative?", "options": [{"key": "A", "text": "A genetic antecedent"}, {"key": "B", "text": "An acute trigger"}, {"key": "C", "text": "A mediator that may be preventing her recovery from fatigue"}], "answer": "C", "rationale": "A mediator that may be preventing her recovery from fatigue Nutrient insufficiencies can act as mediators that perpetuate symptoms and prevent return to function.", "caseContext": null}, {"id": 139, "question": "If Sarah expresses concern about her ability to afford organic food, which competency is the practitioner applying by discussing local seasonal options?", "options": [{"key": "A", "text": "Patient Evaluation"}, {"key": "B", "text": "Patient Communication"}, {"key": "C", "text": "Structural Integrity"}], "answer": "B", "rationale": "Patient Communication Collaborating based on the patient's circumstances and feasibility is a core communication competency.", "caseContext": null}, {"id": 140, "question": "Considering Sarah’s high-carb diet and fatigue, which metabolic process should be evaluated for ‘mitigation of oxidative stress'?", "options": [{"key": "A", "text": "Lymphatic flow"}, {"key": "B", "text": "Biliary excretion"}, {"key": "C", "text": "Mitochondrial energy production"}], "answer": "C", "rationale": "Mitochondrial energy production The Bioenergetics node specifically links energy production with the modulation of oxidative stress.", "caseContext": null}, {"id": 141, "question": "Sarah reports feeling worse after drinking wine. This symptom most likely reflects a burden on which node?", "options": [{"key": "A", "text": "Defense and Repair"}, {"key": "B", "text": "Communication"}, {"key": "C", "text": "Biotransformation and Elimination"}], "answer": "C", "rationale": "Biotransformation and Elimination The processing of alcohol and its metabolites is a primary function of the detoxification pathways.", "caseContext": null}, {"id": 142, "question": "What is the most appropriate next step to assess the 'Assimilation' node for Sarah?", "options": [{"key": "A", "text": "Order a 24-hour urine heavy metal test"}, {"key": "B", "text": "Evaluate her for signs of nutrient deficiency and digestive symptoms"}, {"key": "C", "text": "Perform a physical exam for joint range of motion"}], "answer": "B", "rationale": "Evaluate her for signs of nutrient deficiency and digestive symptoms Assimilation covers the intake and breakdown of nutrients and information into the body.", "caseContext": null}, {"id": 143, "question": "Sarah's joint stiffness and pitting edema suggest a need to further evaluate which Matrix node?", "options": [{"key": "A", "text": "Communication"}, {"key": "B", "text": "Biotransformation"}, {"key": "C", "text": "Transport"}], "answer": "C", "rationale": "Transport Transport involves the movement of substances and energy among cells and tissues, including lymphatic and fluid balance. Transport includes the cardiovascular and lymphatic systems.", "caseContext": null}, {"id": 144, "question": "Which question during the intake interview best addresses the 'Patient Communication' competency regarding 'meaning and purpose'?", "options": [{"key": "A", "text": "'What is most important to you in your life that this fatigue is preventing you from doing?’"}, {"key": "B", "text": "'How many servings of vegetables do you eat per day?'"}, {"key": "C", "text": "'What are your specific health goals for the next 3 months?"}], "answer": "A", "rationale": "'What is most important to you in your life that this fatigue is preventing you from doing?’ This identifies what gives the patient meaning and purpose to inform clinical decisions.", "caseContext": null}, {"id": 145, "question": "If the practitioner discovers Sarah has a mutation in the MTHFR gene, this is classified as an:", "options": [{"key": "A", "text": "Trigger"}, {"key": "B", "text": "Antecedent"}, {"key": "C", "text": "Mediator"}], "answer": "B", "rationale": "Antecedent Genetics are inherited predispositions that exist before the onset of symptoms. Case Study 2 — Answer Key", "caseContext": null}, {"id": 146, "question": "Which factor in Robert's history is best classified as a 'Trigger' for his sudden decline in health?", "options": [{"key": "A", "text": "The recent dental amalgam removal procedures"}, {"key": "B", "text": "His long-term career as a pesticide applicator"}, {"key": "C", "text": "His preference for high-mercury predatory fish"}], "answer": "A", "rationale": "The recent dental amalgam removal procedures Identify the acute event that shifted his status. An acute medical event that releases a surge of toxicants (mercury vapor) acts as a classic trigger.", "caseContext": "Case Study 2: The Toxicant & Thyroid Connection Questions 146-160\nPatient Profile: Robert, a 52-year-old male, presents with unexpected weight gain, cold intolerance,\nand \"heavy\" limbs. He works as a commercial pesticide applicator.\nHistory: He recently underwent a series of dental procedures to remove old mercury amalgams. He\nhas a high intake of \"large\" predatory fish (tuna/swordfish) and rarely consumes sea vegetables.\nClinical Indicators: Bradycardia (heart rate 55 bpm), periorbital edema, and delayed relaxation of\nthe Achilles reflex.\nLabs: TSH 4.1 uIU/mL (high-normal), Free T4 0.9 ng/dL (low-normal), Free T3 2.1 pg/mL (low),\nReverse T3 32 ng/dL (high). Urine toxic elements show elevated Inorganic Mercury."}, {"id": 147, "question": "Robert’s elevated Reverse T3 (32 ng/dL) and low Free T3 suggest a disturbance in which Matrix node?", "options": [{"key": "A", "text": "Assimilation"}, {"key": "B", "text": "Energy"}, {"key": "C", "text": "Communication"}], "answer": "C", "rationale": "Communication Consider the system responsible for 'sending the signal’ to cells. Thyroid hormone conversion and signaling are primary components of the Communication node.", "caseContext": null}, {"id": 148, "question": "Based on the Environmental Health module, what is the first priority in Robert's treatment plan?", "options": [{"key": "A", "text": "Starting T3 monotherapy to boost metabolism"}, {"key": "B", "text": "Aggressive chelation therapy with DMSA"}, {"key": "C", "text": "Reducing further exposures (fish intake and protective gear at work)"}], "answer": "C", "rationale": "Reducing further exposures (fish intake and protective gear at work) The first step in 'PURE' (Pattern Recognition, Undernourished, Reduce Exposures, Ensure Safe Detox) is to stop the intake of toxicants.", "caseContext": null}, {"id": 149, "question": "Robert's bradycardia and delayed Achilles reflex are clinical indicators of which functional state?", "options": [{"key": "A", "text": "Hypometabolism"}, {"key": "B", "text": "Phase I Detoxification activation"}, {"key": "C", "text": "Sympathetic dominance"}], "answer": "A", "rationale": "Hypometabolism Physical signs of thyroid deficiency, such as slow heart rate and reflexes, indicate a state of low cellular energy and metabolism.", "caseContext": null}, {"id": 150, "question": "Mercury is known to inhibit the 5'-deiodinase enzyme. This mechanism primarily affects which process?", "options": [{"key": "A", "text": "Iodine uptake in the thyroid gland"}, {"key": "B", "text": "The synthesis of TSH in the pituitary"}, {"key": "C", "text": "The conversion of T4 to T3"}], "answer": "C", "rationale": "The conversion of T4 to T3 The deiodinase enzymes are responsible for converting the pro-hormone T4 into the active T3. Think about how the ‘active’ hormone is produced. A is not correct because while iodine is involved, the specific enzyme mentioned handles peripheral conversion.", "caseContext": null}, {"id": 151, "question": "In the Patient Communication competency, how should the practitioner explain the role of pesticides to Robert?", "options": [{"key": "A", "text": "Advise him to quit his job immediately without discussing his financial context."}, {"key": "B", "text": "Inform him that his job is the sole cause of his thyroid disease."}, {"key": "C", "text": "Explain how environmental exposures can act as ‘endocrine disruptors' affecting his hormone balance."}], "answer": "C", "rationale": "Explain how environmental exposures can act as ‘endocrine disruptors' affecting his hormone balance. Focus on educating the patient about the physiological 'how' of their condition. Educating the patient on the mechanism of exposures is a core communication competency.", "caseContext": null}, {"id": 152, "question": "Robert's high Reverse T3 level is often a marker of 'non-thyroidal illness syndrome.’ Which Matrix node focuses on the 'molecular currency' affected by this?", "options": [{"key": "A", "text": "Transport"}, {"key": "B", "text": "Biotransformation"}, {"key": "C", "text": "Energy"}], "answer": "C", "rationale": "Energy The Energy node (Bioenergetics) deals with ATP, mitochondria, and how thyroid status influences cellular 'funding.'", "caseContext": null}, {"id": 153, "question": "The practitioner uses the \"Toxin Exposure Questionnaire.’ This action falls under which competency domain?", "options": [{"key": "A", "text": "Therapeutic Intervention"}, {"key": "B", "text": "Patient Communication"}, {"key": "C", "text": "Patient Evaluation"}], "answer": "C", "rationale": "Patient Evaluation Think about the phase of the clinical encounter (Gathering/Organizing). Using structured questionnaires to gather history and identify burdens is a key evaluative step.", "caseContext": null}, {"id": 154, "question": "If Robert has a GSTM1 'null' genotype, this would be classified on his Matrix as a/an:", "options": [{"key": "A", "text": "Mediator"}, {"key": "B", "text": "Antecedent"}, {"key": "C", "text": "Trigger"}], "answer": "B", "rationale": "Antecedent Genetic polymorphisms are inherited factors that exist before illness onset.", "caseContext": null}, {"id": 155, "question": "Which dietary intervention would best support Robert's 'Biotransformation' node by providing Phase II conjugation support?", "options": [{"key": "A", "text": "Simple sugars for rapid energy"}, {"key": "B", "text": "Cruciferous vegetables (sulforaphane)"}, {"key": "C", "text": "High-fiber grains for fecal bulk"}], "answer": "B", "rationale": "Cruciferous vegetables (sulforaphane) Think about the 'Detox Food Plan’. Cruciferous vegetables provide the sulfur compounds and phytonutrients necessary for Phase II pathways.", "caseContext": null}, {"id": 156, "question": "Robert's periorbital edema and weight gain suggest a secondary disturbance in which node?", "options": [{"key": "A", "text": "Defense and Repair"}, {"ke     const STORAGE_KEY_ANSWERS = 'ifm_exam1_answers';

    const STORAGE_KEY_THEME = 'ifm_theme';

    let userAnswers = JSON.parse(localStorage.getItem(STORAGE_KEY_ANSWERS) || '{}');

    let currentBatch = 1;
    const batchSize = 20;
    const totalBatches = 8;

    function speakWord(word) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(word);
      const voices = window.speechSynthesis.getVoices();
      const naturalVoice = voices.find(v => (v.name.includes("Samantha") || v.name.includes("Ava") || v.name.includes("Jenny") || v.name.includes("Natural")) && v.lang.startsWith("en")) || voices.find(v => v.lang === "en-US");
      if (naturalVoice) utter.voice = naturalVoice;
      utter.lang = 'en-US';
      utter.rate = 0.88;
      window.speechSynthesis.speak(utter);
    }
    if ('speechSynthesis' in window) window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();

    function init() {
      applyTheme();
      renderBatchBar();
      renderQuestions();
      updateBadges();
      setupSelectionTooltip();
    }

    function switchView(viewName) {
      document.getElementById('view-exam').style.display = viewName === 'exam' ? 'block' : 'none';
      document.getElementById('view-vocab').style.display = viewName === 'vocab' ? 'block' : 'none';
      document.getElementById('view-wrong').style.display = viewName === 'wrong' ? 'block' : 'none';

      document.getElementById('tab-exam').className = 'nav-btn' + (viewName === 'exam' ? ' active' : '');
      document.getElementById('tab-vocab').className = 'nav-btn' + (viewName === 'vocab' ? ' active' : '');
      document.getElementById('tab-wrong').className = 'nav-btn' + (viewName === 'wrong' ? ' active' : '');

      if (viewName === 'vocab') renderVocabList();
      if (viewName === 'wrong') renderWrongList();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderBatchBar() {
      const container = document.getElementById('batch-grid');
      let html = '';
      let totalAnsweredAll = Object.keys(userAnswers).length;

      for (let i = 1; i <= totalBatches; i++) {
        const start = (i - 1) * batchSize + 1;
        const end = i * batchSize;
        
        let answeredInGroup = 0;
        let correctInGroup = 0;
        for (let qid = start; qid <= end; qid++) {
          if (userAnswers[qid]) answeredInGroup++;
          const q = ALL_QUESTIONS[qid - 1];
          if (q && userAnswers[qid] === q.answer) correctInGroup++;
        }

        const isSub = !!submittedGroups[i];
        let subText = `${answeredInGroup}/20 题`;
        if (isSub) {
          subText = `${correctInGroup}/20 正确 ✅`;
        }

        html += `
          <button class="batch-btn ${i === currentBatch ? 'active' : ''}" onclick="switchBatch(${i})">
            <span>${start}–${end} 题</span>
            <span class="batch-sub">${subText}</span>
          </button>
        `;
      }
      container.innerHTML = html;
      document.getElementById('exam-overall-stats').innerText = `总进度：${totalAnsweredAll} / 160 题已答`;
      document.getElementById('current-group-num').innerText = currentBatch;

      const isCurrentSub = !!submittedGroups[currentBatch];
      const btnSubmit = document.getElementById('btn-group-submit');
      if (isCurrentSub) {
        btnSubmit.innerText = '🔄 重新核对本组';
      } else {
        btnSubmit.innerText = '📝 交卷核对本组';
      }
    }

    function switchBatch(batchNum) {
      currentBatch = batchNum;
      renderBatchBar();
      renderQuestions();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function nextGroup() {
      if (currentBatch < totalBatches) {
        switchBatch(currentBatch + 1);
      } else {
        showToast('已经是最后一组了！建议切换到【错题深度复盘】进行汇总！');
      }
    }

    function renderQuestions() {
      const container = document.getElementById('questions-container');
      const startIdx = (currentBatch - 1) * batchSize;
      const batchList = ALL_QUESTIONS.slice(startIdx, startIdx + batchSize);
      const isSub = !!submittedGroups[currentBatch];

      let html = '';

      batchList.forEach(q => {
        const uAns = userAnswers[q.id];

        if (q.caseContext) {
          html += `
            <div class="case-card">
              <h3>📋 综合临床案例背景</h3>
              <pre>${q.caseContext}</pre>
            </div>
          `;
        }

        html += `
          <div class="card" id="q-card-${q.id}">
            <div class="q-meta">
              <span class="q-badge">QUESTION ${q.id} OF 160</span>
              <span>IFM Practice Exam 1</span>
            </div>
            <div class="question-stem">${q.question}</div>
            <div class="options">
              ${q.options.map(opt => {
                let optClass = 'option-label';
                if (isSub) {
                  if (opt.key === q.answer) optClass += ' is-correct';
                  else if (uAns === opt.key && uAns !== q.answer) optClass += ' is-wrong';
                }
                return `
                  <label class="${optClass}" id="opt-label-${q.id}-${opt.key}">
                    <input type="radio" name="q-${q.id}" value="${opt.key}" 
                      ${uAns === opt.key ? 'checked' : ''} 
                      onchange="selectAnswer(${q.id}, '${opt.key}')">
                    <span><span class="opt-key">${opt.key}.</span>${opt.text}</span>
                  </label>
                `;
              }).join('')}
            </div>
            <div class="explanation" id="exp-${q.id}" style="display: ${isSub ? 'block' : 'none'};">
              <div class="exp-row"><span class="exp-tag">🎯 正确答案:</span> <strong>${q.answer}</strong></div>
              <div class="exp-row"><span class="exp-tag">🔬 IFM 官方临床解析:</span> ${q.rationale || '详见 IFM 教材核心讲义解析'}</div>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    function selectAnswer(qid, val) {
      userAnswers[qid] = val;
      localStorage.setItem(STORAGE_KEY_ANSWERS, JSON.stringify(userAnswers));
      renderBatchBar();
      updateBadges();
    }

    function submitCurrentGroup() {
      const start = (currentBatch - 1) * batchSize + 1;
      const end = currentBatch * batchSize;
      
      let answeredCount = 0;
      let correctCount = 0;

      for (let qid = start; qid <= end; qid++) {
        if (userAnswers[qid]) answeredCount++;
        const q = ALL_QUESTIONS[qid - 1];
        if (q && userAnswers[qid] === q.answer) correctCount++;
      }

      submittedGroups[currentBatch] = true;
      localStorage.setItem(STORAGE_KEY_SUBMITTED, JSON.stringify(submittedGroups));

      renderBatchBar();
      renderQuestions();
      updateBadges();

      showToast(`第 ${currentBatch} 组核对完毕！答对 ${correctCount} / ${batchSize} 题（得分率 ${Math.round(correctCount / batchSize * 100)}%）`);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    let currentSelectedText = '';
    function setupSelectionTooltip() {
      const tooltip = document.getElementById('selection-tooltip');

      document.addEventListener('mouseup', function(e) {
        if (e.target.closest('#selection-tooltip')) return;

        const sel = window.getSelection();
        const text = sel.toString().trim();

        if (text && text.length > 1 && text.length < 50 && /^[a-zA-Z\s\-]+$/.test(text)) {
          currentSelectedText = text;
          const cleanKey = text.toLowerCase();
          const dictEntry = MEDICAL_DICT[cleanKey] || {};

          document.getElementById('tt-word').innerText = text;
          document.getElementById('tt-ipa').innerText = dictEntry.ipa || '';
          document.getElementById('tt-cn').innerText = dictEntry.cn || '点击收录或发音';

          const range = sel.getRangeAt(0);
          const rect = range.getBoundingClientRect();
          
          tooltip.style.left = (rect.left + rect.width / 2 + window.scrollX) + 'px';
          tooltip.style.top = (rect.top + window.scrollY) + 'px';
          tooltip.style.display = 'block';
        } else {
          tooltip.style.display = 'none';
        }
      });
    }

    function playSelectedWord(e) {
      e.stopPropagation();
      if (currentSelectedText) speakWord(currentSelectedText);
    }

    function saveSelectedWord(e) {
      e.stopPropagation();
      if (!currentSelectedText) return;
      const cleanKey = currentSelectedText.toLowerCase();
      const dictEntry = MEDICAL_DICT[cleanKey] || {};

      if (!vocabList.some(v => v.word.toLowerCase() === cleanKey)) {
        vocabList.unshift({
          word: currentSelectedText,
          ipa: dictEntry.ipa || '',
          cn: dictEntry.cn || '',
          time: new Date().toLocaleDateString()
        });
        localStorage.setItem(STORAGE_KEY_VOCAB, JSON.stringify(vocabList));
        updateBadges();
        showToast(`已成功收录: ${currentSelectedText} 到生词本！`);
      } else {
        showToast(`该词已在生词本中`);
      }
      document.getElementById('selection-tooltip').style.display = 'none';
    }

    function renderVocabList() {
      const tbody = document.getElementById('vocab-table-body');
      if (vocabList.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding: 2.5rem; color: var(--text-muted);">生词本为空。在答题过程中用鼠标选中任何英文生词，即可划词发音并收录！</td></tr>`;
        return;
      }
      tbody.innerHTML = vocabList.map((item, idx) => `
        <tr>
          <td><strong>${item.word}</strong></td>
          <td style="color: #8b5cf6; font-family: monospace;">${item.ipa || '-'}</td>
          <td>${item.cn || '<span style="color:var(--text-muted);">自行记忆</span>'}</td>
          <td style="text-align: center;">
            <button class="btn-icon" onclick="speakWord('${item.word}')" title="播放真人自然发音">🔊</button>
          </td>
          <td style="text-align: center;">
            <button class="btn-icon" onclick="deleteVocab(${idx})" title="删除" style="color: var(--danger);">🗑️</button>
          </td>
        </tr>
      `).join('');
    }

    function deleteVocab(idx) {
      vocabList.splice(idx, 1);
      localStorage.setItem(STORAGE_KEY_VOCAB, JSON.stringify(vocabList));
      renderVocabList();
      updateBadges();
      showToast('已从生词本移除');
    }

    function clearVocab() {
      if (confirm('确定要清空全部生词本吗？')) {
        vocabList = [];
        localStorage.setItem(STORAGE_KEY_VOCAB, JSON.stringify(vocabList));
        renderVocabList();
        updateBadges();
        showToast('生词本已清空');
      }
    }

    function copyVocabMarkdown() {
      if (vocabList.length === 0) return showToast('生词本为空！');
      let md = '| 单词 (Word) | 国际音标 (IPA) | 功能医学专业释义 |\n|---|---|---|\n';
      vocabList.forEach(v => {
        md += `| ${v.word} | ${v.ipa} | ${v.cn} |\n`;
      });
      navigator.clipboard.writeText(md).then(() => showToast('已成功复制 Markdown 表格到剪贴板！可直接粘贴至 Obsidian！'));
    }

    function exportVocabTSV() {
      if (vocabList.length === 0) return showToast('生词本为空！');
      let tsv = '';
      vocabList.forEach(v => {
        tsv += `${v.word}\t${v.ipa}\t${v.cn}\n`;
      });
      navigator.clipboard.writeText(tsv).then(() => showToast('已成功复制 TSV 到剪贴板！可直接粘贴导入 Anki！'));
    }

        const groupNum = Math.ceil(q.id / batchSize);
        if (submittedGroups[groupNum]) {
          const uAns = userAnswers[q.id];
          if (uAns && uAns !== q.answer) {
            wrongQuestions.push({ question: q, userAns: uAns });
          }
        }
      });

      if (wrongQuestions.length === 0) {
        container.innerHTML = `
          <div class="card" style="text-align: center; padding: 3rem; color: var(--text-muted);">
            🎉 暂无错题记录！请先在【英文真题】中作答并点击【交卷核对】，系统会自动抓取全部错题！
          </div>
        `;
        return;
      }

      container.innerHTML = wrongQuestions.map(w => `
        <div class="wrong-item">
          <div class="wrong-header">
            <span style="color: var(--danger);">QUESTION ${w.question.id} (第 ${Math.ceil(w.question.id / batchSize)} 组)</span>
            <span>IFM Practice Exam 1</span>
          </div>
          <div class="wrong-stem">${w.question.question}</div>
          <div class="wrong-choice-grid">
            <div class="my-choice">❌ 我的选择: ${w.userAns}</div>
            <div class="correct-choice">✅ 正确答案: ${w.question.answer}</div>
          </div>
          <div class="explanation" style="display:block; margin-top: 0.6rem;">
            <div class="exp-row"><span class="exp-tag">🔬 机制深度剖析:</span> ${w.question.rationale}</div>
          </div>
        </div>
      `).join('');
    }

    function getWrongList() {
      const wrongQuestions = [];
      ALL_QUESTIONS.forEach(q => {
        const groupNum = Math.ceil(q.id / batchSize);
        if (submittedGroups[groupNum]) {
          const uAns = userAnswers[q.id];
          if (uAns && uAns !== q.answer) {
            wrongQuestions.push({ q: q, uAns: uAns });
          }
        }
      });
      return wrongQuestions;
    }

    function copyWrongForNotebookLM() {
      const wrongQuestions = getWrongList();
      if (wrongQuestions.length === 0) return showToast('目前暂无已批改出的错题！');

      let text = `【请基于已上传的 IFM 官方讲义、教材与课程 Transcript 检索并回答】\n\n`;
      text += `我在进行 IFM Practice Exam 1 模考时做错了以下题目。请检索知识库中对应的 APM 模块（GI, Detox, Hormone, Energy, Immune, Cardiometabolic, Neuro/Matrix/GOTOIT）及课程音频文字稿：\n\n`;
      text += `1. **知识点与模块定位**：指出每道题涉及的核心模块、讲义章节或专家观点；\n`;
      text += `2. **错选辨析与机制深剖**：对照【我的错误选择】与【官方正确答案】，用讲义中的生理/生化机理解释我为什么会混淆，并引用讲义依据；\n`;
      text += `3. **临床要点总结**：提炼该知识点在 IFM 认证考试中的必背临床诊断与干预原则。\n\n`;
      text += `### 错题明细清单：\n\n`;

      wrongQuestions.forEach((item, index) => {
        text += `#### 错题 ${index + 1} (Question ${item.q.id})\n`;
        text += `**英文题干**: ${item.q.question}\n`;
        text += `**选项列表**:\n`;
        item.q.options.forEach(opt => {
          text += `  - ${opt.key}. ${opt.text}\n`;
        });
        text += `**我的错误选择**: ❌ ${item.uAns}\n`;
        text += `**官方正确答案**: ✅ ${item.q.answer}\n`;
        text += `**官方临床解析**: ${item.q.rationale}\n\n`;
      });

      navigator.clipboard.writeText(text).then(() => {
        showToast('已复制【NotebookLM 专属提问指令】！直接粘贴到 NotebookLM 对话框即可！');
      });
    }

    function copyWrongForAI() {
      const wrongQuestions = getWrongList();
      if (wrongQuestions.length === 0) return showToast('目前暂无已批改出的错题！');

      let promptText = `## IFM 备考专项深度复盘与二次变式出题\n\n`;
      promptText += `我在做 IFM Practice Exam 1 时出现以下错题。请调取我的 IFM 课程笔记与讲义，针对每道错题帮我做两件事：\n`;
      promptText += `1. **核心病理生理机制剖析**：分析我为什么容易选错【我的选项】，正解【正确选项】在功能医学矩阵（Matrix）或生化通路上的根本逻辑是什么；\n`;
      promptText += `2. **反向变式出题（二次盲测）**：针对该考点，出 2 道新的英文临床案例长题（附 4 个选项与解析），测试我是否彻底掌握。\n\n`;
      promptText += `### 错题明细清单：\n\n`;

      wrongQuestions.forEach((item, index) => {
        promptText += `#### 错题 ${index + 1} (Question ${item.q.id})\n`;
        promptText += `- **英文原题**: ${item.q.question}\n`;
        promptText += `- **我的错误选择**: ${item.uAns}\n`;
        promptText += `- **官方正确答案**: ${item.q.answer}\n`;
        promptText += `- **官方参考解析**: ${item.q.rationale}\n\n`;
      });

      navigator.clipboard.writeText(promptText).then(() => {
        showToast('已成功复制变式出题 Prompt！请直接粘贴至 Gemini / Claude 对话框！');
      });
    }

    function copyWrongAsNote() {
      const wrongQuestions = getWrongList();
      if (wrongQuestions.length === 0) return showToast('目前暂无已批改出的错题！');

      let text = `# IFM Practice Exam 1 错题复盘笔记\n\n`;
      text += `> 收录日期: ${new Date().toLocaleDateString()} | 错题总数: ${wrongQuestions.length} 题\n\n`;
      text += `---\n\n`;

      wrongQuestions.forEach((item, index) => {
        text += `### Q${item.q.id}. ${item.q.question}\n\n`;
        item.q.options.forEach(opt => {
          let mark = '  ';
          if (opt.key === item.q.answer) mark = '✅ ';
          else if (opt.key === item.uAns) mark = '❌ ';
          text += `- ${mark}${opt.key}. ${opt.text}\n`;
        });
        text += `\n**我的错选**: ${item.uAns} | **标准答案**: ${item.q.answer}\n\n`;
        text += `**官方临床机制解析 (Rationale)**:\n${item.q.rationale}\n\n`;
        text += `---\n\n`;
      });

      navigator.clipboard.writeText(text).then(() => {
        showToast('已复制【Markdown 错题笔记源】！可在 NotebookLM 点击“添加笔记”直接粘贴！');
      });
    }

    function updateBadges() {
      document.getElementById('vocab-count').innerText = vocabList.length;
      
      let wrongCount = 0;
      ALL_QUESTIONS.forEach(q => {
        const groupNum = Math.ceil(q.id / batchSize);
        if (submittedGroups[groupNum] && userAnswers[q.id] && userAnswers[q.id] !== q.answer) {
          wrongCount++;
        }
      });
      document.getElementById('wrong-count').innerText = wrongCount;
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 3200);
    }

    function applyTheme() {
      const th = localStorage.getItem(STORAGE_KEY_THEME) || 'light';
      if (th === 'dark') document.body.classList.add('dark-mode');
      else document.body.classList.remove('dark-mode');
    }
    function toggleTheme() {
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      localStorage.setItem(STORAGE_KEY_THEME, isDark ? 'dark' : 'light');
    }

    window.onload = init;
  </script>
</body>
</html>
