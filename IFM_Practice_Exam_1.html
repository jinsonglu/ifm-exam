<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IFM 官方全真模拟考场 · Exam 1 (160题全量)</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-hover: #1e40af;
      --primary-light: #eff6ff;
      --accent: #0284c7;
      --success: #15803d;
      --success-light: #dcfce7;
      --danger: #b91c1c;
      --danger-light: #fee2e2;
      --warning: #d97706;
      --text: #0f172a;
      --text-muted: #64748b;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --border-dark: #cbd5e1;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    body.dark-mode {
      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --primary-light: #1e293b;
      --accent: #38bdf8;
      --success: #22c55e;
      --success-light: #14532d33;
      --danger: #ef4444;
      --danger-light: #7f1d1d33;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --border-dark: #475569;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding-bottom: 5rem;
      transition: background-color 0.2s, color 0.2s;
    }

    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 0.85rem 1.8rem;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow-sm);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .brand h1 {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.01em;
    }
    .brand .badge {
      background: var(--primary-light);
      color: var(--primary);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.2rem 0.55rem;
      border-radius: 9999px;
      border: 1px solid var(--primary);
    }

    .nav-tabs {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .nav-btn {
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text);
      padding: 0.45rem 0.95rem;
      border-radius: 7px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }
    .nav-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .nav-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .theme-toggle {
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.45rem 0.7rem;
      border-radius: 7px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .container {
      max-width: 960px;
      margin: 1.5rem auto;
      padding: 0 1rem;
    }

    .batch-bar-card {
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 1rem 1.25rem;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow-sm);
    }
    .batch-bar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }
    .batch-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .batch-stats {
      font-size: 0.82rem;
      color: var(--text-muted);
    }
    .batch-btns-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(105px, 1fr));
      gap: 0.5rem;
    }
    .batch-btn {
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      padding: 0.5rem 0.4rem;
      border-radius: 8px;
      font-size: 0.82rem;
      cursor: pointer;
      font-weight: 600;
      text-align: center;
      transition: all 0.15s ease;
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }
    .batch-btn:hover {
      border-color: var(--accent);
      background: var(--primary-light);
    }
    .batch-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      box-shadow: 0 2px 4px rgba(30, 58, 138, 0.25);
    }
    .batch-btn .batch-sub {
      font-size: 0.7rem;
      font-weight: normal;
      opacity: 0.85;
    }

    .case-card {
      background: #eff6ff;
      border: 2px solid #bfdbfe;
      border-radius: 12px;
      padding: 1.4rem;
      margin-bottom: 1.5rem;
      color: #1e3a8a;
      line-height: 1.7;
    }
    body.dark-mode .case-card {
      background: #172554;
      border-color: #1e40af;
      color: #dbeafe;
    }
    .case-card h3 {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .case-card pre {
      white-space: pre-wrap;
      font-family: inherit;
      font-size: 0.92rem;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 1.5rem;
      margin-bottom: 1.3rem;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.2s;
    }
    .card:hover {
      border-color: var(--border-dark);
    }
    .q-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .q-badge {
      background: var(--bg);
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      border: 1px solid var(--border);
    }
    .question-stem {
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.7;
      margin-bottom: 1.2rem;
      color: var(--text);
      user-select: text;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }
    .option-label {
      display: flex;
      align-items: flex-start;
      gap: 0.85rem;
      padding: 0.85rem 1.15rem;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.15s ease;
      background: var(--card-bg);
      font-size: 0.95rem;
      line-height: 1.55;
      user-select: text;
    }
    .option-label:hover {
      background-color: var(--primary-light);
      border-color: #93c5fd;
    }
    .option-label input[type="radio"] {
      margin-top: 0.25rem;
      width: 1.15rem;
      height: 1.15rem;
      accent-color: var(--primary);
      cursor: pointer;
    }
    .opt-key {
      font-weight: 700;
      color: var(--primary);
      margin-right: 0.2rem;
    }
    body.dark-mode .opt-key {
      color: var(--accent);
    }

    .option-label.is-correct {
      background-color: var(--success-light) !important;
      border-color: var(--success) !important;
      color: var(--success) !important;
      font-weight: 600;
    }
    .option-label.is-wrong {
      background-color: var(--danger-light) !important;
      border-color: var(--danger) !important;
      color: var(--danger) !important;
      text-decoration: line-through;
    }

    .explanation {
      margin-top: 1.2rem;
      padding: 1.15rem;
      background: var(--bg);
      border-left: 4px solid var(--accent);
      border-radius: 8px;
      font-size: 0.92rem;
      line-height: 1.65;
      animation: fadeIn 0.25s ease-in-out;
    }
    .exp-row {
      margin-bottom: 0.6rem;
    }
    .exp-row:last-child {
      margin-bottom: 0;
    }
    .exp-tag {
      display: inline-block;
      font-weight: 700;
      color: var(--accent);
      margin-right: 0.4rem;
    }

    #selection-tooltip {
      position: absolute;
      display: none;
      background: #0f172a;
      color: #fff;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.88rem;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.4);
      z-index: 1000;
      transform: translate(-50%, -100%);
      margin-top: -10px;
      white-space: nowrap;
      pointer-events: auto;
      animation: popIn 0.15s ease-out;
    }
    #selection-tooltip::after {
      content: "";
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 6px 6px 0;
      border-style: solid;
      border-color: #0f172a transparent;
    }
    .tooltip-content {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .tooltip-word {
      font-weight: 700;
      color: #38bdf8;
    }
    .tooltip-ipa {
      color: #a78bfa;
      font-family: "Lucida Sans Unicode", sans-serif;
      font-size: 0.82rem;
    }
    .tooltip-cn {
      color: #e2e8f0;
      max-width: 260px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tooltip-btn {
      background: #1e293b;
      border: 1px solid #475569;
      color: #fff;
      border-radius: 5px;
      padding: 0.2rem 0.5rem;
      cursor: pointer;
      font-size: 0.78rem;
      transition: background 0.15s;
    }
    .tooltip-btn:hover {
      background: #334155;
    }

    .submit-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 1.5rem;
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      margin-top: 1.5rem;
    }
    .btn-submit {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 0.75rem 1.8rem;
      border-radius: 9px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 6px -1px rgba(30, 58, 138, 0.25);
      transition: background 0.15s, transform 0.1s;
    }
    .btn-submit:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }
    .btn-next {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.75rem 1.4rem;
      border-radius: 9px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-next:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .table-container {
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border);
      overflow: hidden;
      margin-top: 1rem;
      box-shadow: var(--shadow-sm);
    }
    .custom-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    .custom-table th, .custom-table td {
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }
    .custom-table th {
      background: var(--bg);
      font-weight: 600;
      color: var(--text-muted);
    }
    .btn-icon {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
      transition: transform 0.1s;
    }
    .btn-icon:hover {
      transform: scale(1.2);
    }

    .wrong-item {
      background: var(--card-bg);
      border-radius: 10px;
      border: 1px solid var(--border);
      padding: 1.25rem;
      margin-bottom: 1rem;
      border-left: 4px solid var(--danger);
    }
    .wrong-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.6rem;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .wrong-stem {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 0.8rem;
    }
    .wrong-choice-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      margin-bottom: 0.8rem;
      font-size: 0.88rem;
    }
    .my-choice {
      padding: 0.5rem 0.8rem;
      background: var(--danger-light);
      color: var(--danger);
      border-radius: 6px;
      font-weight: 600;
    }
    .correct-choice {
      padding: 0.5rem 0.8rem;
      background: var(--success-light);
      color: var(--success);
      border-radius: 6px;
      font-weight: 600;
    }

    #toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      background: #0f172a;
      color: #fff;
      padding: 0.7rem 1.4rem;
      border-radius: 9999px;
      font-size: 0.88rem;
      font-weight: 500;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
      display: none;
      z-index: 2000;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes popIn {
      from { opacity: 0; transform: translate(-50%, -80%); }
      to { opacity: 1; transform: translate(-50%, -100%); }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <h1>🩺 IFM 官方全真模拟考场</h1>
      <span class="badge">Exam 1 · 160题全量</span>
    </div>
    <div class="nav-tabs">
      <button class="nav-btn active" id="tab-exam" onclick="switchView('exam')">📝 英文真题 (160题)</button>
      <button class="nav-btn" id="tab-vocab" onclick="switchView('vocab')">📖 语音生词本 (<span id="vocab-count">0</span>)</button>
      <button class="nav-btn" id="tab-wrong" onclick="switchView('wrong')">❌ 错题深度复盘 (<span id="wrong-count">0</span>)</button>
      <button class="theme-toggle" onclick="toggleTheme()" title="切换明暗主题">🌗</button>
    </div>
  </header>

  <div id="selection-tooltip">
    <div class="tooltip-content">
      <span class="tooltip-word" id="tt-word">word</span>
      <span class="tooltip-ipa" id="tt-ipa">/ipa/</span>
      <span class="tooltip-cn" id="tt-cn">释义</span>
      <button class="tooltip-btn" onclick="playSelectedWord(event)" title="朗读">🔊 读音</button>
      <button class="tooltip-btn" onclick="saveSelectedWord(event)" title="收录到生词本">⭐ 收录</button>
    </div>
  </div>

  <div class="container">

    <div id="view-exam">
      <div class="batch-bar-card">
        <div class="batch-bar-header">
          <span class="batch-title">📌 分组答题导航（每组 20 题）</span>
          <span class="batch-stats" id="exam-overall-stats">总进度：0 / 160 题已答</span>
        </div>
        <div class="batch-btns-grid" id="batch-grid"></div>
      </div>

      <div id="questions-container"></div>

      <div class="submit-bar">
        <div id="batch-status-msg" style="font-size: 0.95rem; font-weight: 600; color: var(--text-muted);">
          第 <span id="current-group-num">1</span> 组答题中
        </div>
        <div style="display: flex; gap: 0.75rem;">
          <button class="btn-submit" id="btn-group-submit" onclick="submitCurrentGroup()">📝 交卷核对本组</button>
          <button class="btn-next" onclick="nextGroup()">下一组 ➡️</button>
        </div>
      </div>
    </div>

    <div id="view-vocab" style="display: none;">
      <div class="card" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <div>
          <h2 style="font-size: 1.15rem; color: var(--primary);">📖 沉浸式医学语音生词本</h2>
          <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.2rem;">划词即查即收录，随时点击 🔊 磨耳朵，支持导出至 Anki 或 Obsidian。</p>
        </div>
        <div style="display: flex; gap: 0.5rem;">
          <button class="nav-btn" onclick="copyVocabMarkdown()">📋 复制为 Markdown 表格</button>
          <button class="nav-btn" onclick="exportVocabTSV()">📥 导出 Anki 卡片 (TSV)</button>
          <button class="nav-btn" style="color: var(--danger); border-color: var(--danger);" onclick="clearVocab()">🗑️ 清空生词本</button>
        </div>
      </div>
      <div class="table-container">
        <table class="custom-table">
          <thead>
            <tr>
              <th style="width: 22%;">单词 / 术语</th>
              <th style="width: 22%;">国际音标 (IPA)</th>
              <th>功能医学专业释义</th>
              <th style="width: 80px; text-align: center;">发音</th>
              <th style="width: 70px; text-align: center;">操作</th>
            </tr>
          </thead>
          <tbody id="vocab-table-body"></tbody>
        </table>
      </div>
    </div>

    <div id="view-wrong" style="display: none;">
      <div class="card" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.8rem;">
        <div>
          <h2 style="font-size: 1.15rem; color: var(--danger);">❌ 错题深度复盘与 NotebookLM 联动</h2>
          <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.2rem;">自动归集各组答错题，一键生成 NotebookLM 专属检索指令或复盘笔记，无缝调取课程讲义。</p>
        </div>
        <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
          <button class="nav-btn" style="background: #e0f2fe; border-color: #38bdf8; color: #0369a1; font-weight: 700;" onclick="copyWrongForNotebookLM()">📖 复制 NotebookLM 提问指令</button>
          <button class="nav-btn" style="background: #fef08a; border-color: #ca8a04; color: #854d0e; font-weight: 700;" onclick="copyWrongForAI()">🤖 复制 Gemini 变式出题</button>
          <button class="nav-btn" onclick="copyWrongAsNote()">📝 复制为复盘笔记源</button>
        </div>
      </div>
      <div id="wrong-list-container"></div>
    </div>

  </div>

  <div id="toast"></div>

  <script>
    const ALL_QUESTIONS = [{"id": 1, "question": "Which of the following best describes the 'G' in the IFM GOTOIT heuristic used for patient management?", "options": [{"key": "A", "text": "Generalize"}, {"key": "B", "text": "Gather"}, {"key": "C", "text": "Generate"}, {"key": "D", "text": "Goals"}], "answer": "B", "rationale": "Gather This initial phase involves collecting information through the timeline, matrix, and patient's story.", "caseContext": null}, {"id": 2, "question": "In the Functional Medicine Matrix, which category would 'Insufficient Sleep' or 'Chronic Stress' typically be categorized as during the history-taking process?", "options": [{"key": "A", "text": "Antecedents"}, {"key": "B", "text": "Core Clinical Imbalances"}, {"key": "C", "text": "Triggers"}, {"key": "D", "text": "Mediators"}], "answer": "D", "rationale": "Mediators Mediators (and moderators) are ongoing factors—social, biochemical, or psychological—that contribute to pathological changes or prevent resolution. Consider factors that 'keep the fire burning’ or sustain a state of chronic illness.", "caseContext": null}, {"id": 3, "question": "Under the 'ABCDs' of Nutritional Evaluation, which category includes the assessment of body composition and waist-to-hip ratio?", "options": [{"key": "A", "text": "Diet Evaluation"}, {"key": "B", "text": "Anthropometrics"}, {"key": "C", "text": "Biomarkers"}, {"key": "D", "text": "Clinical Indicators"}], "answer": "B", "rationale": "Anthropometrics Anthropometrics refers to the physical measurement of the human body, including height, weight, and body proportions.", "caseContext": null}, {"id": 4, "question": "Which core clinical imbalance on the Functional Medicine Matrix covers the health of the microbiome and intestinal permeability?", "options": [{"key": "A", "text": "Defense and Repair"}, {"key": "B", "text": "Communication"}, {"key": "C", "text": "Assimilation"}, {"key": "D", "text": "Transport"}], "answer": "C", "rationale": "Assimilation Assimilation includes digestion, absorption, and the integrity of the gastrointestinal tract and microbiome.", "caseContext": null}, {"id": 5, "question": "What is the primary difference between conventional medicine and Functional Medicine regarding chronic disease?", "options": [{"key": "A", "text": "Functional Medicine focuses on acute trauma while conventional focuses on prevention."}, {"key": "B", "text": "Functional Medicine relies solely on natural supplements without scientific evidence."}, {"key": "C", "text": "Functional Medicine seeks to identify the root cause, whereas conventional often manages symptoms."}, {"key": "D", "text": "Conventional medicine is patient-centered while Functional is disease-centered."}], "answer": "C", "rationale": "Functional Medicine seeks to identify the root cause, whereas conventional often manages symptoms. Functional Medicine uses a systems-biology approach to find 'why' an illness occurred rather than just ‘what’ it is.", "caseContext": null}, {"id": 6, "question": "In the context of the clinical encounter, what is the 'Environment of Insight’?", "options": [{"key": "A", "text": "A database for storing patient medical records."}, {"key": "B", "text": "A standardized hospital room designed for maximum efficiency."}, {"key": "C", "text": "A therapeutic encounter that facilitates patient self-discovery and transformation."}, {"key": "D", "text": "A high-tech laboratory where genetic testing is performed."}], "answer": "C", "rationale": "A therapeutic encounter that facilitates patient self-discovery and transformation. This environment is created through mindfulness and storytelling to help patients understand their own journey.", "caseContext": null}, {"id": 7, "question": "Which of the following is considered one of the 'Seven Core Clinical Imbalances' in the Functional Medicine Matrix?", "options": [{"key": "A", "text": "Cardiovascular Disease"}, {"key": "B", "text": "Depression"}, {"key": "C", "text": "Biotransformation and Elimination"}, {"key": "D", "text": "Diabetes"}], "answer": "C", "rationale": "Biotransformation and Elimination Look for a physiological process rather than a medical diagnosis. This is a core imbalance involving how the body processes and removes toxins.", "caseContext": null}, {"id": 8, "question": "In the 'GOTOIT' heuristic, what does the 'O' stand for?", "options": [{"key": "A", "text": "Observe"}, {"key": "B", "text": "Overcome"}, {"key": "C", "text": "Organize"}, {"key": "D", "text": "Operate"}], "answer": "C", "rationale": "Organize This step involves mapping the gathered information onto the Functional Medicine Matrix.", "caseContext": null}, {"id": 9, "question": "What is the primary purpose of 'Self-Gathering' techniques for a clinician?", "options": [{"key": "A", "text": "To collect physical samples from the patient."}, {"key": "B", "text": "To increase the speed of the patient consultation."}, {"key": "C", "text": "To organize the clinic's digital files."}, {"key": "D", "text": "To enhance the therapeutic encounter by centering the practitioner."}], "answer": "D", "rationale": "To enhance the therapeutic encounter by centering the practitioner. Think about how a practitioner's focus and presence affect the patient's willingness to share their story. By being mindful and present, the practitioner can better listen to the patient's story and provide insight.", "caseContext": null}, {"id": 10, "question": "Which clinical tool is described as the 'operating system! of Functional Medicine?", "options": [{"key": "A", "text": "The Electronic Health Record"}, {"key": "B", "text": "The Functional Medicine Matrix"}, {"key": "C", "text": "The Nutrition Prescription"}, {"key": "D", "text": "The Patient Intake Form"}], "answer": "B", "rationale": "The Functional Medicine Matrix The Matrix, combined with the Timeline, serves as the core framework for organizing patient data and imbalances. It's the visual tool used to map core imbalances, lifestyle factors, and antecedents/triggers/mediators.", "caseContext": null}, {"id": 11, "question": "A patient presents with a history of long-term antibiotic use during childhood. In the Functional Medicine Matrix, this historical fact would most likely be categorized as a(n):", "options": [{"key": "A", "text": "Trigger"}, {"key": "B", "text": "Mediator"}, {"key": "C", "text": "Core Clinical Imbalance"}, {"key": "D", "text": "Antecedent"}], "answer": "D", "rationale": "Antecedent Antecedents are factors that predispose an individual to illness, such as genetics or significant early-life exposures like antibiotics.", "caseContext": null}, {"id": 12, "question": "Which specific 'ABCD' assessment involves reviewing lab results for homocysteine, methylmalonic acid (MMA), and Vitamin D levels?", "options": [{"key": "A", "text": "Anthropometrics"}, {"key": "B", "text": "Clinical Indicators"}, {"key": "C", "text": "Biomarkers"}, {"key": "D", "text": "Diet Evaluation"}], "answer": "C", "rationale": "Biomarkers Biomarkers include laboratory data and functional tests that provide insight into internal physiological states.", "caseContext": null}, {"id": 13, "question": "When utilizing the 'Timeline' tool, which of the following is the primary objective?", "options": [{"key": "A", "text": "To prioritize which laboratory tests should be ordered first."}, {"key": "B", "text": "To document a list of all current medications the patient is taking."}, {"key": "C", "text": "To calculate the patient's biological age versus chronological age."}, {"key": "D", "text": "To identify patterns of health and illness by mapping life events from preconception to the present."}], "answer": "D", "rationale": "To identify patterns of health and illness by mapping life events from preconception to the present. The timeline helps practitioners see the connections between antecedents, triggers, and the development of chronic disease. Think about how chronological storytelling helps reveal the '‘why' behind a patient's current health status.", "caseContext": null}, {"id": 14, "question": "An assessment of a patient's 'Mental, Emotional, and Spiritual’ (MES) health is located where on the Functional Medicine Matrix?", "options": [{"key": "A", "text": "At the center of the Matrix, influencing all other physiological systems."}, {"key": "B", "text": "Along the top of the Matrix under 'Lifestyle Factors’."}, {"key": "C", "text": "In the 'Communication' core imbalance node."}, {"key": "D", "text": "In the 'Defense and Repair’ core imbalance node."}], "answer": "A", "rationale": "At the center of the Matrix, influencing all other physiological systems. The MES factors are central to the Matrix because they act as the foundation for the patient's overall health and physiological function.", "caseContext": null}, {"id": 15, "question": "A patient with brittle nails, vertical ridges, and white spots on their nails is exhibiting what part of the 'ABCD' evaluation?", "options": [{"key": "A", "text": "Clinical Indicators"}, {"key": "B", "text": "Diet Evaluation"}, {"key": "C", "text": "Biomarkers"}, {"key": "D", "text": "Anthropometrics"}], "answer": "A", "rationale": "Clinical Indicators Clinical indicators are the signs discovered during a physical exam that suggest underlying nutritional deficiencies. This involves using your eyes during a physical exam to look for signs of nutrient status.", "caseContext": null}, {"id": 16, "question": "In the GOTOIT heuristic, which phase involves creating a shared \"Treatment Plan' with the patient?", "options": [{"key": "A", "text": "Organize"}, {"key": "B", "text": "Initiate"}, {"key": "C", "text": "Tell"}, {"key": "D", "text": "Gather"}], "answer": "B", "rationale": "Initiate Initiate is the step where the collaborative treatment plan is put into action.", "caseContext": null}, {"id": 17, "question": "Which clinical imbalance node would you most likely focus on for a patient with toxic metal exposure and difficulty with Phase II conjugation?", "options": [{"key": "A", "text": "Assimilation"}, {"key": "B", "text": "Structural Integrity"}, {"key": "C", "text": "Transport"}, {"key": "D", "text": "Biotransformation and Elimination"}], "answer": "D", "rationale": "Biotransformation and Elimination This node is specifically concerned with how the body metabolizes and excretes endogenous and exogenous toxins.", "caseContext": null}, {"id": 18, "question": "Which of these is a 'Prebiotic' as used in the 'Reinoculate' phase?", "options": [{"key": "A", "text": "Oil of Oregano"}, {"key": "B", "text": "Betaine HCI"}, {"key": "C", "text": "Lactobacillus acidophilus"}, {"key": "D", "text": "Inulin or FOS (Fructooligosaccharides)"}], "answer": "D", "rationale": "Inulin or FOS (Fructooligosaccharides) These are types of fiber that selectively stimulate the growth of beneficial bacteria.", "caseContext": null}, {"id": 19, "question": "Which clinical marker is considered a highly sensitive (90-100%) and non-invasive test for evaluating exocrine pancreatic function?", "options": [{"key": "A", "text": "Fecal fat (Sudan stain)"}, {"key": "B", "text": "Pancreatic Elastase 1"}, {"key": "C", "text": "C-reactive protein (CRP)"}, {"key": "D", "text": "Serum amylase"}], "answer": "B", "rationale": "Pancreatic Elastase 1 : Pancreatic Elastase 1 is a proteolytic enzyme secreted exclusively by the human pancreas and reflects overall enzyme production and is not affected by supplemental enzyme therapy.", "caseContext": null}, {"id": 20, "question": "According to the 5R program, which step involves the reintroduction of desirable GI microflora such as Bifidobacteria and Lactobacillus?", "options": [{"key": "A", "text": "Repair"}, {"key": "B", "text": "Remove"}, {"key": "C", "text": "Replace"}, {"key": "D", "text": "Reinoculate"}], "answer": "D", "rationale": "Reinoculate Reinoculate refers to reintroducing beneficial microbes using probiotics, prebiotics, or synbiotics. This step is about 'populating' the gut with healthy bacteria.", "caseContext": null}, {"id": 21, "question": "A 48-year-old female presents with iron deficiency anemia and bloating 15-20 minutes after meals. Based on the material, which intervention is most logically indicated alongside iron supplementation?", "options": [{"key": "A", "text": "Gluten-free diet only"}, {"key": "B", "text": "Hydrochloric acid"}, {"key": "C", "text": "Broad-spectrum antibiotics"}, {"key": "D", "text": "Fiber-rich bulking agents"}], "answer": "B", "rationale": "Hydrochloric acid Bloating immediately after meals and iron deficiency are key clinical indicators of hypochlorhydria, which impairs mineral absorption. Iron absorption requires an acidic environment in the stomach.", "caseContext": null}, {"id": 22, "question": "In the Lactulose/Mannitol test for intestinal permeability, how is an increased index interpreted?", "options": [{"key": "A", "text": "It indicates healthy transcellular uptake."}, {"key": "B", "text": "It indicates a lack of pancreatic enzymes."}, {"key": "C", "text": "It proves the presence of SIBO."}, {"key": "D", "text": "It suggests increased paracellular diffusion through tight junctions."}], "answer": "D", "rationale": "It suggests increased paracellular diffusion through tight junctions. Lactulose is a large molecule that usually stays in the gut; its presence in urine suggests ‘leaky' tight junctions.", "caseContext": null}, {"id": 23, "question": "Which of the following is NOT listed as a trigger for increased intestinal permeability?", "options": [{"key": "A", "text": "Stress"}, {"key": "B", "text": "Dysbiosis"}, {"key": "C", "text": "Inadequate mastication"}, {"key": "D", "text": "NSAIDs"}], "answer": "C", "rationale": "Inadequate mastication Inadequate mastication is an impairment of Digestion/Absorption ('D'), not a direct trigger for permeability ('l') itself. All other answer choices impair the chemical integrity of the gut wall while C affects the mechanical breakdown of food.", "caseContext": null}, {"id": 24, "question": "What is 'molecular mimicry' in the context of gut dysregulation?", "options": [{"key": "A", "text": "Enzymes mimicking the role of hydrochloric acid."}, {"key": "B", "text": "Pathogens mimicking the appearance of beneficial bacteria."}, {"key": "C", "text": "The gut mimicking the nervous system's signaling."}, {"key": "D", "text": "Antigens possessing similar structures to human tissue, leading to cross-reactivity."}], "answer": "D", "rationale": "Antigens possessing similar structures to human tissue, leading to cross-reactivity. Translocation of microbial components can cause the immune system to attack similar-looking human tissues. Think about why the immune system might accidentally attack the body after an infection.", "caseContext": null}, {"id": 25, "question": "According to the provided charts, which environmental factor is associated with an INCREASED risk of Inflammatory Bowel Disease (IBD)?", "options": [{"key": "A", "text": "Childhood antibiotic exposure"}, {"key": "B", "text": "Rural living"}, {"key": "C", "text": "High Vitamin D levels"}, {"key": "D", "text": "Diet rich in fish and vegetables"}], "answer": "A", "rationale": "Childhood antibiotic exposure Consider the impact of early-life medical interventions on the microbiome. Antibiotic exposure in childhood is explicitly associated with an increased risk of developing IBD.", "caseContext": null}, {"id": 26, "question": "Which nutrient is specifically mentioned as providing support for the repair of the GI mucosa and GALT (Gut- Associated Lymphoid Tissue) function?", "options": [{"key": "A", "text": "Betaine HCl"}, {"key": "B", "text": "Bile salts"}, {"key": "C", "text": "L-Glutamine"}, {"key": "D", "text": "Cellulose"}], "answer": "C", "rationale": "L-Glutamine L-Glutamine is a primary fuel for enterocytes and is essential for GI repair and healing. This amino acid is often referred to as the most important nutrient for intestinal barrier integrity.", "caseContext": null}, {"id": 27, "question": "What does the 'Rebalance' step in the 5R/6R program primarily focus on?", "options": [{"key": "A", "text": "Balancing the pH of the stomach."}, {"key": "B", "text": "Restoring the ratio of Omega-3 to Omega-6 fats."}, {"key": "C", "text": "Balancing the population of aerobic vs. anaerobic bacteria."}, {"key": "D", "text": "Lifestyle factors like sleep, stress management, and mindful eating."}], "answer": "D", "rationale": "Lifestyle factors like sleep, stress management, and mindful eating. Rebalance refers to restorative processes in a patient's life, such as yoga, meditation, and relationship support. This step looks beyond clinical supplements to the patient's daily habits and mental state to help with rest and digest.", "caseContext": null}, {"id": 28, "question": "A patient with suspected hypochlorhydria is undergoing a Betaine HCI challenge. If the patient experiences a burning sensation after taking a single 650mg capsule with a protein-rich meal, what is the most appropriate clinical interpretation?", "options": [{"key": "A", "text": "The patient has a protein-digestion deficiency but sufficient acid."}, {"key": "B", "text": "The dose was too low to trigger the proper feedback loop."}, {"key": "C", "text": "The patient likely has sufficient HCl production or an underlying gastritis/ulcer."}, {"key": "D", "text": "The patient has severe achlorhydria and requires a much higher dose."}], "answer": "C", "rationale": "The patient likely has sufficient HCl production or an underlying gastritis/ulcer. The immediate onset of symptoms suggests the stomach already has enough acid or that the protective mucosal barrier is compromised.", "caseContext": null}, {"id": 29, "question": "Elevated levels of fecal Secretory IgA (sIgA) are detected in a patient. How does this finding influence the clinical focus within the DIGIN framework?", "options": [{"key": "A", "text": "It focuses attention on 'T' (Inflammation/Immune) suggesting an up-regulated GALT response."}, {"key": "B", "text": "It confirms that the 'N' (Nervous System) node is suppressing gut motility."}, {"key": "C", "text": "It points toward 'D' (Digestion) due to lack of bile flow."}, {"key": "D", "text": "It indicates a state of immune exhaustion requiring immediate supplementation of sIgA."}], "answer": "A", "rationale": "It focuses attention on 'T' (Inflammation/Immune) suggesting an up-regulated GALT response. slgA is the primary immunoglobulin of the mucosal immune system, and elevation signals the immune system is actively fighting an antigen or pathogen.", "caseContext": null}, {"id": 30, "question": "During the 'Remove' phase of the 5R program, a patient develops 'die-off' symptoms (Herxheimer reaction). Which physiological mechanism best explains this occurrence?", "options": [{"key": "A", "text": "The immediate repair of the intestinal basement membrane."}, {"key": "B", "text": "An allergic reaction to the botanical antimicrobials used."}, {"key": "C", "text": "A sudden drop in systemic pH due to the absence of beneficial bacteria."}, {"key": "D", "text": "The rapid release of endotoxins (LPS) from lysed Gram-negative bacteria."}], "answer": "D", "rationale": "The rapid release of endotoxins (LPS) from lysed Gram-negative bacteria. When pathogenic bacteria are killed off rapidly, they release lipopolysaccharides that trigger a temporary systemic inflammatory response.", "caseContext": null}, {"id": 31, "question": "Why is it clinically significant to test for Total Serum IgA when evaluating a patient for Celiac Disease using tTG-IgA antibodies?", "options": [{"key": "A", "text": "Because IgA deficiency is significantly more common in Celiac patients and can cause false negatives."}, {"key": "B", "text": "Total IgA levels determine the severity of the villous atrophy."}, {"key": "C", "text": "To ensure the patient has enough protein to build antibodies."}, {"key": "D", "text": "IgA is the only immunoglobulin capable of crossing the blood-brain barrier."}], "answer": "A", "rationale": "Because IgA deficiency is significantly more common in Celiac patients and can cause false negatives. If a patient is deficient in total IgA, their specific tTG-lgA test may be low regardless of whether they have the disease.", "caseContext": null}, {"id": 32, "question": "A patient presents with high fecal Calprotectin. Which specific node of the DIGIN mnemonic is most directly implicated by this biomarker?", "options": [{"key": "A", "text": "Digestion/Absorption"}, {"key": "B", "text": "Gut Microbiota"}, {"key": "C", "text": "Inflammation/Immune"}, {"key": "D", "text": "Intestinal Permeability"}], "answer": "C", "rationale": "Inflammation/Immune Calprotectin is a protein released by neutrophils during an inflammatory response in the gut mucosa. This marker is used to differentiate between IBS (non-inflammatory) and IBD (inflammatory).", "caseContext": null}, {"id": 33, "question": "In the context of the SR program, what is the primary biochemical role of providing supplementary butyrate during the 'Repair' phase?", "options": [{"key": "A", "text": "To directly neutralize lipopolysaccharides (LPS) in the lumen."}, {"key": "B", "text": "To provide the preferred energy source for colonocytes and promote gene expression for barrier repair."}, {"key": "C", "text": "To acidify the stomach to help break down proteins."}, {"key": "D", "text": "To act as a prebiotic 'food' for Lactobacillus species."}], "answer": "B", "rationale": "To provide the preferred energy source for colonocytes and promote gene expression for barrier repair. Butyrate is the main fuel for the cells lining the colon and plays a role in maintaining the mucosal barrier.", "caseContext": null}, {"id": 34, "question": "A patient has a high 'Lactulose/Mannitol Recovery Ratio' but low absolute recovery of both sugars. What does this pattern suggest?", "options": [{"key": "A", "text": "Normal gut function with high transit time."}, {"key": "B", "text": "The patient is consuming too much fiber, blocking sugar uptake."}, {"key": "C", "text": "High exocrine pancreatic insufficiency."}, {"key": "D", "text": "Combined malabsorption and increased permeability (leaky gut)."}], "answer": "D", "rationale": "Combined malabsorption and increased permeability (leaky gut). Low mannitol recovery indicates reduced surface area/absorption, while the high ratio indicates the larger lactulose is still getting through via tight junction failure.", "caseContext": null}, {"id": 35, "question": "According to the Institute for Functional Medicine (IFM) definitions, which mechanism characterizes a 'food sensitivity'?", "options": [{"key": "A", "text": "An immunologic reaction involving IgG-mediated delayed hypersensitivity."}, {"key": "B", "text": "A non-immunologic reaction such as lactose or histamine intolerance."}, {"key": "C", "text": "A toxic reaction occurring in any individual regardless of susceptibility."}, {"key": "D", "text": "An immunologic IgE-mediated type 1 hypersensitivity reaction."}], "answer": "A", "rationale": "An immunologic reaction involving IgG-mediated delayed hypersensitivity. Think about the specific immunoglobulin class associated with 'delayed' rather than ‘immediate’ reactions.", "caseContext": null}, {"id": 36, "question": "In the metabolism of Omega-3 fatty acids, which enzyme is responsible for converting Alpha- linolenic acid (ALA) to Stearidonic acid and is notably inhibited by age and alcohol?", "options": [{"key": "A", "text": "Delta-6-desaturase"}, {"key": "B", "text": "Delta-5-desaturase"}, {"key": "C", "text": "Delta-5-elongase"}, {"key": "D", "text": "Beta Oxidation"}], "answer": "A", "rationale": "Delta-6-desaturase This enzyme is the rate-limiting step and first desaturase in the omega-3 and omega-6 conversion pathways. Delta-6- desaturase is the initial enzyme in the pathway and is sensitive to inhibition by age and alcohol consumption.", "caseContext": null}, {"id": 37, "question": "What is the recommended optimal ratio of EPA to DHA for patients with inflammatory diseases, according to the clinical pearls provided?", "options": [{"key": "A", "text": "1:4"}, {"key": "B", "text": "1:1"}, {"key": "C", "text": "1.5:1"}, {"key": "D", "text": "4:1"}], "answer": "C", "rationale": "1.5:1 The ratio slightly favors EPA over DHA. The clinical evidence suggests that an EPA/DHA ratio of 1.5:1 is optimal for managing inflammatory diseases.", "caseContext": null}, {"id": 38, "question": "Which of the following biomarkers is considered an acute-phase reactant that typically increases 100X within 24—48 hours of an inflammatory stimulus?", "options": [{"key": "A", "text": "Fibrinogen"}, {"key": "B", "text": "C-reactive protein"}, {"key": "C", "text": "Serum Amyloid A"}, {"key": "D", "text": "Ferritin"}], "answer": "B", "rationale": "C-reactive protein CRP is a hallmark acute-phase reactant known for its rapid and dramatic increase following trauma or infection. This marker is often the 'best bet' for assessing low-grade systemic inflammation.", "caseContext": null}, {"id": 39, "question": "Which botanical contains proteolytic enzymes and acts to downregulate COX-2 expression while also inhibiting bradykinin production?", "options": [{"key": "A", "text": "Boswellia"}, {"key": "B", "text": "Bromelain"}, {"key": "C", "text": "Ginger"}, {"key": "D", "text": "Curcumin"}], "answer": "B", "rationale": "Bromelain Derived from pineapple, bromelain contains proteolytic enzymes that inhibit bradykinin and modulate COX-2.", "caseContext": null}, {"id": 40, "question": "A patient with chronic sinusitis and asthma is already taking EPA and GLA. According to the case management guidelines, which combination would be most useful to add to their regimen?", "options": [{"key": "A", "text": "Turmeric and Devil’s Claw"}, {"key": "B", "text": "Turmeric and Piperine"}, {"key": "C", "text": "Vitamin C and Bromelain"}, {"key": "D", "text": "Boswellia and Quercetin"}], "answer": "D", "rationale": "Boswellia and Quercetin Look for a combination that specifically addresses leukotriene pathways and histamine release. Boswellia is indicated for asthma, and Quercetin inhibits histamine release and LOX/COX pathways, making them ideal for sinusitis and asthma.", "caseContext": null}, {"id": 41, "question": "Which factor is NOT listed as an ATM (Antecedent, Trigger, or Mediator) involved in food allergy and barrier permeability?", "options": [{"key": "A", "text": "Hyperthyroidism"}, {"key": "B", "text": "Hypochlorhydria"}, {"key": "C", "text": "Cesarean sections"}, {"key": "D", "text": "Iatrogenic factors like NSAIDs and acid blockers"}], "answer": "A", "rationale": "Hyperthyroidism While ferritin may be elevated in hyperthyroidism, it is not listed as a primary ATM for food allergy development. C- sections are noted as ATMs that can influence the initial microbiota and immune development.", "caseContext": null}, {"id": 42, "question": "Why is it recommended to take Gamma-linolenic acid (GLA) concurrently with Eicosapentaenoic acid (EPA)?", "options": [{"key": "A", "text": "To stimulate the production of PGE2."}, {"key": "B", "text": "To inhibit the retro-conversion of DHA."}, {"key": "C", "text": "To increase the absorption of EPA in the gut."}, {"key": "D", "text": "To prevent the conversion of GLA to Arachidonic Acid (AA)."}], "answer": "D", "rationale": "To prevent the conversion of GLA to Arachidonic Acid (AA). EPA inhibits the delta-5-desaturase enzyme, which prevents the pro-inflammatory shunting of DGLA (from GLA) toward AA.", "caseContext": null}, {"id": 43, "question": "Which immunoglobulin isotype has the longest half-life, necessitating elimination diets of at least 3-4 weeks to significantly reduce levels?", "options": [{"key": "A", "text": "IgM"}, {"key": "B", "text": "IgG"}, {"key": "C", "text": "IgA"}, {"key": "D", "text": "IgE"}], "answer": "B", "rationale": "IgG IgG has a half-life of approximately 21—23 days, which is why elimination diets must be sustained to see a reduction in these antibodies. This class makes up 75% of total immunoglobulins and is associated with delayed food sensitivities.", "caseContext": null}, {"id": 44, "question": "Which of the following is a 'clinical pearl' for reducing oxidative biosynthesis of inflammatory eicosanoids?", "options": [{"key": "A", "text": "Increasing intake of deeply pigmented fruits and vegetables."}, {"key": "B", "text": "Using hydrogenated fats to stabilize cell membranes."}, {"key": "C", "text": "Limiting fiber intake to reduce microbiome activity."}, {"key": "D", "text": "Increasing intake of simple sugars to boost energy for immune cells."}], "answer": "A", "rationale": "Increasing intake of deeply pigmented fruits and vegetables. Pigmented produce provides phytonutrients and antioxidants that quench reactive oxygen species and reduce inflammatory signaling. B is incorrect since hydrogenated and trans-fats are inhibitors of desaturase enzymes and increase inflammation.", "caseContext": null}, {"id": 45, "question": "A patient with elevated markers of systemic inflammation is consuming high amounts of dietary Linoleic Acid (LA). Which metabolic shift is most likely to occur if this patient also has undiagnosed hyperinsulinemia?", "options": [{"key": "A", "text": "Decreased production of series-2 eicosanoids."}, {"key": "B", "text": "Increased shunting of Dihomo-gamma-linolenic acid (DGLA) toward Prostaglandin E2 (PGE2)."}, {"key": "C", "text": "Increased conversion of ALA to DHA via Delta-6-desaturase."}, {"key": "D", "text": "Inhibition of the retro-conversion of DHA to EPA."}], "answer": "B", "rationale": "Increased shunting of Dihomo-gamma-linolenic acid (DGLA) toward Prostaglandin E2 (PGE2). Excess insulin up-regulates Delta-5-desaturase, which shifts DGLA away from anti-inflammatory series-1 eicosanoids and toward pro-inflammatory Arachidonic Acid and PGE2.", "caseContext": null}, {"id": 46, "question": "Which of the following describes the most accurate clinical rationale for utilizing high-sensitivity CRP (hs- CRP) rather than standard CRP in a functional medicine assessment?", "options": [{"key": "A", "text": "hs-CRP can detect 'low-grade' systemic inflammation in patients without overt clinical symptoms."}, {"key": "B", "text": "hs-CRP is specifically used to monitor the half-life of IgG antibodies during an elimination diet."}, {"key": "C", "text": "hs-CRP is an acute-phase reactant while standard CRP is a chronic-phase reactant."}, {"key": "D", "text": "Standard CRP is unable to detect levels above 10 mg/L, making it useless for acute infection."}], "answer": "A", "rationale": "hs-CRP can detect 'low-grade' systemic inflammation in patients without overt clinical symptoms. hs-CRP measures levels below 3 mg/L, allowing clinicians to identify subclinical inflammation that standard CRP assays would miss.", "caseContext": null}, {"id": 47, "question": "A practitioner is treating a patient with chronic inflammation using both Gamma-linolenic acid (GLA) and Eicosapentaenoic acid (EPA). What is the specific enzymatic mechanism by which EPA prevents GLA from becoming pro-inflammatory?", "options": [{"key": "A", "text": "EPA inhibits Delta-5-desaturase, preventing DGLA from converting to Arachidonic Acid."}, {"key": "B", "text": "EPA blocks the retro-conversion of GLA into Linoleic Acid."}, {"key": "C", "text": "EPA activates Delta-6-elongase to speed up the production of DHA."}, {"key": "D", "text": "EPA inhibits Delta-6-desaturase, preventing LA from becoming GLA."}], "answer": "A", "rationale": "EP A inhibits Delta-5-desaturase, preventing DGLA from converting to Arachidonic Acid. By inhibiting Delta-5-desaturase, EPA ensures that the DGLA produced from GLA stays in the anti-inflammatory pathway instead of becoming Arachidonic Acid.", "caseContext": null}, {"id": 48, "question": "During an elimination diet, why might a patient's symptoms temporarily exacerbate before they begin to improve, specifically in the context of IgG-mediated reactions?", "options": [{"key": "A", "text": "The clearance of circulating immune complexes and the long half-life of IgG (21—23 days) can delay clinical stabilization."}, {"key": "B", "text": "Withdrawal from food additives like MSG causes immediate systemic leukocytosis."}, {"key": "C", "text": "Eliminating fiber reduces the production of Short Chain Fatty Acids, causing immediate gut inflammation."}, {"key": "D", "text": "The 2.3-day half-life of IgE causes a rapid release of histamine upon food removal."}], "answer": "A", "rationale": "The clearance of circulating immune complexes and the long half-life of IgG (21—23 days) can delay clinical stabilization. Because IgG persists for weeks, symptoms may fluctuate as the body clears existing antibodies and immune complexes even after the trigger is removed.", "caseContext": null}, {"id": 49, "question": "Which set of cofactors is essential for the proper function of desaturase enzymes involved in the metabolism of Omega-3 PUFAs?", "options": [{"key": "A", "text": "Iron, Copper, and Vitamin B12."}, {"key": "B", "text": "Vitamin D, Vitamin K2, and Calcium."}, {"key": "C", "text": "Selenium, Iodine, and Vitamin A."}, {"key": "D", "text": "Zinc, Magnesium, Ascorbate, Niacin, and Pyridoxine."}], "answer": "D", "rationale": "Zinc, Magnesium, Ascorbate, Niacin, and Pyridoxine. These specific vitamins and minerals are required as cofactors for the desaturase enzymes to convert ALA into EPA and DHA.", "caseContext": null}, {"id": 50, "question": "A patient presents with rhinosinusitis and nasal polyps. Based on clinical pearls, which dietary ‘pseudo- allergen' should be suspected as a possible trigger even if standard IgE tests are negative?", "options": [{"key": "A", "text": "Tyramine"}, {"key": "B", "text": "Lectins"}, {"key": "C", "text": "Oxalates"}, {"key": "D", "text": "Salicylates"}], "answer": "D", "rationale": "Salicylates This substance acts as a natural plant preservative and is also found in aspirin. Salicylate intolerance classically presents with the triad of asthma, nasal polyps, and rhinosinusitis.", "caseContext": null}, {"id": 51, "question": "In the context of the IFM Cardiometabolic Clinical Decision Tree, which of the following is considered a primary (1°) treatment intervention?", "options": [{"key": "A", "text": "Phyto-nutritional supplementation"}, {"key": "B", "text": "Advanced laboratory testing (e.g., CAC (Coronary Artery Calcification/CIMT (Carotid Intima-Media Thickness)"}, {"key": "C", "text": "Pharmacological statin therapy"}, {"key": "D", "text": "Modifiable Lifestyle Factors (MLF)"}], "answer": "D", "rationale": "Modifiable Lifestyle Factors (MLF) The decision tree emphasizes 'food first' and lifestyle interventions like sleep and movement as primary treatments.", "caseContext": null}, {"id": 52, "question": "Which effect of hyperinsulinemia is most directly relevant to increasing cardiometabolic risk according to the module?", "options": [{"key": "A", "text": "Decreasing triglycerides"}, {"key": "B", "text": "Increasing HDL particle size"}, {"key": "C", "text": "Decreasing small LDL particle number"}, {"key": "D", "text": "Increasing C-Reactive Protein (hs-CRP)"}], "answer": "D", "rationale": "Increasing C-Reactive Protein (hs-CRP) Hyperinsulinemia is a key driver of systemic inflammation, often measured by elevations in hs- CRP.", "caseContext": null}, {"id": 53, "question": "Which of the following nutrients is specifically listed as being at risk for depletion when a patient is taking HMG-CoA Reductase Inhibitors (statins)?", "options": [{"key": "A", "text": "Calcium"}, {"key": "B", "text": "Vitamin C"}, {"key": "C", "text": "Iron"}, {"key": "D", "text": "Coenzyme Q10 (CoQ10)"}], "answer": "D", "rationale": "Coenzyme Q10 (CoQ10) Statins inhibit the mevalonate pathway, which is required for the synthesis of both cholesterol and CoQ10.", "caseContext": null}, {"id": 54, "question": "When managing hypertension through a therapeutic diet, which food group is typically not emphasized for inclusion?", "options": [{"key": "A", "text": "Foods rich in dietary fiber (e.g., oatmeal, barley)"}, {"key": "B", "text": "Foods rich in lycopene (e.g., tomato, watermelon)"}, {"key": "C", "text": "Foods rich in L-arginine (e.g., walnuts, lentils)"}, {"key": "D", "text": "Foods rich in sulfur (e.g., broccoli, cabbage)"}], "answer": "D", "rationale": "Foods rich in sulfur (e.g., broccoli, cabbage) While healthy for synthesizing the important antioxidant glutathione, sulfur-rich foods are not the primary focus for hypertension compared to arginine, lycopene, or fiber-rich foods.", "caseContext": null}, {"id": 55, "question": "What does a 'non-dipping' blood pressure pattern at night indicate in terms of clinical risk?", "options": [{"key": "A", "text": "Lower risk of myocardial infarction"}, {"key": "B", "text": "Normal autonomic nervous system function"}, {"key": "C", "text": "Successful response to sodium restriction"}, {"key": "D", "text": "High cardiac risk and potential secondary hypertension"}], "answer": "D", "rationale": "High cardiac risk and potential secondary hypertension A healthy body should show a significant decrease in blood pressure during sleep. Failure of BP to drop 10-20% at night is correlated with congestive heart failure, stroke, and renal failure.", "caseContext": null}, {"id": 56, "question": "According to the module, how is 'Sedentary Behavior' defined for a waking adult?", "options": [{"key": "A", "text": "Participating in less than 60 minutes of exercise daily"}, {"key": "B", "text": "Energy expenditure < 1.5 METs while sitting or reclining"}, {"key": "C", "text": "Any activity that does not raise the heart rate above 100 bpm"}, {"key": "D", "text": "Walking fewer than 5,000 steps per day"}], "answer": "B", "rationale": "Energy expenditure < 1.5 METs while sitting or reclining The definition specifically targets low-energy activities (1.5 METs or less) in a seated or lying position.", "caseContext": null}, {"id": 57, "question": "Which of the following is a 'Common Matrix Player' for Visceral Adiposity within the Communication node?", "options": [{"key": "A", "text": "Endothelial dysfunction"}, {"key": "B", "text": "Fatty liver"}, {"key": "C", "text": "Adipocytokines and hyperinsulinemia"}, {"key": "D", "text": "Calorie excess"}], "answer": "C", "rationale": "Adipocytokines and hyperinsulinemia Communication in the matrix refers to hormones and cell signaling. Hormones and signaling molecules like adipocytokines and insulin are the primary 'Communication' issues in adiposity.", "caseContext": null}, {"id": 58, "question": "In a Functional Nutrition Evaluation, which of these would be considered a 'SHOULD Know' laboratory test rather than a 'COULD Know ' test?", "options": [{"key": "A", "text": "Myeloperoxidase (MPO)"}, {"key": "B", "text": "MTHFR gene testing"}, {"key": "C", "text": "Urine provoked metals testing"}, {"key": "D", "text": "HbAIc"}], "answer": "D", "rationale": "HbAIc HbAic is a foundational biomarker for blood sugar management and is listed in the 'SHOULD Know' category.", "caseContext": null}, {"id": 59, "question": "Which mechanism of chronic stress most directly contributes to central adiposity and insulin resistance?", "options": [{"key": "A", "text": "Increased bone density"}, {"key": "B", "text": "Ovarian dysfunction"}, {"key": "C", "text": "Excess cortisol and HPA axis dysfunction"}, {"key": "D", "text": "Decreased sympathetic nervous system activity"}], "answer": "C", "rationale": "Excess cortisol and HP A axis dysfunction High cortisol levels promote the accumulation of fat around the waist and contribute to insulin resistance.", "caseContext": null}, {"id": 60, "question": "What is the primary cardiorespiratory exercise recommendation for apparently healthy adults according to the FITT criteria?", "options": [{"key": "A", "text": "150 minutes per week total of moderate intensity"}, {"key": "B", "text": "60 minutes of vigorous intensity daily"}, {"key": "C", "text": "Only sessions lasting longer than 30 minutes are acceptable"}, {"key": "D", "text": "Resistance training 5-7 days per week"}], "answer": "A", "rationale": "150 minutes per week total of moderate intensity This aligns with the ACSM guidelines of 150 minutes total, often spread as 30-60 mins 5 days per week.", "caseContext": null}, {"id": 61, "question": "A patient's lab results show an elevated Triglyceride to HDL ratio. According to the IFM Cardiometabolic Risk Patterns, which category does this finding primarily fall under?", "options": [{"key": "A", "text": "Immune and Toxic Burden"}, {"key": "B", "text": "Coagulation"}, {"key": "C", "text": "Metabolic Function"}, {"key": "D", "text": "Vascular/Endothelial Function"}], "answer": "C", "rationale": "Metabolic Function The module specifically identifies the Trig/HDL ratio as a clinical indicator for metabolic risk alongside fasting glucose and insulin.", "caseContext": null}, {"id": 62, "question": "A patient with the APOE 4 allele (3/4 or 4/4) is seeking dietary advice to mitigate cardiovascular risk. Which recommendation is specifically emphasized for this genotype in the module?", "options": [{"key": "A", "text": "Increase intake of medium-chain triglycerides (MCTs)"}, {"key": "B", "text": "Prioritize high-intensity interval training over dietary changes"}, {"key": "C", "text": "Strongly advise against alcohol consumption"}, {"key": "D", "text": "Switch to a high-protein, low-fiber diet"}], "answer": "C", "rationale": "Strongly advise against alcohol consumption The summary for APOE 4 management specifically highlights advising against alcohol along with lowering simple carbs and saturated fats.", "caseContext": null}, {"id": 63, "question": "Which of the following is considered a 'Mediator or Perpetuator' in the Cardiometabolic Matrix, specifically linked to chronic stress and oxidative inflammation?", "options": [{"key": "A", "text": "Infection and Dysbiosis"}, {"key": "B", "text": "Visceral Adipose Tissue (V AT)"}, {"key": "C", "text": "Age and Gender"}, {"key": "D", "text": "Familial hypercholesterolemia"}], "answer": "B", "rationale": "Visceral Adipose Tissue (VAT) V AT is listed alongside hyperinsulinemia and chronic stress as a key mediator that perpetuates clinical imbalances.", "caseContext": null}, {"id": 64, "question": "In the context of the 'Defense & Repair' node for visceral adiposity, which 'Common Matrix Player' is most prominent?", "options": [{"key": "A", "text": "Inflammation"}, {"key": "B", "text": "Adipocytokines"}, {"key": "C", "text": "Fatty liver"}, {"key": "D", "text": "Endothelial dysfunction"}], "answer": "A", "rationale": "Inflammation The module explicitly links the Defense & Repair node to inflammation in the context of visceral adiposity.", "caseContext": null}, {"id": 65, "question": "Which agent is specifically highlighted for its ability to inhibit the 'respiratory burst' reaction in Myeloperoxidase (MPO) activation?", "options": [{"key": "A", "text": "Fish Oil (EPA/DHA)"}, {"key": "B", "text": "N-Acetyl Cysteine (NAC)"}, {"key": "C", "text": "Red Yeast Rice"}, {"key": "D", "text": "Niacin"}], "answer": "B", "rationale": "N-Acetyl Cysteine (NAC) NAC provides the precursors for glutathione and directly helps modulate the oxidative burst associated with MPO.", "caseContext": null}, {"id": 66, "question": "According to the module's section on ‘Obesity, tissue inflammation, and insulin resistance,' what role do bone marrow-derived macrophages play in the adipose tissue?", "options": [{"key": "A", "text": "They primarily target the breakdown of triglycerides into glucose"}, {"key": "B", "text": "They decrease the production of pro-inflammatory cytokines"}, {"key": "C", "text": "They promote systemic insulin resistance through endocrine mechanisms"}, {"key": "D", "text": "They prevent the 'feed-forward' cycle of macrophage recruitment"}], "answer": "C", "rationale": "They promote systemic insulin resistance through endocrine mechanisms The module describes a process where macrophages release cytokines that activate inflammatory pathways locally and distally.", "caseContext": null}, {"id": 67, "question": "According to the steroidogenic pathway, what is the primary enzymatic effect of stress and inflammation that contributes to the 'cortisol steal’ phenomenon?", "options": [{"key": "A", "text": "Inhibition of 17,20-lyase"}, {"key": "B", "text": "Stimulation of 11-beta-hydroxylase"}, {"key": "C", "text": "Stimulation of 21-hydroxylase"}, {"key": "D", "text": "Inhibition of aromatase"}], "answer": "A", "rationale": "Inhibition of 17,20-lyase Think about the enzyme responsible for converting precursors over to the androgen (DHEA) side of the pathway, which gets blocked by stress. Stress and inflammation inhibit the 17,20-lyase enzyme. This slows the conversion of precursors into androgens (like DHEA), effectively shunting the pathway toward cortisol production.", "caseContext": null}, {"id": 68, "question": "A patient presents with elevated fasting insulin and signs of insulin resistance. How does this metabolic state typically affect Sex Hormone Binding Globulin (SHBG) levels?", "options": [{"key": "A", "text": "It increases SHBG levels."}, {"key": "B", "text": "It causes fluctuating SHBG levels dependent on cortisol."}, {"key": "C", "text": "It has no effect on SHBG levels."}, {"key": "D", "text": "It decreases SHBG levels."}], "answer": "D", "rationale": "It decreases SHBG levels. There is a strong inverse relationship where insulin resistance and hyperinsulinemia lower SHBG levels. Low SHBG is considered a marker for insulin resistance, a predictor for the development of Type II Diabetes.", "caseContext": null}, {"id": 69, "question": "In the 'Arousal' stage (Stage 1) of HPA axis dysfunction, which laboratory profile is most characteristic?", "options": [{"key": "A", "text": "Normal Cortisol and Depressed DHEA"}, {"key": "B", "text": "Elevated Cortisol and Elevated or Normal DHEA"}, {"key": "C", "text": "Elevated Cortisol and Depressed DHEA"}, {"key": "D", "text": "Depressed Cortisol and Depressed DHEA"}], "answer": "B", "rationale": "Elevated Cortisol and Elevated or Normal DHEA Stage 1 is the alarm/arousal phase characterized by a hyper-response, resulting in elevated cortisol and often maintained or elevated DHEA levels. In the very first stage of stress response, the body is fully stimulated and pumping out high levels of all stress hormones.", "caseContext": null}, {"id": 70, "question": "Which of the following physical signs is considered a possible exam finding associated with elevated cortisol levels?", "options": [{"key": "A", "text": "Slow heart rate (Bradycardia)"}, {"key": "B", "text": "Sergant's white line"}, {"key": "C", "text": "Low blood pressure upon standing"}, {"key": "D", "text": "Pupil dilation in response to light"}], "answer": "B", "rationale": "Sergant's white line Sergant's white line (a white line remaining on the abdomen after scratching with a blunt instrument) is noted as a possible finding with elevated cortisol. This sign involves a paradoxical reaction of the skin capillaries on the abdomen when stroked with a blunt object.", "caseContext": null}, {"id": 71, "question": "Identify the laboratory pattern associated with Stage 3 (Exhaustion) of HPA axis dysfunction.", "options": [{"key": "A", "text": "Depressed Cortisol and Depressed DHEA"}, {"key": "B", "text": "Elevated Cortisol and Low DHEA"}, {"key": "C", "text": "Low morning Cortisol and rising evening Cortisol"}, {"key": "D", "text": "Elevated Cortisol sum throughout the day"}], "answer": "A", "rationale": "Depressed Cortisol and Depressed DHEA In the Exhaustion stage, the adrenal reserve is depleted, leading to low levels of both cortisol and DHEA. In the final stage of the General Adaptation Syndrome, the body's resources are depleted, resulting in low levels of both major adrenal markers.", "caseContext": null}, {"id": 72, "question": "Inflammation can impact hormone pathways similarly to stress. Specifically, inflammation stimulates which enzyme, potentially leading to increased estrogen formation?", "options": [{"key": "A", "text": "17,20-lyase"}, {"key": "B", "text": "Aromatase"}, {"key": "C", "text": "21-hydroxylase"}, {"key": "D", "text": "11-beta-HSD"}], "answer": "B", "rationale": "Aromatase Inflammation stimulates aromatase, which increases the conversion of androgens to estrogens.", "caseContext": null}, {"id": 73, "question": "Which symptom is most specifically listed as a symptom of depressed cortisol (Stage 3) rather than elevated cortisol?", "options": [{"key": "A", "text": "Weight gain around the middle"}, {"key": "B", "text": "Craving salty foods"}, {"key": "C", "text": "Insomnia/difficulty falling asleep"}, {"key": "D", "text": "Night sweats"}], "answer": "B", "rationale": "Craving salty foods Craving salty foods (pickles, etc.) is listed as a symptom of depressed cortisol, likely related to the loss of sodium retention typically managed by aldosterone/cortisol. Low adrenal function often leads to an inability to retain sodium, leading to a specific dietary craving.", "caseContext": null}, {"id": 74, "question": "Regarding thyroid hormone replacement (THR), what is a distinguishing feature of natural desiccated porcine glandulars compared to synthetic levothyroxine monotherapy?", "options": [{"key": "A", "text": "They contain T4,T3,T2, and T1."}, {"key": "B", "text": "They have been proven to cause autoimmune flares."}, {"key": "C", "text": "They contain only T3."}, {"key": "D", "text": "They are not FDA approved."}], "answer": "A", "rationale": "They contain T4,T3,T2, and T1. Synthetic levothyroxine provides only the storage form of the hormone, while the natural glandular provides the full spectrum found in the gland. Desiccated thyroid extracts contain all four iodothyronines (T4, T3, T2, T1), whereas synthetic monotherapy contains only T4 (levothyroxine).", "caseContext": null}, {"id": 75, "question": "High doses of glucocorticoids (cortisol) interact with thyroid physiology primarily by:", "options": [{"key": "A", "text": "Decreasing Reverse T3 (RT3)"}, {"key": "B", "text": "Increasing TSH secretion"}, {"key": "C", "text": "Enhancing the conversion of T4 to T3"}, {"key": "D", "text": "Inhibiting thyroid hormone secretion"}], "answer": "D", "rationale": "Inhibiting thyroid hormone secretion High cortisol inhibits TSH secretion and thyroid hormone production, and also negatively impacts conversion of T4 to T3. Glucocorticoids suppress TSH, they do not increase it. Estrogen is noted to increase TSH secretion.", "caseContext": null}, {"id": 76, "question": "Which nutrient is essential for the conversion of T4 to T3 and is recommended in the routine daily supplementation for a hypothyroid patient?", "options": [{"key": "A", "text": "Calcium"}, {"key": "B", "text": "Magnesium Oxide"}, {"key": "C", "text": "Copper"}, {"key": "D", "text": "Selenium"}], "answer": "D", "rationale": "Selenium Selenium is a cofactor for the deiodinase enzymes responsible for converting T4 into the active T3. The module recommends 200-400 mcg. This mineral is a key component of the deiodinase enzyme and is often paired with Zinc for thyroid health.", "caseContext": null}, {"id": 77, "question": "In the hierarchy of hormonal treatment described in the module, which system should generally be supported first before addressing the others?", "options": [{"key": "A", "text": "Sex Steroids"}, {"key": "B", "text": "Thyroid"}, {"key": "C", "text": "Adrenals"}, {"key": "D", "text": "All systems simultaneously"}], "answer": "C", "rationale": "Adrenals Think of the 'combination lock' analogy provided in the text: one specific system must be unlocked to safely allow treatment of the subsequent metabolic regulators. The module emphasizes a specific order of treatment (Adrenal -> Thyroid -> Sex Steroids), noting that treating the thyroid first in the presence of weak adrenals can be problematic.", "caseContext": null}, {"id": 78, "question": "Inflammation and insulin resistance are noted to stimulate the 5-alpha reductase enzyme. What is the clinical consequence of this upregulation?", "options": [{"key": "A", "text": "Increased conversion of Testosterone to Estradiol"}, {"key": "B", "text": "Increased conversion of Testosterone to DHT, potentially causing hair loss"}, {"key": "C", "text": "Inhibition of Cortisol synthesis"}, {"key": "D", "text": "Decreased production of DHEA"}], "answer": "B", "rationale": "Increased conversion of Testosterone to DHT, potentially causing hair loss This enzymatic pathway diverts testosterone into a more potent androgen often associated with androgenic alopecia (hair loss). Inflammation increases 5-alpha reductase, which increases the formation of Dihydrotestosterone (DHT), a hormone linked to hair loss and acne.", "caseContext": null}, {"id": 79, "question": "What is the specific target Ferritin level recommended for optimal thyroid function?", "options": [{"key": "A", "text": "100 ng/mL"}, {"key": "B", "text": "30 ng/mL"}, {"key": "C", "text": "500 ng/mL"}, {"key": "D", "text": "10 ng/mL"}], "answer": "A", "rationale": "100 ng/mL The module explicitly mentions iron supplementation above RDA to achieve a ferritin level of 100 ng/mL. The optimal level mentioned is a round number that is significantly higher than the typical lower cutoff for ‘normal’ iron stores.", "caseContext": null}, {"id": 80, "question": "Which laboratory cortisol pattern is most characteristic of Stage 2 (Adaptation/Resistance) HPA axis dysfunction?", "options": [{"key": "A", "text": "Variable patterns, such as low morning and elevated evening cortisol"}, {"key": "B", "text": "Consistently elevated cortisol at all four time points"}, {"key": "C", "text": "Consistently depressed cortisol at all four time points"}, {"key": "D", "text": "Elevated DHEA with normal cortisol"}], "answer": "A", "rationale": "Variable patterns, such as low morning and elevated evening cortisol Stage 2 is characterized by dysregulation rather than pure elevation or depletion, often manifesting as a 'flipped' curve (low AM, high PM). In this middle stage, the body is struggling to maintain rhythm, leading to ‘tired but wired’ presentations where cortisol is high when it should be low.", "caseContext": null}, {"id": 81, "question": "Ifa patient presents with thyroid dysfunction and tests positive for Thyroid Peroxidase (TPO) antibodies, which additional screening test is strongly recommended by the module?", "options": [{"key": "A", "text": "Liver Biopsy"}, {"key": "B", "text": "MRI of the Pituitary"}, {"key": "C", "text": "24-Hour Urinary Calcium"}, {"key": "D", "text": "Celiac Panel (IgG gliadin)"}], "answer": "D", "rationale": "Celiac Panel (IgG gliadin) There is a strong clinical association between autoimmune thyroid conditions and sensitivity to a specific protein found in wheat. The text advises that for patients with labs suggestive of dysfunction and positive antibodies (Hashimoto's/Graves'), one should 'always order' a Celiac panel/IgG gliadin.", "caseContext": null}, {"id": 82, "question": "What is a potential adverse effect of supplementing Zinc at doses higher than 50 mg/day as noted in the module?", "options": [{"key": "A", "text": "Elevated TSH levels"}, {"key": "B", "text": "Excessive hair growth"}, {"key": "C", "text": "Severe hypertension"}, {"key": "D", "text": "Improper copper metabolism"}], "answer": "D", "rationale": "Improper copper metabolism The text warns that Zinc >50mg/d can cause improper copper metabolism, altered iron function, and reduced immune function.", "caseContext": null}, {"id": 83, "question": "The text defines an ‘optimal’ reference range for TSH that differs from standard lab ranges. What is this optimal range in Functional Medicine?", "options": [{"key": "A", "text": "0.1 - 1.0 mIU/L"}, {"key": "B", "text": "04 - 2.5 mIU/L"}, {"key": "C", "text": "0.5 - 10.0 mIU/L"}, {"key": "D", "text": "2.5 - 5.0 mIU/L"}], "answer": "B", "rationale": "04 - 2.5 mIU/L The document states 'Optimal RR should be 0.4-2.0/2.5' for individuals under 70 years old. Functional medicine often narrows the standard range (usually up to 4.5 or 5.0) to a tighter upper limit to capture subclinical issues.", "caseContext": null}, {"id": 84, "question": "When evaluating a male patient for Testosterone Deficiency, which biomarker is considered the most clinically relevant for assessing the actual amount of hormone available to the tissues, especially in older men or those with high SHBG?", "options": [{"key": "A", "text": "Total Testosterone"}, {"key": "B", "text": "Androstenedione"}, {"key": "C", "text": "Dihydrotestosterone (DHT)"}, {"key": "D", "text": "Calculated Free or Bioavailable Testosterone"}], "answer": "D", "rationale": "Calculated Free or Bioavailable Testosterone This accounts for the portion of testosterone not tightly bound to SHBG, reflecting the hormone actually available for cellular action", "caseContext": null}, {"id": 85, "question": "A female patient's Dutch test results show a high 2—OH:16a—OH ratio but very low 2- Methoxyestrone (2- MeO-E1). Which nutritional intervention is the most direct priority to address this specific methylation bottleneck?", "options": [{"key": "A", "text": "Iodine supplementation"}, {"key": "B", "text": "Diindolylmethane (DIM)"}, {"key": "C", "text": "Magnesium and Methyl-donors (B12/Folate)"}, {"key": "D", "text": "Calcium D-Glucarate"}], "answer": "C", "rationale": "Magnesium and Methyl-donors (B12/Folate) The COMT enzyme requires magnesium as a cofactor and methyl groups to convert potentially reactive hydroxy-estrogens into stable methoxy-estrogens.", "caseContext": null}, {"id": 86, "question": "According to the 'Hormone Hierarchy' discussed in the Sex Hormones Module, which system should generally be stabilized before initiating sex steroid replacement therapy?", "options": [{"key": "A", "text": "Cholesterol levels"}, {"key": "B", "text": "Bone Density"}, {"key": "C", "text": "Serum Vitamin D levels"}, {"key": "D", "text": "The HPA Axis (Adrenals) and Blood Sugar"}], "answer": "D", "rationale": "The HP A Axis (Adrenals) and Blood Sugar Cortisol and insulin imbalances can create 'noise' that makes sex hormone replacement ineffective or poorly tolerated.", "caseContext": null}, {"id": 87, "question": "A male patient with low testosterone also presents with elevated Estradiol and significant central adiposity. Which enzyme is likely overactive, and what is the Functional Medicine approach?", "options": [{"key": "A", "text": "Aromatase; treat by reducing adipose tissue and using zinc or botanical aromatase inhibitors."}, {"key": "B", "text": "17-beta hydroxysteroid dehydrogenase; treat with DHEA."}, {"key": "C", "text": "5-alpha reductase; treat with Saw Palmetto."}, {"key": "D", "text": "Beta-glucuronidase; treat with probiotics."}], "answer": "A", "rationale": "Aromatase; treat by reducing adipose tissue and using zinc or botanical aromatase inhibitors. Fat tissue contains aromatase, which converts testosterone to estrogen; addressing weight and enzyme activity is key.", "caseContext": null}, {"id": 88, "question": "In the context of Hormone Replacement Therapy (HRT) for women, what is the primary clinical reason for always prescribing Progesterone alongside Estrogen in women with an intact uterus?", "options": [{"key": "A", "text": "To improve sleep and reduce anxiety symptoms."}, {"key": "B", "text": "To prevent estrogen-induced endometrial hyperplasia and reduce the risk of uterine cancer."}, {"key": "C", "text": "To prevent the 'Pregnenolone Steal' from occurring."}, {"key": "D", "text": "To increase the absorption rate of transdermal Estrogen."}], "answer": "B", "rationale": "To prevent estrogen-induced endometrial hyperplasia and reduce the risk of uterine cancer. Progesterone opposes the proliferative effects of estrogen on the uterine lining.", "caseContext": null}, {"id": 89, "question": "Which delivery method for Estrogen (E2) is generally preferred in Functional Medicine to minimize the risk of blood clots and minimize the 'first-pass' effect on the liver?", "options": [{"key": "A", "text": "Intramuscular injections"}, {"key": "B", "text": "Transdermal (patches or creams)"}, {"key": "C", "text": "Oral tablets"}, {"key": "D", "text": "Synthetic conjugated equine estrogens"}], "answer": "B", "rationale": "Transdermal (patches or creams) Bypassing the liver reduces the thrombotic risk and maintains more stable physiological levels.", "caseContext": null}, {"id": 90, "question": "A patient exhibits signs of 'Androgen Dominance' (acne, thinning hair, PCOS). Which enzyme pathway is often up-regulated, shunting testosterone toward a more potent metabolite?", "options": [{"key": "A", "text": "The Sulfotransferase (SULT) pathway."}, {"key": "B", "text": "The CYP3A4 pathway."}, {"key": "C", "text": "The 5-alpha reductase pathway."}, {"key": "D", "text": "The Aromatase pathway."}], "answer": "C", "rationale": "The 5-alpha reductase pathway. This pathway creates Dihydrotestosterone (DHT), which has a much higher affinity for androgen receptors than testosterone. This enzyme is the target of medications like Finasteride used for hair loss.", "caseContext": null}, {"id": 91, "question": "Inthe 'PTSD' framework for hormones, why is 'Stress' such a significant disruptor of sex steroid balance?", "options": [{"key": "A", "text": "Stress directly converts Estrogen into Cortisol."}, {"key": "B", "text": "Stress causes the kidneys to excrete testosterone too rapidly."}, {"key": "C", "text": "Stress increases the production of SHBG, which destroys hormones."}, {"key": "D", "text": "High cortisol levels can inhibit GnRH, LH, and FSH secretion, leading to 'Functional Hypothalamic Amenorrhea' or low T."}], "answer": "D", "rationale": "High cortisol levels can inhibit GnRH, LH, and FSH secretion, leading to 'Functional Hypothalamic Amenorrhea' or low T. The body prioritizes the 'survival' axis (HPA
