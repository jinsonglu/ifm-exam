", "options": [{"key": "A", "text": "Weight gain around the middle"}, {"key": "B", "text": "Shakiness between meals and sugar cravings"}, {"key": "C", "text": "Night sweats and hot flashes"}, {"key": "D", "text": "Inability to hold a pupil contraction"}], "answer": "B", "rationale": "Shakiness between meals and sugar cravings Cortisol stimulates gluconeogenesis; high levels or rapid fluctuations lead to blood sugar instability and these specific symptoms.", "caseContext": null}, {"id": 83, "question": "A patient has a 'Flat-line' cortisol profile and low DHEA. You observe a positive Ragland’s sign. Which physiological failure does this sign specifically indicate?", "options": [{"key": "A", "text": "Hyper-responsiveness of the HPA axis to postural change."}, {"key": "B", "text": "Excessive sympathetic nervous system dominance."}, {"key": "C", "text": "Inability of the adrenals to maintain vascular tone against gravity."}, {"key": "D", "text": "Autoimmune destruction of the thyroid gland."}], "answer": "C", "rationale": "Inability of the adrenals to maintain vascular tone against gravity. Ragland’s sign (a drop in systolic BP upon standing) indicates the adrenals are too exhausted to provide the necessary catecholamine/cortisol support for vasoconstriction.", "caseContext": null}, {"id": 84, "question": "A 54-year-old female patient with a history of controlled hypertension and a BMI of 29 is considering BHRT. According to the IFM risk stratification model (Red, Yellow, Green), which category does she fall into, and what is the recommended delivery route?", "options": [{"key": "A", "text": "Yellow Risk; Transdermal delivery is required to bypass first-pass hepatic effects."}, {"key": "B", "text": "Red Risk; HRT is strictly contraindicated due to her BMI and blood pressure."}, {"key": "C", "text": "Yellow Risk; Pellets are the preferred method to ensure steady-state absorption."}, {"key": "D", "text": "Green Risk; Oral delivery is acceptable since her hypertension is controlled."}], "answer": "A", "rationale": "Yellow Risk; Transdermal delivery is required to bypass first-pass hepatic effects. Hypertension and elevated BMI place her in the 'Yellow' (moderate) risk category, where transdermal E2 is mandatory to avoid increasing clotting factors and CRP.", "caseContext": null}, {"id": 85, "question": "A male patient on TRT presents with a new onset of sleep apnea and an elevated Hematocrit of 54%. According to the 'Evaluating and Treating Hormonal Dysfunction in Men' lecture, what is the most likely physiological cause of this erythrocytosis?", "options": [{"key": "A", "text": "Testosterone suppresses hepcidin, increasing iron bioavailability and stimulating red blood cell production."}, {"key": "B", "text": "Testosterone directly destroys white blood cells, causing a compensatory rise in red cells."}, {"key": "C", "text": "The patient is likely taking vitamin B12 in excess while on therapy."}, {"key": "D", "text": "Aromatization of testosterone into estrogen stimulates the bone marrow."}], "answer": "A", "rationale": "Testosterone suppresses hepcidin, increasing iron bioavailability and stimulating red blood cell production. Exogenous testosterone suppresses hepcidin, which leads to increased iron absorption and a subsequent rise in hemoglobin and hematocrit.", "caseContext": null}, {"id": 86, "question": "In the 'Conditions of Estrogen Excess' lecture, which specific 'Toxin' in the PTSD model is highlighted for its ability to bind to the Estrogen Receptor Alpha (ERα) and act as a potent xenoestrogen?", "options": [{"key": "A", "text": "Glyphosate"}, {"key": "B", "text": "Bisphenol A (BPA)"}, {"key": "C", "text": "Mercury"}, {"key": "D", "text": "Mold mycotoxins"}], "answer": "B", "rationale": "Bisphenol A (BP A) BPA is a well-studied xenoestrogen that mimics estradiol and binds to estrogen receptors, contributing to functional estrogen dominance. Consider common plastic additives that are known to mimic natural hormones.", "caseContext": null}, {"id": 87, "question": "A clinician is monitoring a female patient on BHRT. Her follow-up labs show a hs-CRP that has jumped from 0.8 mg/L to 3.5 mg/L after starting therapy. What does this change indicate regarding her treatment plan?", "options": [{"key": "A", "text": "The patient has a localized infection unrelated to the hormones."}, {"key": "B", "text": "This is a normal 'healing crisis' as the body adjusts to new hormone levels."}, {"key": "C", "text": "The progesterone dose is too high and is suppressing the immune system."}, {"key": "D", "text": "The hormone therapy is likely inducing systemic inflammation and a potential pro-thrombotic state."}], "answer": "D", "rationale": "The hormone therapy is likely inducing systemic inflammation and a potential pro- thrombotic state. A significant rise in hs-CRP on HRT suggests the current dose or route is triggering an inflammatory response, increasing cardiovascular risk.", "caseContext": null}, {"id": 88, "question": "A 32-year-old female with PCOS has been following the recommended ‘low-glycemic Diet' but still has high DHT. Which Supplement specifically blocks the translocation of the Androgen Receptor to the nucleus?", "options": [{"key": "A", "text": "EGCG (Green Tea Extract)"}, {"key": "B", "text": "Probiotics"}, {"key": "C", "text": "Magnesium"}, {"key": "D", "text": "Vitamin D"}], "answer": "A", "rationale": "EGCG (Green Tea Extract) EGCG has been shown to interfere with the signaling and translocation of the androgen receptor, reducing androgenic expression.", "caseContext": null}, {"id": 89, "question": "A perimenopausal woman is experiencing 'night sweats' but her serum E2 is 150 pg/mL (normal range). Why might she still be symptomatic according to the 'Navigating Perimenopause' lecture?", "options": [{"key": "A", "text": "Serum testing is 100% inaccurate for perimenopause."}, {"key": "B", "text": "She has become completely resistant to all estrogen receptors."}, {"key": "C", "text": "Her testosterone is too high, masking the estrogen's effects."}, {"key": "D", "text": "Rapidly fluctuating levels cause a 'withdrawal' effect at the hypothalamus, even if the absolute level appears normal."}], "answer": "D", "rationale": "Rapidly fluctuating levels cause a 'withdrawal' effect at the hypothalamus, even if the absolute level appears normal. Perimenopause is characterized by erratic hormone spikes and drops; the 'crash' from a high level to a normal level can trigger symptoms.", "caseContext": null}, {"id": 90, "question": "In the Hormone Hierarchy, why is the 'Adrenal' level placed above the 'Sex Steroid' level?", "options": [{"key": "A", "text": "Because cortisol and the HPA axis must be stabilized to ensure proper sex hormone receptor sensitivity and metabolism."}, {"key": "B", "text": "Because adrenals produce more total hormones than the gonads."}, {"key": "C", "text": "Adrenals are less important in post-menopausal women."}, {"key": "D", "text": "Sex hormones are more dangerous, so they are placed higher for safety."}], "answer": "A", "rationale": "Because cortisol and the HP A axis must be stabilized to ensure proper sex hormone receptor sensitivity and metabolism. HPA dysfunction (stress) can lead to 'progesterone steal' and androgen receptor resistance, making sex hormone therapy less effective.", "caseContext": null}, {"id": 91, "question": "A patient's Dutch test shows high 5α-reductase activity (favoring the alpha-pathway). Which clinical symptom is most associated with this preference in a female patient?", "options": [{"key": "A", "text": "Chronic fatigue and low body temperature."}, {"key": "B", "text": "Weight gain specifically in the hips and thighs."}, {"key": "C", "text": "Heavy menstrual bleeding and fibroids."}, {"key": "D", "text": "Cystic acne and thinning hair on the scalp (androgenic alopecia)."}], "answer": "D", "rationale": "Cystic acne and thinning hair on the scalp (androgenic alopecia). The 5-alpha pathway creates DHT, which is much more potent at the hair follicle and sebaceous gland than testosterone.", "caseContext": null}, {"id": 92, "question": "A 60-year-old male has been on TRT for 6 months. His PSA has risen from 1.2 ng/mL to 2.5 ng/mL. According to IFM guidelines, what is the most appropriate next step?", "options": [{"key": "A", "text": "Check his estrogen levels; high E2 causes PSA to rise."}, {"key": "B", "text": "Discontinue TRT immediately and refer to urology."}, {"key": "C", "text": "Double the dose of testosterone to 'flush out' the prostate."}, {"key": "D", "text": "Ignore the rise because it is still below the 4.0 threshold."}], "answer": "B", "rationale": "Discontinue TRT immediately and refer to urology. A rise of >1.4 ng/mL in a year or a rapid doubling warrants referral to rule out prostate pathology while on therapy.", "caseContext": null}, {"id": 93, "question": "Which of the following describes the 'Phase 2' detoxification requirement for neutralizing catechol estrogens (2−OH and 4−OH)?", "options": [{"key": "A", "text": "The addition of a methyl group via the COMT enzyme."}, {"key": "B", "text": "The hydroxylation of the A-ring by CYP1A1."}, {"key": "C", "text": "The breakdown of fiber in the gut to release glucuronidates."}, {"key": "D", "text": "The addition of a sulfur group via the SULT enzyme."}], "answer": "A", "rationale": "The addition of a methyl group via the COMT enzyme. Methylation is the primary Phase 2 pathway that converts reactive catechol estrogens into stable, water-soluble methoxy- estrogens.", "caseContext": null}, {"id": 94, "question": "A 44-year-old male with central adiposity and elevated hs-CRP has a Total Testosterone of 350 ng/dL and an Estradiol (E2) of 45 pg/mL (optimal < 30). According to the 'Hormone Hierarchy,' which intervention must be prioritized before considering exogenous testosterone?", "options": [{"key": "A", "text": "Addressing insulin resistance and visceral fat to reduce aromatase activity."}, {"key": "B", "text": "Ordering a pituitary MRI to rule out a prolactinoma."}, {"key": "C", "text": "Initiating Clomiphene citrate to stimulate the pituitary gland."}, {"key": "D", "text": "Starting a low-dose Aromatase Inhibitor (AI) to lower E2 immediately."}], "answer": "A", "rationale": "Addressing insulin resistance and visceral fat to reduce aromatase activity. In the hormone hierarchy, metabolic and blood sugar stability must be addressed first because hyperinsulinemia upregulates the aromatase enzyme, which converts testosterone to estrogen.", "caseContext": null}, {"id": 95, "question": "A patient's DUTCH test shows a high level of the quinone-forming metabolite 4−OH−E1 and a very low 'Methylation Activity' ratio. Which clinical risk is specifically associated with this finding?", "options": [{"key": "A", "text": "A reduction in Sex Hormone Binding Globulin (SHBG) levels."}, {"key": "B", "text": "Heavy menstrual bleeding due to uterine fibroids."}, {"key": "C", "text": "Suppression of the thyroid gland's T4 to T3 conversion."}, {"key": "D", "text": "Direct DNA damage and the formation of depurinating adducts."}], "answer": "D", "rationale": "Direct DNA damage and the formation of depurinating adducts. 4-hydroxyestrone can easily oxidize into quinones, which react with DNA to create mutations if Phase 2 methylation is insufficient to neutralize them.", "caseContext": null}, {"id": 96, "question": "According to the 'PTSD' model for modulating hormones, which mechanism explains how high-fiber intake helps reduce the total estrogen burden?", "options": [{"key": "A", "text": "Fiber increases the liver's production of IGF-1 to balance estrogen."}, {"key": "B", "text": "Fiber stimulates the production of Pregnenolone in the mitochondria."}, {"key": "C", "text": "Fiber facilitates the excretion of conjugated estrogens and prevents their reabsorption in the gut."}, {"key": "D", "text": "Fiber directly inhibits the aromatase enzyme in adipose tissue."}], "answer": "C", "rationale": "Fiber facilitates the excretion of conjugated estrogens and prevents their reabsorption in the gut. Fiber binds to estrogens in the digestive tract, ensuring they are excreted in the stool rather than being recycled by the estrobolome.", "caseContext": null}, {"id": 97, "question": "In a male patient with 'Primary Hypogonadism,' what lab pattern would you expect to see on a standard serum panel?", "options": [{"key": "A", "text": "Low Testosterone with high LH and FSH."}, {"key": "B", "text": "Normal Testosterone with high Prolactin levels."}, {"key": "C", "text": "Low Testosterone with low or normal LH and FSH."}, {"key": "D", "text": "High Testosterone with low LH and FSH."}], "answer": "A", "rationale": "Low Testosterone with high LH and FSH. Primary hypogonadism indicates testicular failure; the pituitary responds to the low T by overproducing LH and FSH to try to stimulate the testes.", "caseContext": null}, {"id": 98, "question": "A clinician is evaluating a female patient for 'Estrogen Dominance.' Her serum E2 is low, but her 'Estrobolome' assessment shows high β-glucuronidase. How is this clinically interpreted?", "options": [{"key": "A", "text": "She is in early menopause and needs more estrogen immediately."}, {"key": "B", "text": "She has functional estrogen excess due to high reabsorption of estrogen in the gut."}, {"key": "C", "text": "Her body is successfully detoxifying all estrogens through the stool."}, {"key": "D", "text": "She has a methylation deficiency and needs B-vitamins."}], "answer": "B", "rationale": "She has functional estrogen excess due to high reabsorption of estrogen in the gut. Beta-glucuronidase 'un-couples' estrogen that the liver already neutralized, allowing it to enter the blood again and create dominance symptoms despite low output.", "caseContext": null}, {"id": 99, "question": "Which specific nutrient is a required cofactor for the COMT enzyme, which is responsible for the methylation of catechol estrogens?", "options": [{"key": "A", "text": "Magnesium"}, {"key": "B", "text": "Iodine"}, {"key": "C", "text": "Iron"}, {"key": "D", "text": "Vitamin C"}], "answer": "A", "rationale": "Magnesium COMT is a magnesium-dependent enzyme; without sufficient magnesium, Phase 2 methylation of estrogen cannot proceed effectively.", "caseContext": null}, {"id": 100, "question": "A woman on BHRT reports that her symptoms of 'hot flashes' returned after she was prescribed a high-dose glucocorticoid for an acute injury. What is the most likely biochemical reason?", "options": [{"key": "A", "text": "Glucocorticoids can decrease the sensitivity of estrogen receptors and disrupt the HPA-G axis."}, {"key": "B", "text": "Glucocorticoids convert directly into estrone (E1)."}, {"key": "C", "text": "The injury caused her to sweat more, which she confused with hot flashes."}, {"key": "D", "text": "The glucocorticoid accelerated the liver's metabolism of the HRT."}], "answer": "A", "rationale": "Glucocorticoids can decrease the sensitivity of estrogen receptors and disrupt the HP A-G axis. High cortisol (or synthetic glucocorticoids) interferes with the pulsatile release of GnRH and can cause ‘receptor resistance’ to sex steroids.", "caseContext": null}, {"id": 101, "question": "Which clinical finding, observed during a physical exam of the mouth, is considered a red flag for chronic inflammatory signaling and potential heavy metal exposure within the 'Defense and Repair' node?", "options": [{"key": "A", "text": "Enamel hypoplasia"}, {"key": "B", "text": "Geographic tongue"}, {"key": "C", "text": "Periodontal disease and mercury amalgams"}, {"key": "D", "text": "Aphthous ulcers"}], "answer": "C", "rationale": "Periodontal disease and mercury amalgams Oral health issues like periodontal disease and mercury amalgams are specific clinical indicators for systemic inflammation and toxic burden.", "caseContext": null}, {"id": 102, "question": "Why is 'Establishing Healthy Elimination' (Step 1 of the sequence) particularly vital for patients undergoing rapid weight loss?", "options": [{"key": "A", "text": "The kidneys require more protein during weight loss to prevent muscle wasting."}, {"key": "B", "text": "Lipophilic toxins stored in adipose tissue are mobilized into the blood and must be excreted to avoid 're- poisoning' the brain and organs."}, {"key": "C", "text": "Weight loss increases the activity of β-glucuronidase in the stomach."}, {"key": "D", "text": "Weight loss causes the liver to stop producing bile."}], "answer": "B", "rationale": "Lipophilic toxins stored in adipose tissue are mobilized into the blood and must be excreted to avoid 're-poisoning' the brain and organs. Adipose tissue acts as a reservoir for Persistent Organic Pollutants (POPs); rapid mobilization requires clear exit pathways (bowels/kidneys).", "caseContext": null}, {"id": 103, "question": "In the IFM 'PURE' sequencing, what is the 'Level 1' priority for a patient starting a detoxification program?", "options": [{"key": "A", "text": "Starting a 10-day water-only fast."}, {"key": "B", "text": "Inducing Phase I enzymes with high-dose botanicals."}, {"key": "C", "text": "Prescribing pharmaceutical chelators for heavy metals."}, {"key": "D", "text": "Establishing healthy elimination (bowel and kidney function)."}], "answer": "D", "rationale": "Establishing healthy elimination (bowel and kidney function). Step 1 of a safe detox is ensuring the exit routes are open to prevent the reabsorption of mobilized toxins. This step ensures that 'the drains are open’ before you start cleaning.", "caseContext": null}, {"id": 104, "question": "A patient with high exposure to aromatic hydrocarbons and a 'fast' CYP1A1 phenotype is at risk for increased DNA damage. Which Phase II pathway's induction would be most protective in neutralizing the resulting epoxide intermediates?", "options": [{"key": "A", "text": "Methylation"}, {"key": "B", "text": "Sulfation"}, {"key": "C", "text": "Acetylation"}, {"key": "D", "text": "Glutathione Conjugation"}], "answer": "D", "rationale": "Glutathione Conjugation Glutathione S-transferase (GST) is the primary enzyme responsible for neutralizing highly reactive electrophilic epoxides created by Phase | oxidation.", "caseContext": null}, {"id": 105, "question": "In the IFM 'PURE' strategy, if a patient presents with multiple chemical sensitivities (TILT) and is currently in a state of 'pathological detoxification,' which clinical action is the priority under 'Ensure a Safe Detox'?", "options": [{"key": "A", "text": "Immediate initiation of pharmaceutical chelation"}, {"key": "B", "text": "Implementing a strict water-only fast"}, {"key": "C", "text": "Providing broad-spectrum Phase II cofactors while slowing Phase I induction"}, {"key": "D", "text": "Increasing the dosage of CYP450 inducers like St. John's Wort"}], "answer": "C", "rationale": "Providing broad-spectrum Phase II cofactors while slowing Phase I induction The goal is to balance the 'bottleneck' where Phase | produces more reactive intermediates than Phase II can clear.", "caseContext": null}, {"id": 106, "question": "A practitioner suspects a patient has impaired 'methylation' due to high homocysteine levels. Which specific clinical physical exam finding would most strongly support the need for B12/Folate support in this context?", "options": [{"key": "A", "text": "Angular stomatitis"}, {"key": "B", "text": "Spoon-shaped nails (koilonychia)"}, {"key": "C", "text": "White spots on the nails (leukonychia)"}, {"key": "D", "text": "Loss of vibratory sense or beefy red tongue"}], "answer": "D", "rationale": "Loss of vibratory sense or beefy red tongue Neurological changes (vibratory sense) and glossitis are classic indicators of B12 or folate deficiency.", "caseContext": null}, {"id": 107, "question": "A patient with a history of chronic 'brain fog' and fatigue is found to have a high level of urinary 8- Hydroxy-2-deoxyguanosine (8-OHdG). In which node of the IFM Matrix should this specific finding be recorded?", "options": [{"key": "A", "text": "Communication (as a Trigger)"}, {"key": "B", "text": "Biotransformation & Elimination (as an Effect)"}, {"key": "C", "text": "Energy (as a Mediator)"}, {"key": "D", "text": "Defense & Repair (as an Antecedent)"}], "answer": "B", "rationale": "Biotransformation & Elimination (as an Effect) Markers like 8-OHdG quantify the biological 'Effect' of toxic load by measuring oxidative damage to DNA.", "caseContext": null}, {"id": 108, "question": "Which specific mineral acts as the critical cofactor for the enzyme Superoxide Dismutase (SOD2) within the mitochondria, protecting against oxidative stress during biotransformation?", "options": [{"key": "A", "text": "Zinc"}, {"key": "B", "text": "Copper"}, {"key": "C", "text": "Manganese"}, {"key": "D", "text": "Iron"}], "answer": "C", "rationale": "Manganese Manganese is the essential metal cofactor for SOD2 (MnSOD), which is located in the mitochondrial matrix. A and B are found in the cytosol.", "caseContext": null}, {"id": 109, "question": "In the 'PURE' strategy, why is the 'U' (Undernourished) addressed by checking for a 'Beefy Red Tongue' during the physical exam?", "options": [{"key": "A", "text": "It suggests a lack of dietary fiber, leading to high beta-glucuronidase activity."}, {"key": "B", "text": "It indicates a deficiency in B-vitamins like B12 and Folate, which are critical for methylation."}, {"key": "C", "text": "It is a sign of high toxicant exposure from heavy metals like Mercury."}, {"key": "D", "text": "It represents a deficiency in Vitamin C, which leads to impaired collagen synthesis."}], "answer": "B", "rationale": "It indicates a deficiency in B-vitamins like B12 and Folate, which are critical for methylation. A smooth, beefy red tongue is a classic sign of glossitis, often caused by B-vitamin deficiencies that impair Phase II pathways.", "caseContext": null}, {"id": 110, "question": "Why is 'Alkalizing the Urine' a recommended strategy during the detoxification of certain organic acid toxicants?", "options": [{"key": "A", "text": "It supports the growth of beneficial bacteria in the bladder."}, {"key": "B", "text": "It increases the solubility of heavy metals like Lead for easier excretion."}, {"key": "C", "text": "It inhibits Phase I enzymes to prevent the formation of reactive intermediates."}, {"key": "D", "text": "It prevents the reabsorption of acidic toxins in the renal tubules by keeping them in an ionized state."}], "answer": "D", "rationale": "It prevents the reabsorption of acidic toxins in the renal tubules by keeping them in an ionized state. Toxins in an ionized (charged) state are less likely to diffuse back across the kidney membranes into the blood. B is not quite correct since heavy metals often require different strategies; alkalization is specifically targeted at organic acids.", "caseContext": null}, {"id": 111, "question": "A patient with suspected mitochondrial dysfunction and exposure to organophosphate pesticides has a ‘scalloped' tongue. Which mineral is the most appropriate first-line intervention to support their ATP-dependent Phase II conjugation reactions?", "options": [{"key": "A", "text": "Copper"}, {"key": "B", "text": "Magnesium"}, {"key": "C", "text": "Molybdenum"}, {"key": "D", "text": "Selenium"}], "answer": "B", "rationale": "Magnesium This mineral is a required cofactor for over 300 enzymes and is essential for the production of ATP, which drives the energy-intensive process of conjugation.", "caseContext": null}, {"id": 112, "question": "In the IFM 'PURE' sequence, why is establishing 1-2 daily bowel movements prioritized as a 'Level 1' intervention before any mobilization of lipophilic toxins?", "options": [{"key": "A", "text": "To bypass the need for Phase II conjugation in the liver."}, {"key": "B", "text": "To prevent the de-conjugation and reabsorption of toxins via enterohepatic recirculation."}, {"key": "C", "text": "To increase the expression of Cytochrome P450 enzymes in the intestinal wall."}, {"key": "D", "text": "To ensure that inorganic mercury is converted into methylmercury for easier excretion."}], "answer": "B", "rationale": "To prevent the de-conjugation and reabsorption of toxins via enterohepatic recirculation. Healthy bowel elimination ensures that toxins conjugated by the liver and excreted in bile are removed before gut bacteria can break them down.", "caseContext": null}, {"id": 113, "question": "A 'Pathological Detoxifier' is clinically described as an individual whose biotransformation is imbalanced in which specific way?", "options": [{"key": "A", "text": "Phase II is overactive, leading to a depletion of essential amino acids."}, {"key": "B", "text": "The patient is 'Undernourished' in Phase I cofactors like Iron."}, {"key": "C", "text": "Bowel elimination is faster than hepatic conjugation."}, {"key": "D", "text": "Phase I is highly induced while Phase II is sluggish or overwhelmed."}], "answer": "D", "rationale": "Phase I is highly induced while Phase II is sluggish or overwhelmed. This imbalance leads to the rapid creation of reactive intermediates that cannot be neutralized, causing systemic inflammation and oxidative stress.", "caseContext": null}, {"id": 114, "question": "Which Phase II pathway is the only one that occurs exclusively within the mitochondria, making it highly sensitive to the 'Energy' node of the Matrix?", "options": [{"key": "A", "text": "Amino Acid Conjugation"}, {"key": "B", "text": "Glucuronidation"}, {"key": "C", "text": "Methylation"}, {"key": "D", "text": "Sulfation"}], "answer": "A", "rationale": "Amino Acid Conjugation This pathway, which conjugates xenobiotics with amino acids like glycine or taurine, takes place in the mitochondrial matrix. This pathway is responsible for processing salicylates and benzoates and is deeply tied to mitochondrial health.", "caseContext": null}, {"id": 115, "question": "During a physical exam, a practitioner finds 'petechiae' and bleeding gums. In the context of the 'U' in PURE, which nutrient deficiency should be addressed to support antioxidant recycling?", "options": [{"key": "A", "text": "Vitamin A"}, {"key": "B", "text": "Iron"}, {"key": "C", "text": "Vitamin C"}, {"key": "D", "text": "Vitamin K"}], "answer": "C", "rationale": "Vitamin C Vitamin C is essential for collagen integrity (preventing petechiae) and for recycling Vitamin E and glutathione during the detox process.", "caseContext": null}, {"id": 116, "question": "A patient has an elevated GGT and a history of exposure to Persistent Organic Pollutants (POPs). According to the 'Two-Part Hypothesis,' why does GGT increase in response to these toxins?", "options": [{"key": "A", "text": "It is needed to transport glutathione-conjugated toxins across cell membranes."}, {"key": "B", "text": "It acts as a direct antioxidant to neutralize heavy metals in the serum."}, {"key": "C", "text": "It induces the expression of metallothionein in the kidneys."}, {"key": "D", "text": "It is a marker of vitamin C deficiency in the liver."}], "answer": "A", "rationale": "It is needed to transport glutathione-conjugated toxins across cell membranes. GGT plays a critical role in the breakdown and transport of glutathione conjugates, and its rise reflects the body's effort to process the toxic load.", "caseContext": null}, {"id": 117, "question": "In the IFM model of the 'Healing Encounter,' the ingredient 'EXPLANATION' (Control) is intended to achieve which primary psychological outcome for a patient with complex chronic illness?", "options": [{"key": "A", "text": "Ensuring the patient performs the healing rituals correctly"}, {"key": "B", "text": "Replacing the need for a physical healing setting"}, {"key": "C", "text": "Enforcing strict adherence to a specific supplement regimen"}, {"key": "D", "text": "Reducing the anxiety of the 'unknown' by providing a coherent framework"}], "answer": "D", "rationale": "Reducing the anxiety of the 'unknown' by providing a coherent framework Think about how 'knowledge'’ acts as an antidote to 'fear' in a clinical setting. Providing a name and a 'why' for symptoms empowers the patient and reduces the physiological stress of uncertainty.", "caseContext": null}, {"id": 118, "question": "In the IFM Pain Matrix, 'Defense and Repair' issues like chronic inflammation can lead to 'Mito-Pain.' Which mechanism describes how mitochondrial ROS contribute to pain signaling?", "options": [{"key": "A", "text": "ROS increase the thickness of the myelin sheath"}, {"key": "B", "text": "ROS directly numb the nerve endings"}, {"key": "C", "text": "ROS prevent the brain from receiving pain signals"}, {"key": "D", "text": "ROS activate the NLRP3 inflammasome, leading to the release of IL-1beta"}], "answer": "D", "rationale": "ROS activate the NLRP3 inflammasome, leading to the release of IL-1beta Think about the 'Danger Signal’ pathways that connect mitochondrial stress to the immune system. Mitochondrial distress sends ‘danger signals' that activate inflammasomes, creating a pro-inflammatory cycle that sensitizes pain receptors.", "caseContext": null}, {"id": 119, "question": "A patient with Chronic Fatigue has an Organic Acid marker showing very high 'Suberate' and 'Adipate.' Which biochemical pathway is impaired, and what nutrient is likely needed?", "options": [{"key": "A", "text": "Ammonia detoxification; Manganese"}, {"key": "B", "text": "Carbohydrate metabolism; Chromium"}, {"key": "C", "text": "Fatty Acid Oxidation (Beta-oxidation); Riboflavin (B2)"}, {"key": "D", "text": "DNA repair; Zinc"}], "answer": "C", "rationale": "Fatty Acid Oxidation (Beta-oxidation); Riboflavin (B2) These acids appear when the 'fat-burning' furnace isn't working properly. Elevated dicarboxylic acids like suberate and adipate indicate poor fat burning, which is dependent on B2-linked enzymes.", "caseContext": null}, {"id": 120, "question": "Terry Wahls, MD, emphasizes that 'Mitochondrial Dynamics' are essential for brain health. Which lifestyle intervention in her protocol is specifically designed to stimulate 'Mitophagy' (the removal of old mitochondria)?", "options": [{"key": "A", "text": "Intermittent Fasting or Time-Restricted Eating"}, {"key": "B", "text": "Avoiding all forms of physical exercise"}, {"key": "C", "text": "Increasing intake of starchy carbohydrates"}, {"key": "D", "text": "Staying in a temperature-controlled, indoor environment"}], "answer": "A", "rationale": "Intermittent Fasting or Time-Restricted Eating Fasting triggers the cellular 'cleanup' processes that allow the body to recycle damaged mitochondria and build new ones.", "caseContext": null}, {"id": 121, "question": "Why does the IFM Bioenergetics Clinical Decision Tree list 'CPAP' (Continuous Positive Airway Pressure) as a 1º Oxidative Stress Treatment?", "options": [{"key": "A", "text": "CPAP machines provide extra antioxidants through the air filter"}, {"key": "B", "text": "CPAP directly stimulates the synthesis of CoQ10 in the lungs"}, {"key": "C", "text": "CPAP is only used if the patient's B-vitamins are normal"}, {"key": "D", "text": "Sleep apnea causes intermittent hypoxia, which is a massive trigger for ROS production"}], "answer": "D", "rationale": "Sleep apnea causes intermittent hypoxia, which is a massive trigger for ROS production The cycle of hypoxia and re-oxygenation in sleep apnea acts like a repetitive reperfusion injury, causing systemic oxidative damage.", "caseContext": null}, {"id": 122, "question": "In Robert Hedaya’s approach to Depression, what is the significance of the 'Cortisol/DHEA ratio' in the context of mitochondrial health?", "options": [{"key": "A", "text": "This ratio is only relevant for digestive health"}, {"key": "B", "text": "A high ratio indicates a catabolic state that can damage mitochondrial membranes"}, {"key": "C", "text": "A low ratio is the primary cause of mitochondrial DNA mutations"}, {"key": "D", "text": "A high ratio suggests the patient is getting too much exercise"}], "answer": "B", "rationale": "A high ratio indicates a catabolic state that can damage mitochondrial membranes Consider the balance between 'Stress/Breakdown' and 'Repair/Anabolic' hormones. Excessive cortisol relative to DHEA promotes oxidative stress and cellular breakdown, contributing to ‘Energy Suffering.’", "caseContext": null}, {"id": 123, "question": "A patient with chronic pain is prescribed a 'Modified Ketogenic Mito Food Plan.' Which of the following is the primary goal regarding the 'Mental, Emotional, and Spiritual' node?", "options": [{"key": "A", "text": "Using ketones to provide a stable, non-inflammatory fuel source for the brain to support mood regulation"}, {"key": "B", "text": "Forcing the patient to use willpower to avoid sugar"}, {"key": "C", "text": "Reducing the patient's social interactions during meal times"}, {"key": "D", "text": "Eliminating the need for any form of psychotherapy"}], "answer": "A", "rationale": "Using ketones to provide a stable, non-inflammatory fuel source for the brain to support mood regulation Stabilizing brain energy is a foundation for psychological resilience and managing the 'Center of the Matrix.' Think of ketones as 'clean-burning fuel’ for the organ that controls mood.", "caseContext": null}, {"id": 124, "question": "In the IFM Bioenergetics Decision Tree, if a patient presents with elevated 8-OHdG and low glutathione, which intervention is categorized as a 1º Oxidative Stress treatment specifically to support 'Inductive' antioxidant defense?", "options": [{"key": "A", "text": "Sulforaphane-glucosinolate (SGS)"}, {"key": "B", "text": "Creatine Monohydrate"}, {"key": "C", "text": "Intravenous Glutathione"}, {"key": "D", "text": "High-dose Vitamin E"}], "answer": "A", "rationale": "Sulforaphane-glucosinolate (SGS) This compound is derived from cruciferous vegetables and communicates with the Nrf2 transcription factor to increase endogenous antioxidant production.", "caseContext": null}, {"id": 125, "question": "Which specific Matrix node is a practitioner addressing when they investigate a patient's 'Glymphatic flow' and 'Capillary integrity' to improve mitochondrial nutrient delivery?", "options": [{"key": "A", "text": "Communication"}, {"key": "B", "text": "Assimilation"}, {"key": "C", "text": "Transport"}, {"key": "D", "text": "Defense and Repair"}], "answer": "C", "rationale": "Transport The Transport node encompasses the movement of nutrients, oxygen, and waste through the vascular, lymphatic, and glymphatic systems.", "caseContext": null}, {"id": 126, "question": "According to the Mito Food Plan, what is the primary clinical objective of recommending 'Anti-inflammatory Fats' like EPA and DHA for mitochondrial health?", "options": [{"key": "A", "text": "To block the absorption of fat-soluble toxins"}, {"key": "B", "text": "To provide a direct source of glucose for the brain"}, {"key": "C", "text": "To increase the production of Superoxide"}, {"key": "D", "text": "To improve the fluidity and structural integrity of the mitochondrial membrane"}], "answer": "D", "rationale": "To improve the fluidity and structural integrity of the mitochondrial membrane The mitochondrial inner membrane requires specific phospholipids and fatty acids to maintain the proper environment for the Electron Transport Chain.", "caseContext": null}, {"id": 127, "question": "A patient with neurodegeneration is advised to use 'Hormetic Therapies.' Which of the following is an example of a 'Mitochondrial Hormetic' intervention that triggers biogenesis of mitochondria?", "options": [{"key": "A", "text": "Taking high-dose antioxidants before exercise"}, {"key": "B", "text": "Continuous use of an electric heating pad"}, {"key": "C", "text": "Cryotherapy or cold plunges"}, {"key": "D", "text": "Strict bed rest"}], "answer": "C", "rationale": "Cryotherapy or cold plunges Cold stress is a hormetic trigger that can upregulate PGC-1alpha, the master regulator of mitochondrial biogenesis.", "caseContext": null}, {"id": 128, "question": "Which enzyme complex in the Citric Acid Cycle is highly sensitive to Arsenic and Mercury, causing a block that leads to elevated Pyruvate and Lactate?", "options": [{"key": "A", "text": "Pyruvate Dehydrogenase (PDH)"}, {"key": "B", "text": "Cytochrome C Oxidase"}, {"key": "C", "text": "ATP Synthase"}, {"key": "D", "text": "Succinate Dehydrogenase"}], "answer": "A", "rationale": "Pyruvate Dehydrogenase (PDH) The PDH complex is extremely sensitive to heavy metals which bind to the lipoic acid cofactor, effectively 'starving' the Krebs cycle. This complex converts the end-product of glycolysis into Acetyl-CoA.", "caseContext": null}, {"id": 129, "question": "When Robert Hedaya, MD, discusses 'Bio-energetics' in the context of Depression, which lab finding would most strongly suggest that an 'Energy' imbalance is contributing to the patient's psychiatric symptoms?", "options": [{"key": "A", "text": "High LDL cholesterol"}, {"key": "B", "text": "Low serum Sodium"}, {"key": "C", "text": "Elevated urinary Lactate/Pyruvate ratio"}, {"key": "D", "text": "Normal serum Glucose"}], "answer": "C", "rationale": "Elevated urinary Lactate/Pyruvate ratio An elevated ratio suggests a shift toward anaerobic metabolism and mitochondrial inefficiency, which can manifest as low brain energy and depression.", "caseContext": null}, {"id": 130, "question": "Which nutrient, found in the 'Mito Food Plan' as a key component of the 'Mito-Protective' group, serves as the central atom in the Heme molecule within Cytochromes?", "options": [{"key": "A", "text": "Manganese"}, {"key": "B", "text": "Magnesium"}, {"key": "C", "text": "Zinc"}, {"key": "D", "text": "Iron"}], "answer": "D", "rationale": "Iron lron is the center of the heme group in cytochromes; however, the module warns it must be balanced due to its potential for toxicity in excess.", "caseContext": null}, {"id": 131, "question": "A patient following the 'Modified Ketogenic' Mito Food Plan is struggling with fatigue. Which 'Transport' supplement might be added to help ferry long-chain fatty acids into the mitochondria for oxidation?", "options": [{"key": "A", "text": "L-Carnitine"}, {"key": "B", "text": "Vitamin K2"}, {"key": "C", "text": "CoQ10"}, {"key": "D", "text": "Alpha-Lipoic Acid"}], "answer": "A", "rationale": "L-Carnitine Carnitine is the 'shuttle' required to move long-chain fatty acids across the mitochondrial membrane to be used for energy.", "caseContext": null}, {"id": 132, "question": "A patient following the Mito Food Plan is struggling with severe fatigue and exercise intolerance. According to the 'Mitochondropathy Therapies' guide, which specific nutrient should be considered to bypass Complex III of the Electron Transport Chain?", "options": [{"key": "A", "text": "High-dose Coenzyme Q10 (Ubiquinol)"}, {"key": "B", "text": "L-Carnitine and Acetyl-L-Carnitine"}, {"key": "C", "text": "Vitamin K2 (as MK-7) in combination with Vitamin C"}, {"key": "D", "text": "Alpha-Lipoic Acid (ALA) and Selenium"}], "answer": "C", "rationale": "Vitamin K2 (as MK-7) in combination with Vitamin C Vitamin K2, specifically when used with Vitamin C, has the unique clinical application of being able to bypass a block or dysfunction at Complex Ill. Case Study 1 — Answer Key", "caseContext": null}, {"id": 133, "question": "Linda’s high FSH (45) and irregular cycles are classic indicators of:", "options": [{"key": "A", "text": "Primary Hypothyroidism"}, {"key": "B", "text": "The Perimenopausal transition"}, {"key": "C", "text": "Polycystic Ovary Syndrome (PCOS)"}], "answer": "B", "rationale": "The Perimenopausal transition High FSH (>30-40) is diagnostic of perimenopause/menopause.", "caseContext": "Case Study 1: The \"Anxious\" Executive (Sex Hormones & Bioenergetics). Questions\n133-146\nPatient Profile: Linda, a 49-year-old high-level attorney.\nChief Concern: \"Panic attacks,\" night sweats, and \"crushing\" insomnia.\nHistory: Linda had regular cycles until 6 months ago; now they are 45-60 days apart. She uses a copper IUD for\ncontraception. She drinks 2 large cups of coffee in the morning and 2 glasses of Chardonnay at night to \"wind\ndown.\"\nPhysical Exam: BP 135/85. Mild thinning of hair at the crown. Notable \"palmar erythema\" (redness of the palms).\nLABS\nFSH: 45 mIU/mL (High)\nEstradiol: 40 pg/mL (Low-normal for day 3)  ·  Progesterone (Day 21): 1.5 ng/mL (Very low)\nFerritin: 180 ng/mL (High-normal)\nRBC Magnesium: 3.8 mg/dL (Low)"}, {"id": 134, "question": "Linda's \"Panic attacks\" and night sweats during perimenopause are primarily driven by:", "options": [{"key": "A", "text": "Rapid fluctuations and eventual decline in Estradiol"}, {"key": "B", "text": "High Testosterone levels"}, {"key": "C", "text": "Iron deficiency"}], "answer": "A", "rationale": "Rapid fluctuations and eventual decline in Estradiol Estrogen withdrawal/fluctuation causes \"Vasomotor Symptoms\" (VMS).", "caseContext": null}, {"id": 135, "question": "Linda's Day 21 Progesterone is 1.5 ng/mL. This suggests:", "options": [{"key": "A", "text": "Normal ovulation"}, {"key": "B", "text": "Anovulatory cycle"}, {"key": "C", "text": "Excessive adrenal output"}], "answer": "B", "rationale": "Anovulatory cycle Progesterone <3-5 on Day 21 usually indicates an anovulatory cycle.", "caseContext": null}, {"id": 136, "question": "In the \"Communication\" node, the \"Relative Estrogen Dominance\" (normal estrogen but very low progesterone) can exacerbate which symptom?", "options": [{"key": "A", "text": "Hair loss"}, {"key": "B", "text": "Anxiety and sleep disruption"}, {"key": "C", "text": "Dry skin"}], "answer": "B", "rationale": "Anxiety and sleep disruption Progesterone is a precursor to Allopregnanolone, which calms the brain via GABA.", "caseContext": null}, {"id": 137, "question": "Linda’s nightly wine (Alcohol) acts as a Mediator that impairs which node's ability to clear estrogen?", "options": [{"key": "A", "text": "Biotransformation"}, {"key": "B", "text": "Transport"}, {"key": "C", "text": "Energy"}], "answer": "A", "rationale": "Biotransformation Alcohol competes for liver detox pathways, slowing estrogen clearance.", "caseContext": null}, {"id": 138, "question": "The \"palmar erythema\" noted on physical exam is a clinical sign often associated with:", "options": [{"key": "A", "text": "High levels of circulating estrogens or liver stress"}, {"key": "B", "text": "Vitamin D deficiency"}, {"key": "C", "text": "Magnesium toxicity"}], "answer": "A", "rationale": "High levels of circulating estrogens or liver stress Palmar erythema is a \"Liver Sign\" often seen in high-estrogen states.", "caseContext": null}, {"id": 139, "question": "Linda’s low RBC Magnesium (3.8) is a significant factor in her anxiety because Magnesium:", "options": [{"key": "A", "text": "Competes with calcium for entry into neurons, acting as a \"calming\" agent"}, {"key": "B", "text": "Increases cortisol production"}, {"key": "C", "text": "Inhibits the production of serotonin"}], "answer": "A", "rationale": "Competes with calcium for entry into neurons, acting as a \"calming\" agent Magnesium is a natural \"NMDA receptor\" blocker (calming).", "caseContext": null}, {"id": 140, "question": "Which botanical is an \"Adaptogen\" that can support Linda’s HPA axis while also providing \"Phytoestrogenic\" support for her night sweats?", "options": [{"key": "A", "text": "Rhodiola"}, {"key": "B", "text": "Black Cohosh or Pueraria lobata (Kudzu)"}, {"key": "C", "text": "Ginkgo Biloba"}], "answer": "B", "rationale": "Black Cohosh or Pueraria lobata (Kudzu) These are specific phytoestrogens/adaptogens used for VMS.", "caseContext": null}, {"id": 141, "question": "In the \"Bioenergetics\" node, Linda’s insomnia leads to a failure of \"Mitochondrial quality control.\" The IFM- recommended intervention for this is:", "options": [{"key": "A", "text": "High-dose caffeine in the morning"}, {"key": "B", "text": "Improving \"Sleep Hygiene\" and Melatonin support"}, {"key": "C", "text": "Increasing late-night protein intake"}], "answer": "B", "rationale": "Improving \"Sleep Hygiene\" and Melatonin support Sleep is the primary \"restorer\" for mitochondrial health (Energy)", "caseContext": null}, {"id": 142, "question": "Linda’s copper IUD, combined with her high-normal Ferritin, should prompt a clinician to consider \"Oxidative Stress\" in which Matrix node?", "options": [{"key": "A", "text": "Defense and Repair"}, {"key": "B", "text": "Structural Integrity"}, {"key": "C", "text": "Assimilation"}], "answer": "A", "rationale": "Defense and Repair Copper and Iron are \"Pro-oxidants\" that drive inflammation (Defense & Repair).", "caseContext": null}, {"id": 143, "question": "Using the \"Hormone Hierarchy,\" what should be addressed before or alongside starting Hormone Replacement Therapy (HRT) for Linda?", "options": [{"key": "A", "text": "HPA Axis (Stress) and Insulin/Glucose balance"}, {"key": "B", "text": "Heavy metal chelation"}, {"key": "C", "text": "Colonoscopy"}], "answer": "A", "rationale": "HP A Axis (Stress) and Insulin/Glucose balance The \"Hormone Hierarchy\" puts HPA/Insulin at the base of the pyramid.", "caseContext": null}, {"id": 144, "question": "Linda is interested in HRT. According to the Sex Hormone module, the \"Gold Standard\" for safety in a woman with a uterus is:", "options": [{"key": "A", "text": "Oral conjugated equine estrogens (CEE) alone"}, {"key": "B", "text": "Transdermal Estradiol and Micronized Progesterone"}, {"key": "C", "text": "Synthetic Progestins and injectable estrogen"}], "answer": "B", "rationale": "Transdermal Estradiol and Micronized Progesterone This combination (Bio-identical) has the best safety profile for CVD/Breast cancer.", "caseContext": null}, {"id": 145, "question": "Linda's hair thinning at the crown may indicate \"Androgen dominance\" or the peripheral conversion of testosterone to:", "options": [{"key": "A", "text": "Estriol"}, {"key": "B", "text": "Dihydrotestosterone (DHT)"}, {"key": "C", "text": "Cortisol"}], "answer": "B", "rationale": "Dihydrotestosterone (DHT) 5-alpha reductase converts testosterone to the more potent DHT (hair loss).", "caseContext": null}, {"id": 146, "question": "Which \"Mito Food Plan\" component would most help Linda’s \"Brain Fog\" and anxiety?", "options": [{"key": "A", "text": "Increasing refined grain intake"}, {"key": "B", "text": "Therapeutic fats (Omega-3s, MCTs) and high phytonutrient density"}, {"key": "C", "text": "Reducing all fat intake to <10%"}], "answer": "B", "rationale": "Therapeutic fats (Omega-3s, MCTs) and high phytonutrient density The Mito plan uses high-quality fats for neurological support. Case Study 2 — Answer Key", "caseContext": null}, {"id": 147, "question": "The acanthosis nigricans and TG:HDL ratio are clinical indicators of dysfunction in which node?", "options": [{"key": "A", "text": "Transport"}, {"key": "B", "text": "Cardiometabolic / Communication"}, {"key": "C", "text": "Structural Integrity"}], "answer": "B", "rationale": "Cardiometabolic / Communication Acanthosis nigricans and high TG:HDL are classic for insulin resistance (Communication/Cardiometabolic).", "caseContext": "Case Study 2: The Post-Viral Metabolic Syndrome Questions 147-160\nPatient Profile: David, a 52-year-old software architect, presents with profound brain fog, significant post-prandial\n\"crashing\" (extreme fatigue after meals), and generalized joint stiffness. These symptoms began acutely following a\nsevere viral infection 12 months ago. He reports a \"new baseline\" of low energy and has gained 15 lbs since the\nillness, primarily around his midsection. He also notes occasional palpitations and night sweats.\nPHYSICAL EXAM\nAnthropometrics: Waist circumference: 42\";\nBMI: 31;\nBP: 145/95 (Stage 2 Hypertension).\nClinical Indicators: Acanthosis nigricans noted on the posterior neck; skin tags on axilla; mild thyroid enlargement\n(Goiter Grade 1) without palpable nodules.\nLABS\nCardiometabolic: Fasting Insulin: 22 uIU/mL (High); TG:HDL Ratio: 4.5 (High); HbA1c: 5.8% (Prediabetes).\nImmune/Inflammation: Hs-CRP: 3.4 mg/L (High vascular risk);\nTPO Antibodies: 85 IU/mL (High).\nHormone: TSH: 3.1 mIU/L; Free T4: 1.1 ng/dL; Free T3: 2.3 pg/mL (Low-normal)."}, {"id": 148, "question": "Based on David’s labs (high TPO, high hs-CRP, and high Insulin), which order of intervention follows the Hormone Hierarchy?", "options": [{"key": "A", "text": "Address Glycemic Control and Adrenal status first"}, {"key": "B", "text": "Start T4 monotherapy immediately to address the weight gain"}, {"key": "C", "text": "Prescribe a statin to lower the TG:HDL ratio"}], "answer": "A", "rationale": "Address Glycemic Control and Adrenal status first Hormone Hierarchy: HPA and Glycemic control are the foundation", "caseContext": null}, {"id": 149, "question": "David’s joint stiffness and history of post-viral onset suggest the virus acted as a:", "options": [{"key": "A", "text": "Genetic Antecedent"}, {"key": "B", "text": "Triggering Event"}, {"key": "C", "text": "Modifiable Lifestyle Factor"}], "answer": "B", "rationale": "Triggering Event The viral infection was the acute event that set the current pathology in motion.", "caseContext": null}, {"id": 150, "question": "Which dietary strategy is most indicated to address both his elevated hs-CRP and his insulin resistance?", "options": [{"key": "A", "text": "High-protein Paleo with unlimited red meat"}, {"key": "B", "text": "Cardiometabolic Food Plan"}, {"key": "C", "text": "Standard American Diet with a caloric deficit"}], "answer": "B", "rationale": "Cardiometabolic Food Plan The Cardiometabolic Food Plan is designed for these specific biomarkers.", "caseContext": null}, {"id": 151, "question": "The \"Defense and Repair\" node is likely being fueled by David's visceral adiposity via:", "options": [{"key": "A", "text": "Increased production of anti-inflammatory cytokines"}, {"key": "B", "text": "Secretion of pro-inflammatory adipokines re the body down-regulates metabolism during stress/illness.", "caseContext": null}, {"id": 155, "question": "The high TG:HDL ratio (4.5) specifically increases David’s risk for:", "options": [{"key": "A", "text": "Large, buoyant LDL particles"}, {"key": "B", "text": "Small, dense LDL and atherosclerosis"}, {"key": "C", "text": "Hypercalcemia"}], "answer": "B", "rationale": "Small, dense LDL and atherosclerosis A high TG:HDL ratio is the most reliable surrogate marker for Pattern B (Small Dense LDL), which is highly atherogenic compared to large, buoyant Pattern A LDL.", "caseContext": null}, {"id": 156, "question": "To support David's \"Biotransformation\" node (Liver), which nutrient is critical for Phase 2 conjugation of toxins?", "options": [{"key": "A", "text": "Glycine and Sulfur-containing amino acids"}, {"key": "B", "text": "Simple glucose"}, {"key": "C", "text": "Saturated fats"}], "answer": "A", "rationale": "Glycine and Sulfur-containing amino acids Phase 2 Biotransformation requires specific amino acid conjugates (Glycine, Taurine, Glutamine) and sulfur donors to neutralize reactive intermediates from Phase 1.", "caseContext": null}, {"id": 157, "question": "According to the GI Clinical Decision Tree, if David also reports bloating, what should be ruled out first?", "options": [{"key": "A", "text": "Food allergies/sensitivities"}, {"key": "B", "text": "SIBO or Dysbiosis"}, {"key": "C", "text": "Low hydrochloric acid"}], "answer": "B", "rationale": "SIBO or Dysbiosis The Gut Microbiota node is a primary consideration in post-viral cases, as infections can alter the migrating motor complex (MMC), predisposing the patient to SIBO.", "caseContext": null}, {"id": 158, "question": "David’s high insulin (22) acts as a \"Mediator\" that:", "options": [{"key": "A", "text": "Decreases systemic inflammation"}, {"key": "B", "text": "Increases sodium retention and activates the Sympathetic Nervous System"}, {"key": "C", "text": "Lowers blood pressure"}], "answer": "B     const STORAGE_KEY_ANSWERS = 'ifm_exam3_answers';
    const STORAGE_KEY_SUBMITTED = 'ifm_exam3_submitted_groups';
    const STORAGE_KEY_VOCAB = 'ifm_vocab_list';
    const STORAGE_KEY_THEME = 'ifm_theme';

    let userAnswers = JSON.parse(localStorage.getItem(STORAGE_KEY_ANSWERS) || '{}');
    let submittedGroups = JSON.parse(localStorage.getItem(STORAGE_KEY_SUBMITTED) || '{}');
    let vocabList = JSON.parse(localStorage.getItem(STORAGE_KEY_VOCAB) || '[]');
    let currentBatch = 1;
    const batchSize = 20;
    const totalBatches = 8;

    function speakWord(word) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(word);
      const voices = window.speechSynthesis.getVoices();
      const naturalVoice = voices.find(v => (v.name.includes("Samantha") || v.name.includes("Ava") || v.name.includes("Jenny") || v.name.includes("Natural")) && v.lang.startsWith("en")) || voices.find(v => v.lang === "en-US");
      if (naturalVoice) utter.voice = naturalVoice;
      utter.lang = 'en-US';
      utter.rate = 0.88;
      window.speechSynthesis.speak(utter);
    }
    if ('speechSynthesis' in window) window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();

    function init() {
      applyTheme();
      renderBatchBar();
      renderQuestions();
      updateBadges();
      setupSelectionTooltip();
    }

    function switchView(viewName) {
      document.getElementById('view-exam').style.display = viewName === 'exam' ? 'block' : 'none';
      document.getElementById('view-vocab').style.display = viewName === 'vocab' ? 'block' : 'none';
      document.getElementById('view-wrong').style.display = viewName === 'wrong' ? 'block' : 'none';

      document.getElementById('tab-exam').className = 'nav-btn' + (viewName === 'exam' ? ' active' : '');
      document.getElementById('tab-vocab').className = 'nav-btn' + (viewName === 'vocab' ? ' active' : '');
      document.getElementById('tab-wrong').className = 'nav-btn' + (viewName === 'wrong' ? ' active' : '');

      if (viewName === 'vocab') renderVocabList();
      if (viewName === 'wrong') renderWrongList();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderBatchBar() {
      const container = document.getElementById('batch-grid');
      let html = '';
      let totalAnsweredAll = Object.keys(userAnswers).length;

      for (let i = 1; i <= totalBatches; i++) {
        const start = (i - 1) * batchSize + 1;
        const end = i * batchSize;
        
        let answeredInGroup = 0;
        let correctInGroup = 0;
        for (let qid = start; qid <= end; qid++) {
          if (userAnswers[qid]) answeredInGroup++;
          const q = ALL_QUESTIONS[qid - 1];
          if (q && userAnswers[qid] === q.answer) correctInGroup++;
        }

        const isSub = !!submittedGroups[i];
        let subText = `${answeredInGroup}/20 题`;
        if (isSub) {
          subText = `${correctInGroup}/20 正确 ✅`;
        }

        html += `
          <button class="batch-btn ${i === currentBatch ? 'active' : ''}" onclick="switchBatch(${i})">
            <span>${start}–${end} 题</span>
            <span class="batch-sub">${subText}</span>
          </button>
        `;
      }
      container.innerHTML = html;
      document.getElementById('exam-overall-stats').innerText = `总进度：${totalAnsweredAll} / 160 题已答`;
      document.getElementById('current-group-num').innerText = currentBatch;

      const isCurrentSub = !!submittedGroups[currentBatch];
      const btnSubmit = document.getElementById('btn-group-submit');
      if (isCurrentSub) {
        btnSubmit.innerText = '🔄 重新核对本组';
      } else {
        btnSubmit.innerText = '📝 交卷核对本组';
      }
    }

    function switchBatch(batchNum) {
      currentBatch = batchNum;
      renderBatchBar();
      renderQuestions();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function nextGroup() {
      if (currentBatch < totalBatches) {
        switchBatch(currentBatch + 1);
      } else {
        showToast('已经是最后一组了！建议切换到【错题深度复盘】进行汇总！');
      }
    }

    function renderQuestions() {
      const container = document.getElementById('questions-container');
      const startIdx = (currentBatch - 1) * batchSize;
      const batchList = ALL_QUESTIONS.slice(startIdx, startIdx + batchSize);
      const isSub = !!submittedGroups[currentBatch];

      let html = '';

      batchList.forEach(q => {
        const uAns = userAnswers[q.id];

        if (q.caseContext) {
          html += `
            <div class="case-card">
              <h3>📋 综合临床案例背景</h3>
              <pre>${q.caseContext}</pre>
            </div>
          `;
        }

        html += `
          <div class="card" id="q-card-${q.id}">
            <div class="q-meta">
              <span class="q-badge">QUESTION ${q.id} OF 160</span>
              <span>IFM Practice Exam 3</span>
            </div>
            <div class="question-stem">${q.question}</div>
            <div class="options">
              ${q.options.map(opt => {
                let optClass = 'option-label';
                if (isSub) {
                  if (opt.key === q.answer) optClass += ' is-correct';
                  else if (uAns === opt.key && uAns !== q.answer) optClass += ' is-wrong';
                }
                return `
                  <label class="${optClass}" id="opt-label-${q.id}-${opt.key}">
                    <input type="radio" name="q-${q.id}" value="${opt.key}" 
                      ${uAns === opt.key ? 'checked' : ''} 
                      onchange="selectAnswer(${q.id}, '${opt.key}')">
                    <span><span class="opt-key">${opt.key}.</span>${opt.text}</span>
                  </label>
                `;
              }).join('')}
            </div>
            <div class="explanation" id="exp-${q.id}" style="display: ${isSub ? 'block' : 'none'};">
              <div class="exp-row"><span class="exp-tag">🎯 正确答案:</span> <strong>${q.answer}</strong></div>
              <div class="exp-row"><span class="exp-tag">🔬 IFM 官方临床解析:</span> ${q.rationale || '详见 IFM 教材核心讲义解析'}</div>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    function selectAnswer(qid, val) {
      userAnswers[qid] = val;
      localStorage.setItem(STORAGE_KEY_ANSWERS, JSON.stringify(userAnswers));
      renderBatchBar();
      updateBadges();
    }

    function submitCurrentGroup() {
      const start = (currentBatch - 1) * batchSize + 1;
      const end = currentBatch * batchSize;
      
      let answeredCount = 0;
      let correctCount = 0;

      for (let qid = start; qid <= end; qid++) {
        if (userAnswers[qid]) answeredCount++;
        const q = ALL_QUESTIONS[qid - 1];
        if (q && userAnswers[qid] === q.answer) correctCount++;
      }

      submittedGroups[currentBatch] = true;
      localStorage.setItem(STORAGE_KEY_SUBMITTED, JSON.stringify(submittedGroups));

      renderBatchBar();
      renderQuestions();
      updateBadges();

      showToast(`第 ${currentBatch} 组核对完毕！答对 ${correctCount} / ${batchSize} 题（得分率 ${Math.round(correctCount / batchSize * 100)}%）`);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    let currentSelectedText = '';
    function setupSelectionTooltip() {
      const tooltip = document.getElementById('selection-tooltip');

      document.addEventListener('mouseup', function(e) {
        if (e.target.closest('#selection-tooltip')) return;

        const sel = window.getSelection();
        const text = sel.toString().trim();

        if (text && text.length > 1 && text.length < 50 && /^[a-zA-Z\s\-]+$/.test(text)) {
          currentSelectedText = text;
          const cleanKey = text.toLowerCase();
          const dictEntry = MEDICAL_DICT[cleanKey] || {};

          document.getElementById('tt-word').innerText = text;
          document.getElementById('tt-ipa').innerText = dictEntry.ipa || '';
          document.getElementById('tt-cn').innerText = dictEntry.cn || '点击收录或发音';

          const range = sel.getRangeAt(0);
          const rect = range.getBoundingClientRect();
          
          tooltip.style.left = (rect.left + rect.width / 2 + window.scrollX) + 'px';
          tooltip.style.top = (rect.top + window.scrollY) + 'px';
          tooltip.style.display = 'block';
        } else {
          tooltip.style.display = 'none';
        }
      });
    }

    function playSelectedWord(e) {
      e.stopPropagation();
      if (currentSelectedText) speakWord(currentSelectedText);
    }

    function saveSelectedWord(e) {
      e.stopPropagation();
      if (!currentSelectedText) return;
      const cleanKey = currentSelectedText.toLowerCase();
      const dictEntry = MEDICAL_DICT[cleanKey] || {};

      if (!vocabList.some(v => v.word.toLowerCase() === cleanKey)) {
        vocabList.unshift({
          word: currentSelectedText,
          ipa: dictEntry.ipa || '',
          cn: dictEntry.cn || '',
          time: new Date().toLocaleDateString()
        });
        localStorage.setItem(STORAGE_KEY_VOCAB, JSON.stringify(vocabList));
        updateBadges();
        showToast(`已成功收录: ${currentSelectedText} 到生词本！`);
      } else {
        showToast(`该词已在生词本中`);
      }
      document.getElementById('selection-tooltip').style.display = 'none';
    }

    function renderVocabList() {
      const tbody = document.getElementById('vocab-table-body');
      if (vocabList.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding: 2.5rem; color: var(--text-muted);">生词本为空。在答题过程中用鼠标选中任何英文生词，即可划词发音并收录！</td></tr>`;
        return;
      }
      tbody.innerHTML = vocabList.map((item, idx) => `
        <tr>
          <td><strong>${item.word}</strong></td>
          <td style="color: #8b5cf6; font-family: monospace;">${item.ipa || '-'}</td>
          <td>${item.cn || '<span style="color:var(--text-muted);">自行记忆</span>'}</td>
          <td style="text-align: center;">
            <button class="btn-icon" onclick="speakWord('${item.word}')" title="播放真人自然发音">🔊</button>
          </td>
          <td style="text-align: center;">
            <button class="btn-icon" onclick="deleteVocab(${idx})" title="删除" style="color: var(--danger);">🗑️</button>
          </td>
        </tr>
      `).join('');
    }

    function deleteVocab(idx) {
      vocabList.splice(idx, 1);
      localStorage.setItem(STORAGE_KEY_VOCAB, JSON.stringify(vocabList));
      renderVocabList();
      updateBadges();
      showToast('已从生词本移除');
    }

    function clearVocab() {
      if (confirm('确定要清空全部生词本吗？')) {
        vocabList = [];
        localStorage.setItem(STORAGE_KEY_VOCAB, JSON.stringify(vocabList));
        renderVocabList();
        updateBadges();
        showToast('生词本已清空');
      }
    }

    function copyVocabMarkdown() {
      if (vocabList.length === 0) return showToast('生词本为空！');
      let md = '| 单词 (Word) | 国际音标 (IPA) | 功能医学专业释义 |\n|---|---|---|\n';
      vocabList.forEach(v => {
        md += `| ${v.word} | ${v.ipa} | ${v.cn} |\n`;
      });
      navigator.clipboard.writeText(md).then(() => showToast('已成功复制 Markdown 表格到剪贴板！可直接粘贴至 Obsidian！'));
    }

    function exportVocabTSV() {
      if (vocabList.length === 0) return showToast('生词本为空！');
      let tsv = '';
      vocabList.forEach(v => {
        tsv += `${v.word}\t${v.ipa}\t${v.cn}\n`;
      });
      navigator.clipboard.writeText(tsv).then(() => showToast('已成功复制 TSV 到剪贴板！可直接粘贴导入 Anki！'));
    }

    function renderWrongList() {
      const container = document.getElementById('wrong-list-container');
      const wrongQuestions = [];

      ALL_QUESTIONS.forEach(q => {
        const groupNum = Math.ceil(q.id / batchSize);
        if (submittedGroups[groupNum]) {
          const uAns = userAnswers[q.id];
          if (uAns && uAns !== q.answer) {
            wrongQuestions.push({ question: q, userAns: uAns });
          }
        }
      });

      if (wrongQuestions.length === 0) {
        container.innerHTML = `
          <div class="card" style="text-align: center; padding: 3rem; color: var(--text-muted);">
            🎉 暂无错题记录！请先在【英文真题】中作答并点击【交卷核对】，系统会自动抓取全部错题！
          </div>
        `;
        return;
      }

      container.innerHTML = wrongQuestions.map(w => `
        <div class="wrong-item">
          <div class="wrong-header">
            <span style="color: var(--danger);">QUESTION ${w.question.id} (第 ${Math.ceil(w.question.id / batchSize)} 组)</span>
            <span>IFM Practice Exam 3</span>
          </div>
          <div class="wrong-stem">${w.question.question}</div>
          <div class="wrong-choice-grid">
            <div class="my-choice">❌ 我的选择: ${w.userAns}</div>
            <div class="correct-choice">✅ 正确答案: ${w.question.answer}</div>
          </div>
          <div class="explanation" style="display:block; margin-top: 0.6rem;">
            <div class="exp-row"><span class="exp-tag">🔬 机制深度剖析:</span> ${w.question.rationale}</div>
          </div>
        </div>
      `).join('');
    }

    function getWrongList() {
      const wrongQuestions = [];
      ALL_QUESTIONS.forEach(q => {
        const groupNum = Math.ceil(q.id / batchSize);
        if (submittedGroups[groupNum]) {
          const uAns = userAnswers[q.id];
          if (uAns && uAns !== q.answer) {
            wrongQuestions.push({ q: q, uAns: uAns });
          }
        }
      });
      return wrongQuestions;
    }

    function copyWrongForNotebookLM() {
      const wrongQuestions = getWrongList();
      if (wrongQuestions.length === 0) return showToast('目前暂无已批改出的错题！');

      let text = `【请基于已上传的 IFM 官方讲义、教材与课程 Transcript 检索并回答】\n\n`;
      text += `我在进行 IFM Practice Exam 3 模考时做错了以下题目。请检索知识库中对应的 APM 模块（GI, Detox, Hormone, Energy, Immune, Cardiometabolic, Neuro/Matrix/GOTOIT）及课程音频文字稿：\n\n`;
      text += `1. **知识点与模块定位**：指出每道题涉及的核心模块、讲义章节或专家观点；\n`;
      text += `2. **错选辨析与机制深剖**：对照【我的错误选择】与【官方正确答案】，用讲义中的生理/生化机理解释我为什么会混淆，并引用讲义依据；\n`;
      text += `3. **临床要点总结**：提炼该知识点在 IFM 认证考试中的必背临床诊断与干预原则。\n\n`;
      text += `### 错题明细清单：\n\n`;

      wrongQuestions.forEach((item, index) => {
        text += `#### 错题 ${index + 1} (Question ${item.q.id})\n`;
        text += `**英文题干**: ${item.q.question}\n`;
        text += `**选项列表**:\n`;
        item.q.options.forEach(opt => {
          text += `  - ${opt.key}. ${opt.text}\n`;
        });
        text += `**我的错误选择**: ❌ ${item.uAns}\n`;
        text += `**官方正确答案**: ✅ ${item.q.answer}\n`;
        text += `**官方临床解析**: ${item.q.rationale}\n\n`;
      });

      navigator.clipboard.writeText(text).then(() => {
        showToast('已复制【NotebookLM 专属提问指令】！直接粘贴到 NotebookLM 对话框即可！');
      });
    }

    function copyWrongForAI() {
      const wrongQuestions = getWrongList();
      if (wrongQuestions.length === 0) return showToast('目前暂无已批改出的错题！');

      let promptText = `## IFM 备考专项深度复盘与二次变式出题\n\n`;
      promptText += `我在做 IFM Practice Exam 3 时出现以下错题。请调取我的 IFM 课程笔记与讲义，针对每道错题帮我做两件事：\n`;
      promptText += `1. **核心病理生理机制剖析**：分析我为什么容易选错【我的选项】，正解【正确选项】在功能医学矩阵（Matrix）或生化通路上的根本逻辑是什么；\n`;
      promptText += `2. **反向变式出题（二次盲测）**：针对该考点，出 2 道新的英文临床案例长题（附 4 个选项与解析），测试我是否彻底掌握。\n\n`;
      promptText += `### 错题明细清单：\n\n`;

      wrongQuestions.forEach((item, index) => {
        promptText += `#### 错题 ${index + 1} (Question ${item.q.id})\n`;
        promptText += `- **英文原题**: ${item.q.question}\n`;
        promptText += `- **我的错误选择**: ${item.uAns}\n`;
        promptText += `- **官方正确答案**: ${item.q.answer}\n`;
        promptText += `- **官方参考解析**: ${item.q.rationale}\n\n`;
      });

      navigator.clipboard.writeText(promptText).then(() => {
        showToast('已成功复制变式出题 Prompt！请直接粘贴至 Gemini / Claude 对话框！');
      });
    }

    function copyWrongAsNote() {
      const wrongQuestions = getWrongList();
      if (wrongQuestions.length === 0) return showToast('目前暂无已批改出的错题！');

      let text = `# IFM Practice Exam 3 错题复盘笔记\n\n`;
      text += `> 收录日期: ${new Date().toLocaleDateString()} | 错题总数: ${wrongQuestions.length} 题\n\n`;
      text += `---\n\n`;

      wrongQuestions.forEach((item, index) => {
        text += `### Q${item.q.id}. ${item.q.question}\n\n`;
        item.q.options.forEach(opt => {
          let mark = '  ';
          if (opt.key === item.q.answer) mark = '✅ ';
          else if (opt.key === item.uAns) mark = '❌ ';
          text += `- ${mark}${opt.key}. ${opt.text}\n`;
        });
        text += `\n**我的错选**: ${item.uAns} | **标准答案**: ${item.q.answer}\n\n`;
        text += `**官方临床机制解析 (Rationale)**:\n${item.q.rationale}\n\n`;
        text += `---\n\n`;
      });

      navigator.clipboard.writeText(text).then(() => {
        showToast('已复制【Markdown 错题笔记源】！可在 NotebookLM 点击“添加笔记”直接粘贴！');
      });
    }

    function updateBadges() {
      document.getElementById('vocab-count').innerText = vocabList.length;
      
      let wrongCount = 0;
      ALL_QUESTIONS.forEach(q => {
        const groupNum = Math.ceil(q.id / batchSize);
        if (submittedGroups[groupNum] && userAnswers[q.id] && userAnswers[q.id] !== q.answer) {
          wrongCount++;
        }
      });
      document.getElementById('wrong-count').innerText = wrongCount;
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 3200);
    }

    function applyTheme() {
      const th = localStorage.getItem(STORAGE_KEY_THEME) || 'light';
      if (th === 'dark') document.body.classList.add('dark-mode');
      else document.body.classList.remove('dark-mode');
    }
    function toggleTheme() {
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      localStorage.setItem(STORAGE_KEY_THEME, isDark ? 'dark' : 'light');
    }

    window.onload = init;
  </script>
</body>
</html>
