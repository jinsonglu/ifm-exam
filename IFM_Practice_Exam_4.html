strogen faster."}, {"key": "B", "text": "It acts as a precursor to progesterone production in the adrenals."}, {"key": "C", "text": "It inhibits the COMT enzyme to prolong the effect of healthy estrogens."}, {"key": "D", "text": "It has anti-androgenic properties that can lower free testosterone levels in women with PCOS."}], "answer": "D", "rationale": "It has anti-androgenic properties that can lower free testosterone levels in women with PCOS. Clinical trials have shown that spearmint tea can lower androgen levels and improve hirsutism in women.", "caseContext": null}, {"id": 85, "question": "Which specific physiological 'trigger' causes the 'Window of Opportunity' to close, making late-start HRT (15+ years post-menopause) risky?", "options": [{"key": "A", "text": "A permanent shift in the liver's production of SHBG."}, {"key": "B", "text": "The total depletion of the primordial follicle pool in the ovaries."}, {"key": "C", "text": "The transition of the vascular endothelium from a 'healthy' state to one with established, unstable plaque."}, {"key": "D", "text": "The down-regulation of Estrogen Receptor Beta (ERβ) in the brain."}], "answer": "C", "rationale": "The transition of the vascular endothelium from a 'healthy' state to one with established, unstable plaque. Estrogen is protective to healthy vessels but can promote inflammation and matrix metalloproteinase activity in diseased vessels. As women age and/or there is an estrogen deficiency, the vasoprotective effects of estrogen diminish.", "caseContext": null}, {"id": 86, "question": "In the 'Hormone Hierarchy,' what is the primary reason the 'Insulin' level must be addressed before the 'Sex Steroid' level?", "options": [{"key": "A", "text": "Insulin prevents the liver from metabolizing progesterone"}, {"key": "B", "text": "Sex hormones cannot bind to receptors in the absence of insulin"}, {"key": "C", "text": "Insulin is the precursor molecule to all steroid hormones"}, {"key": "D", "text": "High insulin up-regulates aromatase and down-regulates SHBG"}], "answer": "D", "rationale": "High insulin up-regulates aromatase and down-regulates SHBG Insulin directly alters the availability and conversion of sex hormones, making TRT or HRT ineffective or 'messy' if insulin is high.", "caseContext": null}, {"id": 87, "question": "Which 'Toxin' is specifically categorized as a 'Metallooestrogen' because it mimics estrogen at the receptor level without being a steroid?", "options": [{"key": "A", "text": "Phthalates"}, {"key": "B", "text": "Cadmium"}, {"key": "C", "text": "Glyphosate"}, {"key": "D", "text": "BPA (Bisphenol A)"}], "answer": "B", "rationale": "Cadmium Cadmium is a heavy metal (found in cigarettes and some foods) that can bind and activate estrogen receptor alpha.", "caseContext": null}, {"id": 88, "question": "According to the 'Navigating Perimenopause' lecture, why is the 'withdrawal' of estrogen sometimes more clinically significant than the absolute level of estrogen?", "options": [{"key": "A", "text": "Withdrawal prevents the liver from producing albumin"}, {"key": "B", "text": "Withdrawal increases the risk of bone fractures more than low levels"}, {"key": "C", "text": "Fluctuating levels destabilize the thermoregulatory center in the hypothalamus"}, {"key": "D", "text": "Only withdrawal can cause endometrial thickening"}], "answer": "C", "rationale": "Fluctuating levels destabilize the thermoregulatory center in the hypothalamus The hypothalamus reacts to the change in estrogen levels, which is why 'hot flashes' occur even when E2 labs appear normal.", "caseContext": null}, {"id": 89, "question": "A male patient presents with 'Low T' symptoms, but his labs show normal Total Testosterone and very high SHBG. According to the Hormone Hierarchy, which underlying issue should be investigated as a primary driver of elevated SHBG?", "options": [{"key": "A", "text": "Liver dysfunction or hyperthyroidism"}, {"key": "B", "text": "Vitamin D deficiency"}, {"key": "C", "text": "Excessive intake of dietary fiber"}, {"key": "D", "text": "Hyperinsulinemia"}], "answer": "A", "rationale": "Liver dysfunction or hyperthyroidism SHBG is produced in the liver and is significantly increased by thyroid hormone excess or liver stress, effectively lowering the bioavailable free testosterone.", "caseContext": null}, {"id": 90, "question": "When addressing Phase 1 estrogen metabolism, the '2:16' ratio is a key biomarker. Which specific clinical risk increases when the 16alpha-OH-E1 pathway dominates?", "options": [{"key": "A", "text": "Rapid clearance of estrogen leading to withdrawal symptoms"}, {"key": "B", "text": "Increased risk of proliferative conditions like breast cysts and heavy menses"}, {"key": "C", "text": "Suppression of the HPA axis"}, {"key": "D", "text": "Increased risk of osteoporosis due to low estrogenic activity"}], "answer": "B", "rationale": "Increased risk of proliferative conditions like breast cysts and heavy menses The 16-alpha-hydroxy pathway produces a potent, long-acting estrogen that strongly stimulates tissue growth.", "caseContext": null}, {"id": 91, "question": "A woman on BHRT has a Dutch test showing low COMT activity and high levels of catechol estrogens (2-OH and 4-OH). Which specific nutrient, besides Magnesium, is the universal methyl donor required for this Phase 2 step?", "options": [{"key": "A", "text": "S-Adenosylmethionine (SAMe)"}, {"key": "B", "text": "Alpha-Lipoic Acid"}, {"key": "C", "text": "Vitamin C"}, {"key": "D", "text": "Vitamin A"}], "answer": "A", "rationale": "S-Adenosylmethionine (SAMe) SAMe is the primary methyl group donor that COMT utilizes to convert reactive catechols into stable methoxyestrogens.", "caseContext": null}, {"id": 92, "question": "How does chronic 'Sleep' deprivation specifically increase the risk of Estrogen Dominance?", "options": [{"key": "A", "text": "Inhibition of the gallbladder"}, {"key": "B", "text": "Increased production of SHBG"}, {"key": "C", "text": "Direct stimulation of the CYP1B1 enzyme"}, {"key": "D", "text": "Reduction in melatonin, which normally acts as a natural aromatase inhibitor"}], "answer": "D", "rationale": "Reduction in melatonin, which normally acts as a natural aromatase inhibitor Melatonin is shown to modulate the aromatase enzyme, so its absence leads to higher conversion of androgens to estrogens. It is a hormonal 'nightly' antioxidant that influences how we convert testosterone to estrogen.", "caseContext": null}, {"id": 93, "question": "In the 'Evaluating Men' lecture, why is a high 'Ferritin' level considered a 'Red Flag' before starting TRT?", "options": [{"key": "A", "text": "High ferritin indicates a 'Phase 3' clearance bottleneck"}, {"key": "B", "text": "Iron overload can cause oxidative damage to the pituitary, leading to secondary hypogonadism"}, {"key": "C", "text": "Iron directly competes with testosterone for binding on SHBG"}, {"key": "D", "text": "It suggests the patient is at high risk for prostate cancer"}], "answer": "B", "rationale": "Iron overload can cause oxidative damage to the pituitary, leading to secondary hypogonadism Hemochromatosis is a classic cause of secondary hypogonadism, and adding TRT without addressing iron can worsen systemic oxidation.", "caseContext": null}, {"id": 94, "question": "A 50-year-old woman is placed in the 'Yellow Risk' category for HRT due to a BMI of 32 and mild metabolic syndrome. Why is 'Transdermal Estradiol' mandatory for this patient?", "options": [{"key": "A", "text": "It prevents the conversion of estradiol into estrone"}, {"key": "B", "text": "It is the only way to ensure the 'Window of Opportunity' remains open"}, {"key": "C", "text": "It avoids stimulating hepatic production of clotting factors and CRP"}, {"key": "D", "text": "It provides higher systemic levels than oral dosing"}], "answer": "C", "rationale": "It avoids stimulating hepatic production of clotting factors and CRP Transdermal delivery bypasses the liver's 'first-pass,' preventing the increase in inflammatory markers and thrombosis risk associated with oral estrogen.", "caseContext": null}, {"id": 95, "question": "A DUTCH test shows a patient has high 4-OH-E1 and high levels of '8-OHdG.' What does the presence of 8- OHdG signify in this clinical context?", "options": [{"key": "A", "text": "A deficiency in Phase 3 gut clearance"}, {"key": "B", "text": "Active oxidative stress and DNA damage, likely from catechol estrogen quinones"}, {"key": "C", "text": "Optimal methylation capacity"}, {"key": "D", "text": "High progesterone receptor sensitivity"}], "answer": "B", "rationale": "Active oxidative stress and DNA damage, likely from catechol estrogen quinones 8-OHdG (8-hydroxy-2'-deoxyguanosine) is a biomarker that measures the level of oxidative damage specifically to the guanine bases of DNA, often resulting when 4-OH estrogens are not methylated and become reactive.", "caseContext": null}, {"id": 96, "question": "According to the 'Navigating Perimenopause' lecture, why is 'Cyclic' Progesterone (days 14-28) often used even if a woman is still having regular periods?", "options": [{"key": "A", "text": "To suppress FSH and stop the transition to menopause"}, {"key": "B", "text": "To induce a heavy bleed and clear out fibroids"}, {"key": "C", "text": "To compensate for the 'Anovulatory' cycles common in perimenopause where a corpus luteum is not formed"}, {"key": "D", "text": "To lower insulin levels and prevent weight gain"}], "answer": "C", "rationale": "To compensate for the 'Anovulatory' cycles common in perimenopause where a corpus luteum is not formed In perimenopause, a woman may bleed but not ovulate, leading to an absence of the natural progesterone 'peak' in the second half of the month.", "caseContext": null}, {"id": 97, "question": "Which specific 'Toxin' is known to interfere with the 'StAR' protein, thereby blocking the rate-limiting step of testosterone production in the testes?", "options": [{"key": "A", "text": "Mycotoxins"}, {"key": "B", "text": "Glyphosate"}, {"key": "C", "text": "Phthalates"}, {"key": "D", "text": "Fluoride"}], "answer": "C", "rationale": "Phthalates Phthalates are well-documented endocrine disruptors that specifically target the StAR protein in Leydig cells, inhibiting the entry of cholesterol into the mitochondria.", "caseContext": null}, {"id": 98, "question": "A patient's DUTCH test shows high 4-OH-E1 and a low Methylation Activity ratio. Which specific combination of supplements best addresses both the toxic metabolite production and the bottleneck in clearance?", "options": [{"key": "A", "text": "N-Acetyl Cysteine and Magnesium"}, {"key": "B", "text": "DIM and I3C"}, {"key": "C", "text": "Calcium D-Glucarate and Fiber"}, {"key": "D", "text": "Saw Palmetto and Zinc"}], "answer": "A", "rationale": "N-Acetyl Cysteine and Magnesium NAC helps neutralize reactive quinones formed from 4-OH, while Magnesium is a critical cofactor for the COMT enzyme to drive methylation.", "caseContext": null}, {"id": 99, "question": "A male patient has high Total Testosterone but a very high SHBG. Which condition is a common metabolic driver for this elevated 'capture' protein?", "options": [{"key": "A", "text": "High intake of saturated fats"}, {"key": "B", "text": "Hyperinsulinemia"}, {"key": "C", "text": "Vitamin D deficiency"}, {"key": "D", "text": "Liver dysfunction or hyperthyroidism"}], "answer": "D", "rationale": "Liver dysfunction or hyperthyroidism The liver produces SHBG, and its production is stimulated by thyroid hormone and inhibited by insulin.", "caseContext": null}, {"id": 100, "question": "A male patient presents with Low T and high levels of Phthalates in his 'Toxins' (PTSD) assessment. What is the mechanism of this endocrine disruption?", "options": [{"key": "A", "text": "They convert Testosterone into Progesterone."}, {"key": "B", "text": "They act as anti-androgens by blocking the androgen receptor."}, {"key": "C", "text": "They stimulate the StAR protein to overproduce cortisol."}, {"key": "D", "text": "They increase the production of LH from the pituitary."}], "answer": "B", "rationale": "They act as anti-androgens by blocking the androgen receptor. Phthalates are known to interfere with testosterone synthesis and block receptor sites, mimicking a deficiency state.", "caseContext": null}, {"id": 101, "question": "Which physical exam finding is specifically associated with marginal Zinc status?", "options": [{"key": "A", "text": "Spoon-shaped nails (koilonychia)"}, {"key": "B", "text": "Angular stomatitis"}, {"key": "C", "text": "Leukonychia (white spots on nails)"}, {"key": "D", "text": "Burton’s lines"}], "answer": "C", "rationale": "Leukonychia (white spots on nails) Leukonychia is listed alongside a positive zinc taste test and dermatitis as a clinical indicator of low zinc.", "caseContext": null}, {"id": 102, "question": "Which mineral is required for the function of all Cytochrome P450 (CYP450) enzymes?", "options": [{"key": "A", "text": "Iron"}, {"key": "B", "text": "Selenium"}, {"key": "C", "text": "Zinc"}, {"key": "D", "text": "Magnesium"}], "answer": "A", "rationale": "Iron The module explicitly states that iron is required for all CYP450 enzymes, which metabolize about 75% of drugs.", "caseContext": null}, {"id": 103, "question": "In a patient with a 'Sluggish' Phase II Glucuronidation pathway, which dietary intervention would be most targeted to inhibit the enzyme beta-glucuronidase in the gut?", "options": [{"key": "A", "text": "Increasing dietary intake of soluble fiber only"}, {"key": "B", "text": "Supplementation with Calcium D-glucarate"}, {"key": "C", "text": "Increased intake of Sulforaphane from broccoli sprouts"}, {"key": "D", "text": "High doses of N-acetylcysteine"}], "answer": "B", "rationale": "Supplementation with Calcium D-glucarate Calcium D-glucarate metabolizes into compounds that inhibit beta-glucuronidase, preventing the 'un-pairing' of toxins in the gut. It is derived from a substance found in apples, grapefruit, and cruciferous vegetables that directly blocks 'de- conjugation'.", "caseContext": null}, {"id": 104, "question": "Which nutrient is a critical cofactor for the enzyme Sulfotransferase (SULT) and is often depleted by high doses of acetaminophen?", "options": [{"key": "A", "text": "Vitamin B12"}, {"key": "B", "text": "Vitamin K"}, {"key": "C", "text": "Magnesium"}, {"key": "D", "text": "Sulfate or Sulfur-containing amino acids"}], "answer": "D", "rationale": "Sulfate or Sulfur-containing amino acids Sulfation (Phase II) requires inorganic sulfate, often derived from cysteine and methionine, which is depleted by acetaminophen metabolism.", "caseContext": null}, {"id": 105, "question": "Which specific mechanism explains why lipophilic toxins like organochlorine pesticides are particularly hazardous during rapid weight loss?", "options": [{"key": "A", "text": "Weight loss reduces the availability of bile acids needed for toxin excretion."}, {"key": "B", "text": "Adipose tissue acts as a temporary reservoir, and rapid mobilization increases the 'unbound' systemic toxic load."}, {"key": "C", "text": "Rapid fat loss causes an immediate down-regulation of Phase II enzymes."}, {"key": "D", "text": "Lipophilic toxins are converted into water-soluble pro-carcinogens within the adipose tissue."}], "answer": "B", "rationale": "Adipose tissue acts as a temporary reservoir, and rapid mobilization increases the 'unbound' systemic toxic load. When fat is burned, the lipophilic toxins stored within are released into the bloodstream, potentially overwhelming the liver's biotransformation capacity.", "caseContext": null}, {"id": 106, "question": "A patient is found to have elevated urinary 8-hydroxy-2'-deoxyguanosine (8-OHdG). What does this specific biomarker indicate regarding the patient's toxic burden?", "options": [{"key": "A", "text": "Inhibition of the Methylation pathway by heavy metals"}, {"key": "B", "text": "A deficiency in the Amino Acid Conjugation pathway"}, {"key": "C", "text": "Oxidative damage to DNA caused by environmental stressors"}, {"key": "D", "text": "Acute exposure to organophosphate pesticides"}], "answer": "C", "rationale": "Oxidative damage to DNA caused by environmental stressors 8-OHdG is a widely used biomarker for assessing systemic oxidative stress and DNA base damage, often induced by toxins.", "caseContext": null}, {"id": 107, "question": "Which of the following nutrients is considered a 'Methyl donor' that can help support the detoxification of arsenic and estrogens?", "options": [{"key": "A", "text": "Magnesium"}, {"key": "B", "text": "Selenium"}, {"key": "C", "text": "Vitamin C"}, {"key": "D", "text": "Trimethylglycine (Betaine)"}], "answer": "D", "rationale": "Trimethylglycine (Betaine) Betaine (TMG) provides methyl groups to the methionine cycle, supporting the production of SAMe for detoxification.", "caseContext": null}, {"id": 108, "question": "In the IFM model, why is the 'Medical Symptom Questionnaire' (MSQ) used repeatedly throughout a detoxification program?", "options": [{"key": "A", "text": "To determine which specific Phase I enzymes are up-regulated."}, {"key": "B", "text": "To bill the insurance company for a higher level of complexity."}, {"key": "C", "text": "To provide a definitive diagnosis of heavy metal poisoning."}, {"key": "D", "text": "To track the 'total symptom burden' and the clinical response to the intervention over time."}], "answer": "D", "rationale": "To track the 'total symptom burden' and the clinical response to the intervention over time. The MSQ allows the practitioner to quantify improvements in multi-system symptoms as the toxic load is reduced.", "caseContext": null}, {"id": 109, "question": "Which of the following is the most appropriate 'first step' when a practitioner suspects a patient is highly toxic but also severely undernourished?", "options": [{"key": "A", "text": "Focus on nutrient repletion and phytonutrient support to build 'detox capacity' first."}, {"key": "B", "text": "Initiate a zero-calorie water fast to force the toxins out of adipose tissue."}, {"key": "C", "text": "Immediately start a high-dose heavy metal chelation protocol."}, {"key": "D", "text": "Order a 24-hour provoked urine test to identify the specific toxins."}], "answer": "A", "rationale": "Focus on nutrient repletion and phytonutrient support to build 'detox capacity' first. The PURE model prioritizes 'Undernourished' first to ensure the liver and gut have the necessary tools for safe biotransformation.", "caseContext": null}, {"id": 110, "question": "A patient presents with a dark blue line along the margin of the gums. This physical finding, known as a 'Burton line,' is a classic indicator of which toxic exposure?", "options": [{"key": "A", "text": "Cadmium"}, {"key": "B", "text": "Arsenic"}, {"key": "C", "text": "Mercury"}, {"key": "D", "text": "Lead"}], "answer": "D", "rationale": "Lead A lead line (Burton line) is a clinical sign of chronic lead poisoning caused by a reaction between circulating lead and bacteria in the mouth. This metal is also associated with 'Basophilic Stippling' on a blood smear. Mercury toxicity often causes tremors or emotional changes but does not typically manifest as a blue gingival line.", "caseContext": null}, {"id": 111, "question": "What is the primary purpose of the 'Elimination Diet' in an environmental health clinical plan?", "options": [{"key": "A", "text": "To ensure the patient is only eating 'green' foods for chelation."}, {"key": "B", "text": "To bypass the need for any Phase II conjugation enzymes."}, {"key": "C", "text": "To reduce the total caloric intake for weight loss."}, {"key": "D", "text": "To identify food-based triggers and reduce the 'total load' on the immune and detox systems."}], "answer": "D", "rationale": "To identify food-based triggers and reduce the 'total load' on the immune and detox systems. Removing common allergens and processed foods helps lower inflammation, allowing the liver to focus on processing environmental toxins.", "caseContext": null}, {"id": 112, "question": "Which of these is a simple lifestyle recommendation to 'Reduce Exposure' to endocrine-disrupting phthalates?", "options": [{"key": "A", "text": "Using old, scratched non-stick pans for all cooking."}, {"key": "B", "text": "Eating only charbroiled meats instead of boiled meats."}, {"key": "C", "text": "Switching from plastic water bottles to glass or stainless steel."}, {"key": "D", "text": "Increasing the use of scented air fresheners in the home."}], "answer": "C", "rationale": "Switching from plastic water bottles to glass or stainless steel. Phthalates are plasticizers that can leach into water and food, especially when heated or stored in soft plastics.", "caseContext": null}, {"id": 113, "question": "If Gamma-Glutamyl Transpeptidase (GGT) is found in the 'high-normal' range (e.g., 25-35 U/L), what is the functional medicine interpretation?", "options": [{"key": "A", "text": "It is a sign of acute viral hepatitis."}, {"key": "B", "text": "It is perfectly healthy as long as it is below the lab's upper limit."}, {"key": "C", "text": "It suggests the patient is drinking too much water."}, {"key": "D", "text": "It may indicate an early depletion of glutathione due to environmental toxic load."}], "answer": "D", "rationale": "It may indicate an early depletion of glutathione due to environmental toxic load. Higher GGT levels, even within the lab's normal range, are associated with increased oxidative stress and exposure to pollutants. Consider GGT as a 'smoke alarm' for glutathione turnover.", "caseContext": null}, {"id": 114, "question": "Which Phase II pathway is most dependent on the availability of the amino acid Glycine?", "options": [{"key": "A", "text": "Amino Acid Conjugation"}, {"key": "B", "text": "Glucuronidation"}, {"key": "C", "text": "Sulfoxidation"}, {"key": "D", "text": "Methylation"}], "answer": "A", "rationale": "Amino Acid Conjugation Glycine is the most common amino acid used in this pathway to conjugate organic acids and certain drugs for excretion.", "caseContext": null}, {"id": 115, "question": "A patient who is 'Highly Sensitive' to perfumes, cleaning products, and exhaust fumes is demonstrating a pattern most consistent with:", "options": [{"key": "A", "text": "A simple case of seasonal hay fever."}, {"key": "B", "text": "Toxicant-Induced Loss of Tolerance."}, {"key": "C", "text": "Type 1 IgE-mediated allergy."}, {"key": "D", "text": "A deficiency in Vitamin D."}], "answer": "B", "rationale": "Toxicant-Induced Loss of Tolerance. TILT describes the phenomenon where a person becomes symptomatic from very low levels of diverse environmental chemicals.", "caseContext": null}, {"id": 116, "question": "Which of the following describes the role of fiber (such as that found in the 'Detox Food Plan') in environmental health?", "options": [{"key": "A", "text": "Fiber directly kills the bacteria that produce beta-glucuronidase."}, {"key": "B", "text": "Fiber acts as a 'trap' to bind toxins in the gut and prevent their reabsorption."}, {"key": "C", "text": "Fiber speeds up Phase I oxidation reactions."}, {"key": "D", "text": "Fiber is the primary cofactor for the CYP450 enzymes."}], "answer": "B", "rationale": "Fiber acts as a 'trap' to bind toxins in the gut and prevent their reabsorption. Fiber binds to bile acids and toxins that the liver has dumped into the intestines, ensuring they leave the body.", "caseContext": null}, {"id": 117, "question": "Which biomarker is categorized as a measure of 'Damaged Proteins' in the evaluation of oxidative stress?", "options": [{"key": "A", "text": "3-Nitrotyrosine"}, {"key": "B", "text": "F2 Isoprostanes"}, {"key": "C", "text": "Hemoglobin A1c"}, {"key": "D", "text": "8-OH Deoxyguanosine"}], "answer": "A", "rationale": "3-Nitrotyrosine This marker specifically reflects the nitration of protein residues, indicating damage caused by reactive nitrogen species (RNS).", "caseContext": null}, {"id": 118, "question": "Which 'Hormetic Therapy' utilizes environmental stressors to induce mitochondrial biogenesis and resilience?", "options": [{"key": "A", "text": "Cold and Heat exposure"}, {"key": "B", "text": "Oral Phosphatidylcholine"}, {"key": "C", "text": "Intranasal Glutathione"}, {"key": "D", "text": "High-dose Vitamin C IV"}], "answer": "A", "rationale": "Cold and Heat exposure Temperature extremes (thermogenesis) are listed as hormetic therapies that challenge mitochondria to improve efficiency and density.", "caseContext": null}, {"id": 119, "question": "What is the recommended dosage range for Phosphatidylcholine (PC) when used for '1º Oral Lipid Support' of mitochondrial membranes?", "options": [{"key": "A", "text": "50 – 500 milligrams per day"}, {"key": "B", "text": "1 – 10 grams per day"}, {"key": "C", "text": "10 – 20 grams per day"}, {"key": "D", "text": "400 – 1000 IU per day"}], "answer": "B", "rationale": "1 – 10 grams per day The module specifies 1–10g as the therapeutic window for oral lipid replacement to restore membrane integrity.", "caseContext": null}, {"id": 120, "question": "Which master regulator is induced by phytochemicals like sulforaphane and curcumin to activate the 'Antioxidant Response Element' (ARE)?", "options": [{"key": "A", "text": "mTOR"}, {"key": "B", "text": "NRF-2"}, {"key": "C", "text": "NF-kB"}, {"key": "D", "text": "HIF-1alpha"}], "answer": "B", "rationale": "NRF-2 NRF-2 is the master transcription factor that, when activated by phytochemicals, enters the nucleus to turn on antioxidant and detox genes. HIF-1alpha responds specifically to low oxygen (hypoxia) rather than being the general regulator of the antioxidant response.", "caseContext": null}, {"id": 121, "question": "In the 'Four Ingredients of a Healing Encounter,' why is providing an 'EXPLANATION' for a patient's symptoms considered therapeutic?", "options": [{"key": "A", "text": "It establishes the practitioner's intellectual superiority."}, {"key": "B", "text": "It creates an 'Emotionally Charged Relationship'."}, {"key": "C", "text": "It provides the patient with a sense of 'Control' over their situation."}, {"key": "D", "text": "It ensures the patient will comply with the 'Ritual' of treatment."}], "answer": "C", "rationale": "It provides the patient with a sense of 'Control' over their situation. Understanding the 'why' behind symptoms reduces the fear of the unknown, which is a major component of the healing process. This is the antidote to learned helplessness.", "caseContext": null}, {"id": 122, "question": "According to the IFM Bioenergetics Clinical Decision Tree, which secondary (2º) metabolism diagnostic test should be considered specifically to evaluate cellular redox potential if primary interventions are insufficient?", "options": [{"key": "A", "text": "Thyroid Stimulating Hormone (TSH)"}, {"key": "B", "text": "Complete Blood Count (CBC)"}, {"key": "C", "text": "Lactate-to-Pyruvate (L:P) ratio"}, {"key": "D", "text": "Homocysteine levels"}], "answer": "C", "rationale": "Lactate-to-Pyruvate (L:P) ratio The L:P ratio is listed as a 2º Metabolism Diagnostic used to assess mitochondrial redox status and the efficiency of the NAD+/NADH balance. This test looks at the balance between the end- product of glycolysis and its reduced counterpart.", "caseContext": null}, {"id": 123, "question": "The module describes a 'feed-forward cycle' of oxidative stress. Which of the following is identified as a trigger that specifically increases Nitric Oxide (NO) and subsequent cellular damage?", "options": [{"key": "A", "text": "Caloric Excess"}, {"key": "B", "text": "Increased HRV (Heart Rate Variability)"}, {"key": "C", "text": "Elevated Magnesium intake"}, {"key": "D", "text": "High Dietary Fiber"}], "answer": "A", "rationale": "Caloric Excess Caloric excess is explicitly listed as a cause of increased oxidative stress and NO production, fueling the damaging feed- forward cycle.", "caseContext": null}, {"id": 124, "question": "When supporting mitochondrial biogenesis through 'Hormetic Therapies,' which combination of environmental factors is most emphasized in the module's diagrams?", "options": [{"key": "A", "text": "Radiation, Xenobiotics, and Mycotoxins"}, {"key": "B", "text": "Stretching, Massage, and Ultrasound"}, {"key": "C", "text": "Glucose, Fructose, and Galactose"}, {"key": "D", "text": "Cold, Heat, Light, and Oxygen"}], "answer": "D", "rationale": "Cold, Heat, Light, and Oxygen The four 'Bio-hacking' elements", "caseContext": null}, {"id": 125, "question": "In the IFM Fatigue Matrix, which clinical indicator of 'Energy' dysregulation is specifically associated with Statin use?", "options": [{"key": "A", "text": "Hyperglycemia"}, {"key": "B", "text": "Iron Deficiency Anemia"}, {"key": "C", "text": "Vitamin B12 deficiency"}, {"key": "D", "text": "CoQ10 deficiency"}], "answer": "D", "rationale": "CoQ10 deficiency Statins inhibit the HMG-CoA reductase pathway, which is the same pathway responsible for the endogenous synthesis of Coenzyme Q10.", "caseContext": null}, {"id": 126, "question": "Which set of cofactors is specifically required by the enzyme Catalase to neutralize Hydrogen Peroxide?", "options": [{"key": "A", "text": "Iron (Fe)"}, {"key": "B", "text": "Selenium (Se)"}, {"key": "C", "text": "Zinc (Zn) and Copper (Cu)"}, {"key": "D", "text": "Manganese (Mn)"}], "answer": "A", "rationale": "Iron (Fe) The module identifies Iron as the primary metallic cofactor required for Catalase activity to convert H2O2 into water and oxygen.", "caseContext": null}, {"id": 127, "question": "A patient with suspected 'Secondary Mitochondrial Dysfunction' presents with neurodegenerative symptoms. Which clinical indicator under the 'Neurologic' section of the decision tree would justify a referral for Neuro- Psych testing?", "options": [{"key": "A", "text": "Peripheral Neuropathy alone"}, {"key": "B", "text": "Cognitive Decline and Depression"}, {"key": "C", "text": "History of Sleep Apnea"}, {"key": "D", "text": "Tachycardia and POTS"}], "answer": "B", "rationale": "Cognitive Decline and Depression The decision tree specifically lists depression, neurodegeneration, and cognitive decline as indicators for advanced Neuro- Psych questionnaires and testing.", "caseContext": null}, {"id": 128, "question": "According to the Module 8 clinical considerations for Chronic Pain, how does 'Learned Helplessness' impact the Bioenergetics matrix?", "options": [{"key": "A", "text": "It acts as a Mental/Emotional mediator under the 'Retelling the Patient's Story' section, potentially perpetuating energy failure."}, {"key": "B", "text": "It causes the over-expression of Heme Biosynthesis enzymes."}, {"key": "C", "text": "It directly inhibits Complex IV of the Electron Transport Chain via cortisol spikes."}, {"key": "D", "text": "It is a primary 'Triggering Event' like head trauma or infection."}], "answer": "A", "rationale": "It acts as a Mental/Emotional mediator under the 'Retelling the Patient's Story' section, potentially perpetuating energy failure. Learned helplessness is listed as a Mental/Emotional factor that can act as a mediator or perpetuator of clinical imbalances in the Fatigue Matrix.", "caseContext": null}, {"id": 129, "question": "Which specific biochemical 'feed-forward cycle' is triggered by caloric excess, leading to increased Nitric Oxide (NO) and subsequent mitochondrial damage?", "options": [{"key": "A", "text": "The Methionine Cycle"}, {"key": "B", "text": "The Citric Acid Cycle"}, {"key": "C", "text": "The Urea Cycle"}, {"key": "D", "text": "Oxidative Stress cycle"}], "answer": "D", "rationale": "Oxidative Stress cycle Caloric excess is identified as a primary trigger that increases oxidative stress, which in turn boosts NO and TNF-alpha, perpetuating a damaging cycle. B is not correct since the Citric Acid Cycle is the productive metabolic pathway for ATP; while it uses calories, it is not the damaging 'feed-forward' cycle described in the context of caloric excess.", "caseContext": null}, {"id": 130, "question": "According to the IFM Bioenergetics Clinical Decision Tree, which biomarker is used to assess 'Damaged Sugars' within the 1º Oxidative Stress diagnostics?", "options": [{"key": "A", "text": "3-nitrotyrosine"}, {"key": "B", "text": "F2 Isoprostanes"}, {"key": "C", "text": "HgbA1c and AGEs"}, {"key": "D", "text": "8-OH deoxyguanosine"}], "answer": "C", "rationale": "HgbA1c and AGEs Hemoglobin A1c and Advanced Glycation End-products (AGEs) are the specific evaluations listed for identifying damaged sugars.", "caseContext": null}, {"id": 131, "question": "Which set of nutrients is categorized specifically as 'Energy Transporters' within the mitochondrial energy production framework?", "options": [{"key": "A", "text": "Vitamin D and Magnesium"}, {"key": "B", "text": "Niacin (B3) and Riboflavin (B2)"}, {"key": "C", "text": "Thiamine (B1) and Pantothenic Acid (B5)"}, {"key": "D", "text": "Folate and Vitamin B12"}], "answer": "B", "rationale": "Niacin (B3) and Riboflavin (B2) B2 and B3 are explicitly listed as the nutrients critical for energy transport in the form of FAD and NAD.", "caseContext": null}, {"id": 132, "question": "Which 2º (Secondary) Metabolism Treatment is indicated for a patient with persistent mitochondrial dysfunction to support methylation and 'rescue' choline for membrane integrity?", "options": [{"key": "A", "text": "Magnesium Chelate"}, {"key": "B", "text": "Alpha-Lipoic Acid (ALA)"}, {"key": "C", "text": "Coenzyme Q10"}, {"key": "D", "text": "SAM-e (S-adenosylmethionine)"}], "answer": "D", "rationale": "SAM-e (S-adenosylmethionine) SAM-e is a 2º metabolism treatment that supports the production of glutathione and preserves choline for phosphatidylcholine (PC) synthesis. This molecule is the body's universal methyl donor. Case Study 1 — Answer Key", "caseContext": null}, {"id": 133, "question": "Elena’s history of teenage antibiotic use is best categorized as a:", "options": [{"key": "A", "text": "Mediator/Perpetuator"}, {"key": "B", "text": "Triggering Event"}, {"key": "C", "text": "Genetic Antecedent"}], "answer": "B", "rationale": "Triggering Event Antibiotics often trigger dysbiosis, a common starting point in a GI timeline.", "caseContext": "Case Study 1: The GI-Immune Connection. Questions 133-146\nPatient Profile: Elena, 28, presents with chronic bloating, alternating constipation/diarrhea, and \"brain fog.\" She\nhas a history of multiple rounds of antibiotics for acne as a teenager.\nLabs: Positive for IgA Tissue Transglutaminase (tTG-IgA); High Fecal Calprotectin; Low Serum B12.\nClinical Indicators: Geographic tongue; brittle nails."}, {"id": 134, "question": "The positive tTG-IgA and low B12 suggest dysfunction primarily in which Matrix node?", "options": [{"key": "A", "text": "Assimilation"}, {"key": "B", "text": "Structural Integrity"}, {"key": "C", "text": "Transport"}], "answer": "A", "rationale": "Assimilation Celiac disease and B12 deficiency are failures of Digestion/Absorption (Assimilation).", "caseContext": null}, {"id": 135, "question": "What is the gold standard \"Next Best Step\" for a patient with positive tTG-IgA and high suspicion of Celiac disease?", "options": [{"key": "A", "text": "Immediate strict gluten-free diet"}, {"key": "B", "text": "Referral for small bowel biopsy"}, {"key": "C", "text": "Food sensitivity testing (IgG)"}], "answer": "B", "rationale": "Referral for small bowel biopsy To confirm Celiac, a biopsy is the \"Gold Standard.\" It must be done while consuming gluten; going gluten-free prematurely can cause a false-negative biopsy.", "caseContext": null}, {"id": 136, "question": "Elena’s \"Geographic tongue\" is a clinical indicator for a deficiency in which node?", "options": [{"key": "A", "text": "Communication"}, {"key": "B", "text": "Assimilation"}, {"key": "C", "text": "Energy"}], "answer": "B", "rationale": "Assimilation Geographic tongue and brittle nails are \"Clinical Indicators\" of micronutrient malabsorption (B- vitamins, Iron, Zinc) within the Assimilation node.", "caseContext": null}, {"id": 137, "question": "Using the 5R Framework, what is the \"Remove\" priority for Elena?", "options": [{"key": "A", "text": "Remove probiotics"}, {"key": "B", "text": "Remove gluten and potentially pathogenic microbes"}, {"key": "C", "text": "Remove exercise"}], "answer": "B", "rationale": "Remove gluten and potentially pathogenic microbes In the 5R program, \"Remove\" refers to pathogens, allergens, and triggers. For Elena, this means removing gluten and potentially addressing microbial overgrowth.", "caseContext": null}, {"id": 138, "question": "High Fecal Calprotectin is a biomarker for which functional imbalance?", "options": [{"key": "A", "text": "Intestinal inflammation"}, {"key": "B", "text": "Low pancreatic enzymes"}, {"key": "C", "text": "SIBO"}], "answer": "A", "rationale": "Intestinal inflammation Calprotectin is a protein found in neutrophils; its presence in stool indicates active white blood cell migration to the gut, a hallmark of the Defense & Repair node imbalance.", "caseContext": null}, {"id": 139, "question": "Elena’s brain fog may be mediated by \"Metabolic Endotoxemia.\" This involves:", "options": [{"key": "A", "text": "LPS (Lipopolysaccharide) crossing the gut barrier into systemic circulation"}, {"key": "B", "text": "High levels of Vitamin D"}, {"key": "C", "text": "Excessive fiber intake"}], "answer": "A", "rationale": "LPS (Lipopolysaccharide) crossing the gut barrier into systemic circulation Metabolic endotoxemia occurs when increased intestinal permeability allows bacterial LPS to enter the blood, triggering systemic cytokine release that affects neurobiology (brain fog).", "caseContext": null}, {"id": 140, "question": "Which \"Replace\" intervention is most likely needed given Elena's geographic tongue and bloating?", "options": [{"key": "A", "text": "Digestive enzymes or HCl"}, {"key": "B", "text": "High-dose Ibuprofen"}, {"key": "C", "text": "Synthetic food dyes"}], "answer": "A", "rationale": "Digestive enzymes or HCl Low Fecal Elastase indicates pancreatic exocrine insufficiency, requiring the \"Replace\" step of the 5R program to aid the Assimilation node.", "caseContext": null}, {"id": 141, "question": "If Elena’s total IgA is found to be deficient, what happens to her tTG-IgA test result?", "options": [{"key": "A", "text": "It stays the same"}, {"key": "B", "text": "It may yield a false negative"}, {"key": "C", "text": "It will always be high"}], "answer": "B", "rationale": "It may yield a false negative Since tTG is an IgA antibody, a patient with absolute IgA deficiency cannot produce it. Clinicians must test IgG-based antibodies (DGP-IgG) in these cases.", "caseContext": null}, {"id": 142, "question": "The \"Re-innoculate\" step of the 5R program involves:", "options": [{"key": "A", "text": "Taking antibiotics"}, {"key": "B", "text": "Using prebiotics and probiotics to support the Gut Microbiota"}, {"key": "C", "text": "Drinking more water"}], "answer": "B", "rationale": "Using prebiotics and probiotics to support the Gut Microbiota Re-inoculation (Step 4 of 5R) focuses on restoring a healthy microbiome using probiotics (live organisms) and prebiotics (fuel for organisms).", "caseContext": null}, {"id": 143, "question": "Elena’s low B12 is most likely a result of:", "options": [{"key": "A", "text": "Excessive stomach acid"}, {"key": "B", "text": "Malabsorption due to villous atrophy in the small intestine"}, {"key": "C", "text": "Too much exercise"}], "answer": "B", "rationale": "Malabsorption due to villous atrophy in the small intestine In Celiac disease, the immune system destroys the villi in the small intestine (villous atrophy), where B12 and Iron are absorbed, leading to the observed deficiencies.", "caseContext": null}, {"id": 144, "question": "According to the GI Module, \"D-I-G-I-N\" stands for Digestion, Intestinal Permeability, Gut Microbiota, Inflammation, and:", "options": [{"key": "A", "text": "Nutrient density"}, {"key": "B", "text": "Nervous System"}, {"key": "C", "text": "Nephrology"}], "answer": "B", "rationale": "Nervous System The \"N\" in D-I-G-I-N stands for Nervous System, specifically referring to the Enteric Nervous System and the bidirectional Gut-Brain Axis.", "caseContext": null}, {"id": 145, "question": "Elena's skin issues (acne) as a teen and current GI issues reflect the \"Cross-talk\" between which two nodes?", "options": [{"key": "A", "text": "Assimilation and Defense & Repair"}, {"key": "B", "text": "Energy and Transport"}, {"key": "C", "text": "Structural Integrity and Communication"}], "answer": "A", "rationale": "Assimilation and Defense & Repair Acne (Defense & Repair/Immune/Inflammation) and bloating (Assimilation) are classic examples of how gut-derived inflammation manifests as skin pathology.", "caseContext": null}, {"id": 146, "question": "The most \"User-Friendly\" way to start Elena on a healing path while awaiting biopsy results is:", "options": [{"key": "A", "text": "A strict 3-day water fast"}, {"key": "B", "text": "A whole-foods, nutrient-dense diet focusing on \"Replacing\" deficiencies"}, {"key": "C", "text": "High-dose Iron supplements"}], "answer": "B", "rationale": "A whole-foods, nutrient-dense diet focusing on \"Replacing\" deficiencies Patient-Centered Care involves supporting the patient's immediate health (nutrients) without interfering with definitive diagnosis (biopsy requires gluten consumption). Case Study 2 — Answer Key", "caseContext": null}, {"id": 147, "question": "According to the IFM Hormone Hierarchy, which node is the top clinical priority for Sarah?", "options": [{"key": "A", "text": "Thyroid (Initiate T4/T3 therapy)"}, {"key": "B", "text": "Adrenal and Insulin (HPA Axis and Glycemic Control)"}, {"key": "C", "text": "Sex Hormones (Estrogen/Progesterone replacement)"}], "answer": "B", "rationale": "Adrenal and Insulin (HP A Axis and Glycemic Control) Hormone Hierarchy: IFM teaches that you must address the \"floor\" (Insulin/Glycemic control) and the \"walls\" (Adrenals/ HPA) before the \"roof\" (Thyroid/Sex Hormones). Treating thyroid first in an unstable HPA axis can worsen fatigue.", "caseContext": "Case Study 2: The \"Inflammaging\" Executive Questions 147-160\nPatient: Sarah, 54-year-old female.\nChief Concern: \"Crushing fatigue,\" 15lb weight gain in 6 months, and \"brain fog.\"\nHistory & Timeline: Family history of T2D (Mother) and Hashimoto’s (Sister).  ·  High-stress litigation 8 months\nago followed by a severe flu with poor recovery.  ·  Drinks 4 cups coffee/day, 2 glasses wine nightly, sedentary job,\nand suspected sleep apnea.\nPHYSICAL EXAM\nBMI: 29.5;\nWaist: 37\";\nBP: 142/88.\nIndicators: Thinning outer eyebrows, \"buffalo hump,\" and +1 ankle edema.\nBIOMARKERS\nLipids: LDL 155, HDL 38, TG 210.\nMetabolic: Fasting Insulin 18, HbA1c 5.9%, hs-CRP 4.8.\nThyroid: TSH 3.8, Free T4 1.0, Free T3 2.1 (Low), rT3 32 (High).\nImmune/Hormone: TPO Ab 145, Morning Cortisol 22 (High), DHEA-S 85 (Low)."}, {"id": 148, "question": "Sarah’s thyroid labs (High rT3, Low Free T3) most likely indicate:", "options": [{"key": "A", "text": "Primary Hypothyroidism requiring immediate T4 monotherapy"}, {"key": "B", "text": "Non-Thyroidal Illness Syndrome (Deiodinase inhibition due to inflammation)"}, {"key": "C", "text": "Central Hypothyroidism due to pituitary exhaustion"}], "answer": "B", "rationale": "Non-Thyroidal Illness Syndrome (Deiodinase inhibition due to inflammation) Non-Thyroidal Illness Syndrome (NTIS): High rT3 and low Free T3 in the setting of high hs-CRP is \"euthyroid sick syndrome.\" The body downregulates conversion to conserve energy during inflammation.", "caseContext": null}, {"id": 149, "question": "Which mediator is most directly driving Sarah's elevated hs-CRP and inhibited thyroid conversion?", "options": [{"key": "A", "text": "Sedentary job"}, {"key": "B", "text": "Nightly alcohol consumption and underlying insulin resistance"}, {"key": "C", "text": "High caffeine intake"}], "answer": "B", "rationale": "Nightly alcohol consumption and underlying insulin resistance Alcohol & Insulin: Alcohol is a major mediator of inflammation (hs-CRP) and liver-based deiodinase inhibition. Sarah’s TG:HDL ratio and HbA1c suggest insulin resistance is the primary driver.", "caseContext": null}, {"id": 150, "question": "Sarah’s waist circumference (37”) and Blood Pressure (142/88) confirm a diagnosis of:", "options": [{"key": "A", "text": "Metabolic Syndrome"}, {"key": "B", "text": "Isolated Systolic Hypertension"}, {"key": "C", "text": "Cushing’s Disease"}], "answer": "A", "rationale": "Metabolic Syndrome Metabolic Syndrome: Diagnosis requires 3 of 5: Waist >35\" (Sarah: 37\"), BP >130/85 (Sarah: 142/88), TG >150 (Sarah: 210), HDL <50 (Sarah: 38), or Fasting Glucose >100. Sarah meets 4/5.", "caseContext": null}, {"id": 151, "question": "Which intervention targets both \"Defense and Repair\" and \"Energy\" (Mitochondria)?", "options": [{"key": "A", "text": "Vitamin C 1000mg"}, {"key": "B", "text": "Alpha-Lipoic Acid (ALA)"}, {"key": "C", "text": "Melatonin 3mg at bedtime"}], "answer": "B", "rationale": "Alpha-Lipoic Acid (ALA) Alpha-Lipoic Acid (ALA): ALA is a unique pleiotropic nutrient that improves insulin sensitivity (Communication), acts as a potent antioxidant (Defense/Repair), and is a cofactor for mitochondrial enzymes (Energy).", "caseContext": null}, {"id": 152, "question": "The \"Buffalo Hump\" and high Fasting Insulin (18) point to dysfunction in which Matrix node?", "options": [{"key": "A", "text": "Biotransformation"}, {"key": "B", "text": "Communication"}, {"key": "C", "text": "Structural Integrity"}], "answer": "B", "rationale": "Communication Communication: Insulin and Cortisol are the primary signaling molecules in this node. The \"Buffalo Hump\" is a physical indicator of hypercortisolism/insulin cross-talk.", "caseContext": null}, {"id": 1       if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(word);
      const voices = window.speechSynthesis.getVoices();
      const naturalVoice = voices.find(v => (v.name.includes("Samantha") || v.name.includes("Ava") || v.name.includes("Jenny") || v.name.includes("Natural")) && v.lang.startsWith("en")) || voices.find(v => v.lang === "en-US");

      utter.lang = 'en-US';
      utter.rate = 0.88;
      window.speechSynthesis.speak(utter);

      let html = '';

      for (let i = 1; i <= totalBatches; i++) {
        const start = (i - 1) * batchSize + 1;
        const end = i * batchSize;
        
        let answeredInGroup = 0;
        let correctInGroup = 0;
        for (let qid = start; qid <= end; qid++) {
          if (userAnswers[qid]) answeredInGroup++;
          const q = ALL_QUESTIONS[qid - 1];
          if (q && userAnswers[qid] === q.answer) correctInGroup++;
        }

        const isSub = !!submittedGroups[i];
        let subText = `${answeredInGroup}/20 题`;
        if (isSub) {
          subText = `${correctInGroup}/20 正确 ✅`;

        html += `
          <button class="batch-btn ${i === currentBatch ? 'active' : ''}" onclick="switchBatch(${i})">

            <span class="batch-sub">${subText}</span>

      container.innerHTML = html;

    function submitCurrentGroup() {

      const end = currentBatch * batchSize;
      
      let answeredCount = 0;
      let correctCount = 0;

      for (let qid = start; qid <= end; qid++) {

        const q = ALL_QUESTIONS[qid - 1];
        if (q && userAnswers[qid] === q.answer) correctCount++;

      submittedGroups[currentBatch] = true;

      renderQuestions();

      showToast(`第 ${currentBatch} 组核对完毕！答对 ${correctCount} / ${batchSize} 题（得分率 ${Math.round(correctCount / batchSize * 100)}%）`);

          document.getElementById('tt-ipa').innerText = dictEntry.ipa || '';
          document.getElementById('tt-cn').innerText = dictEntry.cn || '点击收录或发音';

          const range = sel.getRangeAt(0);
          const rect = range.getBoundingClientRect();
          
          tooltip.style.left = (rect.left + rect.width / 2 + window.scrollX) + 'px';
          tooltip.style.top = (rect.top + window.scrollY) + 'px';
          tooltip.style.display = 'block';
        } else {
          tooltip.style.display = 'none';
        }
      });
    }

    function playSelectedWord(e) {
      e.stopPropagation();
      if (currentSelectedText) speakWord(currentSelectedText);
    }

    function saveSelectedWord(e) {
      e.stopPropagation();
      if (!currentSelectedText) return;
      const cleanKey = currentSelectedText.toLowerCase();
      const dictEntry = MEDICAL_DICT[cleanKey] || {};

      if (!vocabList.some(v => v.word.toLowerCase() === cleanKey)) {
        vocabList.unshift({
          word: currentSelectedText,
          ipa: dictEntry.ipa || '',
          cn: dictEntry.cn || '',
          time: new Date().toLocaleDateString()
        });
        localStorage.setItem(STORAGE_KEY_VOCAB, JSON.stringify(vocabList));
        updateBadges();
        showToast(`已成功收录: ${currentSelectedText} 到生词本！`);
      } else {
        showToast(`该词已在生词本中`);
      }
      document.getElementById('selection-tooltip').style.display = 'none';
    }

    function renderVocabList() {
      const tbody = document.getElementById('vocab-table-body');
      if (vocabList.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding: 2.5rem; color: var(--text-muted);">生词本为空。在答题过程中用鼠标选中任何英文生词，即可划词发音并收录！</td></tr>`;
        return;
      }
      tbody.innerHTML = vocabList.map((item, idx) => `
        <tr>
          <td><strong>${item.word}</strong></td>
          <td style="color: #8b5cf6; font-family: monospace;">${item.ipa || '-'}</td>
          <td>${item.cn || '<span style="color:var(--text-muted);">自行记忆</span>'}</td>
          <td style="text-align: center;">
            <button class="btn-icon" onclick="speakWord('${item.word}')" title="播放真人自然发音">🔊</button>
          </td>
          <td style="text-align: center;">
            <button class="btn-icon" onclick="deleteVocab(${idx})" title="删除" style="color: var(--danger);">🗑️</button>
          </td>
        </tr>
      `).join('');
    }

    function deleteVocab(idx) {
      vocabList.splice(idx, 1);
      localStorage.setItem(STORAGE_KEY_VOCAB, JSON.stringify(vocabList));
      renderVocabList();
      updateBadges();
      showToast('已从生词本移除');
    }

    function clearVocab() {
      if (confirm('确定要清空全部生词本吗？')) {
        vocabList = [];
        localStorage.setItem(STORAGE_KEY_VOCAB, JSON.stringify(vocabList));
        renderVocabList();
        updateBadges();
        showToast('生词本已清空');
      }
    }

    function copyVocabMarkdown() {
      if (vocabList.length === 0) return showToast('生词本为空！');
      let md = '| 单词 (Word) | 国际音标 (IPA) | 功能医学专业释义 |\n|---|---|---|\n';
      vocabList.forEach(v => {
        md += `| ${v.word} | ${v.ipa} | ${v.cn} |\n`;
      });
      navigator.clipboard.writeText(md).then(() => showToast('已成功复制 Markdown 表格到剪贴板！可直接粘贴至 Obsidian！'));
    }

    function exportVocabTSV() {
      if (vocabList.length === 0) return showToast('生词本为空！');
      let tsv = '';
      vocabList.forEach(v => {
        tsv += `${v.word}\t${v.ipa}\t${v.cn}\n`;
      });
      navigator.clipboard.writeText(tsv).then(() => showToast('已成功复制 TSV 到剪贴板！可直接粘贴导入 Anki！'));
    }

    function renderWrongList() {
      const container = document.getElementById('wrong-list-container');
      const wrongQuestions = [];

      ALL_QUESTIONS.forEach(q => {
        const groupNum = Math.ceil(q.id / batchSize);
        if (submittedGroups[groupNum]) {
          const uAns = userAnswers[q.id];
          if (uAns && uAns !== q.answer) {
            wrongQuestions.push({ question: q, userAns: uAns });
          }
        }
      });

      if (wrongQuestions.length === 0) {
        container.innerHTML = `
          <div class="card" style="text-align: center; padding: 3rem; color: var(--text-muted);">
            🎉 暂无错题记录！请先在【英文真题】中作答并点击【交卷核对】，系统会自动抓取全部错题！
          </div>
        `;
        return;
      }

      container.innerHTML = wrongQuestions.map(w => `
        <div class="wrong-item">
          <div class="wrong-header">
            <span style="color: var(--danger);">QUESTION ${w.question.id} (第 ${Math.ceil(w.question.id / batchSize)} 组)</span>
            <span>IFM Practice Exam 4</span>
          </div>
          <div class="wrong-stem">${w.question.question}</div>
          <div class="wrong-choice-grid">
            <div class="my-choice">❌ 我的选择: ${w.userAns}</div>
            <div class="correct-choice">✅ 正确答案: ${w.question.answer}</div>
          </div>
          <div class="explanation" style="display:block; margin-top: 0.6rem;">
            <div class="exp-row"><span class="exp-tag">🔬 机制深度剖析:</span> ${w.question.rationale}</div>
          </div>
        </div>
      `).join('');
    }

    function getWrongList() {
      const wrongQuestions = [];
      ALL_QUESTIONS.forEach(q => {
        const groupNum = Math.ceil(q.id / batchSize);
        if (submittedGroups[groupNum]) {
          const uAns = userAnswers[q.id];
          if (uAns && uAns !== q.answer) {
            wrongQuestions.push({ q: q, uAns: uAns });
          }
        }
      });
      return wrongQuestions;
    }

    function copyWrongForNotebookLM() {
      const wrongQuestions = getWrongList();
      if (wrongQuestions.length === 0) return showToast('目前暂无已批改出的错题！');

      let text = `【请基于已上传的 IFM 官方讲义、教材与课程 Transcript 检索并回答】\n\n`;
      text += `我在进行 IFM Practice Exam 4 模考时做错了以下题目。请检索知识库中对应的 APM 模块（GI, Detox, Hormone, Energy, Immune, Cardiometabolic, Neuro/Matrix/GOTOIT）及课程音频文字稿：\n\n`;
      text += `1. **知识点与模块定位**：指出每道题涉及的核心模块、讲义章节或专家观点；\n`;
      text += `2. **错选辨析与机制深剖**：对照【我的错误选择】与【官方正确答案】，用讲义中的生理/生化机理解释我为什么会混淆，并引用讲义依据；\n`;
      text += `3. **临床要点总结**：提炼该知识点在 IFM 认证考试中的必背临床诊断与干预原则。\n\n`;
      text += `### 错题明细清单：\n\n`;

      wrongQuestions.forEach((item, index) => {
        text += `#### 错题 ${index + 1} (Question ${item.q.id})\n`;
        text += `**英文题干**: ${item.q.question}\n`;
        text += `**选项列表**:\n`;
        item.q.options.forEach(opt => {
          text += `  - ${opt.key}. ${opt.text}\n`;
        });
        text += `**我的错误选择**: ❌ ${item.uAns}\n`;
        text += `**官方正确答案**: ✅ ${item.q.answer}\n`;
        text += `**官方临床解析**: ${item.q.rationale}\n\n`;
      });

      navigator.clipboard.writeText(text).then(() => {
        showToast('已复制【NotebookLM 专属提问指令】！直接粘贴到 NotebookLM 对话框即可！');
      });
    }

    function copyWrongForAI() {
      const wrongQuestions = getWrongList();
      if (wrongQuestions.length === 0) return showToast('目前暂无已批改出的错题！');

      let promptText = `## IFM 备考专项深度复盘与二次变式出题\n\n`;
      promptText += `我在做 IFM Practice Exam 4 时出现以下错题。请调取我的 IFM 课程笔记与讲义，针对每道错题帮我做两件事：\n`;
      promptText += `1. **核心病理生理机制剖析**：分析我为什么容易选错【我的选项】，正解【正确选项】在功能医学矩阵（Matrix）或生化通路上的根本逻辑是什么；\n`;
      promptText += `2. **反向变式出题（二次盲测）**：针对该考点，出 2 道新的英文临床案例长题（附 4 个选项与解析），测试我是否彻底掌握。\n\n`;
      promptText += `### 错题明细清单：\n\n`;

      wrongQuestions.forEach((item, index) => {
        promptText += `#### 错题 ${index + 1} (Question ${item.q.id})\n`;
        promptText += `- **英文原题**: ${item.q.question}\n`;
        promptText += `- **我的错误选择**: ${item.uAns}\n`;
        promptText += `- **官方正确答案**: ${item.q.answer}\n`;
        promptText += `- **官方参考解析**: ${item.q.rationale}\n\n`;
      });

      navigator.clipboard.writeText(promptText).then(() => {
        showToast('已成功复制变式出题 Prompt！请直接粘贴至 Gemini / Claude 对话框！');
      });
    }

    function copyWrongAsNote() {
      const wrongQuestions = getWrongList();
      if (wrongQuestions.length === 0) return showToast('目前暂无已批改出的错题！');

      let text = `# IFM Practice Exam 4 错题复盘笔记\n\n`;
      text += `> 收录日期: ${new Date().toLocaleDateString()} | 错题总数: ${wrongQuestions.length} 题\n\n`;
      text += `---\n\n`;

      wrongQuestions.forEach((item, index) => {
        text += `### Q${item.q.id}. ${item.q.question}\n\n`;
        item.q.options.forEach(opt => {
          let mark = '  ';
          if (opt.key === item.q.answer) mark = '✅ ';
          else if (opt.key === item.uAns) mark = '❌ ';
          text += `- ${mark}${opt.key}. ${opt.text}\n`;
        });
        text += `\n**我的错选**: ${item.uAns} | **标准答案**: ${item.q.answer}\n\n`;
        text += `**官方临床机制解析 (Rationale)**:\n${item.q.rationale}\n\n`;
        text += `---\n\n`;
      });

      navigator.clipboard.writeText(text).then(() => {
        showToast('已复制【Markdown 错题笔记源】！可在 NotebookLM 点击“添加笔记”直接粘贴！');
      });
    }

    function updateBadges() {
      document.getElementById('vocab-count').innerText = vocabList.length;
      
      let wrongCount = 0;
      ALL_QUESTIONS.forEach(q => {
        const groupNum = Math.ceil(q.id / batchSize);
        if (submittedGroups[groupNum] && userAnswers[q.id] && userAnswers[q.id] !== q.answer) {
          wrongCount++;
        }
      });
      document.getElementById('wrong-count').innerText = wrongCount;
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 3200);
    }

    function applyTheme() {
      const th = localStorage.getItem(STORAGE_KEY_THEME) || 'light';
      if (th === 'dark') document.body.classList.add('dark-mode');
      else document.body.classList.remove('dark-mode');
    }
    function toggleTheme() {
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      localStorage.setItem(STORAGE_KEY_THEME, isDark ? 'dark' : 'light');
    }

    window.onload = init;
  </script>
</body>
</html>
