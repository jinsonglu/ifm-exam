<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IFM 官方全真模拟考场 · Exam 4 (160题全量)</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-hover: #1e40af;
      --primary-light: #eff6ff;
      --accent: #0284c7;
      --success: #15803d;
      --success-light: #dcfce7;
      --danger: #b91c1c;
      --danger-light: #fee2e2;
      --warning: #d97706;
      --text: #0f172a;
      --text-muted: #64748b;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --border-dark: #cbd5e1;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    body.dark-mode {
      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --primary-light: #1e293b;
      --accent: #38bdf8;
      --success: #22c55e;
      --success-light: #14532d33;
      --danger: #ef4444;
      --danger-light: #7f1d1d33;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --border-dark: #475569;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding-bottom: 5rem;
      transition: background-color 0.2s, color 0.2s;
    }

    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 0.85rem 1.8rem;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow-sm);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .brand h1 {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.01em;
    }
    .brand .badge {
      background: var(--primary-light);
      color: var(--primary);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.2rem 0.55rem;
      border-radius: 9999px;
      border: 1px solid var(--primary);
    }

    .nav-tabs {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .nav-btn {
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text);
      padding: 0.45rem 0.95rem;
      border-radius: 7px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }
    .nav-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .nav-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .theme-toggle {
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.45rem 0.7rem;
      border-radius: 7px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .container {
      max-width: 960px;
      margin: 1.5rem auto;
      padding: 0 1rem;
    }

    .batch-bar-card {
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 1rem 1.25rem;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow-sm);
    }
    .batch-bar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }
    .batch-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .batch-stats {
      font-size: 0.82rem;
      color: var(--text-muted);
    }
    .batch-btns-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(105px, 1fr));
      gap: 0.5rem;
    }
    .batch-btn {
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      padding: 0.5rem 0.4rem;
      border-radius: 8px;
      font-size: 0.82rem;
      cursor: pointer;
      font-weight: 600;
      text-align: center;
      transition: all 0.15s ease;
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }
    .batch-btn:hover {
      border-color: var(--accent);
      background: var(--primary-light);
    }
    .batch-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      box-shadow: 0 2px 4px rgba(30, 58, 138, 0.25);
    }
    .batch-btn .batch-sub {
      font-size: 0.7rem;
      font-weight: normal;
      opacity: 0.85;
    }

    .case-card {
      background: #eff6ff;
      border: 2px solid #bfdbfe;
      border-radius: 12px;
      padding: 1.4rem;
      margin-bottom: 1.5rem;
      color: #1e3a8a;
      line-height: 1.7;
    }
    body.dark-mode .case-card {
      background: #172554;
      border-color: #1e40af;
      color: #dbeafe;
    }
    .case-card h3 {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .case-card pre {
      white-space: pre-wrap;
      font-family: inherit;
      font-size: 0.92rem;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 1.5rem;
      margin-bottom: 1.3rem;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.2s;
    }
    .card:hover {
      border-color: var(--border-dark);
    }
    .q-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .q-badge {
      background: var(--bg);
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      border: 1px solid var(--border);
    }
    .question-stem {
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.7;
      margin-bottom: 1.2rem;
      color: var(--text);
      user-select: text;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }
    .option-label {
      display: flex;
      align-items: flex-start;
      gap: 0.85rem;
      padding: 0.85rem 1.15rem;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.15s ease;
      background: var(--card-bg);
      font-size: 0.95rem;
      line-height: 1.55;
      user-select: text;
    }
    .option-label:hover {
      background-color: var(--primary-light);
      border-color: #93c5fd;
    }
    .option-label input[type="radio"] {
      margin-top: 0.25rem;
      width: 1.15rem;
      height: 1.15rem;
      accent-color: var(--primary);
      cursor: pointer;
    }
    .opt-key {
      font-weight: 700;
      color: var(--primary);
      margin-right: 0.2rem;
    }
    body.dark-mode .opt-key {
      color: var(--accent);
    }

    .option-label.is-correct {
      background-color: var(--success-light) !important;
      border-color: var(--success) !important;
      color: var(--success) !important;
      font-weight: 600;
    }
    .option-label.is-wrong {
      background-color: var(--danger-light) !important;
      border-color: var(--danger) !important;
      color: var(--danger) !important;
      text-decoration: line-through;
    }

    .explanation {
      margin-top: 1.2rem;
      padding: 1.15rem;
      background: var(--bg);
      border-left: 4px solid var(--accent);
      border-radius: 8px;
      font-size: 0.92rem;
      line-height: 1.65;
      animation: fadeIn 0.25s ease-in-out;
    }
    .exp-row {
      margin-bottom: 0.6rem;
    }
    .exp-row:last-child {
      margin-bottom: 0;
    }
    .exp-tag {
      display: inline-block;
      font-weight: 700;
      color: var(--accent);
      margin-right: 0.4rem;
    }

    #selection-tooltip {
      position: absolute;
      display: none;
      background: #0f172a;
      color: #fff;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.88rem;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.4);
      z-index: 1000;
      transform: translate(-50%, -100%);
      margin-top: -10px;
      white-space: nowrap;
      pointer-events: auto;
      animation: popIn 0.15s ease-out;
    }
    #selection-tooltip::after {
      content: "";
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 6px 6px 0;
      border-style: solid;
      border-color: #0f172a transparent;
    }
    .tooltip-content {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .tooltip-word {
      font-weight: 700;
      color: #38bdf8;
    }
    .tooltip-ipa {
      color: #a78bfa;
      font-family: "Lucida Sans Unicode", sans-serif;
      font-size: 0.82rem;
    }
    .tooltip-cn {
      color: #e2e8f0;
      max-width: 260px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tooltip-btn {
      background: #1e293b;
      border: 1px solid #475569;
      color: #fff;
      border-radius: 5px;
      padding: 0.2rem 0.5rem;
      cursor: pointer;
      font-size: 0.78rem;
      transition: background 0.15s;
    }
    .tooltip-btn:hover {
      background: #334155;
    }

    .submit-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 1.5rem;
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      margin-top: 1.5rem;
    }
    .btn-submit {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 0.75rem 1.8rem;
      border-radius: 9px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 6px -1px rgba(30, 58, 138, 0.25);
      transition: background 0.15s, transform 0.1s;
    }
    .btn-submit:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }
    .btn-next {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.75rem 1.4rem;
      border-radius: 9px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-next:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .table-container {
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border);
      overflow: hidden;
      margin-top: 1rem;
      box-shadow: var(--shadow-sm);
    }
    .custom-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    .custom-table th, .custom-table td {
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }
    .custom-table th {
      background: var(--bg);
      font-weight: 600;
      color: var(--text-muted);
    }
    .btn-icon {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
      transition: transform 0.1s;
    }
    .btn-icon:hover {
      transform: scale(1.2);
    }

    .wrong-item {
      background: var(--card-bg);
      border-radius: 10px;
      border: 1px solid var(--border);
      padding: 1.25rem;
      margin-bottom: 1rem;
      border-left: 4px solid var(--danger);
    }
    .wrong-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.6rem;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .wrong-stem {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 0.8rem;
    }
    .wrong-choice-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      margin-bottom: 0.8rem;
      font-size: 0.88rem;
    }
    .my-choice {
      padding: 0.5rem 0.8rem;
      background: var(--danger-light);
      color: var(--danger);
      border-radius: 6px;
      font-weight: 600;
    }
    .correct-choice {
      padding: 0.5rem 0.8rem;
      background: var(--success-light);
      color: var(--success);
      border-radius: 6px;
      font-weight: 600;
    }

    #toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      background: #0f172a;
      color: #fff;
      padding: 0.7rem 1.4rem;
      border-radius: 9999px;
      font-size: 0.88rem;
      font-weight: 500;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
      display: none;
      z-index: 2000;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes popIn {
      from { opacity: 0; transform: translate(-50%, -80%); }
      to { opacity: 1; transform: translate(-50%, -100%); }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <h1>🩺 IFM 官方全真模拟考场</h1>
      <span class="badge">Exam 4 · 160题全量</span>
    </div>
    <div class="nav-tabs">
      <button class="nav-btn active" id="tab-exam" onclick="switchView('exam')">📝 英文真题 (160题)</button>
      <button class="nav-btn" id="tab-vocab" onclick="switchView('vocab')">📖 语音生词本 (<span id="vocab-count">0</span>)</button>
      <button class="nav-btn" id="tab-wrong" onclick="switchView('wrong')">❌ 错题深度复盘 (<span id="wrong-count">0</span>)</button>
      <button class="theme-toggle" onclick="toggleTheme()" title="切换明暗主题">🌗</button>
    </div>
  </header>

  <div id="selection-tooltip">
    <div class="tooltip-content">
      <span class="tooltip-word" id="tt-word">word</span>
      <span class="tooltip-ipa" id="tt-ipa">/ipa/</span>
      <span class="tooltip-cn" id="tt-cn">释义</span>
      <button class="tooltip-btn" onclick="playSelectedWord(event)" title="朗读">🔊 读音</button>
      <button class="tooltip-btn" onclick="saveSelectedWord(event)" title="收录到生词本">⭐ 收录</button>
    </div>
  </div>

  <div class="container">

    <div id="view-exam">
      <div class="batch-bar-card">
        <div class="batch-bar-header">
          <span class="batch-title">📌 分组答题导航（每组 20 题）</span>
          <span class="batch-stats" id="exam-overall-stats">总进度：0 / 160 题已答</span>
        </div>
        <div class="batch-btns-grid" id="batch-grid"></div>
      </div>

      <div id="questions-container"></div>

      <div class="submit-bar">
        <div id="batch-status-msg" style="font-size: 0.95rem; font-weight: 600; color: var(--text-muted);">
          第 <span id="current-group-num">1</span> 组答题中
        </div>
        <div style="display: flex; gap: 0.75rem;">
          <button class="btn-submit" id="btn-group-submit" onclick="submitCurrentGroup()">📝 交卷核对本组</button>
          <button class="btn-next" onclick="nextGroup()">下一组 ➡️</button>
        </div>
      </div>
    </div>

    <div id="view-vocab" style="display: none;">
      <div class="card" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <div>
          <h2 style="font-size: 1.15rem; color: var(--primary);">📖 沉浸式医学语音生词本</h2>
          <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.2rem;">划词即查即收录，随时点击 🔊 磨耳朵，支持导出至 Anki 或 Obsidian。</p>
        </div>
        <div style="display: flex; gap: 0.5rem;">
          <button class="nav-btn" onclick="copyVocabMarkdown()">📋 复制为 Markdown 表格</button>
          <button class="nav-btn" onclick="exportVocabTSV()">📥 导出 Anki 卡片 (TSV)</button>
          <button class="nav-btn" style="color: var(--danger); border-color: var(--danger);" onclick="clearVocab()">🗑️ 清空生词本</button>
        </div>
      </div>
      <div class="table-container">
        <table class="custom-table">
          <thead>
            <tr>
              <th style="width: 22%;">单词 / 术语</th>
              <th style="width: 22%;">国际音标 (IPA)</th>
              <th>功能医学专业释义</th>
              <th style="width: 80px; text-align: center;">发音</th>
              <th style="width: 70px; text-align: center;">操作</th>
            </tr>
          </thead>
          <tbody id="vocab-table-body"></tbody>
        </table>
      </div>
    </div>

    <div id="view-wrong" style="display: none;">
      <div class="card" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.8rem;">
        <div>
          <h2 style="font-size: 1.15rem; color: var(--danger);">❌ 错题深度复盘与 NotebookLM 联动</h2>
          <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.2rem;">自动归集各组答错题，一键生成 NotebookLM 专属检索指令或复盘笔记，无缝调取课程讲义。</p>
        </div>
        <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
          <button class="nav-btn" style="background: #e0f2fe; border-color: #38bdf8; color: #0369a1; font-weight: 700;" onclick="copyWrongForNotebookLM()">📖 复制 NotebookLM 提问指令</button>
          <button class="nav-btn" style="background: #fef08a; border-color: #ca8a04; color: #854d0e; font-weight: 700;" onclick="copyWrongForAI()">🤖 复制 Gemini 变式出题</button>
          <button class="nav-btn" onclick="copyWrongAsNote()">📝 复制为复盘笔记源</button>
        </div>
      </div>
      <div id="wrong-list-container"></div>
    </div>

  </div>

  <div id="toast"></div>

  <script>
    const ALL_QUESTIONS = [{"id": 1, "question": "A patient mentions they have felt 'broken' since a severe car accident three years ago. In the 'Environment of Insight,' how should the clinician interpret this statement?", "options": [{"key": "A", "text": "As a purely physical complaint requiring an X-ray of the spine."}, {"key": "B", "text": "As a potential 'Trigger' that shifted their Mental, Emotional, and Spiritual (MES) state."}, {"key": "C", "text": "As a subjective exaggeration that should be ignored in favor of lab results."}, {"key": "D", "text": "As an indication of a primary 'Transport' node imbalance."}], "answer": "B", "rationale": "As a potential 'Trigger' that shifted their Mental, Emotional, and Spiritual (MES) state. Traumatic events can serve as triggers that alter the patient's internal narrative and 'Environment of Insight'.", "caseContext": null}, {"id": 2, "question": "Which clinical imbalance node would be most affected by 'Oxidative Stress' and a lack of protective antioxidants like glutathione?", "options": [{"key": "A", "text": "Energy"}, {"key": "B", "text": "Defense and Repair"}, {"key": "C", "text": "Biotransformation"}, {"key": "D", "text": "Communication"}], "answer": "A", "rationale": "Energy Oxidative stress directly impacts mitochondrial function and the efficiency of the Electron Transport Chain.", "caseContext": null}, {"id": 3, "question": "According to the GOTOIT heuristic, the 'Track' phase involves:", "options": [{"key": "A", "text": "Monitoring the patient's progress and adjusting the treatment plan over time."}, {"key": "B", "text": "Retelling the patient's story using the Timeline."}, {"key": "C", "text": "Ordering a complete set of genetic tests."}, {"key": "D", "text": "Charging the patient for a follow-up visit."}], "answer": "A", "rationale": "Monitoring the patient's progress and adjusting the treatment plan over time. The 'Track' phase ensures the therapeutic partnership is working and allows for adjustments as the patient's health evolves.", "caseContext": null}, {"id": 4, "question": "If a patient has 'Low HDL' and 'High Triglycerides,' which ABCD category is the clinician currently assessing?", "options": [{"key": "A", "text": "Dietary Evaluation"}, {"key": "B", "text": "Clinical Indicators"}, {"key": "C", "text": "Biomarkers"}, {"key": "D", "text": "Anthropometrics"}], "answer": "C", "rationale": "Biomarkers Standard laboratory values like cholesterol and triglycerides are classic examples of biomarkers.", "caseContext": null}, {"id": 5, "question": "In Functional Medicine, how is 'Spirituality' differentiated from 'Religion' in the clinical encounter?", "options": [{"key": "A", "text": "They are considered identical and are mapped to the 'Communication' node."}, {"key": "B", "text": "Spirituality is only assessed in terminal cases, whereas religion is assessed in all cases."}, {"key": "C", "text": "Religion is an organized set of beliefs, while spirituality is the patient's individual sense of meaning and purpose."}, {"key": "D", "text": "Spirituality is considered irrelevant to physiological health, while religion is a lifestyle factor."}], "answer": "C", "rationale": "Religion is an organized set of beliefs, while spirituality is the patient's individual sense of meaning and purpose. Spirituality refers to how a patient connects to something larger than themselves, which provides resilience in the face of illness.", "caseContext": null}, {"id": 6, "question": "A patient reports that their grandmother and mother both suffered from severe autoimmune conditions. In the Functional Medicine Matrix, this family history is categorized as a(n):", "options": [{"key": "A", "text": "Trigger"}, {"key": "B", "text": "Antecedent"}, {"key": "C", "text": "Mediator"}, {"key": "D", "text": "Clinical Indicator"}], "answer": "B", "rationale": "Antecedent Think about factors that are 'pre-existing' or 'inherited' rather than 'catalysts'. Antecedents are factors that predispose an individual to an illness, such as genetics or family history.", "caseContext": null}, {"id": 7, "question": "In the GOTOIT heuristic, what is the specific purpose of the 'Tell' phase for the clinician?", "options": [{"key": "A", "text": "To prescribe the initial treatment plan."}, {"key": "B", "text": "To order the necessary laboratory biomarkers."}, {"key": "C", "text": "To organize the data into the clinical tools."}, {"key": "D", "text": "To retell the patient's story back to them using the Matrix and Timeline."}], "answer": "D", "rationale": "To retell the patient's story back to them using the Matrix and Timeline. This phase focuses on the 'retelling' of the narrative to confirm accuracy and connection. Retelling ensures the clinician has correctly understood the patient's narrative and builds the therapeutic bond.", "caseContext": null}, {"id": 8, "question": "Which clinical imbalance node on the Matrix is responsible for assessing the body's lymphatic and vascular systems?", "options": [{"key": "A", "text": "Structural Integrity"}, {"key": "B", "text": "Assimilation"}, {"key": "C", "text": "Transport"}, {"key": "D", "text": "Communication"}], "answer": "C", "rationale": "Transport Consider the systems that move nutrients, waste, and immune cells throughout the body. The Transport node maps imbalances in the cardiovascular and lymphatic systems.", "caseContext": null}, {"id": 9, "question": "According to the Science of Creating Health, why are 'Modifiable Lifestyle Factors' (MLFs) placed at the bottom of the Matrix?", "options": [{"key": "A", "text": "Because they are the last things a clinician should address."}, {"key": "B", "text": "Because they only relate to genetic expression."}, {"key": "C", "text": "To indicate they are the foundation upon which all other physiological systems rest."}, {"key": "D", "text": "Because they are the least important factors in chronic disease."}], "answer": "C", "rationale": "To indicate they are the foundation upon which all other physiological systems rest. Addressing lifestyle factors is the foundational step in resolving core clinical imbalances.", "caseContext": null}, {"id": 10, "question": "A patient with a history of chronic stress exhibits 'high-fructose corn syrup consumption' and 'low fiber intake.' These would be mapped under which ABCD category?", "options": [{"key": "A", "text": "Biomarkers"}, {"key": "B", "text": "Clinical Indicators"}, {"key": "C", "text": "Anthropometrics"}, {"key": "D", "text": "Diet and Lifestyle"}], "answer": "D", "rationale": "Diet and Lifestyle Dietary habits and specific nutrient intakes are tracked under the 'D' of the ABCDs.", "caseContext": null}, {"id": 11, "question": "How does Monique Class define the 'Environment of Insight' in a way that promotes patient 'Transformation'?", "options": [{"key": "A", "text": "By creating a space where the patient discovers the 'why' behind their symptoms."}, {"key": "B", "text": "By providing a detailed printout of all lab abnormalities."}, {"key": "C", "text": "By focusing solely on the physical clinical indicators."}, {"key": "D", "text": "By the clinician assuming the role of the primary expert."}], "answer": "A", "rationale": "By creating a space where the patient discovers the 'why' behind their symptoms. Focus on the shift from 'receiving information' to 'personal discovery'. Transformation is driven by the patient's internal realization and insight into their own health journey.", "caseContext": null}, {"id": 12, "question": "Which of the following is an example of a 'Functional Lab' as opposed to a standard 'Biomarker'?", "options": [{"key": "A", "text": "Urinary Organic Acids"}, {"key": "B", "text": "Hemoglobin A1c"}, {"key": "C", "text": "Comprehensive Metabolic Panel (CMP)"}, {"key": "D", "text": "Serum Glucose"}], "answer": "A", "rationale": "Urinary Organic Acids Organic acids measure metabolic intermediates, showing how well pathways are actually functioning. Think about which test measures the 'output' or 'efficiency' of a metabolic process.", "caseContext": null}, {"id": 13, "question": "In the context of the Matrix, where would you map 'Hormonal Signaling' and 'Neurotransmitter Balance'?", "options": [{"key": "A", "text": "Defense and Repair"}, {"key": "B", "text": "Communication"}, {"key": "C", "text": "Transport"}, {"key": "D", "text": "Assimilation"}], "answer": "B", "rationale": "Communication Consider the 'messengers' of the body. Communication refers to the signaling molecules that transmit information between cells and organs.", "caseContext": null}, {"id": 14, "question": "During a 'Nutritional Physical Exam,' a clinician notices 'cracking at the corners of the mouth' (Cheilosis). This is categorized as a:", "options": [{"key": "A", "text": "Dietary Factor"}, {"key": "B", "text": "Anthropometric"}, {"key": "C", "text": "Clinical Indicator"}, {"key": "D", "text": "Biomarker"}], "answer": "C", "rationale": "Clinical Indicator Clinical indicators are physical signs of nutrient deficiencies detected during a physical examination.", "caseContext": null}, {"id": 15, "question": "A patient tells you, \"I've been successfully following my new diet and exercise plan for the last 8 months.\" Which stage of the \"Spiral of Change\" are they in?", "options": [{"key": "A", "text": "Action"}, {"key": "B", "text": "Maintenance"}, {"key": "C", "text": "Contemplation"}, {"key": "D", "text": "Preparation"}], "answer": "B", "rationale": "Maintenance Maintenance is defined as having solved the problem for more than 6 months.", "caseContext": null}, {"id": 16, "question": "In the GOTOIT heuristic, during the 'Order' phase, which criteria should a clinician use to prioritize which clinical imbalances to address first?", "options": [{"key": "A", "text": "The patient's personal goals and the most foundational lifestyle imbalances."}, {"key": "B", "text": "Starting with the most expensive functional tests to rule out rare conditions."}, {"key": "C", "text": "Addressing all seven clinical imbalances simultaneously to ensure systemic coverage."}, {"key": "D", "text": "The most complex biomarker abnormalities identified in the lab reports."}], "answer": "A", "rationale": "The patient's personal goals and the most foundational lifestyle imbalances. Prioritization focuses on the patient's readiness and the modifiable lifestyle factors that provide the base for physiological healing.", "caseContext": null}, {"id": 17, "question": "A patient presents with chronic musculoskeletal pain and evidence of increased intestinal permeability. Which node on the Matrix serves as the primary location for mapping both 'barrier function' and 'physical scaffolding'?", "options": [{"key": "A", "text": "Communication"}, {"key": "B", "text": "Defense and Repair"}, {"key": "C", "text": "Structural Integrity"}, {"key": "D", "text": "Assimilation"}], "answer": "C", "rationale": "Structural Integrity Think about the physical 'boundaries' of the body's systems. This node encompasses the health of membranes, barriers (gut/ brain), and the musculoskeletal system.", "caseContext": null}, {"id": 18, "question": "How does the 'Rebalance' step specifically address the 'N' (Nervous System) node to improve gallbladder function?", "options": [{"key": "A", "text": "By reducing the production of cholesterol in the liver."}, {"key": "B", "text": "By increasing sympathetic tone to move bile more quickly through the ducts."}, {"key": "C", "text": "By using stress to trigger the release of bile as a protective mechanism."}, {"key": "D", "text": "By shifting the body into parasympathetic dominance to stimulate CCK release and gallbladder contraction."}], "answer": "D", "rationale": "By shifting the body into parasympathetic dominance to stimulate CCK release and gallbladder contraction. The 'rest and digest' state is essential for the hormonal and neural signals that trigger bile release.", "caseContext": null}, {"id": 19, "question": "A patient has a history of chronic NSAID use. Which biomarker would be most appropriate to monitor for 'occult' damage to the small intestinal mucosa?", "options": [{"key": "A", "text": "Serum Gastrin"}, {"key": "B", "text": "Breath Hydrogen"}, {"key": "C", "text": "Pancreatic Elastase-1"}, {"key": "D", "text": "Fecal Calprotectin"}], "answer": "D", "rationale": "Fecal Calprotectin You're looking for a marker of localized inflammation in the gut wall. NSAIDs are known to cause 'NSAID enteropathy,' and Calprotectin is a sensitive marker for the resulting neutrophil- driven inflammation.", "caseContext": null}, {"id": 20, "question": "In the DIGIN framework, why is 'mastication' (chewing) considered a critical first step in the 'D' (Digestion) node?", "options": [{"key": "A", "text": "It is the only way to activate pancreatic lipase."}, {"key": "B", "text": "It neutralizes stomach acid before it reaches the esophagus."}, {"key": "C", "text": "It increases the surface area for enzymes and triggers cephalic phase secretions."}, {"key": "D", "text": "It prevents the reabsorption of estrogens in the colon."}], "answer": "C", "rationale": "It increases the surface area for enzymes and triggers cephalic phase secretions. Physical breakdown is vital, but the act of chewing also signals the brain to begin secreting HCl and enzymes.", "caseContext": null}, {"id": 21, "question": "What is the primary rationale for using 'Saccharomyces boulardii' during the 'Remove' phase when a patient is taking antibiotics?", "options": [{"key": "A", "text": "It permanently colonizes the gut to replace lost Lactobacillus species."}, {"key": "B", "text": "It directly produces hydrochloric acid to help digest the medication."}, {"key": "C", "text": "It is a beneficial yeast that is not killed by antibiotics and helps prevent opportunistic infections."}, {"key": "D", "text": "It helps the antibiotics penetrate the bacterial cell wall more effectively."}], "answer": "C", "rationale": "It is a beneficial yeast that is not killed by antibiotics and helps prevent opportunistic infections. Being a yeast, it survives antibiotic therapy and competes for space/nutrients, reducing the risk of antibiotic-associated diarrhea.", "caseContext": null}, {"id": 22, "question": "Which specific finding in a stool analysis would provide the strongest evidence for 'Immune Exhaustion' within the Inflammation/Immune (I) node of DIGIN?", "options": [{"key": "A", "text": "Presence of occult blood without an elevation in fecal Lactoferrin."}, {"key": "B", "text": "Elevated Calprotectin paired with low-normal Secretory IgA."}, {"key": "C", "text": "Low Eosinophil Protein X in a patient with known food sensitivities."}, {"key": "D", "text": "High Fecal Fat and high fecal Secretory IgA."}], "answer": "B", "rationale": "Elevated Calprotectin paired with low-normal Secretory IgA. High markers of active inflammation (Calprotectin) alongside a failure to mount a robust mucosal antibody response (sIgA) suggests the GALT is depleted.", "caseContext": null}, {"id": 23, "question": "In the context of the 'Repair' phase, what is the biochemical rationale for choosing Zinc Carnosine over other forms of zinc for a patient with gastric mucosal erosions?", "options": [{"key": "A", "text": "It bypasses the need for hydrochloric acid for systemic absorption."}, {"key": "B", "text": "It acts as a direct prebiotic for butyrate-producing bacteria."}, {"key": "C", "text": "It uniquely stimulates the release of secretin from the duodenum."}, {"key": "D", "text": "It dissociates slowly in the stomach, allowing it to adhere to and protect lesioned tissue."}], "answer": "D", "rationale": "It dissociates slowly in the stomach, allowing it to adhere to and protect lesioned tissue. The chelate structure of zinc carnosine allows it to stick to gastric ulcers and erosions, providing a localized healing effect.", "caseContext": null}, {"id": 24, "question": "A patient with chronic biliary stasis is undergoing a 5R protocol. Which 'Replace' intervention is most critical to ensure the effectiveness of the 'Remove' phase involving lipid-soluble antimicrobials?", "options": [{"key": "A", "text": "Bile salts (e.g., Ox bile)"}, {"key": "B", "text": "Betaine Hydrochloride"}, {"key": "C", "text": "Bromelain"}, {"key": "D", "text": "Amylase"}], "answer": "A", "rationale": "Bile salts (e.g., Ox bile) Bile salts are essential for the emulsification and absorption of fat-soluble substances, including many botanical antimicrobials and fat-soluble vitamins. Bromelain is a mixture of enzymes from pineapple plants used as a dietary supplement for its anti-inflammatory and protein-digesting properties.", "caseContext": null}, {"id": 25, "question": "Which physiological mechanism explains why Corticotropin-Releasing Hormone (CRH) during acute stress directly impacts Intestinal Permeability?", "options": [{"key": "A", "text": "It directly inhibits the synthesis of occludin and claudin mRNA in the nucleus."}, {"key": "B", "text": "It triggers mast cell degranulation, releasing proteases that compromise tight junctions."}, {"key": "C", "text": "It causes a rapid increase in the production of gastric pepsinogen."}, {"key": "D", "text": "It stimulates the overgrowth of Gram-negative bacteria in the ileum."}], "answer": "B", "rationale": "It triggers mast cell degranulation, releasing proteases that compromise tight junctions. Stress-induced CRH activates mast cells in the gut, which release mediators that degrade the protein structures maintaining the intestinal barrier.", "caseContext": null}, {"id": 26, "question": "When interpreting a Lactulose/Mannitol test, how should a result showing low recovery of both sugars but a normal L/M ratio be interpreted?", "options": [{"key": "A", "text": "High levels of serum Zonulin interfering with the renal clearance of the sugars."}, {"key": "B", "text": "Excessive bacterial fermentation of the sugar probes in the small intestine."}, {"key": "C", "text": "Severe 'Leaky Gut' syndrome with high systemic inflammation."}, {"key": "D", "text": "General malabsorption or reduced surface area without increased paracellular leakage."}], "answer": "D", "rationale": "General malabsorption or reduced surface area without increased paracellular leakage. Low recovery of both indicates a reduction in total absorptive capacity, but the normal ratio suggests the 'leakiness' is not disproportionately high.", "caseContext": null}, {"id": 27, "question": "In the DIGIN framework, why is the 'N' (Nervous System) node often considered the 'gatekeeper' for the 'Replace' phase?", "options": [{"key": "A", "text": "Vagal tone is required to stimulate the cephalic phase of digestion and endogenous secretions."}, {"key": "B", "text": "Sympathetic dominance is necessary to maximize nutrient absorption in the ileum."}, {"key": "C", "text": "Nerve endings in the brush border are the primary site of zinc and magnesium absorption."}, {"key": "D", "text": "The enteric nervous system produces the majority of the body's digestive enzymes."}], "answer": "A", "rationale": "Vagal tone is required to stimulate the cephalic phase of digestion and endogenous secretions. The parasympathetic nervous system (via the vagus nerve) triggers the release of HCl, bile, and enzymes; without it, 'Replacing' is only a temporary fix.", "caseContext": null}, {"id": 28, "question": "In the context of the 'Replace' phase, which physiological finding would make the use of Bitter Herbs a more appropriate first-line choice than Betaine HCl for a patient with upper GI distress?", "options": [{"key": "A", "text": "The patient reports symptoms appearing 2-3 hours after a meal."}, {"key": "B", "text": "The patient is currently taking high-dose pancreatic enzymes."}, {"key": "C", "text": "The patient has confirmed achlorhydria via a Heidelberg capsule test."}, {"key": "D", "text": "The patient has a history of active peptic ulcers or severe gastritis."}], "answer": "D", "rationale": "The patient has a history of active peptic ulcers or severe gastritis. Bitters stimulate endogenous secretions via the cephalic phase without the direct corrosive risk of supplemental acid in a damaged mucosal lining. A is not quite correct since late-onset symptoms are more indicative of lower GI issues or SIBO rather than the immediate acid- dependent phase of digestion.", "caseContext": null}, {"id": 29, "question": "A patient presents with a 'High-Normal' Fecal Calprotectin (e.g., 45 μg/g) and chronic joint pain. Within the DIGIN framework, why might this result still warrant an investigation into the 'I' (Intestinal Permeability) node?", "options": [{"key": "A", "text": "Low-grade mucosal inflammation can still drive systemic 'leaky gut' and antigen trafficking even if it's below the clinical cutoff for IBD."}, {"key": "B", "text": "Calprotectin levels are inversely proportional to intestinal permeability."}, {"key": "C", "text": "A value of 45 μg/g confirms the presence of Crohn's disease."}, {"key": "D", "text": "Calprotectin is a specific marker for paracellular transport proteins."}], "answer": "A", "rationale": "Low-grade mucosal inflammation can still drive systemic 'leaky gut' and antigen trafficking even if it's below the clinical cutoff for IBD. Functional medicine often views borderline markers as indicative of early-stage dysfunction or subclinical inflammation.", "caseContext": null}, {"id": 30, "question": "During the 'Repair' phase, how does the mechanism of action of DGL (Deglycyrrhizinated Licorice) differ from that of L-Glutamine?", "options": [{"key": "A", "text": "DGL acts as a prebiotic for the microbiome, while L-Glutamine acts as an antimicrobial."}, {"key": "B", "text": "DGL increases cortisol to reduce inflammation, while L-Glutamine decreases it."}, {"key": "C", "text": "L-Glutamine is used for the stomach, while DGL is used only for the colon."}, {"key": "D", "text": "DGL supports the gastric mucous barrier and cell longevity, while L-Glutamine provides fuel for enterocyte regeneration."}], "answer": "D", "rationale": "DGL supports the gastric mucous barrier and cell longevity, while L-Glutamine provides fuel for enterocyte regeneration. One focuses on the protective coating, the other on the cellular 'building blocks' themselves. DGL is primarily focused on the protective mucus layer and epithelial life-span, whereas glutamine is the primary nitrogen source for rapidly dividing gut cells.", "caseContext": null}, {"id": 31, "question": "What is the primary rationale for addressing the 'N' (Nervous System) node before or alongside the 'Remove' phase in a patient with recurrent SIBO?", "options": [{"key": "A", "text": "Nervous system support is required to kill Gram-negative bacteria directly."}, {"key": "B", "text": "The 'N' node controls the pH of the small intestine, which kills the bacteria."}, {"key": "C", "text": "Stress management prevents the bacteria from consuming hydrogen gas."}, {"key": "D", "text": "To restore the Migrating Motor Complex (MMC) function, which is necessary to prevent immediate re- colonization."}], "answer": "D", "rationale": "To restore the Migrating Motor Complex (MMC) function, which is necessary to prevent immediate re-colonization. Without the 'cleansing wave' provided by the MMC (vagal-mediated), bacteria will likely return shortly after antimicrobial treatment ends.", "caseContext": null}, {"id": 32, "question": "In a patient with chronic 'G' (Gut Microbiota) dysbiosis and high Fecal Beta-glucuronidase, which dietary strategy would most logically support the elimination of de-conjugated toxins?", "options": [{"key": "A", "text": "Increasing Calcium-D-Glutarate and cruciferous vegetables."}, {"key": "B", "text": "Adopting a low-residue, low-fiber diet to slow down transit."}, {"key": "C", "text": "Increasing simple sugars to feed the beneficial bacteria."}, {"key": "D", "text": "Restricting all protein to reduce nitrogenous waste."}], "answer": "A", "rationale": "Increasing Calcium-D-Glutarate and cruciferous vegetables. Calcium-D-Glucarate directly inhibits the beta-glucuronidase enzyme, while cruciferous veggies support the initial Phase II conjugation.", "caseContext": null}, {"id": 33, "question": "A patient has low Pancreatic Elastase-1 and low fecal sIgA. Within the 5R program, how does this combination impact the 'Reinoculate' phase?", "options": [{"key": "A", "text": "Probiotics should only be given if sIgA is high to ensure they are 'tagged' by the immune system."}, {"key": "B", "text": "The lack of enzymes and low mucosal immunity may make it harder for beneficial probiotics to survive and colonize without parallel 'Replace' and 'Repair' support."}, {"key": "C", "text": "Low sIgA means probiotics will grow too fast and cause SIBO."}, {"key": "D", "text": "Pancreatic enzymes are toxic to Bifidobacteria."}], "answer": "B", "rationale": "The lack of enzymes and low mucosal immunity may make it harder for beneficial probiotics to survive and colonize without parallel 'Replace' and 'Repair' support. Think about the 'environment' or 'soil' in which you are trying to plant the 'seeds' (probiotics). Successful colonization requires a hospitable environment; undigested food and low sIgA (poor defense) create an environment of inflammation/ dysbiosis.", "caseContext": null}, {"id": 34, "question": "Which of the following is a key 'Rebalance' clinical pearl for patients with 'D' (Digestion) issues related to the cephalic phase?", "options": [{"key": "A", "text": "Drinking large amounts of water during the meal to dilute the gastric juices."}, {"key": "B", "text": "Avoiding all fats to prevent the need for bile secretion."}, {"key": "C", "text": "Practicing mindful eating and thorough chewing to trigger the vagal-mediated release of HCl and enzymes."}, {"key": "D", "text": "Taking a cold shower immediately after eating to stimulate the sympathetic nervous system."}], "answer": "C", "rationale": "Practicing mindful eating and thorough chewing to trigger the vagal-mediated release of HCl and enzymes. The cephalic phase of digestion begins in the brain and is transmitted via the vagus nerve before food even hits the stomach.", "caseContext": null}, {"id": 35, "question": "What is the primary role of the 'Inflammasome' (e.g., NLRP3) within the innate immune response?", "options": [{"key": "A", "text": "To produce specific IgG antibodies against viral antigens."}, {"key": "B", "text": "To act as a protein complex that triggers the maturation of pro-inflammatory cytokines like IL-1beta."}, {"key": "C", "text": "To inhibit the translocation of NF-kappaB into the nucleus."}, {"key": "D", "text": "To repair the basement membrane of the intestinal mucosa."}], "answer": "B", "rationale": "To act as a protein complex that triggers the maturation of pro-inflammatory cytokines like IL-1beta. The inflammasome processes inactive precursors into active cytokines in response to 'danger signals'.", "caseContext": null}, {"id": 36, "question": "A patient with systemic inflammation exhibits a high AA:EPA ratio. Beyond increasing fish oil, which dietary strategy is most effective for shifting the eicosanoid balance by limiting the pool of available pro-inflammatory precursors?", "options": [{"key": "A", "text": "Increasing intake of nightshade vegetables to support immune diversity."}, {"key": "B", "text": "Consuming high amounts of alpha-linolenic acid (ALA) from flaxseed only."}, {"key": "C", "text": "Reducing the intake of grain-fed meats and commercial vegetable oils."}, {"key": "D", "text": "Switching from saturated fats to hydrogenated margarines."}], "answer": "C", "rationale": "Reducing the intake of grain-fed meats and commercial vegetable oils. Grain-fed meats and commercial vegetable oils are the primary exogenous sources of Arachidonic Acid and its precursor, Linoleic Acid.", "caseContext": null}, {"id": 37, "question": "In a patient with 'Th17-dominant' autoimmunity, which nutrient deficiency would most likely exacerbate the condition by failing to stabilize T-regulatory (Treg) cells?", "options": [{"key": "A", "text": "Vitamin D"}, {"key": "B", "text": "Calcium"}, {"key": "C", "text": "Vitamin K2"}, {"key": "D", "text": "Iodine"}], "answer": "A", "rationale": "Vitamin D Vitamin D is critical for the differentiation of Treg cells which help maintain self-tolerance and suppress Th17 activity. This nutrient acts more like a hormone and has significant genomic effects on immune cell maturation.", "caseContext": null}, {"id": 38, "question": "A patient presents with 'Sickness Behavior' including social withdrawal and lethargy despite no visible infection. Which biochemical pathway explains this systemic effect?", "options": [{"key": "A", "text": "Excessive production of Serotonin in the gut lumen."}, {"key": "B", "text": "Suppression of NF-kappaB in the hypothalamus."}, {"key": "C", "text": "Direct inhibition of the HPA axis by dietary saturated fats."}, {"key": "D", "text": "Increased production of peripheral cytokines that signal the brain via the vagus nerve."}], "answer": "D", "rationale": "Increased production of peripheral cytokines that signal the brain via the vagus nerve. Peripheral inflammation communicates with the CNS to induce behavioral changes designed to conserve energy for healing.", "caseContext": null}, {"id": 39, "question": "When assessing the 'Total Load' of a patient with chronic fatigue, you find evidence of reactivated Epstein- Barr Virus (EBV). How should this be classified on the IFM Matrix?", "options": [{"key": "A", "text": "Trigger"}, {"key": "B", "text": "Antecedent"}, {"key": "C", "text": "Structural Integrity"}, {"key": "D", "text": "Assimilation"}], "answer": "A", "rationale": "Trigger A viral reactivation acts as a discrete event that initiates or maintains the current immune response.", "caseContext": null}, {"id": 40, "question": "In the 'Case Management of Allergic Disease,' why is identifying 'Hypochlorhydria' considered a priority 'Antecedent'?", "options": [{"key": "A", "text": "Hypochlorhydria directly inhibits the production of IgE antibodies."}, {"key": "B", "text": "Low stomach acid prevents the breakdown of proteins into non-allergenic amino acids."}, {"key": "C", "text": "Stomach acid is required to activate the Th2 immune response."}, {"key": "D", "text": "Low acid increases the absorption of Vitamin C, which stabilizes mast cells."}], "answer": "B", "rationale": "Low stomach acid prevents the breakdown of proteins into non-allergenic amino acids. Large, undigested protein fragments are more likely to be recognized as antigens by the Gut- Associated Lymphoid Tissue (GALT).", "caseContext": null}, {"id": 41, "question": "Which botanical acts as a 'dual inhibitor' by targeting both the 5-Lipoxygenase (5-LOX) enzyme and the NF- kappaB signaling pathway?", "options": [{"key": "A", "text": "Valerian Root"}, {"key": "B", "text": "Milk Thistle"}, {"key": "C", "text": "Boswellia serrata"}, {"key": "D", "text": "Echinacea purpurea"}], "answer": "C", "rationale": "Boswellia serrata Boswellic acids are unique in their ability to inhibit 5-LOX and prevent the translocation of NF- kappaB into the nucleus. This is a botanical frequently used for joint health and inflammatory bowel conditions.", "caseContext": null}, {"id": 42, "question": "A patient with Hashimoto's Thyroiditis continues to have high antibody titers despite a gluten-free diet. Based on the concept of 'molecular mimicry,' which other food protein is most commonly cross-reactive?", "options": [{"key": "A", "text": "Rice (Oryzenin)"}, {"key": "B", "text": "Dairy (Casein)"}, {"key": "C", "text": "Broccoli (Sulforaphane)"}, {"key": "D", "text": "Leafy Greens (Chlorophyll)"}], "answer": "B", "rationale": "Dairy (Casein) Casein shares structural similarities with gluten and thyroid tissue, often leading to continued immune activation in sensitive patients.", "caseContext": null}, {"id": 43, "question": "A patient with a high intake of vegetable oils and commercial poultry presents with elevated markers of inflammation. Which specific nutrient, when supplemented, acts to competitively inhibit the Delta-5-desaturase enzyme to reduce the production of series-4 leukotrienes?", "options": [{"key": "A", "text": "Oleic acid"}, {"key": "B", "text": "Alpha-linolenic acid (ALA)"}, {"key": "C", "text": "Eicosapentaenoic acid (EPA)"}, {"key": "D", "text": "Gamma-linolenic acid (GLA)"}], "answer": "C", "rationale": "Eicosapentaenoic acid (EP A) Think about the omega-3 fatty acid that prevents the 'shunting' of DGLA toward the pro- inflammatory series-2 prostaglandins. EPA acts as a competitive inhibitor of the enzyme that converts Dihomo-gamma-linolenic acid (DGLA) into pro-inflammatory Arachidonic Acid (AA).", "caseContext": null}, {"id": 44, "question": "Which set of conditions is most accurately categorized as 'Auto-inflammatory,' characterized by innate immune system dysfunction rather than adaptive immune auto-antibodies?", "options": [{"key": "A", "text": "Familial Mediterranean Fever and Gout"}, {"key": "B", "text": "Rheumatoid Arthritis and Systemic Lupus Erythematosus"}, {"key": "C", "text": "Hashimoto’s Thyroiditis and Celiac Disease"}, {"key": "D", "text": "Type 1 Diabetes and Multiple Sclerosis"}], "answer": "A", "rationale": "Familial Mediterranean Fever and Gout These conditions are driven by over-activation of the inflammasome (NLRP3) and IL-1beta production within the innate immune system.", "caseContext": null}, {"id": 45, "question": "A patient with systemic inflammation and joint pain shows a deficiency in Secretory IgA (sIgA). According to the Immune APM, this finding most directly reflects a failure in which part of the immune system?", "options": [{"key": "A", "text": "Cell-mediated Th1 response"}, {"key": "B", "text": "Systemic humoral immunity"}, {"key": "C", "text": "Th17/Treg balance"}, {"key": "D", "text": "Innate mucosal defense"}], "answer": "D", "rationale": "Innate mucosal defense sIgA is the primary immunoglobulin of the mucosal surfaces and represents the first line of innate-associated defense in the gut.", "caseContext": null}, {"id": 46, "question": "In the 'Working Upstream' model, which molecular complex must be phosphorylated and degraded to allow NF-kappaB to enter the nucleus and initiate transcription of pro-inflammatory cytokines?", "options": [{"key": "A", "text": "JAK-STAT complex"}, {"key": "B", "text": "Cyclooxygenase-2 (COX-2)"}, {"key": "C", "text": "IkappaB (IkB)"}, {"key": "D", "text": "NLRP3 Inflammasome"}], "answer": "C", "rationale": "IkappaB (IkB) This 'inhibitor' must be removed before the transcription factor can act on the DNA. IkB acts as an inhibitory chaperone that keeps NF-kappaB sequestered in the cytoplasm until it is degraded.", "caseContext": null}, {"id": 47, "question": "A practitioner is assessing 'Total Load' in a patient with chronic fatigue. The presence of high levels of Arabinose on an Organic Acid Test (OAT) suggests that which trigger is contributing to the patient's immune activation?", "options": [{"key": "A", "text": "Heavy Metal Toxicity"}, {"key": "B", "text": "Candida albicans overgrowth"}, {"key": "C", "text": "Lyme Borreliosis"}, {"key": "D", "text": "Environmental Mycotoxins"}], "answer": "B", "rationale": "Candida albicans overgrowth Arabinose is a sugar alcohol produced by the fermentation of yeast/fungi like Candida in the gastrointestinal tract. Candida is a common fungal organism that can lead to 'brain fog' and systemic inflammation.", "caseContext": null}, {"id": 48, "question": "Which biomarker is considered a superior indicator of chronic, low-grade systemic inflammation compared to standard CRP because it can detect levels below 3.0 mg/L?", "options": [{"key": "A", "text": "Interleukin-6 (IL-6)"}, {"key": "B", "text": "Erythrocyte Sedimentation Rate (ESR)"}, {"key": "C", "text": "High-sensitivity CRP (hs-CRP)"}, {"key": "D", "text": "Fibrinogen"}], "answer": "C", "rationale": "High-sensitivity CRP (hs-CRP) hs-CRP uses more sensitive assays to measure low-level inflammation that standard CRP tests might miss. This test is frequently used in cardiovascular risk assessment to find inflammation in 'healthy' appearing individuals.", "caseContext": null}, {"id": 49, "question": "When addressing a patient with 'Total Load' issues, why is it vital to identify and treat a 'hidden' Stachybotrys exposure in a patient already being treated for Lyme disease?", "options": [{"key": "A", "text": "Mold exposure lowers the levels of IgG, making Lyme testing impossible."}, {"key": "B", "text": "Mold acts as a persistent trigger that keeps the innate immune system in a state of SIRS."}, {"key": "C", "text": "Mold toxins directly inhibit the absorption of antibiotics used for Lyme."}, {"key": "D", "text": "Stachybotrys and Borrelia are genetically identical organisms."}], "answer": "B", "rationale": "Mold acts as a persistent trigger that keeps the innate immune system in a state of SIRS. Cumulative triggers prevent the immune system from successfully resolving any single infection, keeping the inflammatory 'bucket' full.", "caseContext": null}, {"id": 50, "question": "Which dietary 'pseudo-allergen' is frequently associated with the clinical 'triad' of asthma, nasal polyps, and chronic rhinosinusitis, even when IgE testing is negative?", "options": [{"key": "A", "text": "Oxalates"}, {"key": "B", "text": "Lactose"}, {"key": "C", "text": "Salicylates"}, {"key": "D", "text": "Histamine"}], "answer": "C", "rationale": "Salicylates Salicylate intolerance can trigger leukotriene-mediated respiratory symptoms and is often associated with nasal polyps. This compound is found in many fruits, vegetables, and aspirin.", "caseContext": null}, {"id": 51, "question": "The presence of 'Gum Disease' is categorized as a source of dysfunction in which part of the IFM Cardiometabolic Matrix?", "options": [{"key": "A", "text": "Transport"}, {"key": "B", "text": "Structural Integrity"}, {"key": "C", "text": "Defense & Repair"}, {"key": "D", "text": "Biotransformation"}], "answer": "C", "rationale": "Defense & Repair The Matrix lists chronic infections, specifically dental/gum disease, under the Defense & Repair node as a driver of systemic inflammation.", "caseContext": null}, {"id": 52, "question": "According to the IFM Clinical Decision Tree, what is the '1º Treatment' priority for all cardiometabolic risk patterns?", "options": [{"key": "A", "text": "Advanced Laboratory testing (CAC/CIMT)"}, {"key": "B", "text": "Targeted Phyto-nutritional supplementation"}, {"key": "C", "text": "Modifiable Lifestyle Factors (MLF)"}, {"key": "D", "text": "Red Flag referrals"}], "answer": "C", "rationale": "Modifiable Lifestyle Factors (MLF) The Decision Tree mandates starting with MLF (Sleep, Movement, Nutrition, etc.) as the primary (1º) intervention for all patterns.", "caseContext": null}, {"id": 53, "question": "In the context of 'Vascular/Endothelial Function,' which physical assessment finding is considered a clinical indicator of peripheral vascular disease?", "options": [{"key": "A", "text": "High MCV"}, {"key": "B", "text": "Ankle-Brachial Index (ABI)"}, {"key": "C", "text": "Acanthosis Nigricans"}, {"key": "D", "text": "Heart Rate Variability (HRV)"}], "answer": "B", "rationale": "Ankle-Brachial Index (ABI) The A:B Index is explicitly listed in the Clinical Decision Tree as a key indicator for peripheral artery/vascular disease. This measurement compares blood pressure at the ankle and the arm.", "caseContext": null}, {"id": 54, "question": "A patient's lab report shows an elevated GGT and ALT. According to the IFM 'Gather' phase, which physiological risk pattern should the practitioner investigate first?", "options": [{"key": "A", "text": "Lipid Burden"}, {"key": "B", "text": "Coagulation"}, {"key": "C", "text": "Immune & Toxic Burden"}, {"key": "D", "text": "Metabolic Function"}], "answer": "D", "rationale": "Metabolic Function Elevated GGT and ALT are specific biomarkers listed under the Metabolic Function risk pattern, often indicating NAFLD or insulin resistance.", "caseContext": null}, {"id": 55, "question": "According to the Decision Tree, which biomarker is a primary (1º) diagnostic indicator for the 'Coagulation' risk pattern?", "options": [{"key": "A", "text": "Homocysteine"}, {"key": "B", "text": "Fasting Glucose"}, {"key": "C", "text": "Myeloperoxidase (MPO)"}, {"key": "D", "text": "Lp-PLA2"}], "answer": "A", "rationale": "Homocysteine Homocysteine is a key laboratory marker for the Coagulation pattern and often signals a need for B-vitamin support. This marker is often elevated in patients with a history of thrombosis or miscarriage.", "caseContext": null}, {"id": 56, "question": "A patient with the APOE 4 allele is being treated. Which '2º Treatment' strategy is specifically prioritized for this genotype to manage Lipid Burden?", "options": [{"key": "A", "text": "Restrict saturated fats and alcohol"}, {"key": "B", "text": "Prioritize a high-sodium DASH diet"}, {"key": "C", "text": "Increase intake of red yeast rice"}, {"key": "D", "text": "Supplement with high-dose Niacin (B3)"}], "answer": "A", "rationale": "Restrict saturated fats and alcohol APOE 4 carriers are genetically sensitive to saturated fats and alcohol, which can significantly drive up LDL-C and particle count. The term “secondary treatment” in this question is being used to describe the APOE4-specific precision branch of the IFM decision tree, rather than the universal foundational interventions that apply to all patients. In the IFM framework, foundational lifestyle strategies (sleep, exercise, glycemic balance, overall nutrition) are considered the universal first-line tier. Once APOE4 is identified, the decision tree then moves into a genotype-specific secondary branch, where the priority becomes interventions uniquely important for APOE4 carriers. Within that branch, restricting saturated fats and alcohol is the specifically prioritized strategy, because APOE4 carriers tend to have a disproportionate rise in LDL-C and particle number in response to these exposures. Some can reason that lifestyle is a “primary treatment” but this question is specifically asking about the secondary precision-treatment branch after genotype identification.", "caseContext": null}, {"id": 57, "question": "When organizing a patient's story, where should 'Chronic Stress' be placed if it is currently driving hyperinsulinemia and visceral adiposity?", "options": [{"key": "A", "text": "Mediators/Perpetuators"}, {"key": "B", "text": "Triggering Events"}, {"key": "C", "text": "Antecedents"}, {"key": "D", "text": "Structural Integrity"}], "answer": "A", "rationale": "Mediators/Perpetuators Mediators or perpetuators are ongoing factors that sustain a disease process, like chronic stress driving insulin resistance.", "caseContext": null}, {"id": 58, "question": "Which clinical assessment tool is specifically mentioned in the 'Gather' phase to identify Peripheral Artery Disease?", "options": [{"key": "A", "text": "Ankle-Brachial Index (ABI)"}, {"key": "B", "text": "Pulse-Oximetry (P-O2)"}, {"key": "C", "text": "Waist-to-Hip Ratio (WHR)"}, {"key": "D", "text": "Heart Rate Variability (HRV)"}], "answer": "A", "rationale": "Ankle-Brachial Index (ABI) The ABI is the primary tool listed in the Decision Tree for gathering evidence of peripheral vascular disease. This test compares the blood pressure measured at your ankle with the blood pressure measured at your arm.", "caseContext": null}, {"id": 59, "question": "In the IFM Matrix, 'Lipotoxicity' and 'Mitochondropathies' are dysfunctions grouped under which node?", "options": [{"key": "A", "text": "Assimilation"}, {"key": "B", "text": "Biotransformation"}, {"key": "C", "text": "Energy"}, {"key": "D", "text": "Transport"}], "answer": "C", "rationale": "Energy The Energy node manages cellular metabolism, including mitochondrial health and the consequences of calorie excess (lipotoxicity).", "caseContext": null}, {"id": 60, "question": "A patient taking a chronic NSAID or COX-2 inhibitor should have which risk pattern evaluated due to potential GI and inflammatory burden?", "options": [{"key": "A", "text": "Immune & Toxic Burden"}, {"key": "B", "text": "Metabolic Function"}, {"key": "C", "text": "Coagulation"}, {"key": "D", "text": "Autonomic Function"}], "answer": "A", "rationale": "Immune & Toxic Burden Chronic NSAID use is explicitly listed as a risk factor under the Immune & Toxic Burden pattern.", "caseContext": null}, {"id": 61, "question": "Which laboratory marker is identified as a 'COULD Know' test that tracks vascular wall inflammation and plaque instability?", "options": [{"key": "A", "text": "Fasting Insulin"}, {"key": "B", "text": "Lp-PLA2 (PLAC test)"}, {"key": "C", "text": "HbA1c"}, {"key": "D", "text": "Lipid Panel (Standard)"}], "answer": "B", "rationale": "Lp-PLA2 (PLAC test) Lp-PLA2 is categorized as an advanced 'COULD Know' lab that provides specific information on plaque rupture risk. This enzyme is produced by inflammatory cells in the vascular wall. This is not part of the basic lab tests.", "caseContext": null}, {"id": 62, "question": "In the IFM framework, what is the '2º Treatment' for a patient with a Coagulation pattern imbalance and high homocysteine?", "options": [{"key": "A", "text": "Omega-3 (EPA/DHA)"}, {"key": "B", "text": "Magnesium and Arginine"}, {"key": "C", "text": "Curcumin and Probiotics"}, {"key": "D", "text": "B6, B12, and Folate"}], "answer": "D", "rationale": "B6, B12, and Folate The 2º Treatment for the Coagulation pattern specifically targets homocysteine reduction using methylated B-vitamins. These B vitamins are cofactors for the enzymes that recycle homocysteine.", "caseContext": null}, {"id": 63, "question": "A patient's lab results show elevated ESR, high homocysteine, and an increased MCV . According to the IFM Cardiometabolic Risk Patterns, which pattern is the primary concern?", "options": [{"key": "A", "text": "Metabolic Function"}, {"key": "B", "text": "Immune & Toxic Burden"}, {"key": "C", "text": "Lipid Burden"}, {"key": "D", "text": "Coagulation"}], "answer": "D", "rationale": "Coagulation This pattern focuses on factors that increase the risk of thrombosis and includes methylation- related markers. The Coagulation risk pattern specifically includes elevated ESR, MCV , and homocysteine as key diagnostic laboratory markers.", "caseContext": null}, {"id": 64, "question": "In the IFM Cardiometabolic Matrix, where is 'TMAO' (Trimethylamine N-oxide) categorized to reflect its origin in the gut microbiome?", "options": [{"key": "A", "text": "Biotransformation"}, {"key": "B", "text": "Defense & Repair"}, {"key": "C", "text": "Assimilation"}, {"key": "D", "text": "Transport"}], "answer": "C", "rationale": "Assimilation TMAO production is directly linked to gut dysbiosis and the metabolism of dietary precursors by intestinal bacteria. TMAO (Trimethylamine N-oxide) is a compound made by gut bacteria from nutrients (choline, L-carnitine) found in red meat, eggs, and dairy, linked to increased heart disease risk, stroke, and diabetes by promoting plaque, inflammation, and cholesterol buildup in arteries.", "caseContext": null}, {"id": 65, "question": "Which of the following is categorized as a 'Triggering Event' in the Cardiometabolic Matrix, often initiating the progression of vascular disease?", "options": [{"key": "A", "text": "APOE 4 Status"}, {"key": "B", "text": "Infection or Dysbiosis"}, {"key": "C", "text": "Family History of CVD"}, {"key": "D", "text": "Hyperinsulinemia"}], "answer": "B", "rationale": "Infection or Dysbiosis Triggering events are discrete incidents like infections or acute toxic exposures that set off a cascade of physiological imbalances.", "caseContext": null}, {"id": 66, "question": "A patient presenting with symptoms of 'Anxiety' and 'Depression' alongside 'Arrhythmias' should be evaluated for which risk pattern?", "options": [{"key": "A", "text": "Autonomic"}, {"key": "B", "text": "Vascular/Endothelial Function"}, {"key": "C", "text": "Coagulation"}, {"key": "D", "text": "Metabolic Function"}], "answer": "A", "rationale": "Autonomic This pattern relates to the body's stress response system and the HPA axis. The Autonomic risk pattern includes mental/ emotional symptoms like anxiety and depression alongside cardiac rhythm issues like arrhythmias.", "caseContext": null}, {"id": 67, "question": "A patient's lab report shows a 'Crash' pattern: high morning cortisol followed by a steep drop to below-normal levels by noon. According to the module, this pattern is highly suggestive of:", "options": [{"key": "A", "text": "Excessive evening cortisol output driving morning exhaustion."}, {"key": "B", "text": "Stage 1 (Arousal) where the body is in a constant state of high output."}, {"key": "C", "text": "A failure of the negative feedback loop in the hippocampus."}, {"key": "D", "text": "Hyper-conversion of T4 to T3 in the morning hours"}], "answer": "C", "rationale": "A failure of the negative feedback loop in the hippocampus. While the hippocampus is involved in feedback, the 'Crash' pattern specifically describes the adrenal gland's inability to sustain output after a morning surge.", "caseContext": null}, {"id": 68, "question": "Which of the following describes the 'unidirectional' nature of the steroidogenic pathway?", "options": [{"key": "A", "text": "The body removes carbons during synthesis but lacks the enzymes to add them back."}, {"key": "B", "text": "Once cortisol is formed, it can never be converted into inactive cortisone."}, {"key": "C", "text": "Steroid hormones can only travel from the gland to the target cell, never back."}, {"key": "D", "text": "Hormones can only be synthesized from LDL, never from acetate."}], "answer": "A", "rationale": "The body removes carbons during synthesis but lacks the enzymes to add them back. The pathway is unidirectional because the enzymatic steps involve decreasing carbon counts (e.g., C27 to C21) which cannot be reversed.", "caseContext": null}, {"id": 69, "question": "A patient with Hashimoto's is following a gluten-free diet but still has elevated TPO antibodies. Which underlying clinical 'block' should be investigated according to the module's target for optimal conversion?", "options": [{"key": "A", "text": "Zinc intake exceeding 15 mg/day"}, {"key": "B", "text": "TSH levels residing in the 0.4 to 2.5 mIU/L range"}, {"key": "C", "text": "Consumption of cooked cruciferous vegetables"}, {"key": "D", "text": "Ferritin levels below 100 ng/mL"}], "answer": "D", "rationale": "Ferritin levels below 100 ng/mL The module identifies a Ferritin target of 100 ng/mL as critical for the iron-dependent enzymes required for thyroid hormone synthesis and conversion. A is not quite correct since although Zinc is necessary for thyroid function; the module only warns against doses exceeding 50 mg/day due to copper metabolism issues.", "caseContext": null}, {"id": 70, "question": "Regarding iodine monitoring, the module recommends a specific target for first morning urinary iodine excretion. What is this range?", "options": [{"key": "A", "text": "10 - 50 mcg/L"}, {"key": "B", "text": "Less than 50 mcg/L"}, {"key": "C", "text": "Greater than 500 mcg/L"}, {"key": "D", "text": "100 - 300 mcg/L"}], "answer": "D", "rationale": "100 - 300 mcg/L This is the specific range recommended in the module for monitoring iodine status and ensuring adequate substrate without toxicity. This target ensures there is enough 'raw material' for T4 synthesis while avoiding the risks of excess.", "caseContext": null}, {"id": 71, "question": "A 42-year-old female presents with low libido, fatigue, and high systemic inflammation. Labs reveal normal Pregnenolone but significantly low DHEA and Testosterone. Based on the steroidogenic pathway, which enzymatic activity is being inhibited by her inflammatory state?", "options": [{"key": "A", "text": "5-alpha-reductase"}, {"key": "B", "text": "17,20-lyase"}, {"key": "C", "text": "3-beta-HSD"}, {"key": "D", "text": "Aromatase"}], "answer": "B", "rationale": "17,20-lyase Inflammation and stress specifically downregulate 17,20-lyase, preventing the conversion of precursors into androgens, a process central to the 'cortisol steal.'", "caseContext": null}, {"id": 72, "question": "When addressing a patient with both significant HPA axis dysfunction and hypothyroidism, why does the hormone hierarchy mandate supporting the adrenals first?", "options": [{"key": "A", "text": "Thyroid hormone replacement will cause an immediate and permanent inhibition of ACTH."}, {"key": "B", "text": "Adrenal glandulars provide the selenium necessary for the thyroid to function."}, {"key": "C", "text": "Thyroid hormone increases metabolic demand, which can overwhelm inadequate adrenal reserves."}, {"key": "D", "text": "Cortisol is required as a direct substrate for the synthesis of T4 in the thyroid gland."}], "answer": "C", "rationale": "Thyroid hormone increases metabolic demand, which can overwhelm inadequate adrenal reserves. Revving up metabolism with thyroid hormone without adequate cortisol to support the increased cellular activity can trigger an adrenal 'crash.'", "caseContext": null}, {"id": 73, "question": "An elderly patient presents with a TSH of 0.3 mIU/L but is asymptomatic for hyperthyroidism. According to the module, what is the most appropriate next step?", "options": [{"key": "A", "text": "Prescribe high-dose Iodine to suppress further TSH production."}, {"key": "B", "text": "Increase the dose of their current Levothyroxine if they are already on therapy."}, {"key": "C", "text": "Immediately prescribe methimazole to prevent atrial fibrillation."}, {"key": "D", "text": "Check Free T3 and Free T4 to rule out a protective adaptation to aging."}], "answer": "D", "rationale": "Check Free T3 and Free T4 to rule out a protective adaptation to aging. In the elderly, a lower TSH may be a physiological adaptation to protect the heart; it should not be treated based on TSH alone.", "caseContext": null}, {"id": 74, "question": "A patient with high systemic inflammation shows a high Reverse T3 (rT3) level. What is the biochemical mechanism by which inflammation drives this 'shunt'?", "options": [{"key": "A", "text": "Decreased production of Thyroid Binding Globulin (TBG)."}, {"key": "B", "text": "Stimulation of Thyroid Peroxidase (TPO)."}, {"key": "C", "text": "Inhibition of the 5'-deiodinase enzyme."}, {"key": "D", "text": "Increased iodine uptake by the sodium-iodide symporter."}], "answer": "C", "rationale": "Inhibition of the 5'-deiodinase enzyme. Inflammation inhibits 5'-deiodinase (which makes T3) and may favor 5-deiodinase, which converts T4 into the inactive rT3.", "caseContext": null}, {"id": 75, "question": "Which physical finding is most strongly associated with the 'Exhaustion' stage of HPA axis dysfunction, where vascular tone can no longer be maintained?", "options": [{"key": "A", "text": "A drop in systolic BP of 10 mmHg or more upon standing (Ragland’s sign)."}, {"key": "B", "text": "The presence of 'Sergant's white line' after stroking the skin."}, {"key": "C", "text": "Hyperreflexia of the patellar tendon."}, {"key": "D", "text": "Exophthalmos (bulging eyes)."}], "answer": "A", "rationale": "A drop in systolic BP of 10 mmHg or more upon standing (Ragland’ s sign). This indicates a failure of the adrenal-mediated sympathetic response to maintain blood pressure against gravity, typical of Stage 3.", "caseContext": null}, {"id": 76, "question": "In the 'Matrix Web,' how does insulin resistance clinically impact the presentation of female patients regarding their androgen levels?", "options": [{"key": "A", "text": "It stimulates the production of TSH, which in turn inhibits testosterone."}, {"key": "B", "text": "It increases SHBG, leading to a functional deficiency of androgens."}, {"key": "C", "text": "It decreases SHBG and upregulates 5-alpha-reductase."}, {"key": "D", "text": "It causes a direct conversion of Progesterone into DHEA."}], "answer": "C", "rationale": "It decreases SHBG and upregulates 5-alpha-reductase. Lower SHBG increases free hormone levels, while 5-alpha reductase increases the conversion to more potent DHT, leading to symptoms like PCOS. These factors increase the 'availability' and ‘potency' of testosterone.", "caseContext": null}, {"id": 77, "question": "A patient following a strict vegan diet for 5 years presents with thinning hair, cold extremities, and a TSH of 3.2. If their TPO antibodies are negative, which nutrient assessment is most critical according to the module?", "options": [{"key": "A", "text": "Magnesium"}, {"key": "B", "text": "Vitamin C"}, {"key": "C", "text": "Calcium"}, {"key": "D", "text": "Ferritin"}], "answer": "D", "rationale": "Ferritin Iron (Ferritin) is essential for thyroid hormone production and conversion; the module recommends a target of 100 ng/mL for optimal function. This mineral is a frequent deficiency in plant-based diets and is required for TPO enzyme activity.", "caseContext": null}, {"id": 78, "question": "A 4-point salivary cortisol test shows the 'Crash' pattern (high morning, very low mid-day/evening). What is the primary clinical goal when using Phosphatidylserine in this specific case?", "options": [{"key": "A", "text": "To provide a substrate for the synthesis of DHEA."}, {"key": "B", "text": "To stimulate mid-day cortisol production."}, {"key": "C", "text": "To blunt the excessive morning cortisol surge."}, {"key": "D", "text": "To increase the conversion of Cortisone back to Cortisol."}], "answer": "C", "rationale": "To blunt the excessive morning cortisol surge. Phosphatidylserine helps modulate the HPA axis and can be used to lower elevated cortisol at specific times of the day, such as a morning surge.", "caseContext": null}, {"id": 79, "question": "Regarding 'Ragland’s Sign' and 'Rogoff’s Sign,' which of the following correctly distinguishes these two physical exam findings?", "options": [{"key": "A", "text": "Ragland’s is a sign of hyperthyroidism; Rogoff’s is a sign of PCOS."}, {"key": "B", "text": "Ragland’s measures pupil dilation; Rogoff’s measures thyroid size."}, {"key": "C", "text": "Ragland’s measures orthostatic BP; Rogoff’s measures adrenal tenderness."}, {"key": "D", "text": "Ragland’s indicates high DHEA; Rogoff’s indicates high Cortisol."}], "answer": "C", "rationale": "Ragland’ s measures orthostatic BP; Rogoff’ s measures adrenal tenderness. Ragland’s is the drop in BP upon standing (Stage 3 indicator), while Rogoff’s is tenderness over the adrenal area with pressure.", "caseContext": null}, {"id": 80, "question": "Why is LDL cholesterol monitoring particularly relevant for an 'over-athletic' patient presenting with symptoms of multiple hormone deficiencies?", "options": [{"key": "A", "text": "LDL is the primary carrier protein for Thyroid Binding Globulin."}, {"key": "B", "text": "High LDL inhibits the conversion of T4 to T3."}, {"key": "C", "text": "Low LDL stimulates aromatase, leading to estrogen dominance."}, {"key": "D", "text": "LDL provides the required cholesterol substrate for all steroid hormone synthesis."}], "answer": "D", "rationale": "LDL provides the required cholesterol substrate for all steroid hormone synthesis. If LDL is too low (common in over-training/malnutrition), the body lacks the raw materials to produce pregnenolone and subsequent hormones.", "caseContext": null}, {"id": 81, "question": "A patient with chronic inflammatory bowel disease presents with low Free T3 and high Reverse T3 (rT3), but a normal TSH. Which specific 'STAAAINS' factor is most likely driving this peripheral conversion shunt?", "options": [{"key": "A", "text": "Stomach Acid (hypochlorhydia)"}, {"key": "B", "text": "Systemic Inflammation"}, {"key": "C", "text": "Toxic Exposure (Halogens)"}, {"key": "D", "text": "Nutrient Deficiency (Iodine)"}], "answer": "B", "rationale": "Systemic Inflammation Inflammatory cytokines are known to inhibit 5'-deiodinase activity, favoring the production of the inactive rT3 over active T3.", "caseContext": null}, {"id": 82, "question": "When managing a patient in Stage 2 (Adaptation) of HPA axis dysfunction who has elevated evening cortisol and low DHEA, what is the primary clinical rationale for using a 'calming' adaptogen like Ashwagandha in the evening?", "options": [{"key": "A", "text": "To increase the sensitivity of the hippocampal glucocorticoid receptors"}, {"key": "B", "text": "To reduce the evening cortisol surge and support the circadian rhythm"}, {"key": "C", "text": "To directly stimulate the adrenal cortex to produce more DHEA"}, {"key": "D", "text": "To inhibit the 11-beta-HSD enzyme in the kidneys"}], "answer": "B", "rationale": "To reduce the evening cortisol surge and support the circadian rhythm Ashwagandha acts as a calming adaptogen that helps modulate the HPA axis to lower inappropriate cortisol elevations at night.", "caseContext": null}, {"id": 83, "question": "Which specific urinary metabolite finding would most strongly confirm that a patient's 'hypocortisol' symptoms are due to rapid clearance (metabolism) rather than low adrenal production?", "options": [{"key": "A", "text": "Low levels of DHEA-S in the morning"}, {"key": "B", "text": "Low free cortisol with high total metabolized cortisol"}, {"key": "C", "text": "Low free cortisol with low total metabolized cortisol"}, {"key": "D", "text": "An elevated THF/THE ratio"}], "answer": "B", "rationale": "Low free cortisol with high total metabolized cortisol High levels of metabolized cortisol in the presence of low free cortisol suggest the adrenals are producing hormone but the body is clearing it too quickly.", "caseContext": null}, {"id": 84, "question": "In a female patient with 'Androgen Dominance,' how does the supplement Spearmint Tea specifically assist in the clinical protocol?", "options": [{"key": "A", "text": "It induces the CYP3A4 enzyme to clear e
