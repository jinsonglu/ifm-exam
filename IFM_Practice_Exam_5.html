in the liver"}, {"key": "D", "text": "Upregulation of the 17,20-lyase enzyme to increase DHEA"}], "answer": "A", "rationale": "Inhibition of 11-beta-hydroxysteroid dehydrogenase (11-beta-HSD) Licorice inhibits the enzyme that converts active cortisol into inactive cortisone, thereby keeping cortisol active in the system longer. C is not correct because Licorice does not act as a cortisol mimic; it prevents the breakdown of the body's existing cortisol.", "caseContext": null}, {"id": 83, "question": "If a patient presents with 'Resistance' (Stage 2) and labs show low DHEA but elevated evening cortisol, which combination of nutrients is most appropriate to support the steroidogenic pathway and hippocampal feedback?", "options": [{"key": "A", "text": "DHEA, Phosphatidylserine, and Vitamin B5"}, {"key": "B", "text": "Pregnenolone, Licorice, and Panax Ginseng"}, {"key": "C", "text": "Licorice, Vitamin C, and Iodine"}, {"key": "D", "text": "High-dose Zinc, Selenium, and Lithium"}], "answer": "A", "rationale": "DHEA, Phosphatidylserine, and Vitamin B5 DHEA replaces the androgen deficit, Phosphatidylserine improves negative feedback to lower high cortisol, and B5 supports the adrenal cortex.", "caseContext": null}, {"id": 84, "question": "In the context of the 'Hormone Matrix,' why is it common to see a rise in TSH levels in women during the perimenopausal transition where estrogen dominance is present?", "options": [{"key": "A", "text": "Estrogen competes with TSH for receptors on the thyroid gland"}, {"key": "B", "text": "Estrogen increases Thyroid Binding Globulin (TBG), reducing the amount of Free T4 available"}, {"key": "C", "text": "Perimenopause causes a sudden increase in iodine clearance in the kidneys"}, {"key": "D", "text": "Estrogen directly inhibits the production of TSH in the pituitary"}], "answer": "B", "rationale": "Estrogen increases Thyroid Binding Globulin (TBG), reducing the amount of Free T4 available High estrogen levels stimulate the liver to produce more TBG, which binds to thyroid hormone and can lead to a compensatory rise in TSH.", "caseContext": null}, {"id": 85, "question": "A DUTCH test shows high levels of 16alpha-OH-E1 (the 'proliferative' estrogen) and low 2-OH-E1. Which intervention helps shift Phase 1 metabolism toward the safer 2-OH pathway?", "options": [{"key": "A", "text": "Topical Progesterone cream."}, {"key": "B", "text": "DIM (Diindolylmethane) or I3C (Indole-3-Carbinol)"}, {"key": "C", "text": "Increasing intake of red meat and saturated fats."}, {"key": "D", "text": "Probiotic supplementation with Lactobacillus."}], "answer": "B", "rationale": "DIM (Diindolylmethane) or I3C (Indole-3-Carbinol) Cruciferous derivatives like DIM specifically induce the CYP1A1 enzyme, which favors the production of 2-OH-E1.", "caseContext": null}, {"id": 86, "question": "In a male patient, which factor is the most common cause of 'secondary' hypogonadism (low T with low/ normal LH)?", "options": [{"key": "A", "text": "Excessive intake of dietary zinc."}, {"key": "B", "text": "Metabolic syndrome and inflammation suppressing the pituitary signal."}, {"key": "C", "text": "Congenital absence of the Leydig cells."}, {"key": "D", "text": "Direct physical trauma to the testes."}], "answer": "B", "rationale": "Metabolic syndrome and inflammation suppressing the pituitary signal. Insulin resistance and inflammatory cytokines act on the hypothalamus and pituitary to dampen the production of LH.", "caseContext": null}, {"id": 87, "question": "Which of the following describes the most 'clinically integrated' first step for a female patient with fibroids and signs of estrogen dominance?", "options": [{"key": "A", "text": "Addressing liver detoxification and gut clearance while stabilizing the HPA axis."}, {"key": "B", "text": "Immediate surgical referral for a hysterectomy."}, {"key": "C", "text": "Starting high-dose Estrogen replacement to 'override' the fibroids."}, {"key": "D", "text": "Prescribing testosterone to counteract the estrogen."}], "answer": "A", "rationale": "Addressing liver detoxification and gut clearance while stabilizing the HP A axis. This follows the 'PTSD' and ‘Hierarchy’ models by clearing excess hormone and reducing the stress that drives imbalance.", "caseContext": null}, {"id": 88, "question": "A 48-year-old male presents with low libido, 'brain fog,' and increased breast tissue (gynecomastia). His labs show low Total Testosterone, but significantly elevated Estrone (E1). According to the Hormone Hierarchy, which underlying metabolic driver must be addressed before initiating TRT?", "options": [{"key": "A", "text": "Zinc deficiency causing a failure in testosterone signaling."}, {"key": "B", "text": "The HPA axis and insulin resistance driving peripheral aromatization."}, {"key": "C", "text": "Renal clearance of estrogen metabolites through Phase 3 pathways."}, {"key": "D", "text": "Primary testicular failure necessitating immediate HCG therapy."}], "answer": "B", "rationale": "The HP A axis and insulin resistance driving peripheral aromatization. High insulin and cortisol levels up-regulate aromatase activity in visceral fat, which siphons testosterone into estrogen; ignoring this ensures TRT will only further increase estrogen.", "caseContext": null}, {"id": 89, "question": "According to the 'Window of Opportunity' hypothesis, why is it considered safer to start HRT closer to the onset of menopause (within 10 years) than later?", "options": [{"key": "A", "text": "HRT only works if the patient is still actively ovulating."}, {"key": "B", "text": "The liver loses the ability to metabolize transdermal hormones after age 65."}, {"key": "C", "text": "Older women have fewer estrogen receptors, making HRT ineffective."}, {"key": "D", "text": "In healthy vessels, estrogen is vasodilatory; in vessels with established plaque, estrogen may promote plaque instability and inflammation."}], "answer": "D", "rationale": "In healthy vessels, estrogen is vasodilatory; in vessels with established plaque, estrogen may promote plaque instability and inflammation. Estrogen's effect on the endothelium is dependent on the baseline state of the vessel; it protects healthy tissue but can destabilize diseased tissue.", "caseContext": null}, {"id": 90, "question": "A patient presents with 'Estrogen Dominance' symptoms despite normal serum E2 levels. Her stool test shows elevated β-glucuronidase. What is the most appropriate first-line supplement to address this Phase 3 bottleneck?", "options": [{"key": "A", "text": "Vitex (Chasteberry)"}, {"key": "B", "text": "DIM (Diindolylmethane)"}, {"key": "C", "text": "DHEA"}, {"key": "D", "text": "Calcium D-Glucarate"}], "answer": "D", "rationale": "Calcium D-Glucarate Look for the compound that prevents the ‘recycling’ of estrogen back into the bloodstream. Calcium D-Glucarate inhibits beta-glucuronidase, preventing the 'un-zipping' of conjugated estrogen and allowing it to be excreted.", "caseContext": null}, {"id": 91, "question": "When interpreting a male patient's labs, you find high Total Testosterone but low Free Testosterone. Which of the following metabolic conditions is most likely driving this pattern?", "options": [{"key": "A", "text": "Insulin Resistance"}, {"key": "B", "text": "Zinc deficiency"}, {"key": "C", "text": "Hyperthyroidism or high-dose oral estrogen exposure."}, {"key": "D", "text": "Overtraining syndrome"}], "answer": "C", "rationale": "Hyperthyroidism or high-dose oral estrogen exposure. Both hyperthyroidism and estrogen (even in men) can significantly increase SHBG, which reduces free testosterone.", "caseContext": null}, {"id": 92, "question": "A woman on BHRT experiences unexpected spotting. According to the safety guidelines in the 'Sex Steroids' module, what is the mandatory first step?", "options": [{"key": "A", "text": "Perform a Dutch test to see if she is methylating correctly."}, {"key": "B", "text": "Refer for a pelvic ultrasound and/or endometrial biopsy to rule out hyperplasia."}, {"key": "C", "text": "Double the dose of progesterone to stop the bleeding."}, {"key": "D", "text": "Switch from transdermal to oral estrogen."}], "answer": "B", "rationale": "Refer for a pelvic ultrasound and/or endometrial biopsy to rule out hyperplasia. Any unscheduled bleeding on HRT must be evaluated to ensure the endometrium is not becoming hyperplastic or malignant.", "caseContext": null}, {"id": 93, "question": "Which laboratory marker, when elevated, is the most sensitive indicator of 'Leptin Resistance' and its direct inhibition of testosterone production in the male?", "options": [{"key": "A", "text": "Serum Albumin"}, {"key": "B", "text": "Serum Leptin"}, {"key": "C", "text": "Alkaline Phosphatase"}, {"key": "D", "text": "Creatinine"}], "answer": "B", "rationale": "Serum Leptin Directly measuring leptin levels can reveal resistance; when high, it bypasses the brain and inhibits the StAR protein in the Leydig cells.", "caseContext": null}, {"id": 94, "question": "A 50-year-old woman is transitioning into menopause. She has a high 'Total Estrogen' load on her Dutch test but her 2:16 ratio is 0.5 (optimal is >2.0). What does this ratio suggest?", "options": [{"key": "A", "text": "She is preferentially using the proliferative 16α-OH pathway, increasing her risk for estrogen-sensitive tissue growth."}, {"key": "B", "text": "She has excellent Phase 1 metabolism and is at low risk for cancer."}, {"key": "C", "text": "She needs to stop taking all Progesterone."}, {"key": "D", "text": "She is a 'Fast Methylator' and is clearing estrogens too quickly."}], "answer": "A", "rationale": "She is preferentially using the proliferative 16α-OH pathway, increasing her risk for estrogen-sensitive tissue growth. A low 2:16 ratio means the body is favoring the 16-alpha pathway over the safer 2-OH pathway, which is associated with breast and uterine proliferation.", "caseContext": null}, {"id": 95, "question": "Which delivery method of Progesterone is specifically recommended for a woman with an intact uterus to ensure maximum endometrial protection?", "options": [{"key": "A", "text": "Topical Progesterone Cream (10% strength)."}, {"key": "B", "text": "Vaginal Progesterone used once a week."}, {"key": "C", "text": "Progesterone Pellets."}, {"key": "D", "text": "Oral Micronized Progesterone (e.g., Prometrium)."}], "answer": "D", "rationale": "Oral Micronized Progesterone (e.g., Prometrium). Oral delivery is the most well-studied for achieving consistent endometrial concentrations to prevent hyperplasia in women on estrogen therapy.", "caseContext": null}, {"id": 96, "question": "A 42-year-old male presents with low libido and a 'total testosterone' of 310 ng/dL. His LH is elevated at 14 mIU/mL. According to the IFM framework, which diagnosis and immediate next step are most appropriate?", "options": [{"key": "A", "text": "Functional hypogonadism; address insulin resistance first."}, {"key": "B", "text": "Secondary hypogonadism; investigate the pituitary gland."}, {"key": "C", "text": "Primary hypogonadism; perform a testicular exam and check for history of trauma or infection."}, {"key": "D", "text": "Androgen resistance; check for androgen receptor polymorphisms."}], "answer": "C", "rationale": "Primary hypogonadism; perform a testicular exam and check for history of trauma or infection. High LH indicates the pituitary is signaling, but the testes are failing to respond (Primary), requiring local investigation. A is incorrect since Functional hypogonadism usually presents with low or inappropriately normal LH due to central suppression.", "caseContext": null}, {"id": 97, "question": "In a patient with PCOS, why is ‘low glycemic Diet considered the most critical first step for reducing Androgen Dominance?", "options": [{"key": "A", "text": "A low-carb diet increases the aromatization of testosterone."}, {"key": "B", "text": "Insulin inhibits SHBG and up-regulates the 5-alpha reductase enzyme."}, {"key": "C", "text": "Fiber blocks the production of FSH in the pituitary."}, {"key": "D", "text": "Sugar directly converts into Dihydrotestosterone (DHT)."}], "answer": "B", "rationale": "Insulin inhibits SHBG and up-regulates the 5-alpha reductase enzyme. Lowering insulin through diet increases the 'capture' of testosterone (via SHBG) and slows its conversion to the more potent DHT.", "caseContext": null}, {"id": 98, "question": "When switching a woman from Oral to Transdermal Estradiol, which inflammatory marker is expected to decrease?", "options": [{"key": "A", "text": "HbA1c"}, {"key": "B", "text": "hs-CRP"}, {"key": "C", "text": "Ferritin"}, {"key": "D", "text": "Leptin"}], "answer": "B", "rationale": "hs-CRP Oral estrogen has a 'first-pass' effect on the liver that stimulates the production of C-reactive protein and clotting factors.", "caseContext": null}, {"id": 99, "question": "A 40-year-old male presents with low libido, low energy, and a Total Testosterone of 250 ng/dL. His LH is 1.5 mIU/mL (Low) and his Prolactin is significantly elevated. According to Module 6 protocols, what is the mandatory next step before initiating TRT?", "options": [{"key": "A", "text": "Perform a testicular ultrasound to rule out Leydig cell failure."}, {"key": "B", "text": "Recommend high-dose Zinc and Saw Palmetto to lower DHT."}, {"key": "C", "text": "Initiate Clomiphene Citrate to stimulate the pituitary."}, {"key": "D", "text": "Order an MRI of the Sella Turcica to rule out a pituitary adenoma."}], "answer": "D", "rationale": "Order an MRI of the Sella Turcica to rule out a pituitary adenoma. High prolactin with low LH/T suggests secondary hypogonadism that may be caused by a physical mass (prolactinoma) compressing the pituitary.", "caseContext": null}, {"id": 100, "question": "A patient's DUTCH test shows a 'Low Methylation Activity' ratio with high 4−OH−E1. Which specific genetic polymorphism should the clinician investigate as the most likely contributor to this Phase 2 bottleneck?", "options": [{"key": "A", "text": "COMT"}, {"key": "B", "text": "CYP1A1"}, {"key": "C", "text": "Aromatase"}, {"key": "D", "text": "Glutathione Reductase"}], "answer": "A", "rationale": "COMT Catechol-O-Methyltransferase is the primary enzyme responsible for methylating catechol estrogens (2-OH and 4-OH) into safe methoxy forms.", "caseContext": null}, {"id": 101, "question": "The presence of β-glucuronidase in the gut is a concern because it can lead to the 'de-conjugation' of toxins. Which of the following is a known inhibitor of this enzyme?", "options": [{"key": "A", "text": "Magnesium"}, {"key": "B", "text": "Vitamin B6"}, {"key": "C", "text": "N-acetylcysteine"}, {"key": "D", "text": "Calcium D-glucarate"}], "answer": "D", "rationale": "Calcium D-glucarate Calcium D-glucarate is a potent inhibitor of beta-glucuronidase, helping to prevent the reabsorption of estrogens and other toxins. This supplement is often used to support the excretion of estrogen.", "caseContext": null}, {"id": 102, "question": "What is the primary function of the 'Amino Acid Conjugation' pathway in Phase II biotransformation?", "options": [{"key": "A", "text": "To recycle B12 and folate for DNA synthesis."}, {"key": "B", "text": "To regulate systemic levels of amino acids used as neurotransmitters while processing organic acids like benzoates."}, {"key": "C", "text": "To serve as the main route for all environmental lipophilic xenobiotics."}, {"key": "D", "text": "To convert parent compounds into reactive intermediates."}], "answer": "B", "rationale": "To regulate systemic levels of amino acids used as neurotransmitters while processing organic acids like benzoates. Its primary role is regulating amino acids used in the CNS while also conjugating carboxylic acids and preservatives.", "caseContext": null}, {"id": 103, "question": "A patient's laboratory results show low levels of urine mercapturic acids. Based on the biotransformation pathways discussed in the module, what is the most likely clinical interpretation of this finding?", "options": [{"key": "A", "text": "Overactive Phase I oxidation reactions causing rapid depletion of metabolites."}, {"key": "B", "text": "Insufficient levels of glutathione and/or cysteine to support conjugation."}, {"key": "C", "text": "High exposure to persistent organic pollutants (POPs)."}, {"key": "D", "text": "Genetic SNPs in the UGT1A1 enzyme affecting glucuronidation."}], "answer": "B", "rationale": "Insufficient levels of glutathione and/or cysteine to support conjugation. Mercapturic acids are the final excretory products of xenobiotics conjugated with glutathione or L-cysteine; low levels indicate a deficiency in these substrates.", "caseContext": null}, {"id": 104, "question": "In the IFM 'PURE' sequencing of detoxification, which of the following is considered a 'Level 2' intervention to be implemented after initial dietary clean-up but before rigorous chelation?", "options": [{"key": "A", "text": "Liquid fasting and high-dose nutraceutical support."}, {"key": "B", "text": "Evaluating genetic SNPs to personalize Phase I enzyme support."}, {"key": "C", "text": "Implementing a Phyto Spectrum or Elimination Diet to reduce exposures."}, {"key": "D", "text": "Removal of dental amalgams and mixed metal crowns."}], "answer": "C", "rationale": "Implementing a Phyto Spectrum or Elimination Diet to reduce exposures. The second step involves therapeutic food plans like the Phyto Spectrum or Elimination Diet to actively reduce the toxic load.", "caseContext": null}, {"id": 105, "question": "Which specific CYP450 enzyme is responsible for the metabolism of approximately 40-45% of all drugs and hormones, and can be inhibited by substances like grapefruit juice?", "options": [{"key": "A", "text": "CYP3A4"}, {"key": "B", "text": "CYP1A2"}, {"key": "C", "text": "CYP2D6"}, {"key": "D", "text": "CYP2E1"}], "answer": "A", "rationale": "CYP3A4 CYP3A4 is the most abundant CYP enzyme and handles nearly half of all clinically used drugs and hormones.", "caseContext": null}, {"id": 106, "question": "In the sequencing of a clinical detox, which 'Level 3' intervention is considered the most aggressive and requires the patient to be ‘PURE' (Pattern Recognition, Undernourished checked, Reduce exposures done, Ensure safe detox ready)?", "options": [{"key": "A", "text": "Sauna therapy"}, {"key": "B", "text": "Probiotic supplementation"}, {"key": "C", "text": "Pharmaceutical Chelation"}, {"key": "D", "text": "Phyto-spectrum diet"}], "answer": "C", "rationale": "Pharmaceutical Chelation Chelation is a high-level, potentially risky intervention that should only be performed after basic elimination and nutrition are stabilized.", "caseContext": null}, {"id": 107, "question": "Which specific Phase II pathway is the primary route for the inactivation of catecholamines like dopamine and epinephrine, as well as the 2-hydroxy and 4-hydroxy forms of estrogen?", "options": [{"key": "A", "text": "Sulfation"}, {"key": "B", "text": "Methylation"}, {"key": "C", "text": "Acetylation"}, {"key": "D", "text": "Glucuronidation"}], "answer": "B", "rationale": "Methylation The COMT (Catechol-O-methyltransferase) enzyme utilizes SAMe to methylate and inactivate catecholamines and estrogen metabolites.", "caseContext": null}, {"id": 108, "question": "In the IFM clinical sequencing of detoxification (PURE), 'Reduce Exposures' includes which of the following 'Level 1' interventions?", "options": [{"key": "A", "text": "Increasing intake of cruciferous vegetables to induce CYP1A1."}, {"key": "B", "text": "Transitioning to organic produce and filtering household water."}, {"key": "C", "text": "Using DMPS to mobilize lead and mercury from the bones."}, {"key": "D", "text": "Prescribing a medical food with high-dose taurine and glycine."}], "answer": "B", "rationale": "Transitioning to organic produce and filtering household water. Reducing ‘input' toxins through diet and water is a foundational Step 2 (Reduce Exposures) intervention.", "caseContext": null}, {"id": 109, "question": "A patient is undergoing a detox program and begins to experience significant 'brain fog' and fatigue. According to the 'E' in PURE, what is the most likely biochemical cause?", "options": [{"key": "A", "text": "The patient's Phase I activity is faster than their Phase II activity, leading to 'Pathological Detoxification'."}, {"key": "B", "text": "The patient has 'fast' glucuronidation which is depleting their glucose stores."}, {"key": "C", "text": "The patient's COMT enzyme is working too fast, depleting their catecholamines."}, {"key": "D", "text": "The patient is drinking too much water, causing electrolyte dilution."}], "answer": "A", "rationale": "The patient's Phase I activity is faster than their Phase II activity, leading to 'Pathological Detoxification'. If Phase | creates reactive intermediates faster than Phase II can conjugate them, the intermediates can cause systemic symptoms like brain fog.", "caseContext": null}, {"id": 110, "question": "Which of the following is a primary function of Phase II biotransformation reactions?", "options": [{"key": "A", "text": "To attach a polar moiety to a compound, making it water-soluble for elimination."}, {"key": "B", "text": "To activate inert pro-drugs into their active forms."}, {"key": "C", "text": "To decrease the water solubility of lipophilic xenobiotics."}, {"key": "D", "text": "To introduce a functional group through oxidation or reduction."}], "answer": "A", "rationale": "To attach a polar moiety to a compound, making it water-soluble for elimination. Phase II reactions involve conjugation, which increases water solubility to facilitate excretion through urine or bile.", "caseContext": null}, {"id": 111, "question": "A patient with a 'Slow' COMT genotype is struggling with estrogen dominance. Which 'Level 1' dietary strategy should be prioritized to reduce their 'Total Load' of estrogens before using methyl donors?", "options": [{"key": "A", "text": "Switching to a high-protein, low-fiber diet."}, {"key": "B", "text": "Daily consumption of charbroiled meats."}, {"key": "C", "text": "High-dose supplementation with Quercetin."}, {"key": "D", "text": "Increasing cruciferous vegetable intake."}], "answer": "D", "rationale": "Increasing cruciferous vegetable intake. Cruciferous vegetables provide sulforaphane and indole-3-carbinol, which favor the 2-hydroxy pathway, making the estrogens easier for COMT to handle.", "caseContext": null}, {"id": 112, "question": "A patient with a history of occupational exposure to organophosphate pesticides presents with chronic fatigue. Which specific antioxidant enzyme system, often evaluated via SNPs, is the primary defense against these specific toxicants?", "options": [{"key": "A", "text": "Paraoxonase 1 (PON1)"}, {"key": "B", "text": "Superoxide Dismutase (SOD2)"}, {"key": "C", "text": "Catalase"}, {"key": "D", "text": "Glutathione Peroxidase (GPs)"}], "answer": "A", "rationale": "Paraoxonase 1 (PON1) This enzyme is located on HDL particles and is responsible for hydrolyzing organophosphates and protecting lipids from oxidation. D is not quite correct since GPx is essential for overall oxidative stress management, but it is not the specific primary hydrolase for organophosphate molecules.", "caseContext": null}, {"id": 113, "question": "Which specific nutrient acts as the rate-limiting cofactor for the synthesis of Glutathione, the body's master antioxidant used in Phase II conjugation?", "options": [{"key": "A", "text": "Glutamine"}, {"key": "B", "text": "Vitamin C"}, {"key": "C", "text": "Glycine"}, {"key": "D", "text": "N-acetylcysteine"}], "answer": "D", "rationale": "N-acetylcysteine NAC provides the cysteine necessary for the rate-limiting step of glutathione synthesis in the liver.", "caseContext": null}, {"id": 114, "question": "A patient with high exposure to pesticides also has a 'Fast' Phase I and 'Slow' Phase II (Glutathione). What is the primary clinical concern for this metabolic pattern?", "options": [{"key": "A", "text": "The buildup of highly reactive, 'functionalized' intermediate metabolites that can cause tissue damage."}, {"key": "B", "text": "The patient will be unable to absorb any fat-soluble vitamins."}, {"key": "C", "text": "The patient will clear toxins too quickly, leading to nutrient depletion."}, {"key": "D", "text": "The patient will develop an immediate allergy to all cruciferous vegetables."}], "answer": "A", "rationale": "The buildup of highly reactive, 'functionalized' intermediate metabolites that can cause tissue damage. Phase | creates reactive molecules; if Phase Il is slow, these intermediates hang around and cause oxidative stress and DNA damage.", "caseContext": null}, {"id": 115, "question": "Which specific Phase II pathway is the primary route for the detoxification of salicylates and certain benzoate food preservatives?", "options": [{"key": "A", "text": "Acetylation"}, {"key": "B", "text": "Sulfation"}, {"key": "C", "text": "Amino Acid Conjugation"}, {"key": "D", "text": "Methylation"}], "answer": "C", "rationale": "Amino Acid Conjugation Glycine conjugation (a type of Amino Acid Conjugation) is the specific pathway used to neutralize salicylates and benzoic acid. Sulfation is vital for steroid hormones and acetaminophen but is not the primary route for salicylates.", "caseContext": null}, {"id": 116, "question": "Which of the following is a symptom of 'Sluggish' Phase II Acetylation, often seen in individuals with the NAT2 slow-acetylator genotype?", "options": [{"key": "A", "text": "Increased energy after drinking coffee."}, {"key": "B", "text": "Sensitivity to smoke, exhaust, and many drugs."}, {"key": "C", "text": "A metallic taste in the mouth."}, {"key": "D", "text": "Hyper-pigmentation of the palms."}], "answer": "B", "rationale": "Sensitivity to smoke, exhaust, and many drugs. Slow acetylators have difficulty clearing various chemicals and medications, making them more prone to side effects and environmental sensitivities.", "caseContext": null}, {"id": 117, "question": "Which specific Phase II conjugation pathway is heavily utilized for the detoxification of catechol estrogens and neurotransmitters like dopamine?", "options": [{"key": "A", "text": "Methylation (COMT)"}, {"key": "B", "text": "Sulfation"}, {"key": "C", "text": "Glucuronidation"}, {"key": "D", "text": "Glutathione Conjugation"}], "answer": "A", "rationale": "Methylation (COMT) Catechol-O-methyltransferase (COMT) is the enzyme responsible for methylating catecholamines and catechol estrogens to render them inactive.", "caseContext": null}, {"id": 118, "question": "In the IFM 'GATHER' phase, a patient reports 'Meese's lines' (transverse white bands on the nails). Which toxicant is most likely responsible for this finding?", "options": [{"key": "A", "text": "Mercury"}, {"key": "B", "text": "Cadmium"}, {"key": "C", "text": "Lead"}, {"key": "D", "text": "Arsenic"}], "answer": "D", "rationale": "Arsenic Meese's lines are a classic dermatological sign of arsenic poisoning, reflecting an interruption in nail plate formation due to the toxin. Cadmium toxicity typically presents with renal dysfunction or 'Itai-itai’ bone pain rather than Meese's lines.", "caseContext": null}, {"id": 119, "question": "In the 'Mito Food Plan,' which nutrient is highlighted for its ability to bypass Complex III of the Electron Transport Chain when used alongside Vitamin C?", "options": [{"key": "A", "text": "L-Carnitine"}, {"key": "B", "text": "CoQ10"}, {"key": "C", "text": "Vitamin K2"}, {"key": "D", "text": "Manganese"}], "answer": "C", "rationale": "Vitamin K2 The module identifies Vitamin K2 (specifically MK-7) as a nutrient that can bypass Complex III in the ETC.", "caseContext": null}, {"id": 120, "question": "Which marker is identified as a 'Secondary (2º) Metabolism Diagnostic' to be used if a patient does not improve after initial B-vitamin and mineral support?", "options": [{"key": "A", "text": "Serum Ferritin"}, {"key": "B", "text": "Body Mass Index (BMI)"}, {"key": "C", "text": "TSH and Free T4"}, {"key": "D", "text": "Acyl-Carnitine and Organic Acids (OA) Profile"}], "answer": "D", "rationale": "Acyl-Carnitine and Organic Acids (OA) Profile These tests provide a deeper look into metabolic intermediates when basic support fails.", "caseContext": null}, {"id": 121, "question": "The 'feed-forward cycle' of oxidative stress can be triggered by many factors. Which of the following is listed as a trigger that specifically activates NF-kB?", "options": [{"key": "A", "text": "High levels of dietary Fiber"}, {"key": "B", "text": "Adequate Hydration"}, {"key": "C", "text": "Increased Oxidative Stress"}, {"key": "D", "text": "B-vitamin supplementation"}], "answer": "C", "rationale": "Increased Oxidative Stress Think of the cycle where damage leads to the activation of pro-inflammatory transcription factors. Increased oxidative stress activates NF-kB, which then up-regulates inflammation genes, creating a cycle of damage.", "caseContext": null}, {"id": 122, "question": "In the clinical management of mitochondropathy, what is the recommended adult dose for Creatine Monohydrate to support energy storage?", "options": [{"key": "A", "text": "100-200 mg/day"}, {"key": "B", "text": "1-2 mg/day"}, {"key": "C", "text": "500 mg/kg/day"}, {"key": "D", "text": "10 g/day (divided)"}], "answer": "D", "rationale": "10 g/day (divided) This supplement acts as a high-energy phosphate buffer. The module recommends a dose of 10 grams per day, divided, for adults to enhance muscle phosphocreatine.", "caseContext": null}, {"id": 123, "question": "When comparing 'Primary Mitochondrial Disease' (PMD) and 'Secondary Mitochondrial Dysfunction' (SMD), which characteristic is unique to SMD according to the clinical considerations provided?", "options": [{"key": "A", "text": "It can only be diagnosed through muscle biopsy"}, {"key": "B", "text": "It only affects the brain and muscle tissues"}, {"key": "C", "text": "It is usually the result of cumulative 'Energy Suffering' from environmental triggers"}, {"key": "D", "text": "It is a permanent state that cannot be reversed"}], "answer": "C", "rationale": "It is usually the result of cumulative 'Energy Suffering' from environmental triggers SMD is acquired through environmental stressors, whereas PMD is strictly defined by inherited mutations in nuclear or mitochondrial DNA.", "caseContext": null}, {"id": 124, "question": "A patient presents with 'Brain Fog' and low exercise tolerance. Which 'Assimilation' node imbalance might lead to poor mitochondrial performance by limiting the availability of Iron?", "options": [{"key": "A", "text": "Over-secretion of bile salts"}, {"key": "B", "text": "Hypochlorhydria"}, {"key": "C", "text": "Excessive intake of dietary fiber"}, {"key": "D", "text": "Rapid gastric emptying"}], "answer": "B", "rationale": "Hypochlorhydria Stomach acid is required to ionize iron for absorption; without it, the body lacks the iron necessary for heme synthesis and ETC complexes.", "caseContext": null}, {"id": 125, "question": "In the context of 'The Centrality of the Therapeutic Encounter,' which of the four ingredients of healing refers to providing the patient with an 'EXPLANATION' for their symptoms?", "options": [{"key": "A", "text": "Healing Setting"}, {"key": "B", "text": "Belief and Action"}, {"key": "C", "text": "Relationship"}, {"key": "D", "text": "Control"}], "answer": "D", "rationale": "Control An explanation provides the patient with 'Control' by making the unknown symptoms understandable and manageable. This ingredient helps move the patient from fear of the unknown to understanding. B is not quite correct since belief and action refers to the ritual or plan that both parties participate in, rather than the initial explanation.", "caseContext": null}, {"id": 126, "question": "Robert Hedaya, MD, notes that psychiatric medications can impact mitochondrial health. Which class of drugs is specifically noted for its potential to deplete CoQ10 and inhibit the Electron Transport Chain?", "options": [{"key": "A", "text": "Statins and certain Antipsychotics"}, {"key": "B", "text": "Broad-spectrum antibiotics"}, {"key": "C", "text": "Non-steroidal anti-inflammatory drugs"}, {"key": "D", "text": "Proton Pump Inhibitors"}], "answer": "A", "rationale": "Statins and certain Antipsychotics Both statins and several antipsychotic medications are known to inhibit mitochondrial respiration and deplete essential cofactors like CoQ10.", "caseContext": null}, {"id": 127, "question": "Which set of biomarkers is categorized as 'Secondary (2º) Metabolism Diagnostics' in the IFM Bioenergetics Clinical Decision Tree, to be used if initial primary interventions fail?", "options": [{"key": "A", "text": "Acyl-Carnitine, Organic Acids (OA) Profile, and Cellular Redox"}, {"key": "B", "text": "B-Vitamins, Magnesium, and CoQ10 levels"}, {"key": "C", "text": "8-OHdG and Oxidized LDL"}, {"key": "D", "text": "Toxic Metals and Glutathione (GSH)"}], "answer": "A", "rationale": "Acyl-Carnitine, Organic Acids (OA) Profile, and Cellular Redox The decision tree reserves advanced metabolic profiling like Acyl-Carnitine and Organic Acids for secondary diagnostic steps.", "caseContext": null}, {"id": 128, "question": "Heavy metals such as Lead (Pb) and Mercury (Hg) primarily cause 'Energy Suffering' by inhibiting which specific biological pathway illustrated in the module?", "options": [{"key": "A", "text": "Heme Biosynthesis"}, {"key": "B", "text": "The recycling of Oxidized Glutathione (GSSG) back to GSH"}, {"key": "C", "text": "The transport of Calcium ions into the mitochondrial matrix"}, {"key": "D", "text": "Glycolysis and the conversion of Glucose to Pyruvate"}], "answer": "A", "rationale": "Heme Biosynthesis The module details how metals inhibit steps like uroporphyrinogen decarboxylase (UROD), preventing the formation of heme, which is central to energy complexes.", "caseContext": null}, {"id": 129, "question": "According to the 'Mito Food Plan,' which lipid is recommended at a dosage of 1–10 grams per day to support mitochondrial membrane replacement (1º Oral Lipid Support)?", "options": [{"key": "A", "text": "Phosphatidylcholine"}, {"key": "B", "text": "Coenzyme Q10"}, {"key": "C", "text": "Creatine Monohydrate"}, {"key": "D", "text": "S-acetyl-Glutathione"}], "answer": "A", "rationale": "Phosphatidylcholine PC is the primary lipid support recommended for oral replacement to maintain the structural integrity of mitochondrial membranes. C is not correct since creatine is used for energy storage and phosphate buffering, not as a structural membrane lipid.", "caseContext": null}, {"id": 130, "question": "What is the primary rationale for using 'Modified Ketogenic' approaches within the Mito Food Plan for neurodegenerative conditions?", "options": [{"key": "A", "text": "To eliminate the need for B-vitamins in the Citric Acid Cycle."}, {"key": "B", "text": "To induce a catabolic state that reduces muscle wasting."}, {"key": "C", "text": "To maximize the production of Nitric Oxide (NO) in the brain."}, {"key": "D", "text": "To provide a stable, non-inflammatory fuel source (ketones) that can cross the BBB and bypass glucose metabolism blocks."}], "answer": "D", "rationale": "To provide a stable, non-inflammatory fuel source (ketones) that can cross the BBB and bypass glucose metabolism blocks. Ketones provide an alternative energy source for neurons, especially when glucose metabolism is impaired by insulin resistance or oxidative stress.", "caseContext": null}, {"id": 131, "question": "Which marker is described as the 'best marker for monitoring intracellular oxidative stress' based on the module's review of Glutathione?", "options": [{"key": "A", "text": "Plasma GSH-to-GSSG ratio"}, {"key": "B", "text": "Urinary 8-OHdG"}, {"key": "C", "text": "Plasma Homocysteine"}, {"key": "D", "text": "Total Serum Ferritin"}], "answer": "A", "rationale": "Plasma GSH-to-GSSG ratio The ratio of reduced to oxidized glutathione in the plasma is the most accurate reflection of cellular redox status.", "caseContext": null}, {"id": 132, "question": "Which enzyme requires Selenium (Se) as a cofactor to neutralize hydrogen peroxide within the body's antioxidant defense system?", "options": [{"key": "A", "text": "Superoxide Dismutase 2 (SOD2)"}, {"key": "B", "text": "Catalase"}, {"key": "C", "text": "Glutathione Peroxidase (GPx)"}, {"key": "D", "text": "Superoxide Dismutase 1 (SOD1)"}], "answer": "C", "rationale": "Glutathione Peroxidase (GPx) GPx is the specific antioxidant enzyme that requires Selenium to convert hydrogen peroxide into water.", "caseContext": null}, {"id": 133, "question": "In the IFM Clinical Decision Tree, which diagnostic test is specifically listed as a 2º (Secondary) Toxin Diagnostic?", "options": [{"key": "A", "text": "Toxic Metals (Lead, Mercury)"}, {"key": "B", "text": "Hs-CRP"}, {"key": "C", "text": "Persistent Organic Pollutants and Mycotoxins"}, {"key": "D", "text": "Glutathione (GSH) levels"}], "answer": "C", "rationale": "Persistent Organic Pollutants and Mycotoxins While toxic metals are 12 diagnostics, POPs and Mycotoxins are considered secondary toxin evaluations.", "caseContext": null}, {"id": 134, "question": "Which ingredient of a 'Healing Encounter' is categorized as providing the patient with 'BELIEF and ACTION'?", "options": [{"key": "A", "text": "A healing setting or place to go for healing."}, {"key": "B", "text": "An explanation for the symptoms that provides control."}, {"key": "C", "text": "A ritual, procedure, or plan involving active participation of both parties."}, {"key": "D", "text": "An emotionally charged relationship with a helping person."}], "answer": "C", "rationale": "A ritual, procedure, or plan involving active participation of both parties. The fourth ingredient of a healing encounter is a shared plan or ritual that both parties believe in, providing belief and a course of action, collaborative steps taken by both the doctor and the patient.", "caseContext": null}, {"id": 135, "question": "Under the 'Structural Integrity' node of the Fatigue Matrix, which clinical imbalance is specifically linked to mitochondrial failure and energy depletion?", "options": [{"key": "A", "text": "B-12 Deficient Diets"}, {"key": "B", "text": "Low Digestive Enzymatic Function"}, {"key": "C", "text": "Pesticide and POP Accumulation"}, {"key": "D", "text": "Muscle Wasting and Membrane Impairment"}], "answer": "D", "rationale": "Muscle Wasting and Membrane Impairment The matrix lists muscle wasting and membrane impairment as structural consequences of mitochondrial energy failure.", "caseContext": null}, {"id": 136, "question": "Which 1º (Primary) Detox Treatment is indicated to support the production of the body's master antioxidant to mitigate mitochondrial damage?", "options": [{"key": "A", "text": "Chelation therapy"}, {"key": "B", "text": "CPAP therapy"}, {"key": "C", "text": "Selenium, NAC, and SAMe"}, {"key": "D", "text": "IV-Phospholipids"}], "answer": "C", "rationale": "Selenium, NAC, and SAMe These nutrients are 12 Detox treatments because they are the building blocks and cofactors for Glutathione (GSH). Case Study 1 — Answer Key", "caseContext": null}, {"id": 137, "question": "Marcus’s history of C-section and frequent childhood antibiotics are categorized as:", "options": [{"key": "A", "text": "Antecedents"}, {"key": "B", "text": "Triggers"}, {"key": "C", "text": "Mediators"}], "answer": "A", "rationale": "Antecedents Antecedents: These are \"born-with\" or early-life factors (Genetics, birth mode, early antibiotics) that set the stage for later dysfunction.", "caseContext": "Case Study 1: The \"Toxic Terrain\" Athlete. Questions 137-148\nPatient: Marcus, 38-year-old male, semi-professional cyclist.\nChief Concern: Recurrent bloating, exercise-induced asthma, and \"un-refreshing sleep.\"\nHISTORY & TIMELINE\nAntecedents: Born via C-section; formula-fed; history of multiple antibiotic rounds for ear infections as a child.\nTriggers: Traveled to Southeast Asia 1 year ago; experienced \"traveler's diarrhea\" that never fully resolved.\nMediators: High-protein \"performance\" bars (sugar alcohols), chlorinated pool water, and daily ibuprofen for knee\npain.\nPHYSICAL EXAM\nSkin: Follicular hyperkeratosis on backs of arms; white coating on tongue.\nAbdomen: Mild tenderness in the RUQ; distention noted post-prandially.\nBIOMARKERS\nGI: Stool PCR + for Blastocystis hominis; Low Secretory IgA; High Fecal Fat.\nDetox: Elevated GGT (45); Low Serum Albumin (3.6).\nNutrient: Low Vitamin D (22); Low Serum Zinc."}, {"id": 138, "question": "The 5R Framework is the primary tool for Marcus. What is the first \"R\" to address given his diet?", "options": [{"key": "A", "text": "Replace (Digestive enzymes)"}, {"key": "B", "text": "Remove (Sugar alcohols and potential parasites)"}, {"key": "C", "text": "Reinoculate (Probiotics)"}], "answer": "B", "rationale": "Remove (Sugar alcohols and potential parasites) Remove: In the 5R program, you must first remove the \"bad stuff\" (Pathogenic parasites like Blastocystis and irritants like sugar alcohols) before replacing enzymes or reinoculating.", "caseContext": null}, {"id": 139, "question": "Follicular hyperkeratosis on the arms (chicken skin) is a clinical indicator for deficiency in:", "options": [{"key": "A", "text": "Vitamin C"}, {"key": "B", "text": "Omega-3 Fatty Acids or Vitamin A"}, {"key": "C", "text": "B12"}], "answer": "B", "rationale": "Omega-3 Fatty Acids or Vitamin A Essential Fatty Acids: Follicular hyperkeratosis is a sign of \"poor quality\" fats in the skin membranes or Vitamin A/Zinc deficiency.", "caseContext": null}, {"id": 140, "question": "Marcus’s exercise-induced asthma is a systemic manifestation of which Matrix node?", "options": [{"key": "A", "text": "Transport"}, {"key": "B", "text": "Defense and Repair"}, {"key": "C", "text": "Biotransformation"}], "answer": "B", "rationale": "Defense and Repair Defense and Repair: Asthma is an immune-mediated inflammatory response of the airways.", "caseContext": null}, {"id": 141, "question": "Which dietary strategy is most appropriate for a patient with Blastocystis and bloating?", "options": [{"key": "A", "text": "High-Fiber Vegan Diet"}, {"key": "B", "text": "Low FODMAP Diet"}, {"key": "C", "text": "Standard American Diet"}], "answer": "B", "rationale": "Low FODMAP Diet Low FODMAP: Effective for managing bloating associated with dysbiosis and parasitic infections by reducing rapidly fermentable substrates.", "caseContext": null}, {"id": 142, "question": "Low Secretory IgA (sIgA) suggests Marcus is in which state of immune function?", "options": [{"key": "A", "text": "Overactive/Hyper-vigilant"}, {"key": "B", "text": "Depleted mucosal immunity"}, {"key": "C", "text": "Acute infection"}], "answer": "B", "rationale": "Depleted mucosal immunity Depleted Immunity: Low slgA indicates chronic stress on the GI tract has exhausted the mucosal immune response.", "caseContext": null}, {"id": 143, "question": "Which supplement provides \"Structure\" for the enterocytes and \"Fuel\" for the GI lining?", "options": [{"key": "A", "text": "L-Glutamine"}, {"key": "B", "text": "Berberine"}, {"key": "C", "text": "Pancreatin"}], "answer": "A", "rationale": "L-Glutamine L-Glutamine: The preferred fuel for enterocytes; it supports both the structure (junctions) and function of the Gl lining.", "caseContext": null}, {"id": 144, "question": "The white coating on Marcus's tongue and un-refreshing sleep suggest a possible overgrowth of:", "options": [{"key": "A", "text": "H. pylori"}, {"key": "B", "text": "Candida"}, {"key": "C", "text": "Giardia"}], "answer": "B", "rationale": "Candida Candida: A white tongue coating (thrush) and unrefreshing sleep (due to acetaldehyde production) are clinical markers of fungal overgrowth.", "caseContext": null}, {"id": 145, "question": "Marcus uses ibuprofen (NSAIDs) daily. This acts as a mediator by:", "options": [{"key": "A", "text": "Inhibiting Phase II detox"}, {"key": "B", "text": "Increasing Intestinal Permeability"}, {"key": "C", "text": "Reducing Fasting Insulin"}], "answer": "B", "rationale": "Increasing Intestinal Permeability Permeability: NSAIDs are a primary \"Trigger/Mediator\" that cause direct injury to the small intestinal mucosa, leading to hyperpermeability.", "caseContext": null}, {"id": 146, "question": "According to the Environmental Health Decision Tree, Marcus’s first step in detox is:", "options": [{"key": "A", "text": "Heavy metal chelation"}, {"key": "B", "text": "Reducing toxic exposures"}, {"key": "C", "text": "High-dose glutathione IV"}], "answer": "B", "rationale": "Reducing toxic exposures Reduce Exposures: The \"Environmental Health Decision Tree\" dictates that reducing the \"incoming load\" is always the first priority.", "caseContext": null}, {"id": 147, "question": "If Marcus’s bloating occurs 90 minutes after eating, which condition should be ruled out?", "options": [{"key": "A", "text": "Small Intestinal Bacterial Overgrowth"}, {"key": "B", "text": "Hypochlorhydria"}, {"key": "C", "text": "Celiac Disease"}], "answer": "A", "rationale": "Small Intestinal Bacterial Overgrowth SIBO: Post-prandial bloating that occurs 60-90 minutes after eating (when food reaches the small intestine) is a classic indicator of SIBO.", "caseContext": null}, {"id": 148, "question": "Which nutrient is a critical cofactor for both Phase 1 Detox and Heme synthesis (Energy)?", "options": [{"key": "A", "text": "Iron"}, {"key": "B", "text": "Magnesium"}, {"key": "C", "text": "Molybdenum"}], "answer": "A", "rationale": "Iron Iron: Iron is required for Cytochrome P450 enzymes (Phase 1) and is a central component of the electron transport chain (Energy). Case Study 2 — Answer Key", "caseContext": null}, {"id": 149, "question": "David’s high 8-OHdG and high urinary citrate/cis-aconitate primarily indicate dysfunction in which Matrix node?", "options": [{"key": "A", "text": "Assimilation"}, {"key": "B", "text": "Energy"}, {"key": "C", "text": "Biotransformation"}], "answer": "B", "rationale": "Energy 8-OHdG is a marker of oxidative DNA damage. High urinary citrate and cis-aconitate (Krebs cycle intermediates) suggest a \"bottleneck\" in the mitochondria, placing this squarely in the Energy node.", "caseContext": "Case Study 2: The \"Fading\" Professor (Bioenergetics & Neuro-Inflammation). Questions\n149-160\nPatient Profile: David, a 62-year-old History Professor.\nChief Concern: Cognitive decline (forgetting names), \"dragging feet\" by late afternoon, and persistent low mood.\nHistory: David grew up in a rural area near heavy pesticide spraying. He had a severe concussion 10 years ago. He\ncurrently works 60 hours a week and sleeps only 5.5 hours per night.\nPhysical Exam: Subtle resting tremor in the right hand. \"Cogwheel rigidity\" noted in the wrist. Normal gait but\nslightly reduced arm swing on the right. Skin shows seborrheic dermatitis on the scalp and nasolabial folds.\nLABS\nHomocysteine: 16.2 umol/L (High)\nFasting Insulin: 18 uIU/mL (High)  ·  Vitamin B12: 380 pg/mL (Low-normal)\nUrinary Organic Acids: High Citrate and Cis-aconitate; High 8-OHdG.\nRBC Magnesium: 4.1 mg/dL (Low)"}, {"id": 150, "question": "David’s childhood pesticide exposure is best classified on the Timeline as an:", "options": [{"key": "A", "text": "Antecedent"}, {"key": "B", "text": "Trigger"}, {"key": "C", "text": "Mediator"}], "answer": "A", "rationale": "Antecedent Antecedents are factors that \"set the stage.\" Early life exposures (childhood) that precede the onset of symptoms or triggers are classified as Antecedents.", "caseContext": null}, {"id": 151, "question": "The \"Cogwheel rigidity\" and tremor suggest a clinical focus on which neurotransmitter system?", "options": [{"key": "A", "text": "Serotonin"}, {"key": "B", "text": "Dopamine"}, {"key": "C", "text": "GABA"}], "answer": "B", "rationale     const STORAGE_KEY_ANSWERS = 'ifm_exam5_answers';
    const STORAGE_KEY_SUBMITTED = 'ifm_exam5_submitted_groups';
    const STORAGE_KEY_VOCAB = 'ifm_vocab_list';
    const STORAGE_KEY_THEME = 'ifm_theme';

    let userAnswers = JSON.parse(localStorage.getItem(STORAGE_KEY_ANSWERS) || '{}');
    let submittedGroups = JSON.parse(localStorage.getItem(STORAGE_KEY_SUBMITTED) || '{}');
    let vocabList = JSON.parse(localStorage.getItem(STORAGE_KEY_VOCAB) || '[]');
    let currentBatch = 1;
    const batchSize = 20;
    const totalBatches = 8;

    function speakWord(word) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(word);
      const voices = window.speechSynthesis.getVoices();
      const naturalVoice = voices.find(v => (v.name.includes("Samantha") || v.name.includes("Ava") || v.name.includes("Jenny") || v.name.includes("Natural")) && v.lang.startsWith("en")) || voices.find(v => v.lang === "en-US");
      if (naturalVoice) utter.voice = naturalVoice;
      utter.lang = 'en-US';
      utter.rate = 0.88;
      window.speechSynthesis.speak(utter);
    }
    if ('speechSynthesis' in window) window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();

    function init() {
      applyTheme();
      renderBatchBar();
      renderQuestions();
      updateBadges();
      setupSelectionTooltip();
    }

    function switchView(viewName) {
      document.getElementById('view-exam').style.display = viewName === 'exam' ? 'block' : 'none';
      document.getElementById('view-vocab').style.display = viewName === 'vocab' ? 'block' : 'none';
      document.getElementById('view-wrong').style.display = viewName === 'wrong' ? 'block' : 'none';

      document.getElementById('tab-exam').className = 'nav-btn' + (viewName === 'exam' ? ' active' : '');
      document.getElementById('tab-vocab').className = 'nav-btn' + (viewName === 'vocab' ? ' active' : '');
      document.getElementById('tab-wrong').className = 'nav-btn' + (viewName === 'wrong' ? ' active' : '');

      if (viewName === 'vocab') renderVocabList();
      if (viewName === 'wrong') renderWrongList();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderBatchBar() {
      const container = document.getElementById('batch-grid');
      let html = '';
      let totalAnsweredAll = Object.keys(userAnswers).length;

      for (let i = 1; i <= totalBatches; i++) {
        const start = (i - 1) * batchSize + 1;
        const end = i * batchSize;
        
        let answeredInGroup = 0;
        let correctInGroup = 0;
        for (let qid = start; qid <= end; qid++) {
          if (userAnswers[qid]) answeredInGroup++;
          const q = ALL_QUESTIONS[qid - 1];
          if (q && userAnswers[qid] === q.answer) correctInGroup++;
        }

        const isSub = !!submittedGroups[i];
        let subText = `${answeredInGroup}/20 题`;
        if (isSub) {
          subText = `${correctInGroup}/20 正确 ✅`;
        }

        html += `
          <button class="batch-btn ${i === currentBatch ? 'active' : ''}" onclick="switchBatch(${i})">
            <span>${start}–${end} 题</span>
            <span class="batch-sub">${subText}</span>
          </button>
        `;
      }
      container.innerHTML = html;
      document.getElementById('exam-overall-stats').innerText = `总进度：${totalAnsweredAll} / 160 题已答`;
      document.getElementById('current-group-num').innerText = currentBatch;

      const isCurrentSub = !!submittedGroups[currentBatch];
      const btnSubmit = document.getElementById('btn-group-submit');
      if (isCurrentSub) {
        btnSubmit.innerText = '🔄 重新核对本组';
      } else {
        btnSubmit.innerText = '📝 交卷核对本组';
      }
    }

    function switchBatch(batchNum) {
      currentBatch = batchNum;
      renderBatchBar();
      renderQuestions();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function nextGroup() {
      if (currentBatch < totalBatches) {
        switchBatch(currentBatch + 1);
      } else {
        showToast('已经是最后一组了！建议切换到【错题深度复盘】进行汇总！');
      }
    }

    function renderQuestions() {
      const container = document.getElementById('questions-container');
      const startIdx = (currentBatch - 1) * batchSize;
      const batchList = ALL_QUESTIONS.slice(startIdx, startIdx + batchSize);
      const isSub = !!submittedGroups[currentBatch];

      let html = '';

      batchList.forEach(q => {
        const uAns = userAnswers[q.id];

        if (q.caseContext) {
          html += `
            <div class="case-card">
              <h3>📋 综合临床案例背景</h3>
              <pre>${q.caseContext}</pre>
            </div>
          `;
        }

        html += `
          <div class="card" id="q-card-${q.id}">
            <div class="q-meta">
              <span class="q-badge">QUESTION ${q.id} OF 160</span>
              <span>IFM Practice Exam 5</span>
            </div>
            <div class="question-stem">${q.question}</div>
            <div class="options">
              ${q.options.map(opt => {
                let optClass = 'option-label';
                if (isSub) {
                  if (opt.key === q.answer) optClass += ' is-correct';
                  else if (uAns === opt.key && uAns !== q.answer) optClass += ' is-wrong';
                }
                return `
                  <label class="${optClass}" id="opt-label-${q.id}-${opt.key}">
                    <input type="radio" name="q-${q.id}" value="${opt.key}" 
                      ${uAns === opt.key ? 'checked' : ''} 
                      onchange="selectAnswer(${q.id}, '${opt.key}')">
                    <span><span class="opt-key">${opt.key}.</span>${opt.text}</span>
                  </label>
                `;
              }).join('')}
            </div>
            <div class="explanation" id="exp-${q.id}" style="display: ${isSub ? 'block' : 'none'};">
              <div class="exp-row"><span class="exp-tag">🎯 正确答案:</span> <strong>${q.answer}</strong></div>
              <div class="exp-row"><span class="exp-tag">🔬 IFM 官方临床解析:</span> ${q.rationale || '详见 IFM 教材核心讲义解析'}</div>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    function selectAnswer(qid, val) {
      userAnswers[qid] = val;
      localStorage.setItem(STORAGE_KEY_ANSWERS, JSON.stringify(userAnswers));
      renderBatchBar();
      updateBadges();
    }

    function submitCurrentGroup() {
      const start = (currentBatch - 1) * batchSize + 1;
      const end = currentBatch * batchSize;
      
      let answeredCount = 0;
      let correctCount = 0;

      for (let qid = start; qid <= end; qid++) {
        if (userAnswers[qid]) answeredCount++;
        const q = ALL_QUESTIONS[qid - 1];
        if (q && userAnswers[qid] === q.answer) correctCount++;
      }

      submittedGroups[currentBatch] = true;
      localStorage.setItem(STORAGE_KEY_SUBMITTED, JSON.stringify(submittedGroups));

      renderBatchBar();
      renderQuestions();
      updateBadges();

      showToast(`第 ${currentBatch} 组核对完毕！答对 ${correctCount} / ${batchSize} 题（得分率 ${Math.round(correctCount / batchSize * 100)}%）`);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    let currentSelectedText = '';
    function setupSelectionTooltip() {
      const tooltip = document.getElementById('selection-tooltip');

      document.addEventListener('mouseup', function(e) {
        if (e.target.closest('#selection-tooltip')) return;

        const sel = window.getSelection();
        const text = sel.toString().trim();

        if (text && text.length > 1 && text.length < 50 && /^[a-zA-Z\s\-]+$/.test(text)) {
          currentSelectedText = text;
          const cleanKey = text.toLowerCase();
          const dictEntry = MEDICAL_DICT[cleanKey] || {};

          document.getElementById('tt-word').innerText = text;
          document.getElementById('tt-ipa').innerText = dictEntry.ipa || '';
          document.getElementById('tt-cn').innerText = dictEntry.cn || '点击收录或发音';

          const range = sel.getRangeAt(0);
          const rect = range.getBoundingClientRect();
          
          tooltip.style.left = (rect.left + rect.width / 2 + window.scrollX) + 'px';
          tooltip.style.top = (rect.top + window.scrollY) + 'px';
          tooltip.style.display = 'block';
        } else {
          tooltip.style.display = 'none';
        }
      });
    }

    function playSelectedWord(e) {
      e.stopPropagation();
      if (currentSelectedText) speakWord(currentSelectedText);
    }

    function saveSelectedWord(e) {
      e.stopPropagation();
      if (!currentSelectedText) return;
      const cleanKey = currentSelectedText.toLowerCase();
      const dictEntry = MEDICAL_DICT[cleanKey] || {};

      if (!vocabList.some(v => v.word.toLowerCase() === cleanKey)) {
        vocabList.unshift({
          word: currentSelectedText,
          ipa: dictEntry.ipa || '',
          cn: dictEntry.cn || '',
          time: new Date().toLocaleDateString()
        });
        localStorage.setItem(STORAGE_KEY_VOCAB, JSON.stringify(vocabList));
        updateBadges();
        showToast(`已成功收录: ${currentSelectedText} 到生词本！`);
      } else {
        showToast(`该词已在生词本中`);
      }
      document.getElementById('selection-tooltip').style.display = 'none';
    }

    function renderVocabList() {
      const tbody = document.getElementById('vocab-table-body');
      if (vocabList.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding: 2.5rem; color: var(--text-muted);">生词本为空。在答题过程中用鼠标选中任何英文生词，即可划词发音并收录！</td></tr>`;
        return;
      }
      tbody.innerHTML = vocabList.map((item, idx) => `
        <tr>
          <td><strong>${item.word}</strong></td>
          <td style="color: #8b5cf6; font-family: monospace;">${item.ipa || '-'}</td>
          <td>${item.cn || '<span style="color:var(--text-muted);">自行记忆</span>'}</td>
          <td style="text-align: center;">
            <button class="btn-icon" onclick="speakWord('${item.word}')" title="播放真人自然发音">🔊</button>
          </td>
          <td style="text-align: center;">
            <button class="btn-icon" onclick="deleteVocab(${idx})" title="删除" style="color: var(--danger);">🗑️</button>
          </td>
        </tr>
      `).join('');
    }

    function deleteVocab(idx) {
      vocabList.splice(idx, 1);
      localStorage.setItem(STORAGE_KEY_VOCAB, JSON.stringify(vocabList));
      renderVocabList();
      updateBadges();
      showToast('已从生词本移除');
    }

    function clearVocab() {
      if (confirm('确定要清空全部生词本吗？')) {
        vocabList = [];
        localStorage.setItem(STORAGE_KEY_VOCAB, JSON.stringify(vocabList));
        renderVocabList();
        updateBadges();
        showToast('生词本已清空');
      }
    }

    function copyVocabMarkdown() {
      if (vocabList.length === 0) return showToast('生词本为空！');
      let md = '| 单词 (Word) | 国际音标 (IPA) | 功能医学专业释义 |\n|---|---|---|\n';
      vocabList.forEach(v => {
        md += `| ${v.word} | ${v.ipa} | ${v.cn} |\n`;
      });
      navigator.clipboard.writeText(md).then(() => showToast('已成功复制 Markdown 表格到剪贴板！可直接粘贴至 Obsidian！'));
    }

    function exportVocabTSV() {
      if (vocabList.length === 0) return showToast('生词本为空！');
      let tsv = '';
      vocabList.forEach(v => {
        tsv += `${v.word}\t${v.ipa}\t${v.cn}\n`;
      });
      navigator.clipboard.writeText(tsv).then(() => showToast('已成功复制 TSV 到剪贴板！可直接粘贴导入 Anki！'));
    }

    function renderWrongList() {
      const container = document.getElementById('wrong-list-container');
      const wrongQuestions = [];

      ALL_QUESTIONS.forEach(q => {
        const groupNum = Math.ceil(q.id / batchSize);
        if (submittedGroups[groupNum]) {
          const uAns = userAnswers[q.id];
          if (uAns && uAns !== q.answer) {
            wrongQuestions.push({ question: q, userAns: uAns });
          }
        }
      });

      if (wrongQuestions.length === 0) {
        container.innerHTML = `
          <div class="card" style="text-align: center; padding: 3rem; color: var(--text-muted);">
            🎉 暂无错题记录！请先在【英文真题】中作答并点击【交卷核对】，系统会自动抓取全部错题！
          </div>
        `;
        return;
      }

      container.innerHTML = wrongQuestions.map(w => `
        <div class="wrong-item">
          <div class="wrong-header">
            <span style="color: var(--danger);">QUESTION ${w.question.id} (第 ${Math.ceil(w.question.id / batchSize)} 组)</span>
            <span>IFM Practice Exam 5</span>
          </div>
          <div class="wrong-stem">${w.question.question}</div>
          <div class="wrong-choice-grid">
            <div class="my-choice">❌ 我的选择: ${w.userAns}</div>
            <div class="correct-choice">✅ 正确答案: ${w.question.answer}</div>
          </div>
          <div class="explanation" style="display:block; margin-top: 0.6rem;">
            <div class="exp-row"><span class="exp-tag">🔬 机制深度剖析:</span> ${w.question.rationale}</div>
          </div>
        </div>
      `).join('');
    }

    function getWrongList() {
      const wrongQuestions = [];
      ALL_QUESTIONS.forEach(q => {
        const groupNum = Math.ceil(q.id / batchSize);
        if (submittedGroups[groupNum]) {
          const uAns = userAnswers[q.id];
          if (uAns && uAns !== q.answer) {
            wrongQuestions.push({ q: q, uAns: uAns });
          }
        }
      });
      return wrongQuestions;
    }

    function copyWrongForNotebookLM() {
      const wrongQuestions = getWrongList();
      if (wrongQuestions.length === 0) return showToast('目前暂无已批改出的错题！');

      let text = `【请基于已上传的 IFM 官方讲义、教材与课程 Transcript 检索并回答】\n\n`;
      text += `我在进行 IFM Practice Exam 5 模考时做错了以下题目。请检索知识库中对应的 APM 模块（GI, Detox, Hormone, Energy, Immune, Cardiometabolic, Neuro/Matrix/GOTOIT）及课程音频文字稿：\n\n`;
      text += `1. **知识点与模块定位**：指出每道题涉及的核心模块、讲义章节或专家观点；\n`;
      text += `2. **错选辨析与机制深剖**：对照【我的错误选择】与【官方正确答案】，用讲义中的生理/生化机理解释我为什么会混淆，并引用讲义依据；\n`;
      text += `3. **临床要点总结**：提炼该知识点在 IFM 认证考试中的必背临床诊断与干预原则。\n\n`;
      text += `### 错题明细清单：\n\n`;

      wrongQuestions.forEach((item, index) => {
        text += `#### 错题 ${index + 1} (Question ${item.q.id})\n`;
        text += `**英文题干**: ${item.q.question}\n`;
        text += `**选项列表**:\n`;
        item.q.options.forEach(opt => {
          text += `  - ${opt.key}. ${opt.text}\n`;
        });
        text += `**我的错误选择**: ❌ ${item.uAns}\n`;
        text += `**官方正确答案**: ✅ ${item.q.answer}\n`;
        text += `**官方临床解析**: ${item.q.rationale}\n\n`;
      });

      navigator.clipboard.writeText(text).then(() => {
        showToast('已复制【NotebookLM 专属提问指令】！直接粘贴到 NotebookLM 对话框即可！');
      });
    }

    function copyWrongForAI() {
      const wrongQuestions = getWrongList();
      if (wrongQuestions.length === 0) return showToast('目前暂无已批改出的错题！');

      let promptText = `## IFM 备考专项深度复盘与二次变式出题\n\n`;
      promptText += `我在做 IFM Practice Exam 5 时出现以下错题。请调取我的 IFM 课程笔记与讲义，针对每道错题帮我做两件事：\n`;
      promptText += `1. **核心病理生理机制剖析**：分析我为什么容易选错【我的选项】，正解【正确选项】在功能医学矩阵（Matrix）或生化通路上的根本逻辑是什么；\n`;
      promptText += `2. **反向变式出题（二次盲测）**：针对该考点，出 2 道新的英文临床案例长题（附 4 个选项与解析），测试我是否彻底掌握。\n\n`;
      promptText += `### 错题明细清单：\n\n`;

      wrongQuestions.forEach((item, index) => {
        promptText += `#### 错题 ${index + 1} (Question ${item.q.id})\n`;
        promptText += `- **英文原题**: ${item.q.question}\n`;
        promptText += `- **我的错误选择**: ${item.uAns}\n`;
        promptText += `- **官方正确答案**: ${item.q.answer}\n`;
        promptText += `- **官方参考解析**: ${item.q.rationale}\n\n`;
      });

      navigator.clipboard.writeText(promptText).then(() => {
        showToast('已成功复制变式出题 Prompt！请直接粘贴至 Gemini / Claude 对话框！');
      });
    }

    function copyWrongAsNote() {
      const wrongQuestions = getWrongList();
      if (wrongQuestions.length === 0) return showToast('目前暂无已批改出的错题！');

      let text = `# IFM Practice Exam 5 错题复盘笔记\n\n`;
      text += `> 收录日期: ${new Date().toLocaleDateString()} | 错题总数: ${wrongQuestions.length} 题\n\n`;
      text += `---\n\n`;

      wrongQuestions.forEach((item, index) => {
        text += `### Q${item.q.id}. ${item.q.question}\n\n`;
        item.q.options.forEach(opt => {
          let mark = '  ';
          if (opt.key === item.q.answer) mark = '✅ ';
          else if (opt.key === item.uAns) mark = '❌ ';
          text += `- ${mark}${opt.key}. ${opt.text}\n`;
        });
        text += `\n**我的错选**: ${item.uAns} | **标准答案**: ${item.q.answer}\n\n`;
        text += `**官方临床机制解析 (Rationale)**:\n${item.q.rationale}\n\n`;
        text += `---\n\n`;
      });

      navigator.clipboard.writeText(text).then(() => {
        showToast('已复制【Markdown 错题笔记源】！可在 NotebookLM 点击“添加笔记”直接粘贴！');
      });
    }

    function updateBadges() {
      document.getElementById('vocab-count').innerText = vocabList.length;
      
      let wrongCount = 0;
      ALL_QUESTIONS.forEach(q => {
        const groupNum = Math.ceil(q.id / batchSize);
        if (submittedGroups[groupNum] && userAnswers[q.id] && userAnswers[q.id] !== q.answer) {
          wrongCount++;
        }
      });
      document.getElementById('wrong-count').innerText = wrongCount;
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 3200);
    }

    function applyTheme() {
      const th = localStorage.getItem(STORAGE_KEY_THEME) || 'light';
      if (th === 'dark') document.body.classList.add('dark-mode');
      else document.body.classList.remove('dark-mode');
    }
    function toggleTheme() {
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      localStorage.setItem(STORAGE_KEY_THEME, isDark ? 'dark' : 'light');
    }

    window.onload = init;
  </script>
</body>
</html>
