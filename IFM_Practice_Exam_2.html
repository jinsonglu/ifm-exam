<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IFM 官方全真模拟考场 · Exam 2 (160题全量)</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-hover: #1e40af;
      --primary-light: #eff6ff;
      --accent: #0284c7;
      --success: #15803d;
      --success-light: #dcfce7;
      --danger: #b91c1c;
      --danger-light: #fee2e2;
      --warning: #d97706;
      --text: #0f172a;
      --text-muted: #64748b;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --border-dark: #cbd5e1;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    body.dark-mode {
      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --primary-light: #1e293b;
      --accent: #38bdf8;
      --success: #22c55e;
      --success-light: #14532d33;
      --danger: #ef4444;
      --danger-light: #7f1d1d33;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --border-dark: #475569;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding-bottom: 5rem;
      transition: background-color 0.2s, color 0.2s;
    }

    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 0.85rem 1.8rem;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow-sm);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .brand h1 {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.01em;
    }
    .brand .badge {
      background: var(--primary-light);
      color: var(--primary);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.2rem 0.55rem;
      border-radius: 9999px;
      border: 1px solid var(--primary);
    }

    .nav-tabs {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .nav-btn {
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text);
      padding: 0.45rem 0.95rem;
      border-radius: 7px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }
    .nav-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .nav-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .theme-toggle {
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.45rem 0.7rem;
      border-radius: 7px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .container {
      max-width: 960px;
      margin: 1.5rem auto;
      padding: 0 1rem;
    }

    .batch-bar-card {
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 1rem 1.25rem;
      margin-bottom: 1.5rem;
      box-shadow: var(--shadow-sm);
    }
    .batch-bar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }
    .batch-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .batch-stats {
      font-size: 0.82rem;
      color: var(--text-muted);
    }
    .batch-btns-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(105px, 1fr));
      gap: 0.5rem;
    }
    .batch-btn {
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      padding: 0.5rem 0.4rem;
      border-radius: 8px;
      font-size: 0.82rem;
      cursor: pointer;
      font-weight: 600;
      text-align: center;
      transition: all 0.15s ease;
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }
    .batch-btn:hover {
      border-color: var(--accent);
      background: var(--primary-light);
    }
    .batch-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      box-shadow: 0 2px 4px rgba(30, 58, 138, 0.25);
    }
    .batch-btn .batch-sub {
      font-size: 0.7rem;
      font-weight: normal;
      opacity: 0.85;
    }

    .case-card {
      background: #eff6ff;
      border: 2px solid #bfdbfe;
      border-radius: 12px;
      padding: 1.4rem;
      margin-bottom: 1.5rem;
      color: #1e3a8a;
      line-height: 1.7;
    }
    body.dark-mode .case-card {
      background: #172554;
      border-color: #1e40af;
      color: #dbeafe;
    }
    .case-card h3 {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .case-card pre {
      white-space: pre-wrap;
      font-family: inherit;
      font-size: 0.92rem;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 1.5rem;
      margin-bottom: 1.3rem;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.2s;
    }
    .card:hover {
      border-color: var(--border-dark);
    }
    .q-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .q-badge {
      background: var(--bg);
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      border: 1px solid var(--border);
    }
    .question-stem {
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.7;
      margin-bottom: 1.2rem;
      color: var(--text);
      user-select: text;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }
    .option-label {
      display: flex;
      align-items: flex-start;
      gap: 0.85rem;
      padding: 0.85rem 1.15rem;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.15s ease;
      background: var(--card-bg);
      font-size: 0.95rem;
      line-height: 1.55;
      user-select: text;
    }
    .option-label:hover {
      background-color: var(--primary-light);
      border-color: #93c5fd;
    }
    .option-label input[type="radio"] {
      margin-top: 0.25rem;
      width: 1.15rem;
      height: 1.15rem;
      accent-color: var(--primary);
      cursor: pointer;
    }
    .opt-key {
      font-weight: 700;
      color: var(--primary);
      margin-right: 0.2rem;
    }
    body.dark-mode .opt-key {
      color: var(--accent);
    }

    .option-label.is-correct {
      background-color: var(--success-light) !important;
      border-color: var(--success) !important;
      color: var(--success) !important;
      font-weight: 600;
    }
    .option-label.is-wrong {
      background-color: var(--danger-light) !important;
      border-color: var(--danger) !important;
      color: var(--danger) !important;
      text-decoration: line-through;
    }

    .explanation {
      margin-top: 1.2rem;
      padding: 1.15rem;
      background: var(--bg);
      border-left: 4px solid var(--accent);
      border-radius: 8px;
      font-size: 0.92rem;
      line-height: 1.65;
      animation: fadeIn 0.25s ease-in-out;
    }
    .exp-row {
      margin-bottom: 0.6rem;
    }
    .exp-row:last-child {
      margin-bottom: 0;
    }
    .exp-tag {
      display: inline-block;
      font-weight: 700;
      color: var(--accent);
      margin-right: 0.4rem;
    }

    #selection-tooltip {
      position: absolute;
      display: none;
      background: #0f172a;
      color: #fff;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.88rem;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.4);
      z-index: 1000;
      transform: translate(-50%, -100%);
      margin-top: -10px;
      white-space: nowrap;
      pointer-events: auto;
      animation: popIn 0.15s ease-out;
    }
    #selection-tooltip::after {
      content: "";
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 6px 6px 0;
      border-style: solid;
      border-color: #0f172a transparent;
    }
    .tooltip-content {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .tooltip-word {
      font-weight: 700;
      color: #38bdf8;
    }
    .tooltip-ipa {
      color: #a78bfa;
      font-family: "Lucida Sans Unicode", sans-serif;
      font-size: 0.82rem;
    }
    .tooltip-cn {
      color: #e2e8f0;
      max-width: 260px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tooltip-btn {
      background: #1e293b;
      border: 1px solid #475569;
      color: #fff;
      border-radius: 5px;
      padding: 0.2rem 0.5rem;
      cursor: pointer;
      font-size: 0.78rem;
      transition: background 0.15s;
    }
    .tooltip-btn:hover {
      background: #334155;
    }

    .submit-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 1.5rem;
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      margin-top: 1.5rem;
    }
    .btn-submit {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 0.75rem 1.8rem;
      border-radius: 9px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 6px -1px rgba(30, 58, 138, 0.25);
      transition: background 0.15s, transform 0.1s;
    }
    .btn-submit:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }
    .btn-next {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.75rem 1.4rem;
      border-radius: 9px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-next:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .table-container {
      background: var(--card-bg);
      border-radius: 12px;
      border: 1px solid var(--border);
      overflow: hidden;
      margin-top: 1rem;
      box-shadow: var(--shadow-sm);
    }
    .custom-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    .custom-table th, .custom-table td {
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }
    .custom-table th {
      background: var(--bg);
      font-weight: 600;
      color: var(--text-muted);
    }
    .btn-icon {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
      transition: transform 0.1s;
    }
    .btn-icon:hover {
      transform: scale(1.2);
    }

    .wrong-item {
      background: var(--card-bg);
      border-radius: 10px;
      border: 1px solid var(--border);
      padding: 1.25rem;
      margin-bottom: 1rem;
      border-left: 4px solid var(--danger);
    }
    .wrong-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.6rem;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .wrong-stem {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 0.8rem;
    }
    .wrong-choice-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      margin-bottom: 0.8rem;
      font-size: 0.88rem;
    }
    .my-choice {
      padding: 0.5rem 0.8rem;
      background: var(--danger-light);
      color: var(--danger);
      border-radius: 6px;
      font-weight: 600;
    }
    .correct-choice {
      padding: 0.5rem 0.8rem;
      background: var(--success-light);
      color: var(--success);
      border-radius: 6px;
      font-weight: 600;
    }

    #toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      background: #0f172a;
      color: #fff;
      padding: 0.7rem 1.4rem;
      border-radius: 9999px;
      font-size: 0.88rem;
      font-weight: 500;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
      display: none;
      z-index: 2000;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes popIn {
      from { opacity: 0; transform: translate(-50%, -80%); }
      to { opacity: 1; transform: translate(-50%, -100%); }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <h1>🩺 IFM 官方全真模拟考场</h1>
      <span class="badge">Exam 2 · 160题全量</span>
    </div>
    <div class="nav-tabs">
      <button class="nav-btn active" id="tab-exam" onclick="switchView('exam')">📝 英文真题 (160题)</button>
      <button class="nav-btn" id="tab-vocab" onclick="switchView('vocab')">📖 语音生词本 (<span id="vocab-count">0</span>)</button>
      <button class="nav-btn" id="tab-wrong" onclick="switchView('wrong')">❌ 错题深度复盘 (<span id="wrong-count">0</span>)</button>
      <button class="theme-toggle" onclick="toggleTheme()" title="切换明暗主题">🌗</button>
    </div>
  </header>

  <div id="selection-tooltip">
    <div class="tooltip-content">
      <span class="tooltip-word" id="tt-word">word</span>
      <span class="tooltip-ipa" id="tt-ipa">/ipa/</span>
      <span class="tooltip-cn" id="tt-cn">释义</span>
      <button class="tooltip-btn" onclick="playSelectedWord(event)" title="朗读">🔊 读音</button>
      <button class="tooltip-btn" onclick="saveSelectedWord(event)" title="收录到生词本">⭐ 收录</button>
    </div>
  </div>

  <div class="container">

    <div id="view-exam">
      <div class="batch-bar-card">
        <div class="batch-bar-header">
          <span class="batch-title">📌 分组答题导航（每组 20 题）</span>
          <span class="batch-stats" id="exam-overall-stats">总进度：0 / 160 题已答</span>
        </div>
        <div class="batch-btns-grid" id="batch-grid"></div>
      </div>

      <div id="questions-container"></div>

      <div class="submit-bar">
        <div id="batch-status-msg" style="font-size: 0.95rem; font-weight: 600; color: var(--text-muted);">
          第 <span id="current-group-num">1</span> 组答题中
        </div>
        <div style="display: flex; gap: 0.75rem;">
          <button class="btn-submit" id="btn-group-submit" onclick="submitCurrentGroup()">📝 交卷核对本组</button>
          <button class="btn-next" onclick="nextGroup()">下一组 ➡️</button>
        </div>
      </div>
    </div>

    <div id="view-vocab" style="display: none;">
      <div class="card" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <div>
          <h2 style="font-size: 1.15rem; color: var(--primary);">📖 沉浸式医学语音生词本</h2>
          <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.2rem;">划词即查即收录，随时点击 🔊 磨耳朵，支持导出至 Anki 或 Obsidian。</p>
        </div>
        <div style="display: flex; gap: 0.5rem;">
          <button class="nav-btn" onclick="copyVocabMarkdown()">📋 复制为 Markdown 表格</button>
          <button class="nav-btn" onclick="exportVocabTSV()">📥 导出 Anki 卡片 (TSV)</button>
          <button class="nav-btn" style="color: var(--danger); border-color: var(--danger);" onclick="clearVocab()">🗑️ 清空生词本</button>
        </div>
      </div>
      <div class="table-container">
        <table class="custom-table">
          <thead>
            <tr>
              <th style="width: 22%;">单词 / 术语</th>
              <th style="width: 22%;">国际音标 (IPA)</th>
              <th>功能医学专业释义</th>
              <th style="width: 80px; text-align: center;">发音</th>
              <th style="width: 70px; text-align: center;">操作</th>
            </tr>
          </thead>
          <tbody id="vocab-table-body"></tbody>
        </table>
      </div>
    </div>

    <div id="view-wrong" style="display: none;">
      <div class="card" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.8rem;">
        <div>
          <h2 style="font-size: 1.15rem; color: var(--danger);">❌ 错题深度复盘与 NotebookLM 联动</h2>
          <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.2rem;">自动归集各组答错题，一键生成 NotebookLM 专属检索指令或复盘笔记，无缝调取课程讲义。</p>
        </div>
        <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
          <button class="nav-btn" style="background: #e0f2fe; border-color: #38bdf8; color: #0369a1; font-weight: 700;" onclick="copyWrongForNotebookLM()">📖 复制 NotebookLM 提问指令</button>
          <button class="nav-btn" style="background: #fef08a; border-color: #ca8a04; color: #854d0e; font-weight: 700;" onclick="copyWrongForAI()">🤖 复制 Gemini 变式出题</button>
          <button class="nav-btn" onclick="copyWrongAsNote()">📝 复制为复盘笔记源</button>
        </div>
      </div>
      <div id="wrong-list-container"></div>
    </div>

  </div>

  <div id="toast"></div>

  <script>
    const ALL_QUESTIONS = [{"id": 1, "question": "Under the 'Anthropometrics' section, why is the 'Waist-to-Hip Ratio' often more clinically useful than BMI alone?", "options": [{"key": "A", "text": "BMI only measures height and weight, while waist-to-hip ratio indicates visceral adiposity."}, {"key": "B", "text": "BMI is an outdated metric that is no longer used in any form of medicine."}, {"key": "C", "text": "Waist-to-hip ratio is easier to calculate than BMI."}, {"key": "D", "text": "Waist-to-hip ratio specifically measures bone density."}], "answer": "A", "rationale": "BMI only measures height and weight, while waist-to-hip ratio indicates visceral adiposity. Visceral fat is a much stronger indicator of metabolic dysfunction and inflammation than total body weight.", "caseContext": null}, {"id": 2, "question": "Which core imbalance node would address issues related to the 'Extracellular Matrix' and 'Cellular Membranes'?", "options": [{"key": "A", "text": "Biotransformation"}, {"key": "B", "text": "Structural Integrity"}, {"key": "C", "text": "Defense and Repair"}, {"key": "D", "text": "Transport"}], "answer": "B", "rationale": "Structural Integrity This node addresses the physical boundaries and supportive structures from the cellular level to the organ level.", "caseContext": null}, {"id": 3, "question": "How does the 'Environment of Insight' facilitate behavior change in a way that a standard office visit might not?", "options": [{"key": "A", "text": "By using the patient's story to help them see the 'why' behind their own illness."}, {"key": "B", "text": "By ensuring the clinic has the most modern aesthetic design."}, {"key": "C", "text": "By prescribing the most advanced pharmaceuticals available."}, {"key": "D", "text": "By providing the patient with a detailed written manual on nutrition."}], "answer": "A", "rationale": "By using the patient's story to help them see the 'why' behind their own illness. When a patient has an 'Aha!' moment about their own history, they are much more likely to transform their habits.", "caseContext": null}, {"id": 4, "question": "A patient presents with high systemic inflammation. Which of the following lifestyle factors should be assessed as a primary 'Input' to this imbalance?", "options": [{"key": "A", "text": "Joint Pain"}, {"key": "B", "text": "Vitamin D Levels"}, {"key": "C", "text": "Sleep and Relaxation"}, {"key": "D", "text": "C-Reactive Protein (CRP)"}], "answer": "C", "rationale": "Sleep and Relaxation Inadequate sleep is a major driver of systemic inflammation and immune dysregulation.", "caseContext": null}, {"id": 5, "question": "In the context of Monique Class's lecture, what is 'Therapeutic Presence'?", "options": [{"key": "A", "text": "The practitioner's ability to remain emotionally detached from the patient."}, {"key": "B", "text": "The practitioner's physical presence in the room during an exam."}, {"key": "C", "text": "A state of being fully 'with' the patient, facilitating a safe space for healing and honesty."}, {"key": "D", "text": "The use of advanced technology to monitor a patient remotely."}], "answer": "C", "rationale": "A state of being fully 'with' the patient, facilitating a safe space for healing and honesty. This level of attention allows the practitioner to pick up on subtle cues in the patient's story.", "caseContext": null}, {"id": 6, "question": "In the context of the 'ABCDs' of Nutritional Evaluation, which of the following is considered a 'Clinical Indicator' that might suggest a deficiency in essential fatty acids?", "options": [{"key": "A", "text": "Elevated serum homocysteine."}, {"key": "B", "text": "A three-day food frequency questionnaire."}, {"key": "C", "text": "A high Waist-to-Hip Ratio."}, {"key": "D", "text": "Hyperkeratosis (goose-flesh appearance) on the back of the arms."}], "answer": "D", "rationale": "Hyperkeratosis (goose-flesh appearance) on the back of the arms. Physical skin findings like follicular hyperkeratosis are classic clinical indicators for nutrient deficiencies, including fatty acids and Vitamin A.", "caseContext": null}, {"id": 7, "question": "Which core clinical imbalance node on the Matrix is most affected by a patient's 'Microbiome diversity' and 'Intestinal Permeability'?", "options": [{"key": "A", "text": "Defense and Repair"}, {"key": "B", "text": "Communication"}, {"key": "C", "text": "Assimilation"}, {"key": "D", "text": "Biotransformation"}], "answer": "C", "rationale": "Assimilation Consider the system responsible for taking 'the outside world' and bringing it into the body. Assimilation covers the entire process of digestion, absorption, and the health of the intestinal barrier and microbiota.", "caseContext": null}, {"id": 8, "question": "What is the primary difference between a 'Trigger' and a 'Mediator' on the Functional Medicine Timeline?", "options": [{"key": "A", "text": "Triggers are genetic, while mediators are environmental."}, {"key": "B", "text": "Triggers initiate the illness, while mediators perpetuate the symptoms and imbalances."}, {"key": "C", "text": "Triggers are always physical, while mediators are always psychological."}, {"key": "D", "text": "Mediators occur before birth, while triggers occur after birth."}], "answer": "B", "rationale": "Triggers initiate the illness, while mediators perpetuate the symptoms and imbalances. Triggers are the 'inciting incidents' (like an infection), while mediators keep the physiological dysfunction going over time. Think of one as the spark that starts the fire and the other as the fuel that keeps it burning.", "caseContext": null}, {"id": 9, "question": "Monique Class suggests that for 'Transformation' to occur, the clinician must move from being an 'Expert' to being a:", "options": [{"key": "A", "text": "Strict Disciplinarian"}, {"key": "B", "text": "Collaborative Partner and Facilitator"}, {"key": "C", "text": "Primary Decision Maker"}, {"key": "D", "text": "Passive Observer"}], "answer": "B", "rationale": "Collaborative Partner and Facilitator Transformation requires a partnership where the patient is empowered to discover their own path to health. Consider the shift from 'doing to' the patient to 'working with' the patient.", "caseContext": null}, {"id": 10, "question": "If a patient has a high level of oxidative stress and low glutathione, which core imbalance node is most directly involved?", "options": [{"key": "A", "text": "Structural Integrity"}, {"key": "B", "text": "Energy"}, {"key": "C", "text": "Assimilation"}, {"key": "D", "text": "Transport"}], "answer": "B", "rationale": "Energy Energy imbalances often involve mitochondrial dysfunction and the resulting oxidative stress (ROS).", "caseContext": null}, {"id": 11, "question": "In the GOTOIT flow, why is the 'Organize' step performed before the 'Tell' step?", "options": [{"key": "A", "text": "To allow the doctor time to look up medications."}, {"key": "B", "text": "To ensure the clinician has a clear systems-biology map (the Matrix) to use when retelling the patient's story."}, {"key": "C", "text": "Because the 'Organize' step is where the patient leaves the room."}, {"key": "D", "text": "To hide the complexity of the case from the patient."}], "answer": "B", "rationale": "To ensure the clinician has a clear systems-biology map (the Matrix) to use when retelling the patient's story. Organizing the data onto the Matrix allows the clinician to see connections that make the 'Retelling' more insightful and accurate. The Matrix acts as the 'blueprint' that helps the clinician tell the story back to the patient effectively.", "caseContext": null}, {"id": 12, "question": "A patient's 'Spirituality' is considered a critical component of the Matrix. Where is it specifically assessed?", "options": [{"key": "A", "text": "It is not technically part of the clinical Matrix."}, {"key": "B", "text": "Within the 'Mental, Emotional, and Spiritual' (MES) center of the Matrix."}, {"key": "C", "text": "In the 'Communication' node."}, {"key": "D", "text": "Only under 'Modifiable Lifestyle Factors'."}], "answer": "B", "rationale": "Within the 'Mental, Emotional, and Spiritual' (MES) center of the Matrix. Spirituality is recognized as a core driver of health and is placed at the center alongside mental and emotional health.", "caseContext": null}, {"id": 13, "question": "Which 'ABCD' evaluation would include a 'DEXA scan' for body composition or 'Bioelectrical Impedance Analysis' (BIA)?", "options": [{"key": "A", "text": "Clinical Indicators"}, {"key": "B", "text": "Diet Evaluation"}, {"key": "C", "text": "Biomarkers"}, {"key": "D", "text": "Anthropometrics"}], "answer": "D", "rationale": "Anthropometrics Anthropometrics involves the measurement of the human body, including size, weight, and proportions.", "caseContext": null}, {"id": 14, "question": "What does the 'Environment of Insight' require from the clinician in terms of their own state of being?", "options": [{"key": "A", "text": "The ability to multitask during the interview."}, {"key": "B", "text": "A high level of intellectual superiority."}, {"key": "C", "text": "A state of 'Self-Gathering' and presence."}, {"key": "D", "text": "Strict adherence to a 10-minute time limit."}], "answer": "C", "rationale": "A state of 'Self-Gathering' and presence. The clinician must be centered and mindful to truly hear the patient and facilitate their self- discovery.", "caseContext": null}, {"id": 15, "question": "If a clinician prioritizes addressing 'Sleep' and 'Stress' before addressing 'Nutrient Deficiencies' in a complex patient, they are utilizing what Functional Medicine principle?", "options": [{"key": "A", "text": "Conventional Symptom Management."}, {"key": "B", "text": "The GOTOIT 'Tell' phase."}, {"key": "C", "text": "Addressing Modifiable Lifestyle Factors (MLFs) as the foundation of the Matrix."}, {"key": "D", "text": "Ignoring the core clinical imbalances."}], "answer": "C", "rationale": "Addressing Modifiable Lifestyle Factors (MLFs) as the foundation of the Matrix. Imbalances are often driven by lifestyle inputs; addressing these first provides a stable foundation for more specific interventions.", "caseContext": null}, {"id": 16, "question": "During the 'G' (Gather) phase of the GOTOIT heuristic, which clinical tool is primary for capturing the sequential story of a patient's life events?", "options": [{"key": "A", "text": "The Functional Medicine Matrix"}, {"key": "B", "text": "The Physical Exam"}, {"key": "C", "text": "The Diet Diary"}, {"key": "D", "text": "The Timeline"}], "answer": "D", "rationale": "The Timeline The Timeline is specifically designed to help the clinician and patient visualize the chronological relationship between life events and the development of illness. A is not quite correct since The Matrix is used for organizing and mapping imbalances, not for chronologically tracking life events.", "caseContext": null}, {"id": 17, "question": "A patient presents with symptoms of PCOS, including insulin resistance and irregular cycles. Under which clinical imbalance node on the Matrix should these hormonal issues be primarily categorized?", "options": [{"key": "A", "text": "Assimilation"}, {"key": "B", "text": "Communication"}, {"key": "C", "text": "Transport"}, {"key": "D", "text": "Defense and Repair"}], "answer": "B", "rationale": "Communication The Communication node encompasses the endocrine system, including hormones like insulin, sex hormones, and neurotransmitters. Consider the node responsible for signal transduction and hormonal balance.", "caseContext": null}, {"id": 18, "question": "According to the 5R protocol, if a patient has insufficient levels of beneficial Bifidobacteria but no overt pathogens, which intervention is most appropriate for the 'Reinoculate' step?", "options": [{"key": "A", "text": "High-dose botanical antimicrobials"}, {"key": "B", "text": "Specific prebiotics like Fructooligosaccharides"}, {"key": "C", "text": "NSAIDs to reduce mucosal swelling"}, {"key": "D", "text": "Broad-spectrum digestive enzymes"}], "answer": "B", "rationale": "Specific prebiotics like Fructooligosaccharides Think of this as providing 'fertilizer' for the bacteria that are already there. Prebiotics provide the specific substrate (fuel) needed to encourage the growth of indigenous beneficial bacteria.", "caseContext": null}, {"id": 19, "question": "A patient presents with 'Steatorrhea' (fatty stools). Within the 'Replace' step, which combination of factors should the clinician consider supplementing?", "options": [{"key": "A", "text": "Lactobacillus and Fiber"}, {"key": "B", "text": "Lipase and Bile Salts"}, {"key": "C", "text": "Glutamine and Zinc"}, {"key": "D", "text": "Betaine HCl and Pepsin"}], "answer": "B", "rationale": "Lipase and Bile Salts Fat digestion requires both a detergent-like substance and a specific enzyme. Lipase is required for the chemical digestion of fats, and bile salts are necessary for their emulsification.", "caseContext": null}, {"id": 20, "question": "Which physiological mechanism explains why stress (Nervous System node) can lead to increased Intestinal Permeability?", "options": [{"key": "A", "text": "Stress increases the production of protective sIgA."}, {"key": "B", "text": "Cortisol-mediated breakdown of the tight junction proteins."}, {"key": "C", "text": "Stress triggers the immediate secretion of pancreatic enzymes."}, {"key": "D", "text": "Stress promotes excessive chewing and mechanical digestion."}], "answer": "B", "rationale": "Cortisol-mediated breakdown of the tight junction proteins. Chronic stress and elevated cortisol can lead to the disassembly of zonulin and other tight junction proteins, opening the paracellular pathway.", "caseContext": null}, {"id": 21, "question": "A patient has a 'Low' Fecal Pancreatic Elastase-1 result but 'Normal' Fecal Fat. How should this be interpreted clinically?", "options": [{"key": "A", "text": "The patient is consuming too much protein and not enough fat."}, {"key": "B", "text": "The patient has no pancreatic issues."}, {"key": "C", "text": "The test is invalid and must be repeated after a 72-hour fast."}, {"key": "D", "text": "Mild to moderate pancreatic insufficiency that hasn't reached the threshold for overt steatorrhea."}], "answer": "D", "rationale": "Mild to moderate pancreatic insufficiency that hasn't reached the threshold for overt steatorrhea. Elastase-1 is more sensitive than fecal fat and can detect early or moderate insufficiency before fat malabsorption becomes measurable.", "caseContext": null}, {"id": 22, "question": "In the context of the 'Repair' phase, why is Vitamin A included in the protocol for GI healing?", "options": [{"key": "A", "text": "To provide the primary caloric fuel for colonocytes."}, {"key": "B", "text": "To neutralize hydrochloric acid in the duodenum."}, {"key": "C", "text": "To act as a surfactant to help dissolve bile stones."}, {"key": "D", "text": "To support the differentiation and health of mucosal epithelial cells."}], "answer": "D", "rationale": "To support the differentiation and health of mucosal epithelial cells. Think about the role of this vitamin in skin and mucosal health throughout the body. Vitamin A is critical for epithelial integrity and the production of mucus, which protects the gut lining.", "caseContext": null}, {"id": 23, "question": "Which of the following describes 'Deaminated Gliadin Peptide (DGP) IgG' testing in the functional assessment of Celiac disease?", "options": [{"key": "A", "text": "It is a reliable marker for Celiac disease, especially in individuals with IgA deficiency."}, {"key": "B", "text": "It is less sensitive than standard IgA tests in all patients."}, {"key": "C", "text": "It is a marker that stays elevated for years even after gluten removal."}, {"key": "D", "text": "It measures the physical height of the intestinal villi."}], "answer": "A", "rationale": "It is a reliable marker for Celiac disease, especially in individuals with IgA deficiency. This test is particularly helpful when the patient's immune system doesn't make enough of the standard antibody type. Since IgA deficiency is common in Celiac patients, IgG-based markers like DGP IgG provide a necessary alternative for diagnosis.", "caseContext": null}, {"id": 24, "question": "What is the primary clinical reason to use the 'Lactulose/Mannitol' test instead of just measuring serum Zonulin?", "options": [{"key": "A", "text": "The L/M test provides a functional measure of total absorptive capacity vs. paracellular leakage."}, {"key": "B", "text": "Zonulin only measures the stomach, not the small intestine."}, {"key": "C", "text": "The L/M test is cheaper and doesn't require a urine sample."}, {"key": "D", "text": "Zonulin is only elevated in cases of active food poisoning."}], "answer": "A", "rationale": "The L/M test provides a functional measure of total absorptive capacity vs. paracellular leakage. Consider the advantage of using a 'ratio' between a large and small molecule. By using two different sized sugars, the test assesses both the health of the cells (Mannitol) and the 'leakiness' of the junctions (Lactulose).", "caseContext": null}, {"id": 25, "question": "A patient has chronic dysbiosis ('G' node) and is about to start the 'Remove' phase. Why might the clinician also support Phase II Liver Detoxification during this time?", "options": [{"key": "A", "text": "To increase the potency of the botanical antimicrobials."}, {"key": "B", "text": "To help the body produce more hydrochloric acid."}, {"key": "C", "text": "To manage the toxic load from microbial die-off (Herxheimer reaction)."}, {"key": "D", "text": "To prevent the 'Replace' enzymes from being digested by the liver."}], "answer": "C", "rationale": "To manage the toxic load from microbial die-off (Herxheimer reaction). As pathogens are killed, they release endotoxins that must be processed and eliminated by the liver to prevent systemic symptoms.", "caseContext": null}, {"id": 26, "question": "A patient exhibits a 'blunted' sIgA response despite clinical symptoms of chronic dysbiosis. According to the material, what does this finding most likely signify regarding the GALT?", "options": [{"key": "A", "text": "A state of mucosal immune exhaustion or depletion."}, {"key": "B", "text": "Successful eradication of all pathogenic species."}, {"key": "C", "text": "An overactive, hypersensitive immune system."}, {"key": "D", "text": "The patient is consuming too many prebiotics."}], "answer": "A", "rationale": "A state of mucosal immune exhaustion or depletion. Think about what happens to a resource when it is overused for too long without recovery. When sIgA is low in the face of ongoing microbial stress, it suggests the Gut-Associated Lymphoid Tissue (GALT) can no longer sustain an adequate defense response.", "caseContext": null}, {"id": 27, "question": "In the context of 'N' (Nervous System) node dysfunction, what is the role of 'Migrating Motor Complex (MMC)' impairment in the development of SIBO?", "options": [{"key": "A", "text": "It increases stomach acid, which kills beneficial bacteria."}, {"key": "B", "text": "It prevents the absorption of Vitamin B12 in the stomach."}, {"key": "C", "text": "It fails to 'sweep' residual food and bacteria into the colon during fasting."}, {"key": "D", "text": "It causes the gallbladder to release bile too frequently."}], "answer": "C", "rationale": "It fails to 'sweep' residual food and bacteria into the colon during fasting. Consider the intestinal 'housekeeping' function that occurs between meals. The MMC acts as a 'housekeeper' wave; when impaired, bacteria can remain and proliferate in the small intestine instead of being cleared.", "caseContext": null}, {"id": 28, "question": "Which specific 'Replace' intervention is uniquely indicated for a patient with 'Hypochlorhydria' who also presents with low pepsinogen levels?", "options": [{"key": "A", "text": "Vegetable enzymes only."}, {"key": "B", "text": "Bicarbonate salts to buffer the duodenum."}, {"key": "C", "text": "Supplemental Betaine HCl with Pepsin."}, {"key": "D", "text": "High-dose magnesium citrate."}], "answer": "C", "rationale": "Supplemental Betaine HCl with Pepsin. Since HCl is required to convert pepsinogen into active pepsin, supplementing both ensures that protein proteolysis can actually occur.", "caseContext": null}, {"id": 29, "question": "What is the primary rationale for including 'Colostrum' or 'Serum-derived Bovine Immunoglobulins (SBI)' in the 'Repair' phase of a 5R protocol?", "options": [{"key": "A", "text": "To provide the essential amino acids for bile acid synthesis."}, {"key": "B", "text": "To bind and neutralize antigens and LPS in the lumen, reducing mucosal inflammation."}, {"key": "C", "text": "To replace the need for Pancreatic Elastase."}, {"key": "D", "text": "To increase the transit speed of the colon."}], "answer": "B", "rationale": "To bind and neutralize antigens and LPS in the lumen, reducing mucosal inflammation. Think of these as 'decoys' or 'sponges' that soak up irritating substances before they can touch the gut wall. By binding to toxins like LPS, these immunoglobulins prevent them from triggering the immune system, allowing the mucosa to heal.", "caseContext": null}, {"id": 30, "question": "A patient's MSQ (Medical Symptoms Questionnaire) shows high scores in joint pain and skin rashes, alongside GI bloating. Within the DIGIN framework, which node provides the most likely bridge between these systemic and localized symptoms?", "options": [{"key": "A", "text": "Intestinal Permeability (I)"}, {"key": "B", "text": "Digestion (D)"}, {"key": "C", "text": "Nervous System (N)"}, {"key": "D", "text": "Gut Microbiota (G)"}], "answer": "A", "rationale": "Intestinal Permeability (I) Increased permeability ('Leaky Gut') allows dietary and microbial antigens to enter systemic circulation, triggering distant immune responses in the skin and joints.", "caseContext": null}, {"id": 31, "question": "Which laboratory pattern is most suggestive of 'Occult GI Bleeding' rather than simple nutritional deficiency in a patient with Anemia?", "options": [{"key": "A", "text": "High Serum Ferritin and low Hemoglobin."}, {"key": "B", "text": "Low Pancreatic Elastase and high Fecal Fat."}, {"key": "C", "text": "Positive Fecal Occult Blood Test (FOBT) or Immunochemical Test (FIT)."}, {"key": "D", "text": "Increased Lactulose/Mannitol ratio."}], "answer": "C", "rationale": "Positive Fecal Occult Blood Test (FOBT) or Immunochemical Test (FIT). These tests specifically detect the presence of hemoglobin in the stool, indicating a break in the integrity of the GI tract.", "caseContext": null}, {"id": 32, "question": "When addressing 'Dysbiosis' in the 'G' node, how does the presence of 'B-glucuronidase' producing bacteria impact systemic health?", "options": [{"key": "A", "text": "It increases the production of beneficial short-chain fatty acids."}, {"key": "B", "text": "It speeds up the conversion of pepsinogen to pepsin."}, {"key": "C", "text": "It deconjugates estrogens and toxins in the gut, allowing them to be reabsorbed into circulation."}, {"key": "D", "text": "It helps the body absorb more Vitamin D."}], "answer": "C", "rationale": "It deconjugates estrogens and toxins in the gut, allowing them to be reabsorbed into circulation. This enzyme 'undoes' the liver's work, leading to increased systemic levels of substances that were intended for excretion.", "caseContext": null}, {"id": 33, "question": "Which clinical presentation is most indicative of 'Small Intestinal Fungal Overgrowth (SIFO)' as opposed to SIBO, based on the material's focus on fungal triggers?", "options": [{"key": "A", "text": "Increased pancreatic enzyme production."}, {"key": "B", "text": "Iron overload (Hemochromatosis)."}, {"key": "C", "text": "High levels of methane on a breath test."}, {"key": "D", "text": "History of chronic antibiotic use followed by intense sugar cravings and vaginal yeast infections."}], "answer": "D", "rationale": "History of chronic antibiotic use followed by intense sugar cravings and vaginal yeast infections. These are classic signs of fungal/yeast dysbiosis where opportunistic fungi fill the niche left by decimated bacteria.", "caseContext": null}, {"id": 34, "question": "A patient has symptoms of SIBO and a history of chronic constipation. Which finding on a breath test would most specifically explain the 'N' (Nervous System) and 'G' (Gut Microbiota) link to their slow transit?", "options": [{"key": "A", "text": "A 'double peak' pattern during the 3-hour test."}, {"key": "B", "text": "The complete absence of CO2 in the breath samples."}, {"key": "C", "text": "High initial Hydrogen (H2) at the 20-minute mark."}, {"key": "D", "text": "Elevated Methane (CH4) levels."}], "answer": "D", "rationale": "Elevated Methane (CH4) levels. Methane gas, produced by archaea like Methanobrevibacter. smithii, is known to inhibit intestinal transit by affecting neuromuscular activity, directly linking microbial overgrowth to constipation.", "caseContext": null}, {"id": 35, "question": "Why is 'Occult' infection a significant concept in the Immune APM module?", "options": [{"key": "A", "text": "Because these infections are always visible on standard imaging like MRIs."}, {"key": "B", "text": "They are easily treated with a single 7-day course of antibiotics."}, {"key": "C", "text": "Hidden infections can act as a persistent 'Trigger' keeping the immune system in a chronic state of activation."}, {"key": "D", "text": "Occult infections are only relevant in third-world countries."}], "answer": "C", "rationale": "Hidden infections can act as a persistent 'Trigger' keeping the immune system in a chronic state of activation. Persistent, low-level infections (viral, bacterial, or fungal) can drive chronic inflammation and systemic dysfunction even if they don't cause acute illness. In the IFM Matrix framework, occult infections are best thought of as ongoing triggers that continue to perpetuate immune activation. A mediator is more often the downstream biochemical or physiologic process that carries the inflammatory signal forward — for example cytokines, NF-kB activation, oxidative stress, or chronic immune dysregulation. So in this question, the hidden infection itself is the persistent upstream driver (trigger), while the chronic inflammatory pathways it sustains would be considered more of the “mediator “layer.", "caseContext": null}, {"id": 36, "question": "Which of the following describes the 'Cytokine-Prostaglandin Link' in chronic pain management?", "options": [{"key": "A", "text": "Standard NSAIDs can completely block cytokine production."}, {"key": "B", "text": "High levels of prostaglandins inhibit the production of all cytokines."}, {"key": "C", "text": "Cytokines like IL-1 and TNF-alpha induce the expression of COX-2, leading to increased prostaglandin production."}, {"key": "D", "text": "Prostaglandins are the only molecules that can cause pain."}], "answer": "C", "rationale": "Cytokines like IL-1 and TNF-alpha induce the expression of COX-2, leading to increased prostaglandin production. This link explains why addressing inflammation (cytokines) is necessary to control the enzymatic production of pain- signaling molecules.", "caseContext": null}, {"id": 37, "question": "Which of the following is a characteristic of 'Auto-inflammatory' diseases compared to 'Auto-immune' diseases?", "options": [{"key": "A", "text": "Auto-inflammatory diseases are only found in geriatric populations."}, {"key": "B", "text": "Auto-inflammatory diseases always present with positive ANA and RF titers."}, {"key": "C", "text": "Auto-inflammatory diseases involve over-activation of the innate immune system and the inflammasome."}, {"key": "D", "text": "Auto-inflammatory diseases are primarily driven by the adaptive immune system (B and T cells)."}], "answer": "C", "rationale": "Auto-inflammatory diseases involve over-activation of the innate immune system and the inflammasome. Unlike autoimmunity, which involves antibodies and T-cells, auto-inflammation involves a primary defect in the innate immune regulation.", "caseContext": null}, {"id": 38, "question": "What is the primary goal of using 'Immunomodulators' rather than 'Immunosuppressants' in Functional Medicine?", "options": [{"key": "A", "text": "To replace the need for an elimination diet."}, {"key": "B", "text": "To completely shut down the immune system to stop all symptoms."}, {"key": "C", "text": "To increase the speed of the Delta-6-desaturase enzyme."}, {"key": "D", "text": "To balance the immune response, downregulating overactive pathways while maintaining host defense."}], "answer": "D", "rationale": "To balance the immune response, downregulating overactive pathways while maintaining host defense. Immunomodulators (like Vitamin D or Curcumin) aim to restore homeostasis and 'appropriate' signaling rather than total suppression.", "caseContext": null}, {"id": 39, "question": "A patient with systemic autoimmunity presents with significant 'intestinal permeability.' According to the module's discussion on the 'Three-Legged Stool' of autoimmunity, which three factors must be present simultaneously to trigger the disease process?", "options": [{"key": "A", "text": "Genetic predisposition, an environmental trigger, and intestinal permeability."}, {"key": "B", "text": "Viral infection, vitamin D deficiency, and high stress levels."}, {"key": "C", "text": "NF-kappaB activation, COX-2 upregulation, and leukotriene production."}, {"key": "D", "text": "IgE allergies, low stomach acid, and heavy metal toxicity."}], "answer": "A", "rationale": "Genetic predisposition, an environmental trigger, and intestinal permeability. The 'three-legged stool' model suggests that autoimmune disease requires a genetic susceptibility, exposure to a trigger, and a breach in the intestinal barrier.", "caseContext": null}, {"id": 40, "question": "When addressing 'Dysbiosis' as a driver of immune dysfunction, which finding on a stool analysis most strongly indicates a failure of the 'Innate' mucosal defense system?", "options": [{"key": "A", "text": "Presence of Blastocystis hominis."}, {"key": "B", "text": "High levels of Fecal Fat."}, {"key": "C", "text": "Low levels of Secretory IgA (sIgA)."}, {"key": "D", "text": "Low levels of Beneficial Lactobacilli."}], "answer": "C", "rationale": "Low levels of Secretory IgA (sIgA). sIgA is the primary immunoglobulin of the mucosal innate immune system; low levels suggest the barrier is poorly defended against pathogens.", "caseContext": null}, {"id": 41, "question": "A patient presents with 'Brain Fog' and systemic inflammation. Organic Acid Testing (OAT) shows high levels of Arabinose. Which 'Occult Infection' does this specifically suggest?", "options": [{"key": "A", "text": "Small Intestinal Bacterial Overgrowth (SIBO)"}, {"key": "B", "text": "Reactivated Epstein-Barr Virus (EBV)"}, {"key": "C", "text": "Systemic Candida albicans overgrowth"}, {"key": "D", "text": "Chronic Borrelia burgdorferi"}], "answer": "C", "rationale": "Systemic Candida albicans overgrowth Arabinose is a sugar alcohol produced by the overgrowth of yeast, specifically Candida, and is linked to neuro- inflammatory symptoms.", "caseContext": null}, {"id": 42, "question": "In the IFM approach to 'Food Allergy,' why is it critical to assess 'Hypochlorhydria' (low stomach acid) as an Antecedent?", "options": [{"key": "A", "text": "Stomach acid is needed to kill off all IgE antibodies in the food."}, {"key": "B", "text": "Acid is required to activate the Delta-6-desaturase enzyme."}, {"key": "C", "text": "Hypochlorhydria causes a direct increase in high-sensitivity CRP."}, {"key": "D", "text": "Low acid leads to large, undigested protein fragments that are more likely to sensitize the GALT."}], "answer": "D", "rationale": "Low acid leads to large, undigested protein fragments that are more likely to sensitize the GALT. Without proper proteolysis, large peptides enter the small intestine where they can be recognized as foreign antigens, triggering an immune response.", "caseContext": null}, {"id": 43, "question": "A patient with 'Total Load' issues has multiple environmental sensitivities. According to the 'Case Management of Allergic Disease,' which intervention should be prioritized to stabilize mast cells?", "options": [{"key": "A", "text": "A high-protein, zero-carbohydrate diet."}, {"key": "B", "text": "Increasing dietary intake of nightshades."}, {"key": "C", "text": "Quercetin and Vitamin C."}, {"key": "D", "text": "High-dose Prednisone for 6 months."}], "answer": "C", "rationale": "Quercetin and Vitamin C. Quercetin is a natural mast cell stabilizer and Vitamin C supports the degradation of histamine, providing a lower-risk approach to symptom control.", "caseContext": null}, {"id": 44, "question": "Which 'Mediator' is specifically responsible for the induction of 'Sickness Behavior' (lethargy, anhedonia, and social withdrawal) during chronic infection?", "options": [{"key": "A", "text": "Arachidonic Acid"}, {"key": "B", "text": "Pro-inflammatory cytokines like IL-1, IL-6, and TNF-alpha."}, {"key": "C", "text": "Secretory IgA"}, {"key": "D", "text": "Salicylates"}], "answer": "B", "rationale": "Pro-inflammatory cytokines like IL-1, IL-6, and TNF-alpha. These cytokines signal the brain to adopt 'sickness behaviors' as a way to conserve energy and focus resources on fighting the infection.", "caseContext": null}, {"id": 45, "question": "What is the primary clinical goal of the 'Re-inoculation' phase of the 5R program in a patient with immune- driven skin issues (e.g., eczema)?", "options": [{"key": "A", "text": "To supplement with high-dose HCL to improve digestion."}, {"key": "B", "text": "To use glutamine to seal the 'leaky' junctions."}, {"key": "C", "text": "To introduce broad-spectrum antibiotics to clear the skin."}, {"key": "D", "text": "To introduce beneficial probiotics and prebiotics to shift the T-regulatory (Treg) cell balance."}], "answer": "D", "rationale": "To introduce beneficial probiotics and prebiotics to shift the T-regulatory (Treg) cell balance. Re-inoculation aims to restore the microbiome, which in turn signals the immune system to increase Treg activity and reduce allergic Th2 dominance.", "caseContext": null}, {"id": 46, "question": "When assessing a patient's 'Matrix,' where would you place 'Emotional Trauma' from early childhood that has led to chronic HPA-axis dysregulation and subsequent immune suppression?", "options": [{"key": "A", "text": "Antecedents"}, {"key": "B", "text": "Triggers"}, {"key": "C", "text": "Mediators"}, {"key": "D", "text": "The Gastrointestinal Node"}], "answer": "A", "rationale": "Antecedents Childhood trauma acts as an antecedent—a foundational factor that predisposes the individual to future immune and endocrine dysfunction. B is not quite correct since Triggers are usually discrete events that initiate an acute flare, whereas childhood trauma is a foundational factor.", "caseContext": null}, {"id": 47, "question": "A patient with chronic inflammatory symptoms has a high intake of Omega-3s but shows low levels of EPA on a fatty acid profile. You suspect a metabolic block at the Delta-6-desaturase enzyme. Which clinical 'Trigger' or 'Mediator' is most likely contributing to this enzymatic inhibition?", "options": [{"key": "A", "text": "A diet high in deeply pigmented berries."}, {"key": "B", "text": "Elevated levels of insulin and high alcohol consumption."}, {"key": "C", "text": "High intake of Vitamin C and Magnesium."}, {"key": "D", "text": "Chronic use of proteolytic enzymes like Bromelain."}], "answer": "B", "rationale": "Elevated levels of insulin and high alcohol consumption. Consider common lifestyle factors and metabolic states that 'slow down' the conversion of parent oils. Alcohol, aging, and hyperinsulinemia are known inhibitors of Delta-6-desaturase, preventing the conversion of ALA to further downstream metabolites.", "caseContext": null}, {"id": 48, "question": "Which of the following findings on a physical exam is most specifically associated with a 'Pseudo-allergic' reaction to Salicylates, particularly when found alongside asthma?", "options": [{"key": "A", "text": "Pitting edema in the lower extremities."}, {"key": "B", "text": "Atopic dermatitis on the antecubital fossa."}, {"key": "C", "text": "Nasal polyps."}, {"key": "D", "text": "Geographic tongue."}], "answer": "C", "rationale": "Nasal polyps. The presence of nasal polyps, asthma, and sensitivity to aspirin/salicylates is a pathognomonic clinical triad.", "caseContext": null}, {"id": 49, "question": "Which set of laboratory markers provides the most comprehensive assessment of a patient's 'Total Load' of inflammation and oxidative stress in the lipid membranes?", "options": [{"key": "A", "text": "Total Cholesterol, LDL, and HDL."}, {"key": "B", "text": "WBC count and a standard CMP."}, {"key": "C", "text": "Glucose and Hemoglobin A1c."}, {"key": "D", "text": "hs-CRP, F2-Isoprostanes, and an AA:EPA ratio."}], "answer": "D", "rationale": "hs-CRP , F2-Isoprostanes, and an AA:EP A ratio. This combination assesses systemic protein markers, lipid-specific oxidation, and the balance of eicosanoid precursors.", "caseContext": null}, {"id": 50, "question": "A patient with chronic 'total load' issues is undergoing the 5R program. During the 'Remove' phase, you discover high levels of LPS (lipopolysaccharide) in the blood. What does this finding specifically imply about the patient's barrier function?", "options": [{"key": "A", "text": "The liver is producing too much bile, causing the breakdown of the intestinal lining."}, {"key": "B", "text": "Metabolic endotoxemia is occurring, where bacterial fragments are crossing the gut wall and triggering systemic inflammation."}, {"key": "C", "text": "The patient has a vitamin D deficiency that prevents the production of stomach acid."}, {"key": "D", "text": "The patient is consuming too many probiotics during the re-inoculation phase."}], "answer": "B", "rationale": "Metabolic endotoxemia is occurring, where bacterial fragments are crossing the gut wall and triggering systemic inflammation. LPS is a component of gram-negative bacteria; its presence in systemic circulation is a hallmark of 'leaky gut' and drives systemic inflammatory signaling.", "caseContext": null}, {"id": 51, "question": "Which specific laboratory marker is used in Functional Medicine to track 'Vascular Wall Inflammation' and specifically indicates the risk of an unstable plaque rupturing?", "options": [{"key": "A", "text": "Fasting Insulin"}, {"key": "B", "text": "Total Cholesterol"}, {"key": "C", "text": "HbA1c"}, {"key": "D", "text": "Lp-PLA2"}], "answer": "D", "rationale": "Lp-PLA2 Lp-PLA2 is an enzyme produced inside the plaque; high levels indicate that the plaque is inflamed and prone to rupture.", "caseContext": null}, {"id": 52, "question": "Which of the following interventions is considered a 'Secondary (2º) Treatment' on the IFM Cardiometabolic Clinical Decision Tree?", "options": [{"key": "A", "text": "Targeted phytonutrient supplementation (e.g., Bergamot)"}, {"key": "B", "text": "Prescribing the Cardiometabolic Food Plan"}, {"key": "C", "text": "Regular physical activity"}, {"key": "D", "text": "Stress management techniques"}], "answer": "A", "rationale": "Targeted phytonutrient supplementation (e.g., Bergamot) Supplements are used to further modulate physiology after or alongside primary lifestyle changes.", "caseContext": null}, {"id": 53, "question": "A practitioner is using the FITT criteria to prescribe exercise for a patient. If the patient is performing resistance training, what is the recommended frequency according to the ACSM guidelines cited in the module?", "options": [{"key": "A", "text": "150 minutes of vigorous intensity daily"}, {"key": "B", "text": "Daily sessions of at least 60 minutes"}, {"key": "C", "text": "Once a week for full-body exhaustion"}, {"key": "D", "text": "2-3 days per week for each major muscle group"}], "answer": "D", "rationale": "2-3 days per week for each major muscle group The module specifies that resistance training should target muscle groups 2-3 times per week for optimal benefit.", "caseContext": null}, {"id": 54, "question": "Which specific Matrix Node is involved when a patient has 'Endothelial Dysfunction' leading to impaired vasodilation?", "options": [{"key": "A", "text": "Structural Integrity"}, {"key": "B", "text": "Assimilation"}, {"key": "C", "text": "Energy"}, {"key": "D", "text": "Biotransformation"}], "answer": "A", "rationale": "Structural Integrity The endothelium is a physical structure; its health and function are core to structural integrity.", "caseContext": null}, {"id": 55, "question": "A patient with a history of heart failure is taking a Loop Diuretic and presents with worsening fatigue and muscle weakness. Which specific Matrix node is most directly impacted by the likely nutrient depletion caused by this medication?", "options": [{"key": "A", "text": "Biotransformation"}, {"key": "B", "text": "Energy"}, {"key": "C", "text": "Communication"}, {"key": "D", "text": "Assimilation"}], "answer": "B", "rationale": "Energy Loop diuretics often deplete Thiamine (B1), which is a critical cofactor for mitochondrial ATP production and myocardial contraction.", "caseContext": null}, {"id": 56, "question": "A patient with elevated myeloperoxidase (MPO) and lipoprotein-associated phospholipase A2 (Lp-PLA2) is most likely experiencing dysfunction in which physiological process?", "options": [{"key": "A", "text": "Hepatic biotransformation of saturated fats"}, {"key": "B", "text": "Hypothalamic-pituitary-adrenal (HPA) axis signaling"}, {"key": "C", "text": "Intestinal assimilation of fat-soluble vitamins"}, {"key": "D", "text": "Vascular wall inflammation and plaque instability"}], "answer": "D", "rationale": "Vascular wall inflammation and plaque instability MPO and Lp-PLA2 are specific biomarkers for white blood cell activation and vascular inflammation that signal vulnerable plaque.", "caseContext": null}, {"id": 57, "question": "When assessing a patient with a 'Pattern B' lipid profile, which additional biomarker would most strongly confirm a high risk of cardiovascular event according to the functional medicine lens?", "options": [{"key": "A", "text": "High oxidized LDL (oxLDL)"}, {"key": "B", "text": "Low high-sensitivity C-reactive protein (hs-CRP)"}, {"key": "C", "text": "Elevated large, buoyant HDL-2"}, {"key": "D", "text": "Low fasting insulin"}], "answer": "A", "rationale": "High oxidized LDL (oxLDL) Small dense LDL particles are significantly more prone to oxidation, making oxLDL a critical confirmatory marker of their pathogenicity.", "caseContext": null}, {"id": 58, "question": "In the 'Energy' node of the Cardiometabolic Matrix, which clinical condition is categorized as a result of mitochondrial dysfunction and nutrient depletion?", "options": [{"key": "A", "text": "Psoriasis"}, {"key": "B", "text": "Congestive Heart Failure"}, {"key": "C", "text": "Essential Hypertension"}, {"key": "D", "text": "Type 1 Diabetes"}], "answer": "B", "rationale": "Congestive Heart Failure CHF is often the end result of 'energy starvation' of the heart muscle, frequently linked to CoQ10 and Thiamine depletions.", "caseContext": null}, {"id": 59, "question": "A patient on chronic Metformin therapy presents with elevated homocysteine levels. Which nutrient depletion should the practitioner investigate first?", "options": [{"key": "A", "text": "Vitamin B12"}, {"key": "B", "text": "Magnesium"}, {"key": "C", "text": "Vitamin C"}, {"key": "D", "text": "Coenzyme Q10"}], "answer": "A", "rationale": "Vitamin B12 Metformin is well-documented to interfere with B12 absorption, which can lead to elevated homocysteine via the methylation pathway.", "caseContext": null}, {"id": 60, "question": "A patient with the APOE 4 allele is highly sensitive to dietary saturated fats. According to the IFM guidelines, which dietary pattern should be prioritized for this specific genotype?", "options": [{"key": "A", "text": "A low-saturated fat, low-alcohol Mediterranean-style diet"}, {"key": "B", "text": "A high-fat Ketogenic diet to improve insulin sensitivity"}, {"key": "C", "text": "A diet high in refined carbohydrates to minimize lipid intake"}, {"key": "D", "text": "A Carnivore diet to eliminate plant-based lectins"}], "answer": "A", "rationale": "A low-saturated fat, low-alcohol Mediterranean-style diet APOE 4 carriers see a significant rise in LDL-P with saturated fats and should also avoid alcohol to manage CVD risk.", "caseContext": null}, {"id": 61, "question": "According to the Cardiometabolic Decision Tree, what is the 'Gather' step for clinical indicators specifically looking for signs of insulin resistance?", "options": [{"key": "A", "text": "Measuring the distance of a diagonal earlobe crease"}, {"key": "B", "text": "Reviewing the Family History (FHx)"}, {"key": "C", "text": "Checking for Acanthosis Nigricans and skin tags"}, {"key": "D", "text": "Calculating the Body Mass Index (BMI)"}], "answer": "C", "rationale": "Checking for Acanthosis Nigricans and skin tags These physical signs are reliable clinical indicators of hyperinsulinemia and are part of the 'Gather' phase for insulin resistance.", "caseContext": null}, {"id": 62, "question": "In the context of hypertension, which dietary component acts as a natural vasodilator by improving nitric oxide availability?", "options": [{"key": "A", "text": "Stearic acid from beef"}, {"key": "B", "text": "L-arginine from nuts and seeds"}, {"key": "C", "text": "Sodium chloride"}, {"key": "D", "text": "Oxalic acid from spinach"}], "answer": "B", "rationale": "L-arginine from nuts and seeds L-arginine is the direct precursor to nitric oxide, which promotes vasodilation and supports endothelial function. D is not quite correct since Oxalic acid is an antinutrient that can interfere with mineral absorption and is not a vasodilator.", "caseContext": null}, {"id": 63, "question": "Why does the IFM approach prioritize 'Non-HDL Cholesterol' over LDL-C alone when evaluating risk in a patient with high triglycerides?", "options": [{"key": "A", "text": "Non-HDL accounts for all atherogenic particles, including VLDL and IDL"}, {"key": "B", "text": "LDL-C is no longer considered a risk factor in functional medicine"}, {"key": "C", "text": "Non-HDL is easier to measure in a non-fasting state"}, {"key": "D", "text": "Non-HDL only measures the 'good' cholesterol"}], "answer": "A", "rationale": "Non-HDL accounts for all atherogenic particles, including VLDL and IDL In patients with high triglycerides, LDL-C may underestimate risk because other triglyceride-rich lipoproteins are also atherogenic.", "caseContext": null}, {"id": 64, "question": "A patient has a 'non-dipping' blood pressure profile. Which matrix node intervention is most likely to address the root cause of this autonomic dysfunction?", "options": [{"key": "A", "text": "Structural Integrity (weight-bearing exercise for bone density)"}, {"key": "B", "text": "Communication (addressing HPA axis and Melatonin levels)"}, {"key": "C", "text": "Assimilation (adding digestive enzymes)"}, {"key": "D", "text": "Biotransformation (increasing Phase II liver conjugation)"}], "answer": "B", "rationale": "Communication (addressing HP A axis and Melatonin levels) Non-dipping is a failure of the body's internal 'clock' and stress response. Non-dipping is an autonomic/circadian issue often driven by high nighttime cortisol or low melatonin.", "caseContext": null}, {"id": 65, "question": "What is the clinical significance of a 'High-Sensitivity' CRP (hs-CRP) value of 2.5 mg/L in a cardiometabolic context?", "options": [{"key": "A", "text": "It represents moderate systemic inflammation and increased vascular risk"}, {"key": "B", "text": "It suggests an acute bacterial infection rather than chronic risk"}, {"key": "C", "text": "It indicates a low risk of future cardiovascular events"}, {"key": "D", "text": "It is a normal finding for any patient over the age of 50"}], "answer": "A", "rationale": "It represents moderate systemic inflammation and increased vascular risk The range of 1.0 to 3.0 mg/L is categorized as moderate risk/inflammation in the functional lens.", "caseContext": null}, {"id": 66, "question": "A patient with suspected insulin resistance shows 'skin tags' and 'Acanthosis Nigricans' during a physical exam. In which section of the IFM Cardiometabolic Clinical Decision Tree should these findings be documented?", "options": [{"key": "A", "text": "Biomarkers"}, {"key": "B", "text": "Clinical Indicators"}, {"key": "C", "text": "Anthropometrics"}, {"key": "D", "text": "Medical History"}], "answer": "B", "rationale": "Clinical Indicators Physical findings on the skin, mouth, and nails are categorized as Clinical Indicators in the GATHER phase of the decision tree.", "caseContext": null}, {"id": 67, "question": "For a 19-year-old female with evening hypercortisolism (high evening cortisol), which supplement is chosen specifically to blunt this evening elevation?", "options": [{"key": "A", "text": "DHEA"}, {"key": "B", "text": "Tyrosine"}, {"key": "C", "text": "Licorice root"}, {"key": "D", "text": "Phosphatidylserine"}], "answer": "D", "rationale": "Phosphatidylserine Phosphatidylserine is clinically used to blunt the ACTH and cortisol response to stress, making it effective for lowering elevated cortisol levels, particularly at night. This phospholipid is often taken before bed to help 'turn off' the stress response and facilitate sleep.", "caseContext": null}, {"id": 68, "question": "Chronic stimulation of the HPA axis leads to several long-term effects. Which impact on the skeletal system is explicitly listed in the module?", "options": [{"key": "A", "text": "Increased bone density"}, {"key": "B", "text": "Demineralization of bone"}, {"key": "C", "text": "Fusion of growth plates"}, {"key": "D", "text": "Calcification of joints"}], "answer": "B", "rationale": "Demineralization of bone Cortisol is a 'breakdown' hormone; when levels are chronically high, it starts breaking down structural tissues, including the skeleton. Chronic cortisol elevation is catabolic and leads to the demineralization of bone (osteoporosis risk).", "caseContext": null}, {"id": 69, "question": "For a patient with adrenal dysfunction, what specific dietary timing rule is recommended to help stabilize cortisol levels?", "options": [{"key": "A", "text": "Eat only twice a day"}, {"key": "B", "text": "Practice intermittent fasting (16:8)"}, {"key": "C", "text": "Eat breakfast by 10 AM"}, {"key": "D", "text": "Avoid all carbohydrates before noon"}], "answer": "C", "rationale": "Eat breakfast by 10 AM Delaying the first meal of the day can cause blood sugar to drop, forcing the adrenals to release cortisol to compensate. The module advises frequent regular meals and specifically notes: 'make sure to eat by 10 AM' to prevent hypoglycemic stress on the adrenals.", "caseContext": null}, {"id": 70, "question": "What is the primary argument for using combination T4/T3 therapy over T4 monotherapy, according to the module?", "options": [{"key": "A", "text": "Combination therapy is the only FDA-approved method."}, {"key": "B", "text": "T4 monotherapy causes rapid weight gain in all patients."}, {"key": "C", "text": "Combination therapy has a lower risk of cardiac side effects."}, {"key": "D", "text": "Monotherapy may fail to improve psychological well-being and depression in some patients despite normal TSH."}], "answer": "D", "rationale": "Monotherapy may fail to improve psychological well-being and depression in some patients despite normal TSH. Some patients do not feel better (specifically regarding mood/depression) on T4 alone, even when their labs look normal, justifying the trial of T3.", "caseContext": null}, {"id": 71, "question": "Why is LDL cholesterol monitoring considered critical when assessing steroid hormone deficiency in undernourished or over-athletic patients?", "options": [{"key": "A", "text": "LDL levels are inversely related to Cortisol output."}, {"key": "B", "text": "LDL provides the cholesterol substrate required for steroid synthesis."}, {"key": "C", "text": "LDL acts as a carrier protein similar to SHBG."}, {"key": "D", "text": "High LDL inhibits the conversion of T4 to T3."}], "answer": "B", "rationale": "LDL provides the cholesterol substrate required for steroid synthesis. Cholesterol (LDL) is the raw material for steroid hormones. If LDL is too low (due to diet or medication), the body cannot synthesize adequate hormones.", "caseContext": null}, {"id": 72, "question": "A patient with Hashimoto's thyroiditis begins a gluten-free diet but still presents with high TPO antibodies and suboptimal Free T3 levels. Which physiological 'block' to T4-to-T3 conversion should be investigated if their Reverse T3 (rT3) is found to be significantly elevated?", "options": [{"key": "A", "text": "Systemic inflammation inhibiting 5'-deiodinase"}, {"key": "B", "text": "Excessive intake of Selenium and Zinc"}, {"key": "C", "text": "Inadequate levels of SHBG"}, {"key": "D", "text": "Over-stimulation of the 17,20-lyase enzyme"}], "answer": "A", "rationale": "Systemic inflammation inhibiting 5'-deiodinase Inflammation, stress, and high cortisol divert T4 away from active T3 production and toward inactive Reverse T3 by inhibiting the 5'-deiodinase enzyme.", "caseContext": null}, {"id": 73, "question": "Which physical exam finding specifically constitutes a positive Ragland's result, indicating potential Stage 3 Adrenal Exhaustion?", "options": [{"key": "A", "text": "Severe pain elicited by palpation of the 12th rib"}, {"key": "B", "text": "A rise in heart rate of 30 beats per minute upon standing"}, {"key": "C", "text": "The presence of a white line on the abdomen that turns red after 2 minutes"}, {"key": "D", "text": "A drop in systolic blood pressure of 10 mmHg or more upon standing"}], "answer": "D", "rationale": "A drop in systolic blood pressure of 10 mmHg or more upon standing Ragland's Sign is an orthostatic blood pressure test where a drop in systolic pressure suggests the adrenals cannot maintain vascular tone via aldosterone/cortisol. This sign measures the body's ability to compensate for gravity through the adrenal- mediated regulation of blood pressure.", "caseContext": null}, {"id": 74, "question": "Why does the module caution against treating a 'low' TSH in an elderly patient without first checking a full thyroid panel including Free T3 and Free T4?", "options": [{"key": "A", "text": "TSH is often falsely low in the elderly due to vitamin D deficiency."}, {"key": "B", "text": "The elderly always require higher TSH levels to maintain cognitive function."}, {"key": "C", "text": "Low TSH is a primary marker for early-onset Alzheimer's."}, {"key": "D", "text": "A low TSH in the elderly may be a normal adaptation to aging to protect the heart."}], "answer": "D", "rationale": "A low TSH in the elderly may be a normal adaptation to aging to protect the heart. Thyroid hormones are 'metabolic accelerators'; too much speed in an older engine can cause specific rhythm issues in the cardiovascular system. As people age, the TSH naturally trends differently, and aggressive suppression can increase the risk of atrial fibrillation and bone loss.", "caseContext": null}, {"id": 75, "question": "Which specific urinary metabolite, if elevated, might suggest that a patient's 'cortisol steal' is being driven by high levels of 11-beta-HSD activity?", "options": [{"key": "A", "text": "The ratio of Cortisol to Cortisone"}, {"key": "B", "text": "5-alpha-Androstenediol"}, {"key": "C", "text": "Urinary Sodium to Potassium ratio"}, {"key": "D", "text": "Total Pregnanetriol"}], "answer": "A", "rationale": "The ratio of Cortisol to Cortisone The 11-beta-HSD enzymes regulate the interconversion of active cortisol (THF) and inactive cortisone (THE); their ratio helps identify if cortisol is being rapidly inactivated or sustained.", "caseContext": null}, {"id": 76, "question": "A patient on T4-only therapy (Levothyroxine) has a 'normal' TSH of 1.8 but continues to suffer from thinning outer eyebrows and cold extremities. What is the most likely physiological explanation?", "options": [{"key": "A", "text": "Iron toxicity is blocking the thyroid receptors."}, {"key": "B", "text": "High iodine intake is causing a 'Wolff-Chaikoff' effect."}, {"key": "C", "text": "Peripheral cellular resistance or poor conversion to Free T3"}, {"key": "D", "text": "The TSH is actually too low and should be closer to 4.5."}], "answer": "C", "rationale": "Peripheral cellular resistance or poor conversion to Free T3 Even with a 'perfect' TSH, the patient may not be effectively converting T4 to the active T3 required at the tissue level (like the hair follicles and skin). The Wolff-Chaikoff effect (WCE) is the thyroid gland's temporary, protective response to excessive iodine by inhibiting its own hormone production, reducing thyroid hormone synthesis and release to prevent overactivity, but prolonged failure to \"escape\" this block can lead to hypothyroidism, especially in susceptible individuals with pre-existing thyroid issues. While possible, the persistent symptoms on T4 therapy usually point toward conversion/ tissue-level issues rather than acute iodine suppression.", "caseContext": null}, {"id": 77, "question": "Regarding the administration of DHEA, which of the following is a contraindication?", "options": [{"key": "A", "text": "PCOS or hormone-sensitive cancers (breast/prostate)"}, {"key": "B", "text": "Vegetarian or Vegan diets"}, {"key": "C", "text": "Chronic fatigue and low blood pressure"}, {"key": "D", "text": "Type II Diabetes and Insulin Resistance"}], "answer": "A", "rationale": "PCOS or hormone-sensitive cancers (breast/prostate) DHEA is a 'pro-hormone' that can turn into 'fuel' for tissues that are sensitive to sex steroids. DHEA can convert into both testosterone and estrogen, potentially exacerbating androgen- dominant PCOS or feeding hormone-sensitive tumors.", "caseContext": null}, {"id": 78, "question": "In the context of the HPA axis, what is the role of the 'Hippocampus' in the control of stress?", "options": [{"key": "A", "text": "It secretes CRH to initiate the stress response."}, {"key": "B", "text": "It provides negative feedback to 'turn off' the HPA axis response."}, {"key": "C", "text": "It converts cholesterol into pregnenolone."}, {"key": "D", "text": "It produces aldosterone to regulate sodium levels."}], "answer": "B", "rationale": "It provides negative feedback to 'turn off' the HP A axis response. This brain region is responsible for memory, but in the endocrine system, it acts as the 'sensor' that tells the body when it has had enough cortisol. The hippocampus has a high density of glucocorticoid receptors and acts as the primary brake for the stress response; chronic stress can damage this area, leading to an 'unbreakable' stress loop.", "caseContext": null}, {"id": 79, "question": "When interpreting a 4-point salivary cortisol test, a patient shows high morning cortisol followed by a steep drop to below-normal levels for the rest of the day. This pattern is often colloquially called:", "options": [{"key": "A", "text": "The 'Circadian Flip'"}, {"key": "B", "text": "The 'Flat-line' pattern"}, {"key": "C", "text": "The 'Crash' pattern"}, {"key": "D", "text": "The 'Cushingoid' curve"}], "answer": "C", "rationale": "The 'Crash' pattern This pattern shows the body's ability to mount an initial response (the AM spike) but an inability to sustain it, characteristic of the transition from Stage 2 to Stage 3.", "caseContext": null}, {"id": 80, "question": "High intake of certain 'Goitrogens' can interfere with thyroid function. Which food group is most associated with this, and what is the mechanism?", "options": [{"key": "A", "text": "High-sugar fruits; they stimulate TSH suppression."}, {"key": "B", "text": "Raw cruciferous vegetables; they compete with iodine uptake."}, {"key": "C", "text": "Fermented dairy; it increases TPO antibodies."}, {"key": "D", "text": "Nightshade vegetables; they inhibit T4 to T3 conversion."}], "answer": "B", "rationale": "Raw cruciferous vegetables; they compete with iodine uptake. Isothiocyanates in raw cruciferous vegetables (like kale or broccoli) can block the NIS (sodium- iodide symporter), preventing iodine from entering the thyroid gland. These healthy greens are only a thyroid problem if eaten raw in very large quantities because they 'steal' the iodine needed to make hormone.", "caseContext": null}, {"id": 81, "question": "According to the Adrenal Decision Tree, if a patient has low DHEA and low Cortisol across all 4 points, which category of botanicals is the primary recommendation?", "options": [{"key": "A", "text": "Cortisol-blunting agents like Phosphatidylserine"}, {"key": "B", "text": "Calming Nervines like Passion Flower"}, {"key": "C", "text": "Only Vitamin C and Magnesium"}, {"key": "D", "text": "Stimulating Adaptogens and Glandulars like Panax Ginseng and Licorice"}], "answer": "D", "rationale": "Stimulating Adaptogens and Glandulars like Panax Ginseng and Licorice In Stage 3 (Exhaustion), the goal is to provide 'building blocks' (glandulars) and 'energy' (stimulating adaptogens like Panax Ginseng or Licorice) to rebuild the system.", "caseContext": null}, {"id": 82, "question": "A patient presents with a 'Flat-line' salivary cortisol profile (low at all four time points) and chronically low DHEA. Which physical exam finding would most specifically support a diagnosis of this advanced stage of HPA axis dysfunction?", "options": [{"key": "A", "text": "A drop in systolic blood pressure of 10 mmHg or more upon standing"}, {"key": "B", "text": "Rap
