id and sustained pupil constriction when exposed to light"}, {"key": "C", "text": "The presence of a white line on the abdomen that turns red within 10 seconds"}, {"key": "D", "text": "Elevated body temperature (>98.6°F) consistently in the morning"}], "answer": "A", "rationale": "A drop in systolic blood pressure of 10 mmHg or more upon standing This describes a positive Ragland’s sign, which indicates the adrenals' inability to maintain vascular tone through mineralocorticoids and cortisol in Stage 3.", "caseContext": null}, {"id": 83, "question": "Which of the following describes the mechanism by which insulin resistance contributes to 'androgenization' in female patients, such as those with PCOS?", "options": [{"key": "A", "text": "It stimulates 5-alpha reductase and stimulates Aromatase"}, {"key": "B", "text": "It stimulates 5-alpha reductase and inhibits 17,20-lyase"}, {"key": "C", "text": "It stimulates 5-alpha reductase and decreases SHBG"}, {"key": "D", "text": "It inhibits 11-beta-hydroxylase and increases DHEA"}], "answer": "C", "rationale": "It stimulates 5-alpha reductase and decreases SHBG Hyperinsulinemia is a powerful driver for decreasing SHBG and increasing the conversion of testosterone to the more potent DHT.", "caseContext": null}, {"id": 84, "question": "When utilizing the 'PTSD' framework to address PCOS-related androgen dominance, why is a low-glycemic 'Diet' considered the first line of intervention over anti-androgen medication?", "options": [{"key": "A", "text": "Hyperinsulinemia decreases SHBG production in the liver and up-regulates 5-alpha reductase activity."}, {"key": "B", "text": "Insulin directly inhibits the pituitary from making LH."}, {"key": "C", "text": "The glycemic index of food determines the rate of estrogen sulfation."}, {"key": "D", "text": "Low-glycemic diets are only used to manage weight, not hormonal pathways."}], "answer": "A", "rationale": "Hyperinsulinemia decreases SHBG production in the liver and up-regulates 5-alpha reductase activity. High insulin creates a 'double hit': it lowers the protein that binds up excess androgens and speeds up the conversion to the more potent DHT.", "caseContext": null}, {"id": 85, "question": "How does the presence of 'Xenoestrogens' (environmental toxins) impact the interpretation of serum Estradiol (E2) levels?", "options": [{"key": "A", "text": "They create 'Functional Estrogen Excess' by activating receptors even if serum E2 levels appear normal or low."}, {"key": "B", "text": "Xenoestrogens show up on standard serum E2 tests as 'High E2'."}, {"key": "C", "text": "Xenoestrogens bind to and block the estrogen receptor, causing 'low estrogen' symptoms."}, {"key": "D", "text": "They inhibit the Aromatase enzyme, leading to high testosterone."}], "answer": "A", "rationale": "They create 'Functional Estrogen Excess' by activating receptors even if serum E2 levels appear normal or low. Toxicants like BPA or phthalates 'mimic' estrogen at the receptor site, leading to dominance symptoms that are invisible on a standard E2 blood test.", "caseContext": null}, {"id": 86, "question": "In a patient with a 'methylation bottleneck' (high 2-OH, low 2-MeO), which symptom is frequently observed due to the accumulation of unstable catechol estrogens?", "options": [{"key": "A", "text": "Rapid increase in lean muscle mass."}, {"key": "B", "text": "Increased risk of DNA adduct formation and potential cellular damage."}, {"key": "C", "text": "Excessive hair growth on the face (hirsutism)."}, {"key": "D", "text": "Immediate and permanent loss of bone mineral density."}], "answer": "B", "rationale": "Increased risk of DNA adduct formation and potential cellular damage. Catechol estrogens (2-OH and 4-OH) are highly reactive; if not methylated, they can oxidize into quinones that bind to DNA.", "caseContext": null}, {"id": 87, "question": "What is the primary clinical disadvantage of using 'Pellets' for HRT delivery ?", "options": [{"key": "A", "text": "They are made of synthetic, non-bioidentical estrogens."}, {"key": "B", "text": "They are absorbed too slowly to be effective for hot flashes."}, {"key": "C", "text": "They cause a massive 'first-pass' effect in the liver."}, {"key": "D", "text": "The inability to quickly adjust or discontinue dosing if side effects or safety concerns (like abnormal bleeding) arise."}], "answer": "D", "rationale": "The inability to quickly adjust or discontinue dosing if side effects or safety concerns (like abnormal bleeding) arise. Once pellets are inserted, they cannot be 'removed' or tapered easily if the patient has a negative reaction or high-risk finding.", "caseContext": null}, {"id": 88, "question": "A male patient has low testosterone and high Leptin levels. What does this 'Leptin' marker indicate regarding his testosterone production?", "options": [{"key": "A", "text": "Leptin is the precursor for DHEA and indicates high adrenal reserve."}, {"key": "B", "text": "High leptin can directly inhibit the Leydig cells in the testes from producing testosterone."}, {"key": "C", "text": "Leptin levels are irrelevant to sex hormones and only track appetite."}, {"key": "D", "text": "He is in a state of starvation and needs more calories to make hormones."}], "answer": "B", "rationale": "High leptin can directly inhibit the Leydig cells in the testes from producing testosterone. Leptin is not just a satiety hormone; at high levels, it acts as an endocrine disruptor that blunts the testicular response to LH.", "caseContext": null}, {"id": 89, "question": "A patient's urinary hormone profile shows high levels of 'Estrone-Sulfate' but very low levels of '2- Methoxyestrone.' Which clinical situation does this combination most likely represent?", "options": [{"key": "A", "text": "A robust Phase 2 methylation pathway coupled with failed sulfation."}, {"key": "B", "text": "A methylation bottleneck where estrogen is being 'shunted' into a temporary storage form (sulfation) because Phase 2 is overwhelmed."}, {"key": "C", "text": "An overactive aromatase enzyme siphoning testosterone into estrone-sulfate."}, {"key": "D", "text": "The successful and permanent detoxification of all estrogen metabolites."}], "answer": "B", "rationale": "A methylation bottleneck where estrogen is being 'shunted' into a temporary storage form (sulfation) because Phase 2 is overwhelmed. Sulfation is a reversible storage pathway; if methylation (COMT) is slow, the body sulfates estrogen to keep it inactive, though it can be 'un-sulfated' later.", "caseContext": null}, {"id": 90, "question": "When monitoring a woman on BHRT, why is hs-CRP specifically included in the laboratory follow-up recommendations?", "options": [{"key": "A", "text": "To calculate the ratio of Progesterone to Cortisol."}, {"key": "B", "text": "To determine if the patient has a hidden gut infection (Estrobolome)."}, {"key": "C", "text": "To assess if the hormone therapy is inducing a pro-thrombotic or inflammatory state in the vasculature."}, {"key": "D", "text": "To measure the direct increase in estrogen production from the adrenals."}], "answer": "C", "rationale": "To assess if the hormone therapy is inducing a pro-thrombotic or inflammatory state in the vasculature. Systemic inflammation is a key risk factor for adverse events; monitoring CRP helps assess the vascular safety of the current regimen.", "caseContext": null}, {"id": 91, "question": "A perimenopausal woman reports that her anxiety and insomnia significantly improve with oral micronized progesterone but not with topical progesterone cream. What is the biochemical reason for this difference?", "options": [{"key": "A", "text": "Oral progesterone is absorbed 100 times better than transdermal forms."}, {"key": "B", "text": "Oral progesterone undergoes first-pass metabolism to produce Allopregnanolone, which cross-reacts with GABA receptors."}, {"key": "C", "text": "Topical progesterone is converted into testosterone in the skin."}, {"key": "D", "text": "Topical cream is too weak to reach the uterine lining effectively."}], "answer": "B", "rationale": "Oral progesterone undergoes first-pass metabolism to produce Allopregnanolone, which cross-reacts with GABA receptors. The first-pass effect in the liver converts oral progesterone into metabolites like allopregnanolone, which has a calming, sedative effect on the brain.", "caseContext": null}, {"id": 92, "question": "In a male patient, how does 'High Leptin' (Leptin Resistance) contribute to the 'Low T' clinical picture beyond simple weight gain?", "options": [{"key": "A", "text": "Leptin converts Testosterone into DHEA-S."}, {"key": "B", "text": "Leptin is a precursor that siphons cholesterol away from testosterone."}, {"key": "C", "text": "High leptin levels exert a direct inhibitory effect on the steroidogenic acute regulatory (StAR) protein in Leydig cells."}, {"key": "D", "text": "Leptin increases the binding affinity of SHBG, locking up all free testosterone."}], "answer": "C", "rationale": "High leptin levels exert a direct inhibitory effect on the steroidogenic acute regulatory (StAR) protein in Leydig cells. Leptin resistance in obese males directly interferes with the rate-limiting step of testosterone production in the testes.", "caseContext": null}, {"id": 93, "question": "According to the 'PTSD' model, how do environmental 'Toxins' like Phthalates specifically disrupt the male hormonal axis?", "options": [{"key": "A", "text": "They strengthen the bond between SHBG and Testosterone."}, {"key": "B", "text": "They act as 'Anti-Androgens' by blocking the androgen receptor or inhibiting T-synthesis."}, {"key": "C", "text": "They increase the production of Progesterone in men."}, {"key": "D", "text": "They provide the raw materials for more Testosterone production."}], "answer": "B", "rationale": "They act as 'Anti-Androgens' by blocking the androgen receptor or inhibiting T- synthesis. Phthalates are well-known endocrine disruptors that interfere with testosterone production and receptor binding.", "caseContext": null}, {"id": 94, "question": "A patient on Dutch testing shows 'Low 4-OH-E1' but 'High 16alpha-OH-E1'. Which nutritional intervention is the most appropriate for shifting this Phase 1 profile toward safety?", "options": [{"key": "A", "text": "Calcium D-Glucarate to stop 16alpha-OH reabsorption."}, {"key": "B", "text": "Iron and Vitamin C to support the aromatase enzyme."}, {"key": "C", "text": "High-dose Glutathione to clear the 4-OH pathway."}, {"key": "D", "text": "DIM (Diindolylmethane) to induce CYP1A1 and favor the 2-OH pathway."}], "answer": "D", "rationale": "DIM (Diindolylmethane) to induce CYP1A1 and favor the 2-OH pathway. DIM specifically encourages the liver to produce the protective 2-OH metabolite, reducing the relative amount of the proliferative 16alpha-OH.", "caseContext": null}, {"id": 95, "question": "Why is 'Transdermal' delivery of Estradiol preferred over 'Oral' delivery for a woman with a history of cigarette smoking or mild hypertension?", "options": [{"key": "A", "text": "Transdermal estrogen is significantly cheaper for the patient."}, {"key": "B", "text": "Smokers cannot absorb oral pills due to lung-gut crosstalk."}, {"key": "C", "text": "Oral estrogen increases hepatic production of C-reactive protein and clotting factors like Factor VII and X."}, {"key": "D", "text": "Transdermal estrogen causes a faster rise in libido than oral versions."}], "answer": "C", "rationale": "Oral estrogen increases hepatic production of C-reactive protein and clotting factors like Factor VII and X. The first-pass effect of oral estrogen stimulates the liver to produce pro-inflammatory and pro- clotting proteins.", "caseContext": null}, {"id": 96, "question": "Which of the following is a symptom specifically associated with a 'Methylation Bottleneck' in estrogen metabolism (accumulation of catechol estrogens)?", "options": [{"key": "A", "text": "Rapid weight loss and high energy levels."}, {"key": "B", "text": "DNA damage via quinone formation and increased oxidative stress markers."}, {"key": "C", "text": "Increased conversion of Progesterone to Cortisol."}, {"key": "D", "text": "High blood pressure and increased bone density."}], "answer": "B", "rationale": "DNA damage via quinone formation and increased oxidative stress markers. Un-methylated 2-OH and 4-OH estrogens can oxidize into quinones, which are highly reactive and can cause DNA mutations.", "caseContext": null}, {"id": 97, "question": "How does the 'Hormone Hierarchy' explain why a clinician might see 'Low T' symptoms in a man with high 'Total Testosterone' and high 'Insulin'?", "options": [{"key": "A", "text": "High insulin causes the kidneys to excrete testosterone too quickly."}, {"key": "B", "text": "High insulin causes the testes to shrink and stop producing sperm."}, {"key": "C", "text": "Insulin directly converts Testosterone into Vitamin D."}, {"key": "D", "text": "Insulin resistance reduces SHBG, but it also creates 'Androgen Resistance' at the cellular receptor level."}], "answer": "D", "rationale": "Insulin resistance reduces SHBG, but it also creates 'Androgen Resistance' at the cellular receptor level. Metabolic dysfunction interferes with the target tissue's ability to 'hear' the hormone signal, rendering serum levels clinically ineffective.", "caseContext": null}, {"id": 98, "question": "A woman with an intact uterus is taking Estrogen but refuses Progesterone because it makes her 'bloated.' What is the most critical risk of this choice?", "options": [{"key": "A", "text": "Endometrial hyperplasia and a significantly increased risk of uterine cancer."}, {"key": "B", "text": "Her bones will become too thick and prone to fracture."}, {"key": "C", "text": "She will develop severe acne and facial hair."}, {"key": "D", "text": "She will lose her ability to produce thyroid hormone."}], "answer": "A", "rationale": "Endometrial hyperplasia and a significantly increased risk of uterine cancer. Estrogen stimulates the growth of the uterine lining; without progesterone to 'oppose' it, the tissue can become cancerous.", "caseContext": null}, {"id": 99, "question": "A 52-year-old female patient with a history of heavy menses and fibroids shows high urinary 4−OH−E1 on her hormone profile. According to the Functional Medicine matrix, which specific biochemical process is failing, and what is the primary clinical risk?", "options": [{"key": "A", "text": "Phase 3 Glucuronidation; risk of estrogen reabsorption in the gut."}, {"key": "B", "text": "Phase 2 Methylation; risk of DNA adducts and oxidative damage."}, {"key": "C", "text": "Sulfation; risk of estrogen storage in the tissues."}, {"key": "D", "text": "Aromatization; risk of excessive testosterone conversion."}], "answer": "B", "rationale": "Phase 2 Methylation; risk of DNA adducts and oxidative damage. Accumulation of 4-hydroxyestrone suggests that Phase 2 COMT-mediated methylation is insufficient to neutralize this reactive catechol estrogen.", "caseContext": null}, {"id": 100, "question": "In a male patient, which mechanism best explains why obesity leads to a state of 'Functional Hypogonadism' even when the pituitary gland is healthy?", "options": [{"key": "A", "text": "Obesity causes the liver to overproduce SHBG, locking up all available testosterone."}, {"key": "B", "text": "Fat cells physically compress the Leydig cells in the testes, preventing secretion."}, {"key": "C", "text": "High fat intake blocks the absorption of cholesterol, the precursor to testosterone."}, {"key": "D", "text": "Adipose tissue produces aromatase, converting testosterone to estradiol, which then provides negative feedback to the hypothalamus."}], "answer": "D", "rationale": "Adipose tissue produces aromatase, converting testosterone to estradiol, which then provides negative feedback to the hypothalamus. Peripheral aromatization in fat cells increases estrogen, which tells the brain there is 'enough' hormone, shutting down GnRH/LH production.", "caseContext": null}, {"id": 101, "question": "Which Phase II pathway is the most common route for the biotransformation of a large number of lipophilic (fat-soluble) xenobiotics and endogenous bilirubin?", "options": [{"key": "A", "text": "Methylation"}, {"key": "B", "text": "Glucuronidation"}, {"key": "C", "text": "Sulfation"}, {"key": "D", "text": "Acetylation"}], "answer": "B", "rationale": "Glucuronidation Glucuronidation is the major pathway for eliminating a vast array of endogenous substances (like bilirubin) and fat-soluble toxins.", "caseContext": null}, {"id": 102, "question": "According to the 'Biotransformation & Elimination' section of the matrix, which finding would be considered a clinical imbalance in this node?", "options": [{"key": "A", "text": "Type II Diabetes"}, {"key": "B", "text": "Autoimmune disease"}, {"key": "C", "text": "Asthma and COPD"}, {"key": "D", "text": "Hepatitis or Non-Alcoholic Fatty Liver Disease"}], "answer": "D", "rationale": "Hepatitis or Non-Alcoholic Fatty Liver Disease Liver diseases directly reflect an imbalance or overload in the biotransformation and elimination node.", "caseContext": null}, {"id": 103, "question": "Which set of cofactors is most critical for supporting the 'Transulfuration' pathway, which converts homocysteine into cysteine and eventually glutathione?", "options": [{"key": "A", "text": "Vitamin C and Zinc"}, {"key": "B", "text": "B12 and Folate"}, {"key": "C", "text": "Iron and Vitamin D"}, {"key": "D", "text": "Vitamin B6 and Magnesium"}], "answer": "D", "rationale": "Vitamin B6 and Magnesium The CBS (Cystathionine-beta-synthase) enzyme in the transulfuration pathway requires B6 as a coenzyme.", "caseContext": null}, {"id": 104, "question": "A patient shows high levels of GGT and a history of exposure to organochlorine pesticides. Which physiological mechanism best explains why GGT is a surrogate marker for this exposure?", "options": [{"key": "A", "text": "High GGT levels indicate a deficiency in Magnesium required for Phase II."}, {"key": "B", "text": "GGT is a Phase I enzyme that directly oxidizes organochlorines."}, {"key": "C", "text": "GGT is required for the transport of glutathione-conjugated xenobiotics across cell membranes."}, {"key": "D", "text": "GGT elevation is caused by the direct destruction of hepatocytes by pesticides."}], "answer": "C", "rationale": "GGT is required for the transport of glutathione-conjugated xenobiotics across cell membranes. Serum GGT reflects the body's effort to manage xenobiotics that have been conjugated with glutathione, acting as a marker for the 'recycling' of glutathione.", "caseContext": null}, {"id": 105, "question": "In the 'PURE' acronym for environmental health, what clinical action is associated with the letter 'E'?", "options": [{"key": "A", "text": "Excrete heavy metals"}, {"key": "B", "text": "Ensure a safe detox"}, {"key": "C", "text": "Eliminate dietary triggers"}, {"key": "D", "text": "Evaluate genetic SNPs"}], "answer": "B", "rationale": "Ensure a safe detox The 'E' in P-U-R-E stands for Ensure a Safe Detox, emphasizing the need for proper sequencing and physiological support.", "caseContext": null}, {"id": 106, "question": "Why is 'Establishing Healthy Elimination' (Bowel and Kidney function) prioritized as Step 1 in the IFM Detoxification Sequence?", "options": [{"key": "A", "text": "To reduce the genetic expression of slow-acetylator SNPs."}, {"key": "B", "text": "To increase the expression of Cytochrome P450 enzymes."}, {"key": "C", "text": "To ensure that the patient can tolerate high doses of NAC."}, {"key": "D", "text": "To prevent the reabsorption of toxins released from adipose tissue during weight loss or detox."}], "answer": "D", "rationale": "To prevent the reabsorption of toxins released from adipose tissue during weight loss or detox. If toxins are mobilized but the 'drainage' pathways (bowels/urine) are blocked, toxins can undergo enterohepatic recirculation and cause systemic damage.", "caseContext": null}, {"id": 107, "question": "A patient has a 'slow' COMT genotype and is exhibiting signs of estrogen dominance. Which nutritional strategy would most effectively support the specific Phase II pathway needed for estrogen clearance?", "options": [{"key": "A", "text": "Using high-dose Vitamin C."}, {"key": "B", "text": "Increasing intake of charbroiled meats."}, {"key": "C", "text": "Providing Methyl-donors like SAMe, Methyl-B12, and Trimethylglycine (TMG)."}, {"key": "D", "text": "Supplementing with inorganic sulfate."}], "answer": "C", "rationale": "Providing Methyl-donors like SAMe, Methyl-B12, and Trimethylglycine (TMG). COMT requires methyl groups from SAMe to neutralize 2-OH and 4-OH estrogens; providing these donors supports the 'slow' enzyme.", "caseContext": null}, {"id": 108, "question": "Which of the following is an 'internal' mediator that could perpetuate a patient's toxic burden, as categorized on the IFM Environmental Health Matrix?", "options": [{"key": "A", "text": "Impaired intestinal barrier function"}, {"key": "B", "text": "A specific SNP in the SOD2 gene"}, {"key": "C", "text": "Poor indoor air quality"}, {"key": "D", "text": "A history of childhood lead exposure"}], "answer": "A", "rationale": "Impaired intestinal barrier function An impaired gut barrier allows for the constant re-entry of endotoxins (LPS) and xenobiotics, acting as an internal perpetuator.", "caseContext": null}, {"id": 109, "question": "Which specific nutrient is the rate-limiting cofactor for the synthesis of Glutathione within the liver?", "options": [{"key": "A", "text": "Iron"}, {"key": "B", "text": "Selenium"}, {"key": "C", "text": "Vitamin E"}, {"key": "D", "text": "N-acetylcysteine"}], "answer": "D", "rationale": "N-acetylcysteine Cysteine (provided by NAC) is the rate-limiting amino acid in the production of the tripeptide glutathione.", "caseContext": null}, {"id": 110, "question": "In following the 'PURE' protocol, the treatment plan includes discontinuing Acetaminophen. Which biochemical rationale explains this clinical decision in the context of environmental health?", "options": [{"key": "A", "text": "Because Acetaminophen acts as a direct inhibitor of the COMT enzyme."}, {"key": "B", "text": "To prevent the induction of CYP1A2 which creates pro-carcinogens."}, {"key": "C", "text": "To preserve glutathione stores needed for the detoxification of other environmental xenobiotics."}, {"key": "D", "text": "To reduce the formation of β-glucuronidase in the gut microbiome."}], "answer": "C", "rationale": "To preserve glutathione stores needed for the detoxification of other environmental xenobiotics. Acetaminophen consumes significant amounts of glutathione; removing it frees up this critical antioxidant for other toxic burdens.", "caseContext": null}, {"id": 111, "question": "A patient undergoing detoxification experience a 'Herxheimer-like' reaction with headaches and nausea. Which modification to the sequencing is most appropriate according to IFM guidelines?", "options": [{"key": "A", "text": "Immediately start EDTA chelation to bind the circulating toxins."}, {"key": "B", "text": "Pause the detox and focus on 'Level 1' support: ensuring 1-2 daily bowel movements and adequate hydration."}, {"key": "C", "text": "Increase the dose of Phase I inducers to clear the toxins faster."}, {"key": "D", "text": "Switch from a rice-based medical food to a soy-based medical food."}], "answer": "B", "rationale": "Pause the detox and focus on 'Level 1' support: ensuring 1-2 daily bowel movements and adequate hydration. Reactions often signify that mobilization exceeds elimination; going back to basic 'drainage' support is the safest clinical step.", "caseContext": null}, {"id": 112, "question": "Which of the following describes the 'two-part hypothesis' for elevated GGT in non-drinkers with metabolic syndrome?", "options": [{"key": "A", "text": "GGT reflects exposure to Persistent Organic Pollutants (POPs) and serves as a marker for glutathione- related xenobiotic transport."}, {"key": "B", "text": "GGT rises to compensate for iron deficiency and increased oxidative stress."}, {"key": "C", "text": "Elevated GGT is a direct result of slow-acetylator SNPs in the NAT2 gene."}, {"key": "D", "text": "GGT is induced by dietary fiber to help inhibit β-glucuronidase."}], "answer": "A", "rationale": "GGT reflects exposure to Persistent Organic Pollutants (POPs) and serves as a marker for glutathione-related xenobiotic transport. The hypothesis suggests GGT is a surrogate for POPs stored in fat, which explains its predictive value for diabetes and CVD.", "caseContext": null}, {"id": 113, "question": "Which specific Phase II pathway is unique because it occurs within the mitochondrial matrix, making it highly dependent on mitochondrial health and ATP availability?", "options": [{"key": "A", "text": "Methylation"}, {"key": "B", "text": "Amino Acid Conjugation"}, {"key": "C", "text": "Glucuronidation"}, {"key": "D", "text": "Acetylation"}], "answer": "B", "rationale": "Amino Acid Conjugation The conjugation of xenobiotics with amino acids like glycine is a mitochondrial process.", "caseContext": null}, {"id": 114, "question": "Xenoestrogens like Bisphenol A (BPA) and phthalates primarily disrupt which physiological node on the IFM Matrix by mimicking endogenous ligands?", "options": [{"key": "A", "text": "Communication"}, {"key": "B", "text": "Defense and Repair"}, {"key": "C", "text": "Transport"}, {"key": "D", "text": "Structural Integrity"}], "answer": "A", "rationale": "Communication The Communication node includes the endocrine system, which is the direct target of endocrine-disrupting chemicals.", "caseContext": null}, {"id": 115, "question": "In the context of 'Ensuring a Safe Detox' (the E in PURE), which biochemical mechanism explains why excessive induction of Phase I without adequate Phase II support is clinically dangerous?", "options": [{"key": "A", "text": "The depletion of ATP prevents the kidneys from filtering water-soluble toxins."}, {"key": "B", "text": "Reactive intermediates produced by Phase I can create 'pathological detoxifiers' by causing more damage than the parent compound."}, {"key": "C", "text": "It leads to a permanent inhibition of the COMT enzyme through feedback loops."}, {"key": "D", "text": "Phase I enzymes will begin to break down essential amino acids if no toxins are present."}], "answer": "B", "rationale": "Reactive intermediates produced by Phase I can create 'pathological detoxifiers' by causing more damage than the parent compound. Phase I often creates highly reactive electrophilic intermediates that, if not conjugated by Phase II, can cause significant DNA and tissue damage.", "caseContext": null}, {"id": 116, "question": "A practitioner identifies 'periodontal disease' and 'mercury amalgams' on a patient's physical exam. According to the Environmental Health Matrix, which node is most directly affected by the chronic inflammatory signaling originating from the oral cavity?", "options": [{"key": "A", "text": "Biotransformation"}, {"key": "B", "text": "Defense and Repair"}, {"key": "C", "text": "Transport"}, {"key": "D", "text": "Structural Integrity"}], "answer": "B", "rationale": "Defense and Repair This node encompasses the immune system and inflammation; oral infections and dental materials are significant triggers for chronic systemic inflammation.", "caseContext": null}, {"id": 117, "question": "According to the presentation on the 'Mito Food Plan,' which nutrient can be used to bypass Complex III of the Electron Transport Chain, particularly when supported by Vitamin C?", "options": [{"key": "A", "text": "Coenzyme Q10"}, {"key": "B", "text": "L-Carnitine"}, {"key": "C", "text": "Alpha-Lipoic Acid"}, {"key": "D", "text": "Vitamin K2"}], "answer": "D", "rationale": "Vitamin K2 Vitamin K2 (specifically MK-7) is highlighted for its unique ability to provide an alternative pathway (bypass) for electron transport. This nutrient is typically associated with bone health but has a 'bypass' role in bioenergetics. B is not correct since Carnitine facilitates the entry of fatty acids into the mitochondria but does not participate in the electron transport chain bypass.", "caseContext": null}, {"id": 118, "question": "Which clinical indicator of 'Mitochondropathy' is specifically listed under both the 'Endocrine/Systemic' and 'Liver' categories in the module's diagnostic signs?", "options": [{"key": "A", "text": "Hypocalcemia"}, {"key": "B", "text": "Tachycardia"}, {"key": "C", "text": "Hypoglycemia"}, {"key": "D", "text": "Ptosis"}], "answer": "C", "rationale": "Hypoglycemia Hypoglycemia is explicitly identified as a systemic, endocrine, and liver-related indicator of mitochondrial dysfunction. D is not correct since Ptosis (drooping eyelid) is a neurological or muscular sign of mitochondropathy, not an endocrine/liver marker.", "caseContext": null}, {"id": 119, "question": "Which 'Secondary (2º) Detox Treatment' is reserved for cases involving persistent toxins or metals that do not respond to primary supports like NAC and Selenium?", "options": [{"key": "A", "text": "Chelation therapy"}, {"key": "B", "text": "Sulforaphane-glucosinolate (SGS)"}, {"key": "C", "text": "Silymarin (Milk Thistle)"}, {"key": "D", "text": "S-acetyl-Glutathione"}], "answer": "A", "rationale": "Chelation therapy The IFM Decision Tree categorizes Chelation and IV Glutathione as secondary (2º) Detox Treatments. This procedure involves the use of agents to bind and remove heavy metals from the body.", "caseContext": null}, {"id": 120, "question": "The marker 8-OH deoxyguanosine (8-OHdG) is used in clinical evaluation to assess damage to which specific cellular component?", "options": [{"key": "A", "text": "DNA"}, {"key": "B", "text": "Intracellular Proteins"}, {"key": "C", "text": "Cell Membrane Lipids"}, {"key": "D", "text": "Plasma Albumin"}], "answer": "A", "rationale": "DNA 8-OHdG is a specific biomarker for oxidative damage to DNA.", "caseContext": null}, {"id": 121, "question": "A patient following the 'Mito Food Plan' is encouraged to consume 'therapeutic foods' to support mitochondrial function. Which specific food group is prioritized for providing sulfur-containing compounds essential for glutathione synthesis?", "options": [{"key": "A", "text": "Nightshade vegetables"}, {"key": "B", "text": "High-glycemic fruits"}, {"key": "C", "text": "Cruciferous vegetables"}, {"key": "D", "text": "Refined vegetable oils"}], "answer": "C", "rationale": "Cruciferous vegetables Think of the vegetable family famous for sulforaphane. Cruciferous vegetables are rich in sulfur and glucosinolates, which are key precursors for glutathione production and Phase II detoxification.", "caseContext": null}, {"id": 122, "question": "In the context of 'The Centrality of the Therapeutic Encounter,' which of the following is defined as a 'ritual or procedure' that restores a state of health through the belief and action of both parties?", "options": [{"key": "A", "text": "A generic prescription handed to a patient"}, {"key": "B", "text": "A shared treatment plan with active participation"}, {"key": "C", "text": "Wait-room environment design"}, {"key": "D", "text": "A strictly biochemical intervention"}], "answer": "B", "rationale": "A shared treatment plan with active participation A core ingredient of a healing encounter is a ritualized procedure or plan that both the patient and practitioner believe in and actively participate in.", "caseContext": null}, {"id": 123, "question": "Which specific 'Communication' imbalance in the Neurodegeneration Matrix is Terry Wahls, MD, known for addressing to improve myelin repair and neuronal health?", "options": [{"key": "A", "text": "Upregulation of Brain-Derived Neurotrophic Factor"}, {"key": "B", "text": "Inhibition of Insulin-like Growth Factor"}, {"key": "C", "text": "Decreasing the cortisol-to-DHEA ratio"}, {"key": "D", "text": "Suppression of Melatonin"}], "answer": "A", "rationale": "Upregulation of Brain-Derived Neurotrophic Factor Supporting BDNF and other nerve growth factors through diet and lifestyle is a central strategy for neuroprotection and repair in the Wahls protocol.", "caseContext": null}, {"id": 124, "question": "In the IFM Pain Matrix, which 'Defense and Repair' clinical consideration is most directly linked to the development of 'central sensitization' and chronic pain?", "options": [{"key": "A", "text": "Chronic systemic inflammation and cytokine production"}, {"key": "B", "text": "Acute muscle strain"}, {"key": "C", "text": "Excessive magnesium levels"}, {"key": "D", "text": "Low dietary fiber intake"}], "answer": "A", "rationale": "Chronic systemic inflammation and cytokine production Persistent inflammatory cytokines can lower the pain threshold and lead to the hypersensitivity of the central nervous system.", "caseContext": null}, {"id": 125, "question": "Which of the following is a hallmark of Secondary Mitochondrial Dysfunction' (SMD) as opposed to primary genetic mitochondrial disease?", "options": [{"key": "A", "text": "It only affects the heart and brain"}, {"key": "B", "text": "It is present only at birth"}, {"key": "C", "text": "It cannot be improved with lifestyle changes"}, {"key": "D", "text": "It is caused by environmental factors like toxins and nutrient deficiencies"}], "answer": "D", "rationale": "It is caused by environmental factors like toxins and nutrient deficiencies Secondary dysfunction is acquired due to external stressors, whereas primary disease is due to inherited mutations in mtDNA or nDNA. A key feature of SMD is that it is often reversible or manageable through the removal of triggers and the addition of cofactors.", "caseContext": null}, {"id": 126, "question": "When assessing the 'Mental, Emotional, and Spiritual' node in a patient with Depression and Anxiety, Robert Hedaya, MD, suggests evaluating 'Bio-energetic' foundations. Which marker would indicate an 'Energy' imbalance contributing to a psychiatric presentation?", "options": [{"key": "A", "text": "High levels of serum Vitamin D"}, {"key": "B", "text": "Elevated urinary organic acids like Lactate and Pyruvate"}, {"key": "C", "text": "Low serum sodium"}, {"key": "D", "text": "Normal C-Reactive Protein"}], "answer": "B", "rationale": "Elevated urinary organic acids like Lactate and Pyruvate Focus on the byproduct of anaerobic metabolism that rises when mitochondria fail. Elevated lactate/pyruvate ratios are markers of impaired mitochondrial respiration, which can deprive the brain of the energy needed for mood regulation.", "caseContext": null}, {"id": 127, "question": "According to the IFM Bioenergetics Clinical Decision Tree, if a patient has high 8-OHdG but low nutrients (B-vits, CoQ10), what is the priority?", "options": [{"key": "A", "text": "Avoid all fats to protect the mitochondria"}, {"key": "B", "text": "Start high-dose chelation immediately"}, {"key": "C", "text": "Replete the nutrient cofactors first to ensure the engine can run efficiently"}, {"key": "D", "text": "Prescribe high-dose iron supplements"}], "answer": "C", "rationale": "Replete the nutrient cofactors first to ensure the engine can run efficiently The Clinical Decision Tree prioritizes addressing '1º Metabolism Dx' (nutrients) alongside '1º Ox- Stress Tx' to stop the cycle of damage.", "caseContext": null}, {"id": 128, "question": "In the 'Mito Food Plan,' the 'Modified Ketogenic' approach is used for specific clinical reasons. Which condition is most frequently cited in the module as an indication for this approach?", "options": [{"key": "A", "text": "Hyperthyroidism"}, {"key": "B", "text": "Neurodegenerative disorders like MS or Alzheimer's"}, {"key": "C", "text": "Iron deficiency anemia"}, {"key": "D", "text": "Acute viral infections"}], "answer": "B", "rationale": "Neurodegenerative disorders like MS or Alzheimer's Ketones provide an alternative fuel source for the brain when glucose metabolism is impaired, as seen in many neurodegenerative conditions.", "caseContext": null}, {"id": 129, "question": "What is the primary clinical reason for using 'Divided Doses' when administering 10 grams of Creatine Monohydrate to an adult?", "options": [{"key": "A", "text": "To ensure it reaches the liver instead of the brain"}, {"key": "B", "text": "To avoid the 'Fenton Reaction'"}, {"key": "C", "text": "To prevent it from turning into Vitamin C"}, {"key": "D", "text": "To minimize gastrointestinal distress and improve absorption"}], "answer": "D", "rationale": "To minimize gastrointestinal distress and improve absorption Large single doses of creatine can cause bloating or diarrhea; dividing the dose improves tolerance and maintains steady levels. B is not correct since the Fenton reaction is associated with free iron, not creatine monohydrate.", "caseContext": null}, {"id": 130, "question": "The 'Transport' node of the Matrix includes the 'Glymphatic System.' Why is this system critical for bioenergetic health in the brain?", "options": [{"key": "A", "text": "It transports red blood cells into the neurons"}, {"key": "B", "text": "It clears metabolic waste products, including amyloid-beta, during sleep"}, {"key": "C", "text": "It regulates the production of stomach acid"}, {"key": "D", "text": "It is the primary site of ATP synthesis in the skull"}], "answer": "B", "rationale": "It clears metabolic waste products, including amyloid-beta, during sleep The glymphatic system is the brain's waste clearance mechanism; if it is congested, 'energy suffering' increases due to toxic buildup. Think of it as the 'drainage system' for the brain.", "caseContext": null}, {"id": 131, "question": "A patient following the 'Mito Food Plan' is advised to prioritize 'High-Quality Fats.' According to the module, which specific lipid ratio or type is most critical for restoring the structural integrity of the mitochondrial inner membrane?", "options": [{"key": "A", "text": "Saturated fats like coconut oil and butter"}, {"key": "B", "text": "Trans-fatty acids for membrane stability"}, {"key": "C", "text": "Omega-6 vegetable oils in a 10:1 ratio with Omega-3"}, {"key": "D", "text": "Omega-3 fatty acids and Phosphatidylcholine"}], "answer": "D", "rationale": "Omega-3 fatty acids and Phosphatidylcholine These specific lipids have roles in maintaining membrane fluidity and supporting the embedded proteins of the Electron Transport Chain.", "caseContext": null}, {"id": 132, "question": "In Terry Wahls' clinical model for neurodegeneration, which 'Transport' node intervention is specifically used to enhance the delivery of nutrients to the brain and stimulate mitochondrial biogenesis?", "options": [{"key": "A", "text": "Low-salt diet to reduce blood pressure"}, {"key": "B", "text": "Restricting water intake to reduce edema"}, {"key": "C", "text": "Neuromuscular Electrical Stimulation"}, {"key": "D", "text": "Static stretching twice daily"}], "answer": "C", "rationale": "Neuromuscular Electrical Stimulation This intervention involves active muscle stimulation to bypass traditional movement limitations. NMES is a unique transport-related intervention used to improve circulation, prevent muscle atrophy, and trigger systemic growth factors like BDNF. Case Study 1 — Answer Key", "caseContext": null}, {"id": 133, "question": "Elena's 3 PM 'crash' and sugar cravings are most likely related to a dysfunction in which Matrix node?", "options": [{"key": "A", "text": "Structural Integrity"}, {"key": "B", "text": "Biotransformation"}, {"key": "C", "text": "Energy"}], "answer": "C", "rationale": "Energy Energy crashes and the need for external fuel (sugar) are hallmark signs of mitochondrial/energetic inefficiency.", "caseContext": "Case Study 1: The HPA Axis & Mitochondrial Fatigue Questions 133-146\nPatient Profile: Elena, a 38-year-old mother of three, presents with \"crash\" fatigue around 3 PM, sugar cravings,\nand insomnia (difficulty falling asleep).\nHistory: She had a high-stress pregnancy followed by a difficult divorce. She drinks 4-5 cups of coffee daily to\nkeep up with her children.\nClinical Indicators: Postural hypotension (BP drops from 120/80 to 105/70 upon standing), dark circles under the\neyes, and truncal adiposity.\nLabs: Low morning Cortisol (4.2 mcg/dL), low DHEA-S, and normal TSH but low-normal Free T3."}, {"id": 134, "question": "The low morning cortisol and low DHEA-S reflect an imbalance in which part of the Communication node?", "options": [{"key": "A", "text": "The HPA Axis"}, {"key": "B", "text": "The HPT Axis"}, {"key": "C", "text": "The HPG Axis"}], "answer": "A", "rationale": "The HP A Axis Morning cortisol and DHEA-S are primary biomarkers for adrenal function within the Hypothalamic-Pituitary-Adrenal axis.", "caseContext": null}, {"id": 135, "question": "Elena's postural hypotension (drop in BP upon standing) is a physical exam finding often associated with:", "options": [{"key": "A", "text": "Adrenal insufficiency or HPA axis dysfunction"}, {"key": "B", "text": "High allostatic load and hyper-excitability"}, {"key": "C", "text": "Excessive mitochondrial ATP production"}], "answer": "A", "rationale": "Adrenal insufficiency or HP A axis dysfunction Aldosterone and cortisol help regulate blood pressure during position changes; their deficiency leads to postural drops.", "caseContext": null}, {"id": 136, "question": "Elena's 4-5 cups of coffee daily should be categorized on the Matrix as a:", "options": [{"key": "A", "text": "Trigger"}, {"key": "B", "text": "Mediator"}, {"key": "C", "text": "Antecedent"}], "answer": "B", "rationale": "Mediator Mediators 'mediate' or 'perpetuate' the current state. Caffeine is a behavioral factor that she uses to cope, but it also perpetuates HPA axis stress and insomnia.", "caseContext": null}, {"id": 137, "question": "According to the Therapeutic Intervention competencies, what is the most appropriate FIRST step for Elena?", "options": [{"key": "A", "text": "Ordering a brain MRI to check the pituitary"}, {"key": "B", "text": "Addressing her sleep hygiene and caffeine intake"}, {"key": "C", "text": "Immediate prescription of Hydrocortisone"}], "answer": "B", "rationale": "Addressing her sleep hygiene and caffeine intake Functional medicine starts with the lifestyle 'foundations' of the Matrix. Modifiable lifestyle factors (Sleep/Relaxation and Nutrition) are prioritized as initial interventional modalities.", "caseContext": null}, {"id": 138, "question": "In the Bioenergetics module, Elena's 'truncal adiposity' and fatigue are linked via which mechanism?", "options": [{"key": "A", "text": "Enhanced Phase II detoxification"}, {"key": "B", "text": "Structural misalignment of the spine"}, {"key": "C", "text": "Insulin resistance and mitochondrial 'inefficiency'"}], "answer": "C", "rationale": "Insulin resistance and mitochondrial 'inefficiency' Adrenal stress and high-sugar cravings lead to insulin resistance, which shifts the body from 'burning' to 'storing' energy.", "caseContext": null}, {"id": 139, "question": "Which question best assesses Elena's 'readiness to engage' in behavioral changes?", "options": [{"key": "A", "text": "'Don't you know coffee is bad for your adrenals?'"}, {"key": "B", "text": "'Can you afford the $300 supplement I am about to recommend?'"}, {"key": "C", "text": "'On a scale of 1-10, how ready are you to reduce your coffee intake?'"}], "answer": "C", "rationale": "'On a scale of 1-10, how ready are you to reduce your coffee intake?' Using a readiness scale is a direct way to evaluate a patient's capacity for behavioral change.", "caseContext": null}, {"id": 140, "question": "If the practitioner uses the 'HPA Axis Questionnaire,' this falls under which clinical task?", "options": [{"key": "A", "text": "Gathering data for Patient Evaluation"}, {"key": "B", "text": "Executing a Therapeutic Ritual"}, {"key": "C", "text": "Setting a SMART goal"}], "answer": "A", "rationale": "Gathering data for Patient Evaluation Questionnaires are 'Gather' tools in the Clinical Decision Tree.", "caseContext": null}, {"id": 141, "question": "Elena's low morning cortisol suggests that her 'Allostatic Load' has led to:", "options": [{"key": "A", "text": "Hypo-responsiveness or exhaustion"}, {"key": "B", "text": "Acute sympathetic flight"}, {"key": "C", "text": "Optimal homeostasis"}], "answer": "A", "rationale": "Hypo-responsiveness or exhaustion Chronic stress eventually leads to a state where the HPA axis cannot maintain adequate cortisol output.", "caseContext": null}, {"id": 142, "question": "The practitioner recommends the 'Mito Food Plan' for Elena. Which Matrix node is this specifically targeting?", "options": [{"key": "A", "text": "Energy"}, {"key": "B", "text": "Biotransformation"}, {"key": "C", "text": "Structural Integrity"}], "answer": "A", "rationale": "Energy The Mito Food Plan is designed to optimize cellular energy production (ATP) and mitochondrial function.", "caseContext": null}, {"id": 143, "question": "Elena's low morning cortisol also impacts her 'Defense and Repair' node. Why?", "options": [{"key": "A", "text": "Cortisol is necessary to modulate and control the inflammatory response."}, {"key": "B", "text": "Cortisol makes the immune system over-active."}, {"key": "C", "text": "There is no link between cortisol and the immune system."}], "answer": "A", "rationale": "Cortisol is necessary to modulate and control the inflammatory response. Cortisol is the body's primary anti-inflammatory signal. Low levels allow inflammation to go unchecked.", "caseContext": null}, {"id": 144, "question": "Which competency is applied when the practitioner asks Elena, 'What is the most important thing you'd like to be able to do with your children if you had more energy?'", "options": [{"key": "A", "text": "Providing an explanation for symptoms"}, {"key": "B", "text": "Identifying what gives the patient meaning and purpose"}, {"key": "C", "text": "Analyzing biomarkers"}], "answer": "B", "rationale": "Identifying what gives the patient meaning and purpose This is about the 'Personal Context' section of Patient Communication. Linking clinical goals to the patient's values (e.g., parenting/family) is a key communication competency.", "caseContext": null}, {"id": 145, "question": "If the practitioner decides to refer Elena to a therapist for her divorce-related stress, this is an example of:", "options": [{"key": "A", "text": "Collaboration with additional healthcare practitioners"}, {"key": "B", "text": "Performing a physical examination"}, {"key": "C", "text": "A failure of the functional medicine model"}], "answer": "A", "rationale": "Collaboration with additional healthcare practitioners Referral to support the patient's emotional health (MES) aligns with the Therapeutic Intervention competency.", "caseContext": null}, {"id": 146, "question": "Why would the practitioner check Elena's iron status (Ferritin) given her fatigue?", "options": [{"key": "A", "text": "Because iron is a primary hormone in the Communication node."}, {"key": "B", "text": "To ensure diagnostic specificity, as iron is a cofactor for energy production."}, {"key": "C", "text": "Because all women over 30 have low iron."}], "answer": "B", "rationale": "To ensure diagnostic specificity, as iron is a cofactor for energy production. Iron is required for the electron transport chain and thyroid function; low iron (a mediator) could mimic adrenal fatigue. Case Study 2 — Answer Key", "caseContext": null}, {"id": 147, "question": "Robert's LDL-C is 110 (near goal), but his LDL-P is 1800. In the Cardiometabolic module, this \"discordance\" suggests:", "options": [{"key": "A", "text": "Low risk; the statin is working effectively"}, {"key": "B", "text": "High risk; the number of particles is more predictive of plaque entry than total cholesterol"}, {"key": "C", "text": "Lab error; LDL-C and LDL-P should always correlate"}], "answer": "B", "rationale": "High risk; the number of particles is more predictive of plaque entry than total cholesterol Discordance (Low LDL-C, High LDL-P) is a \"red flag\" for high risk.", "caseContext": "Case Study 2: The \"Heavy\" Heart (Cardiometabolic & Detoxification) Questions 147-160\nPatient Profile: Robert, a 54-year-old auto mechanic.\nChief Concern: Shortness of breath on exertion, \"stabbing\" joint pain, and difficulty losing weight despite a low-\nfat diet.\nHistory: Robert has worked in an auto shop for 30 years. He had a mild myocardial infarction 2 years ago. He takes\na statin (Atorvastatin) and an ACE inhibitor. He drinks 3-4 diet sodas a day.\nPhysical Exam: BP 148/92. Waist circumference 42 inches. Notable xanthelasmas (yellow deposits) around the\neyelids and \"pitting edema\" in the ankles.\nLabs: LDL-C: 110 mg/dL (on statin)  ·  LDL Particle Number (LDL-P): 1800 nmol/L (High)  ·  Small Dense LDL:\nHigh (Pattern B)  ·  Homocysteine: 15.8 mol/L  ·  GGT: 58 U/L (High-normal)  ·  CoQ10: 0.4 ug/mL (Low)"}, {"id": 148, "question": "Robert's profession as an auto mechanic for 30 years is a significant clinical indicator for exposure to:", "options": [{"key": "A", "text": "Bisphenol A (BPA)"}, {"key": "B", "text": "Heavy metals (Lead/Cadmium) and V olatile Organic Compounds"}, {"key": "C", "text": "Mold (Mycotoxins)"}], "answer": "B", "rationale": "Heavy metals (Lead/Cadmium) and Volatile Organic Compounds Auto mechanics have high exposure to lead (batteries), solvents (VOCs), and exhaust.", "caseContext": null}, {"id": 149, "question": "Which nutrient deficiency is a direct side effect of Robert's statin use and likely contributes to his shortness of breath?", "options": [{"key": "A", "text": "Vitamin K2"}, {"key": "B", "text": "Coenzyme Q10"}, {"key": "C", "text": "Magnesium"}], "answer": "B", "rationale": "Coenzyme Q10 Statins block the HMG-CoA reductase pathway, which is required to make CoQ10.", "caseContext": null}, {"id": 150, "question": "In the \"Biotransformation\" node, Robert’s high GGT (58) and high-normal liver enzymes should prompt a search for:", "options": [{"key": "A", "text": "Chronic glutathione depletion or occult alcohol use"}, {"key": "B", "text": "Iron deficiency"}, {"key": "C", "text": "Vitamin C toxicity"}], "answer": "A", "rationale": "Chronic glutathione depletion or occult alcohol use GGT is a sensitive marker for glutathione status and liver stress.", "caseContext": null}, {"id": 151, "question": "Robert's use of 3-4 diet sodas daily (artificial sweeteners) can act as a Mediator by:", "options": [{"key": "A", "text": "Improving insulin sensitivity via calorie reduction"}, {"key": "B", "text": "Altering the gut microbiome and potentially increasing insulin resistance"}, {"key": "C", "text": "Directly increasing HDL levels"}], "answer": "B", "rationale": "Altering the gut microbiome and potentially increasing insulin resistance Artificial sweeteners are known \"Mediators\" that can induce dysbiosis.", "caseContext": null}, {"id": 152, "question": "The xanthelasmas noted on Robert's physical exam are clinical indicators of:", "options": [{"key": "A", "text": "Calcium deposition in the skin"}, {"key": "B", "text": "Dyslipidemia and poor lipid clearance"}, {"key": "C", "text": "Vitamin A toxicity"}], "answer": "B", "rationale": "Dyslipidemia and poor lipid clearance Xanthelasmas are classic skin signs of hyperlipidemia.", "caseContext": null}, {"id": 153, "question": "Robert's Homocysteine is 15.8. Which Matrix node is the primary site for \"B-vitamin mediated methylation\" to lower this marker?", "options": [{"key": "A", "text": "Transport"}, {"key": "B", "text": "Biotransformation"}, {"key": "C", "text": "Structural Integrity"}], "answer": "B", "rationale": "Biotransformation Methylation is a Phase II detoxification pathway (Biotransformation).", "caseContext": null}, {"id": 154, "question": "Robert reports joint pain and uses NSAIDs daily. According to the GI module, this increases his risk for:", "options": [{"key": "A", "text": "SIBO"}, {"key": "B", "text": "Increased Intestinal Permeability"}, {"key": "C", "text": "Low stomach acid"}], "answer": "B", "rationale": "Increased Intestinal Permeability NSAIDs are \"Triggers/Mediators\" of intestinal permeability.", "caseContext": null}, {"id": 155, "question": "Robert’s \"pitting edema\" is organized under which Matrix node?", "options": [{"key": "A", "text": "Transport"}, {"key": "B", "text": "Communication"}, {"key": "C", "text": "Assimilation"}], "answer": "A", "rationale": "Transport Edema is a \"Transport\" (Lymphatic/Vascular fluid dynamics) issue.", "caseContext": null}, {"id": 156, "question": "Robert's high LDL-P and Small Dense LDL (Pattern B) are most strongly driven by:", "options": [{"key": "A", "text": "High dietary saturated fat"}, {"key": "B", "text": "High dietary refined carbohydrates and insulin resistance"}, {"key": "C", "text": "Lack of dietary fiber"}], "answer": "B", "rationale": "High dietary refined carbohydrates and insulin resistance Small dense LDL is primarily driven by high sugar/starch intake and insulin.", "caseContext": null}, {"id": 157, "question": "The \"Environmental Health Decision Tree\" would classify Robert’s long-term lead/VOC exposure as:", "options": [{"key": "A", "text": "Low risk; no action needed"}, {"key": "B", "text": "High risk; requires reduction of exposure and safe detoxification support"}, {"key": "C", "text": "Red flag; immediate hospitalization"}], "answer": "B", "rationale": "High risk; requires reduction of exposure and safe detoxification support The Decision Tree prioritizes \"Reduce Exposure\" and \"Ensure Safe Detox.\"", "caseContext": null}, {"id": 158, "question": "Which mineral is a required cofactor for the SOD (Superoxide Dismutase) enzyme to protect Robert's vascular endothelium from oxidative stress?", "options": [{"key": "A", "text": "Zinc, Copper, and Manganese"}, {"key": "B", "text": "Sodium and Potassium"}, {"key": "C", "text": "Calcium and Phosphorus"}], "answer": "A", "rationale": "Zinc, Copper, and Manganese SOD requires Zn, Cu (cytoplasmic), and Mn (mitochondrial).", "caseContext": null}, {"id": 159, "question": "Robert's \"Shortness of breath on exertion\" despite normal lung sounds may indicate a deficit in which node?", "options": [{"key": "A", "text": "Energy"}, {"key": "B", "text": "Assimilation"}, {"key": "C", "text": "Structural Integrity"}], "answer": "A", "rationale": "Energy Fatigue/shortness of breath without lung disease is often \"Mitochondrial\" (Energy).", "caseContext": null}, {"id": 160, "question": "To support Robert's \"Phase II\" detoxification of environmental toxins, which food group provides the most \"Glucosinolates\"?", "options": [{"key": "A", "text": "Alliums (Onions/Garlic)"}, {"key": "B", "text": "Cruciferous vegetables (Broccoli/Kale)"}, {"key": "C", "text": "Nightshades (Peppers/Tomatoes)"}], "answer": "B", "rationale": "Cruciferous vegetables (Broccoli/Kale) Cruciferous veggies induce Phase II enzymes (Sulforaphane).", "caseContext": null}];

    const STORAGE_KEY_ANSWERS = 'ifm_exam2_answers';
    const STORAGE_KEY_SUBMITTED = 'ifm_exam2_submitted_groups';
    const STORAGE_KEY_VOCAB = 'ifm_vocab_list';
    const STORAGE_KEY_THEME = 'ifm_theme';

    let userAnswers = JSON.parse(localStorage.getItem(STORAGE_KEY_ANSWERS) || '{}');
    let submittedGroups = JSON.parse(localStorage.getItem(STORAGE_KEY_SUBMITTED) || '{}');
    let vocabList = JSON.parse(localStorage.getItem(STORAGE_KEY_VOCAB) || '[]');
    let currentBatch = 1;
    const batchSize = 20;
    const totalBatches = 8;

    function speakWord(word) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(word);
      const voices = window.speechSynthesis.getVoices();
      const naturalVoice = voices.find(v => (v.name.includes("Samantha") || v.name.includes("Ava") || v.name.includes("Jenny") || v.name.includes("Natural")) && v.lang.startsWith("en")) || voices.find(v => v.lang === "en-US");
      if (naturalVoice) utter.voice = naturalVoice;
      utter.lang = 'en-US';
      utter.rate = 0.88;
      window.speechSynthesis.speak(utter);
    }
    if ('speechSynthesis' in window) window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();

    function init() {
      applyTheme();
      renderBatchBar();
      renderQuestions();
      updateBadges();
      setupSelectionTooltip();
    }

    function switchView(viewName) {
      document.getElementById('view-exam').style.display = viewName === 'exam' ? 'block' : 'none';
      document.getElementById('view-vocab').style.display = viewName === 'vocab' ? 'block' : 'none';
      document.getElementById('view-wrong').style.display = viewName === 'wrong' ? 'block' : 'none';

      document.getElementById('tab-exam').className = 'nav-btn' + (viewName === 'exam' ? ' active' : '');
      document.getElementById('tab-vocab').className = 'nav-btn' + (viewName === 'vocab' ? ' active' : '');
      document.getElementById('tab-wrong').className = 'nav-btn' + (viewName === 'wrong' ? ' active' : '');

      if (viewName === 'vocab') renderVocabList();
      if (viewName === 'wrong') renderWrongList();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderBatchBar() {
      const container = document.getElementById('batch-grid');
      let html = '';
      let totalAnsweredAll = Object.keys(userAnswers).length;

      for (let i = 1; i <= totalBatches; i++) {
        const start = (i - 1) * batchSize + 1;
        const end = i * batchSize;
        
        let answeredInGroup = 0;
        let correctInGroup = 0;
        for (let qid = start; qid <= end; qid++) {
          if (userAnswers[qid]) answeredInGroup++;
          const q = ALL_QUESTIONS[qid - 1];
          if (q && userAnswers[qid] === q.answer) correctInGroup++;
        }

        const isSub = !!submittedGroups[i];
        let subText = `${answeredInGroup}/20 题`;
        if (isSub) {
          subText = `${correctInGroup}/20 正确 ✅`;
        }

        html += `
          <button class="batch-btn ${i === currentBatch ? 'active' : ''}" onclick="switchBatch(${i})">
            <span>${start}–${end} 题</span>
            <span class="batch-sub">${subText}</span>
          </button>
        `;
      }
      container.innerHTML = html;
      document.getElementById('exam-overall-stats').innerText = `总进度：${totalAnsweredAll} / 160 题已答`;
      document.getElementById('current-group-num').innerText = currentBatch;

      const isCurrentSub = !!submittedGroups[currentBatch];
      const btnSubmit = document.getElementById('btn-group-submit');
      if (isCurrentSub) {
        btnSubmit.innerText = '🔄 重新核对本组';
      } else {
        btnSubmit.innerText = '📝 交卷核对本组';
      }
    }

    function switchBatch(batchNum) {
      currentBatch = batchNum;
      renderBatchBar();
      renderQuestions();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function nextGroup() {
      if (currentBatch < totalBatches) {
        switchBatch(currentBatch + 1);
      } else {
        showToast('已经是最后一组了！建议切换到【错题深度复盘】进行汇总！');
      }
    }

    function renderQuestions() {
      const container = document.getElementById('questions-container');
      const startIdx = (currentBatch - 1) * batchSize;
      const batchList = ALL_QUESTIONS.slice(startIdx, startIdx + batchSize);
      const isSub = !!submittedGroups[currentBatch];

      let html = '';

      batchList.forEach(q => {
        const uAns = userAnswers[q.id];

        if (q.caseContext) {
          html += `
            <div class="case-card">
              <h3>📋 综合临床案例背景</h3>
              <pre>${q.caseContext}</pre>
            </div>
          `;
        }

        html += `
          <div class="card" id="q-card-${q.id}">
            <div class="q-meta">
              <span class="q-badge">QUESTION ${q.id} OF 160</span>
              <span>IFM Practice Exam 2</span>
            </div>
            <div class="question-stem">${q.question}</div>
            <div class="options">
              ${q.options.map(opt => {
                let optClass = 'option-label';
                if (isSub) {
                  if (opt.key === q.answer) optClass += ' is-correct';
                  else if (uAns === opt.key && uAns !== q.answer) optClass += ' is-wrong';
                }
                return `
                  <label class="${optClass}" id="opt-label-${q.id}-${opt.key}">
                    <input type="radio" name="q-${q.id}" value="${opt.key}" 
                      ${uAns === opt.key ? 'checked' : ''} 
                      onchange="selectAnswer(${q.id}, '${opt.key}')">
                    <span><span class="opt-key">${opt.key}.</span>${opt.text}</span>
                  </label>
                `;
              }).join('')}
            </div>
            <div class="explanation" id="exp-${q.id}" style="display: ${isSub ? 'block' : 'none'};">
              <div class="exp-row"><span class="exp-tag">🎯 正确答案:</span> <strong>${q.answer}</strong></div>
              <div class="exp-row"><span class="exp-tag">🔬 IFM 官方临床解析:</span> ${q.rationale || '详见 IFM 教材核心讲义解析'}</div>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    function selectAnswer(qid, val) {
      userAnswers[qid] = val;
      localStorage.setItem(STORAGE_KEY_ANSWERS, JSON.stringify(userAnswers));
      renderBatchBar();
      updateBadges();
    }

    function submitCurrentGroup() {
      const start = (currentBatch - 1) * batchSize + 1;
      const end = currentBatch * batchSize;
      
      let answeredCount = 0;
      let correctCount = 0;

      for (let qid = start; qid <= end; qid++) {
        if (userAnswers[qid]) answeredCount++;
        const q = ALL_QUESTIONS[qid - 1];
        if (q && userAnswers[qid] === q.answer) correctCount++;
      }

      submittedGroups[currentBatch] = true;
      localStorage.setItem(STORAGE_KEY_SUBMITTED, JSON.stringify(submittedGroups));

      renderBatchBar();
      renderQuestions();
      updateBadges();

      showToast(`第 ${currentBatch} 组核对完毕！答对 ${correctCount} / ${batchSize} 题（得分率 ${Math.round(correctCount / batchSize * 100)}%）`);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    let currentSelectedText = '';
    function setupSelectionTooltip() {
      const tooltip = document.getElementById('selection-tooltip');

      document.addEventListener('mouseup', function(e) {
        if (e.target.closest('#selection-tooltip')) return;

        const sel = window.getSelection();
        const text = sel.toString().trim();

        if (text && text.length > 1 && text.length < 50 && /^[a-zA-Z\s\-]+$/.test(text)) {
          currentSelectedText = text;
          const cleanKey = text.toLowerCase();
          const dictEntry = MEDICAL_DICT[cleanKey] || {};

          document.getElementById('tt-word').innerText = text;
          document.getElementById('tt-ipa').innerText = dictEntry.ipa || '';
          document.getElementById('tt-cn').innerText = dictEntry.cn || '点击收录或发音';

          const range = sel.getRangeAt(0);
          const rect = range.getBoundingClientRect();
          
          tooltip.style.left = (rect.left + rect.width / 2 + window.scrollX) + 'px';
          tooltip.style.top = (rect.top + window.scrollY) + 'px';
          tooltip.style.display = 'block';
        } else {
          tooltip.style.display = 'none';
        }
      });
    }

    function playSelectedWord(e) {
      e.stopPropagation();
      if (currentSelectedText) speakWord(currentSelectedText);
    }

    function saveSelectedWord(e) {
      e.stopPropagation();
      if (!currentSelectedText) return;
      const cleanKey = currentSelectedText.toLowerCase();
      const dictEntry = MEDICAL_DICT[cleanKey] || {};

      if (!vocabList.some(v => v.word.toLowerCase() === cleanKey)) {
        vocabList.unshift({
          word: currentSelectedText,
          ipa: dictEntry.ipa || '',
          cn: dictEntry.cn || '',
          time: new Date().toLocaleDateString()
        });
        localStorage.setItem(STORAGE_KEY_VOCAB, JSON.stringify(vocabList));
        updateBadges();
        showToast(`已成功收录: ${currentSelectedText} 到生词本！`);
      } else {
        showToast(`该词已在生词本中`);
      }
      document.getElementById('selection-tooltip').style.display = 'none';
    }

    function renderVocabList() {
      const tbody = document.getElementById('vocab-table-body');
      if (vocabList.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding: 2.5rem; color: var(--text-muted);">生词本为空。在答题过程中用鼠标选中任何英文生词，即可划词发音并收录！</td></tr>`;
        return;
      }
      tbody.innerHTML = vocabList.map((item, idx) => `
        <tr>
          <td><strong>${item.word}</strong></td>
          <td style="color: #8b5cf6; font-family: monospace;">${item.ipa || '-'}</td>
          <td>${item.cn || '<span style="color:var(--text-muted);">自行记忆</span>'}</td>
          <td style="text-align: center;">
            <button class="btn-icon" onclick="speakWord('${item.word}')" title="播放真人自然发音">🔊</button>
          </td>
          <td style="text-align: center;">
            <button class="btn-icon" onclick="deleteVocab(${idx})" title="删除" style="color: var(--danger);">🗑️</button>
          </td>
        </tr>
      `).join('');
    }

    function deleteVocab(idx) {
      vocabList.splice(idx, 1);
      localStorage.setItem(STORAGE_KEY_VOCAB, JSON.stringify(vocabList));
      renderVocabList();
      updateBadges();
      showToast('已从生词本移除');
    }

    function clearVocab() {
      if (confirm('确定要清空全部生词本吗？')) {
        vocabList = [];
        localStorage.setItem(STORAGE_KEY_VOCAB, JSON.stringify(vocabList));
        renderVocabList();
        updateBadges();
        showToast('生词本已清空');
      }
    }

    function copyVocabMarkdown() {
      if (vocabList.length === 0) return showToast('生词本为空！');
      let md = '| 单词 (Word) | 国际音标 (IPA) | 功能医学专业释义 |\n|---|---|---|\n';
      vocabList.forEach(v => {
        md += `| ${v.word} | ${v.ipa} | ${v.cn} |\n`;
      });
      navigator.clipboard.writeText(md).then(() => showToast('已成功复制 Markdown 表格到剪贴板！可直接粘贴至 Obsidian！'));
    }

    function exportVocabTSV() {
      if (vocabList.length === 0) return showToast('生词本为空！');
      let tsv = '';
      vocabList.forEach(v => {
        tsv += `${v.word}\t${v.ipa}\t${v.cn}\n`;
      });
      navigator.clipboard.writeText(tsv).then(() => showToast('已成功复制 TSV 到剪贴板！可直接粘贴导入 Anki！'));
    }

    function renderWrongList() {
      const container = document.getElementById('wrong-list-container');
      const wrongQuestions = [];

      ALL_QUESTIONS.forEach(q => {
        const groupNum = Math.ceil(q.id / batchSize);
        if (submittedGroups[groupNum]) {
          const uAns = userAnswers[q.id];
          if (uAns && uAns !== q.answer) {
            wrongQuestions.push({ question: q, userAns: uAns });
          }
        }
      });

      if (wrongQuestions.length === 0) {
        container.innerHTML = `
          <div class="card" style="text-align: center; padding: 3rem; color: var(--text-muted);">
            🎉 暂无错题记录！请先在【英文真题】中作答并点击【交卷核对】，系统会自动抓取全部错题！
          </div>
        `;
        return;
      }

      container.innerHTML = wrongQuestions.map(w => `
        <div class="wrong-item">
          <div class="wrong-header">
            <span style="color: var(--danger);">QUESTION ${w.question.id} (第 ${Math.ceil(w.question.id / batchSize)} 组)</span>
            <span>IFM Practice Exam 2</span>
          </div>
          <div class="wrong-stem">${w.question.question}</div>
          <div class="wrong-choice-grid">
            <div class="my-choice">❌ 我的选择: ${w.userAns}</div>
            <div class="correct-choice">✅ 正确答案: ${w.question.answer}</div>
          </div>
          <div class="explanation" style="display:block; margin-top: 0.6rem;">
            <div class="exp-row"><span class="exp-tag">🔬 机制深度剖析:</span> ${w.question.rationale}</div>
          </div>
        </div>
      `).join('');
    }

    function getWrongList() {
      const wrongQuestions = [];
      ALL_QUESTIONS.forEach(q => {
        const groupNum = Math.ceil(q.id / batchSize);
        if (submittedGroups[groupNum]) {
          const uAns = userAnswers[q.id];
          if (uAns && uAns !== q.answer) {
            wrongQuestions.push({ q: q, uAns: uAns });
          }
        }
      });
      return wrongQuestions;
    }

    function copyWrongForNotebookLM() {
      const wrongQuestions = getWrongList();
      if (wrongQuestions.length === 0) return showToast('目前暂无已批改出的错题！');

      let text = `【请基于已上传的 IFM 官方讲义、教材与课程 Transcript 检索并回答】\n\n`;
      text += `我在进行 IFM Practice Exam 2 模考时做错了以下题目。请检索知识库中对应的 APM 模块（GI, Detox, Hormone, Energy, Immune, Cardiometabolic, Neuro/Matrix/GOTOIT）及课程音频文字稿：\n\n`;
      text += `1. **知识点与模块定位**：指出每道题涉及的核心模块、讲义章节或专家观点；\n`;
      text += `2. **错选辨析与机制深剖**：对照【我的错误选择】与【官方正确答案】，用讲义中的生理/生化机理解释我为什么会混淆，并引用讲义依据；\n`;
      text += `3. **临床要点总结**：提炼该知识点在 IFM 认证考试中的必背临床诊断与干预原则。\n\n`;
      text += `### 错题明细清单：\n\n`;

      wrongQuestions.forEach((item, index) => {
        text += `#### 错题 ${index + 1} (Question ${item.q.id})\n`;
        text += `**英文题干**: ${item.q.question}\n`;
        text += `**选项列表**:\n`;
        item.q.options.forEach(opt => {
          text += `  - ${opt.key}. ${opt.text}\n`;
        });
        text += `**我的错误选择**: ❌ ${item.uAns}\n`;
        text += `**官方正确答案**: ✅ ${item.q.answer}\n`;
        text += `**官方临床解析**: ${item.q.rationale}\n\n`;
      });

      navigator.clipboard.writeText(text).then(() => {
        showToast('已复制【NotebookLM 专属提问指令】！直接粘贴到 NotebookLM 对话框即可！');
      });
    }

    function copyWrongForAI() {
      const wrongQuestions = getWrongList();
      if (wrongQuestions.length === 0) return showToast('目前暂无已批改出的错题！');

      let promptText = `## IFM 备考专项深度复盘与二次变式出题\n\n`;
      promptText += `我在做 IFM Practice Exam 2 时出现以下错题。请调取我的 IFM 课程笔记与讲义，针对每道错题帮我做两件事：\n`;
      promptText += `1. **核心病理生理机制剖析**：分析我为什么容易选错【我的选项】，正解【正确选项】在功能医学矩阵（Matrix）或生化通路上的根本逻辑是什么；\n`;
      promptText += `2. **反向变式出题（二次盲测）**：针对该考点，出 2 道新的英文临床案例长题（附 4 个选项与解析），测试我是否彻底掌握。\n\n`;
      promptText += `### 错题明细清单：\n\n`;

      wrongQuestions.forEach((item, index) => {
        promptText += `#### 错题 ${index + 1} (Question ${item.q.id})\n`;
        promptText += `- **英文原题**: ${item.q.question}\n`;
        promptText += `- **我的错误选择**: ${item.uAns}\n`;
        promptText += `- **官方正确答案**: ${item.q.answer}\n`;
        promptText += `- **官方参考解析**: ${item.q.rationale}\n\n`;
      });

      navigator.clipboard.writeText(promptText).then(() => {
        showToast('已成功复制变式出题 Prompt！请直接粘贴至 Gemini / Claude 对话框！');
      });
    }

    function copyWrongAsNote() {
      const wrongQuestions = getWrongList();
      if (wrongQuestions.length === 0) return showToast('目前暂无已批改出的错题！');

      let text = `# IFM Practice Exam 2 错题复盘笔记\n\n`;
      text += `> 收录日期: ${new Date().toLocaleDateString()} | 错题总数: ${wrongQuestions.length} 题\n\n`;
      text += `---\n\n`;

      wrongQuestions.forEach((item, index) => {
        text += `### Q${item.q.id}. ${item.q.question}\n\n`;
        item.q.options.forEach(opt => {
          let mark = '  ';
          if (opt.key === item.q.answer) mark = '✅ ';
          else if (opt.key === item.uAns) mark = '❌ ';
          text += `- ${mark}${opt.key}. ${opt.text}\n`;
        });
        text += `\n**我的错选**: ${item.uAns} | **标准答案**: ${item.q.answer}\n\n`;
        text += `**官方临床机制解析 (Rationale)**:\n${item.q.rationale}\n\n`;
        text += `---\n\n`;
      });

      navigator.clipboard.writeText(text).then(() => {
        showToast('已复制【Markdown 错题笔记源】！可在 NotebookLM 点击“添加笔记”直接粘贴！');
      });
    }

    function updateBadges() {
      document.getElementById('vocab-count').innerText = vocabList.length;
      
      let wrongCount = 0;
      ALL_QUESTIONS.forEach(q => {
        const groupNum = Math.ceil(q.id / batchSize);
        if (submittedGroups[groupNum] && userAnswers[q.id] && userAnswers[q.id] !== q.answer) {
          wrongCount++;
        }
      });
      document.getElementById('wrong-count').innerText = wrongCount;
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 3200);
    }

    function applyTheme() {
      const th = localStorage.getItem(STORAGE_KEY_THEME) || 'light';
      if (th === 'dark') document.body.classList.add('dark-mode');
      else document.body.classList.remove('dark-mode');
    }
    function toggleTheme() {
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      localStorage.setItem(STORAGE_KEY_THEME, isDark ? 'dark' : 'light');
    }

    window.onload = init;
  </script>
</body>
</html>
